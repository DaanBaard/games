<div id="load"><div id="lart"></div><h1>BirdBloom</h1><div id="bar"><i></i></div></div>
<script>
'use strict';
/* =========================================================
   BIRDBLOOM — a little bird herds clouds, merges them into storms,
   rain on thirsty fields and grow a floating sky-farm.
   ========================================================= */

// ---------- helpers
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function fmt(n) { n = Math.floor(n); if (n < 10000) return '' + n; if (n < 1e6) return (n / 1000).toFixed(n < 1e5 ? 1 : 0).replace('.0', '') + 'K'; return (n / 1e6).toFixed(1).replace('.0', '') + 'M'; }
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = lerp(pa >> 16, pb >> 16, t) | 0, g = lerp((pa >> 8) & 255, (pb >> 8) & 255, t) | 0, bl = lerp(pa & 255, pb & 255, t) | 0;
  return 'rgb(' + r + ',' + g + ',' + bl + ')';

// ---------- core gameplay

}
function tryPickup(p) {

// ---------- missions & hats (v0.8): three small goals of about a minute each, every one pays coins and a star;
// stars unlock hats for Pip. Icons and numbers only, so they need no translation.
const HATS = [{ id: 'straw', at: 1 }, { id: 'flower', at: 3 }, { id: 'party', at: 5 }, { id: 'propeller', at: 8 }, { id: 'crown', at: 12 }, { id: 'rainbow', at: 16 },
  { id: 'astro', at: 22 }, { id: 'explorer', at: 30 }]; // v0.9: space helmet and jungle explorer hat

function makeMission(i) {
  const z = S.zone, lv = clamp(z - WORLDS[S.w].z0 + S.w, 0, 4); // how far into the game, capped so goals stay about a minute
  let t = M_CYCLE[i % M_CYCLE.length];
  if (t === 'golden' && i < 5) t = 'rain';
  if (t === 'golden' && S.w >= 1 && i % 2) t = 'power'; // catch a power-up (space and jungle)
  const m = { t, c: 0, n: 1 };
  if (t === 'harvest') {
    // a crop from the newest island the player farms on
    const mine = fields.filter(f => f.w === S.w), crops = mine.filter(f => zoneAt(f.x, f.y) === z).map(f => f.crop);
    m.k = crops.length ? pick(crops) : (mine[0] || fields[0]).crop;
    m.n = Math.max(4, Math.round(9 - CROPS[m.k].grow * 0.5 + lv));
  } else if (t === 'rain') m.n = 6 + lv * 2;
  else if (t === 'tier') { m.k = Math.min(tierCap(), 2 + z + (i % 2)); m.n = 1; }
  else if (t === 'coins') m.n = Math.max(30, Math.round(Math.max(30, incomeRate * 55) / 10) * 10);
  return m;
}
function updateMissions() {
  if (!missionsOn()) return;
  for (let i = 0; i < 3; i++) {
    const m = S.miss[i];
    if (!m || (m.done && S.time - m.done > 1.8)) {
      // never two of the same goal at once
      let nm = makeMission(S.mi++);
      for (let tries = 0; tries < 4 && S.miss.some((o, j) => j !== i && o && !o.done && o.t === nm.t); tries++) nm = makeMission(S.mi++);
      S.miss[i] = nm; ev('mission', nm.t, 'visible');

  }
}

  if (!missionsOn()) return;

    if (!m || m.done || m.t !== t) continue;
    if (t === 'tier') { if (key >= m.k) m.c = 1; }
    else if (m.k === undefined || m.k === key) m.c = Math.min(m.n, m.c + amount);

}

  m.done = S.time;
  // about 10 s of income: the star is the real prize, the coins must not skip the island
  const v = Math.max(5, Math.round(incomeRate * 10 + 3 * (S.zone + 1)));
  spawnCoins(P.x, P.y - 40, v, 'player', { reward: true });
  const had = hatsOwned(); S.stars++;

  if (hatsOwned() > had) {

// ---------- world travel (v0.9): the world's finale build shoots a beam up, Pip and the herd ride it,
// warp through space (or a leafy wormhole) and drop onto the first island of the next world.

  const near = src && d2(src.x, src.y, P.x, P.y) < 500 * 500;
  trans = { t: 0, to, from: S.w, sx: near ? src.x : P.x, sy: near ? src.y : P.y, moved: false, landed: false };
  SDK.stop(); keys.clear(); joy.active = false; AU.launch(); shake(6);

    if (tr.t >= TR.warp) { tr.moved = true; arrive(tr.to); }

  hist = [{ x: P.x, y: P.y }];

  cam.x = P.x; cam.y = P.y - 40;
  puffs = []; orbs = []; parts = []; springs.forEach(s => { s.n = 0; });
  coinFx.forEach(c => { if (c.to === 'player') addCoins(c.val, c.reward); }); coinFx = [];
  const gift = PADS.find(p => p.free && ZONES[p.z].w === w);
  if (gift && !S.built.has(gift.id)) { applyBuild(gift, false); burst(gift.x, gift.y, 24, 'confetti', PARTY, 260, 1.2); }

function step(dt) {
  time += dt;
  if (hudCoinBump > 0) hudCoinBump = Math.max(0, hudCoinBump - dt * 4);
  if (hudCapFlash > 0) hudCapFlash = Math.max(0, hudCapFlash - dt * 1.5);
  toasts.forEach(t => t.t += dt); toasts = toasts.filter(t => t.t < t.life);
  if (modal) modal.t += dt;
  if (!modal && !SDK.ad) { if (trans) updateTrans(dt); else simulate(dt); }
  // camera
  const k = 1 - Math.exp(-dt * 6);
  cam.x += (P.x - cam.x) * k; cam.y += (P.y - 40 - cam.y) * k;
  if (shakeT > 0) shakeT -= dt; else shakeA = 0;
  AU.setRain(modal || SDK.ad ? 0 : rainLevel);
}

function simulate(dt) {
  S.time += dt; trackTime(dt);
  if (pendingTrans >= 0 && started && S.time >= transAt) { const w = pendingTrans; pendingTrans = -1; startTrans(w); return; }
  if (S.boost > 0) S.boost = Math.max(0, S.boost - dt);
  for (const k in S.pw) if (S.pw[k] > 0) S.pw[k] = Math.max(0, S.pw[k] - dt);
  P.fullCd -= dt;
  updatePlayer(dt);
  updateSprings(dt);
  updatePuffs(dt);
  updateTrail(dt);
  updateFields(dt);
  updatePads(dt);
  updateBees(dt);
  updateRainers(dt);
  updateHives(dt);
  updateGolden(dt);
  updateOrbs(dt);
  updateBushes(dt);
  updateCoins(dt);
  updateParts(dt);
  updateMissions();
  floaters.forEach(f => { f.t += dt; f.y -= 40 * dt; }); floaters = floaters.filter(f => f.t < f.life);
  incomeT += dt; if (incomeT >= 1) { incomeRate = lerp(incomeRate, incomeAcc / incomeT, 0.15); incomeAcc = 0; incomeT = 0; }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }
}

function updatePlayer(dt) {
  const inp = readInput();
  if ((inp.x || inp.y) && !started) onFirstInput();
  const sp = BASE_SPEED * speedMul(), k = 1 - Math.exp(-dt * 11);
  P.vx += (inp.x * sp - P.vx) * k; P.vy += (inp.y * sp - P.vy) * k;
  const nx = P.x + P.vx * dt, ny = P.y + P.vy * dt;
  if (walkable(nx, P.y)) P.x = nx; else P.vx *= 0.2;
  if (walkable(P.x, ny)) P.y = ny; else P.vy *= 0.2;
  const spd = Math.hypot(P.vx, P.vy);
  movedDist += spd * dt; if (movedDist > 250) tutFade = Math.max(0, tutFade - dt * 2);
  if (spd > 20) P.look = Math.atan2(P.vy, P.vx);
  if (Math.abs(P.vx) > 25) P.face = P.vx > 0 ? 1 : -1;
  P.flap += dt * (spd > 30 ? 16 + spd / 40 : 7);
  P.blink -= dt; P.nextBlink -= dt;
  if (P.nextBlink <= 0) { P.blink = 0.13; P.nextBlink = Math.random() < 0.2 ? 0.28 : rand(1.8, 4.5); }
  P.squash = lerp(P.squash, clamp(spd / 700, 0, 0.18), 1 - Math.exp(-dt * 8));
  const lh = hist[hist.length - 1];
  if (!lh || d2(lh.x, lh.y, P.x, P.y) > 25) { hist.push({ x: P.x, y: P.y }); if (hist.length > 700) hist.shift(); }
  if (S.pw.rocket > 0 && spd > 120 && Math.random() < dt * 30) addPart({ type: 'spark', x: P.x - P.vx * 0.1 + rand(-10, 10), y: P.y - P.vy * 0.1, z: 30 + rand(-6, 6), vx: -P.vx * 0.3, vy: -P.vy * 0.3, vz: 0, t: 0, life: 0.45, c: pick(['#ffd23f', '#ff8a3d', '#ff5d6c']), s: rand(5, 9), r: 0, vr: 4 });
  if (spd > 120 && Math.random() < dt * 14) addPart({ type: 'wind', x: P.x - P.vx * 0.12 + rand(-14, 14), y: P.y - P.vy * 0.12 + rand(-10, 10), z: 26 + rand(-8, 8), vx: -P.vx * 0.2, vy: -P.vy * 0.2, vz: 0, t: 0, life: 0.35, a: Math.atan2(P.vy, P.vx), s: rand(14, 24) });
  // pickups
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; if (p.s < 0.6) continue;
    const r = cloudR(p.water) * 0.8 + P.r * giantK();
    if (d2(p.x, p.y, P.x, P.y) < r * r) tryPickup(p);
  }
}

function updateSprings(dt) {
  const rateMul = 1;
  for (const s of springs) {
    if (s.appear < 1) s.appear = Math.min(1, s.appear + dt * 2);
    s.puffAnim = Math.max(0, s.puffAnim - dt * 3);
    if (ZONES[s.z].w !== S.w) continue; // springs of the worlds you left stay quiet
    s.t -= dt * rateMul;
    if (s.t <= 0) {
      s.t = SPRING_EVERY * rand(0.8, 1.2);
      if (s.n < SPRING_MAX && puffs.length < PUFF_MAX) {
        const z = s.z, r = Math.random();
        let tier = 1;
        if (z === 1) tier = r < 0.4 ? 2 : 1;
        else if (z === 2) tier = r < 0.25 ? 3 : r < 0.7 ? 2 : 1;
        else if (z === 3) tier = r < 0.2 ? 4 : r < 0.6 ? 3 : 2;
        else if (ZONES[z].pt) { const pt = ZONES[z].pt; tier = r < 0.2 ? pt[2] : r < 0.6 ? pt[1] : pt[0]; }
        const a = rand(0, TAU);
        const p = spawnPuff(s.x, s.y, tier, { origin: s, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 });
        p.a = a; s.n++; s.puffAnim = 1;
      }
    }
  }
}

function updatePuffs(dt) {
  const mag = S.pw.magnet > 0;
  for (const p of puffs) {
    p.t += dt; p.bob += dt * 2.2;
    if (p.s < 1) p.s = Math.min(1, p.s + dt * 2.5);
    if (p.gold) continue;
    if (mag && p.s >= 1) {
      // cloud magnet: clouds nearby glide to Pip (only while there is room in the herd)
      const dd = Math.sqrt(d2(p.x, p.y, P.x, P.y));
      if (dd < MAGNET_R && (trail.length < cap() || canAdd(p.tier))) { const k = Math.min(1, 460 * dt / (dd || 1)); p.x += (P.x - p.x) * k; p.y += (P.y - p.y) * k; continue; }
    }
    p.a += rand(-1, 1) * dt * 1.6;
    const sp = 20;
    p.vx *= Math.exp(-dt * 2.5); p.vy *= Math.exp(-dt * 2.5);
    const nx = p.x + (Math.cos(p.a) * sp + p.vx) * dt, ny = p.y + (Math.sin(p.a) * sp * 0.7 + p.vy) * dt;
    if (puffArea(nx, ny) >= 0) { p.x = nx; p.y = ny; }
    else {
      const z = ZONES[Math.max(0, zoneAt(p.x, p.y))] || ZONES[0];
      p.a = Math.atan2(z.cy - p.y, z.cx - p.x) + rand(-0.6, 0.6); p.vx *= -0.5; p.vy *= -0.5;
      if (puffArea(p.x, p.y) < 0) { p.x += (z.cx - p.x) * dt; p.y += (z.cy - p.y) * dt; }
    }
  }
}

function pointAlongHist(dist) {
  let acc = 0, px = P.x, py = P.y;
  for (let i = hist.length - 1; i >= 0; i--) {
    const h = hist[i], seg = Math.hypot(h.x - px, h.y - py);
    if (acc + seg >= dist) { const t = (dist - acc) / (seg || 1); return [lerp(px, h.x, t), lerp(py, h.y, t)]; }
    acc += seg; px = h.x; py = h.y;
  }
  return [px, py];
}

function rectDist2(x, y, f) {
  const dx = Math.max(Math.abs(x - f.x) - FIELD_W / 2, 0), dy = Math.max(Math.abs(y - f.y) - FIELD_H / 2, 0);
  return dx * dx + dy * dy;
}

function updateTrail(dt) {
  let dist = P.r + 6, raining = 0;
  const k = 1 - Math.exp(-dt * 9);
  for (let i = 0; i < trail.length; i++) {
    const c = trail[i], r = cloudR(c.water);
    dist += r * 0.95;
    const [tx, ty] = pointAlongHist(dist);
    c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
    dist += r * 0.85;
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 3);
  }
  for (let i = trail.length - 1; i >= 0; i--) {
    const c = trail[i], rr = cloudR(c.water) * 0.75;
    c.raining = false;
    for (const f of fields) {
      if (f.state !== 'dry' || f.appear < 1) continue;
      if (rectDist2(c.x, c.y, f) > rr * rr) continue;
      const rate = 1.1 + 0.9 * c.tier, give = Math.min(rate * dt, c.water, (f.need - f.prog) / EFF[c.tier] + 1e-4);
      if (!(S.pw.comet > 0)) c.water -= give; // comet rain: the herd rains without running dry
      c.raining = true;
      if (!S.flags.rained) { S.flags.rained = 1; tutStep('rain'); celebrate(); }
      waterField(f, give * EFF[c.tier], true);
      if (c.water <= 0.01) break;
    }
    if (c.raining) {
      raining += 0.35 + c.tier * 0.1;
      c.rt += dt;
      const n = Math.min(6, (14 + c.tier * 10) * dt + Math.random());
      const r = cloudR(c.water);
      for (let j = 0; j < (n | 0); j++) addPart({ type: 'rain', x: c.x + rand(-r * 0.7, r * 0.7), y: c.y + rand(-4, 8), z: 30 + (c.hov || 34), vx: 0, vy: 0, vz: -rand(380, 520), t: 0, life: 1, s: rand(10, 16) });
    }
    if (c.water <= 0.01) {
      trail.splice(i, 1); puffBurst(c.x, c.y, 6, 0.8);
    } else c.tier = tierOf(c.water);
  }
  rainLevel = raining;
  // once the herd has left the field, leftover drizzle pools together and full clouds merge again
  if (!raining && trail.some(c => !isFull(c))) resolveMerges();
}

// rain on a dry field, from the herd or from a rain helper; the last drop makes it sprout
function waterField(f, amt, byPlayer) {
  f.prog = Math.min(f.need, f.prog + amt); f.wet = 1;
  if (f.prog >= f.need - 1e-3) {
    f.prog = f.need; f.state = 'grow'; f.t = 0; f.bump = 1; f.rc = null; AU.grow();
    burst(f.x, f.y, 8, 'spark', ['#bfe9ff', '#ffffff'], 140, 0.6);
    if (byPlayer) { tutStep('grow'); mTrack('rain', 1); }
  }
}
function updateFields(dt) {
  const growK = S.pw.grow > 0 ? 4 : 1, reach = S.pw.giant > 0 ? 60 : 14;
  for (const f of fields) {
    if (f.appear < 1) f.appear = Math.min(1, f.appear + dt * 2.2);
    if (f.bump > 0) f.bump = Math.max(0, f.bump - dt * 3);
    if (f.wet > 0) f.wet = Math.max(0, f.wet - dt * 2);
    if (f.state === 'grow') {
      f.t += dt * growK;
      if (f.t >= CROPS[f.crop].grow) { f.state = 'ripe'; f.t = 0; f.bump = 1; AU.ripe(); burst(f.x, f.y, 8, 'spark', ['#ffe36b', '#ffffff'], 160, 0.7); }
    } else if (f.state === 'ripe') {
      f.t += dt;
      if (Math.abs(P.x - f.x) < FIELD_W / 2 + reach && Math.abs(P.y - f.y) < FIELD_H / 2 + reach) harvest(f, null);
    }
  }
}

function updatePads(dt) {
  padTick -= dt;
  for (const p of PADS) {
    if (!padVisible(p)) continue;
    if (p.appear < 0) { p.appear = 0; evOnce('build', p.id, 'visible'); if (p.type === 'bridge') evOnce('bridge', islandKey(p.z), 'visible'); }
    if (p.appear < 1) p.appear = Math.min(1, p.appear + dt * 2.5);
    if (d2(P.x, P.y, p.x, p.y) < 52 * 52 && S.coins > 1e-6 && p.appear >= 1) {
      const rate = Math.max(14, p.cost / 1.3), amt = Math.min(rate * dt, S.coins, p.cost - p.paid);
      p.paid += amt; S.coins -= amt; S.paidMap[p.id] = p.paid;
      if (S.coins < 1e-6) S.coins = 0;
      if (padTick <= 0) {
        padTick = 0.07;
        coinFx.push({ x: P.x, y: P.y, z: 40, vx: 0, vy: 0, vz: 160, t: 0, delay: 0, val: 0, to: 'pad', tx: p.x, ty: p.y });
        AU.tick(p.paid / p.cost);
      }
      if (p.paid >= p.cost - 1e-6) build(p);
    }
  }
}

function updateBees(dt) {
  for (const b of bees) {
    if (b.w !== S.w) continue;
    b.t += dt; if (b.hop) b.hop = Math.max(0, b.hop - dt * 3);
    if (b.tgt && (b.tgt.state !== 'ripe' || b.tgt.claimed !== b)) b.tgt = null;
    if (!b.tgt) {
      let best = null, bd = 1e12;
      for (const f of fields) if (f.w === b.w && f.state === 'ripe' && !f.claimed && f.t > 0.6) { const dd = d2(b.x, b.y, f.x, f.y); if (dd < bd) { bd = dd; best = f; } }
      if (best) { b.tgt = best; best.claimed = b; }
    }
    let tx, ty, sp;
    const h = b.hive || b.home;
    if (b.tgt) { tx = b.tgt.x; ty = b.tgt.y; sp = b.kind === 'monkey' ? 260 : 190; }
    else { tx = h.x + Math.cos(b.t * 1.3) * 50; ty = h.y - 20 + Math.sin(b.t * 2.1) * 26; sp = 90; }
    const dx = tx - b.x, dy = ty - b.y, dd = Math.hypot(dx, dy);
    if (dd > 1) { const k = 1 - Math.exp(-dt * 5); b.vx += (dx / dd * sp - b.vx) * k; b.vy += (dy / dd * sp - b.vy) * k; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.tgt && dd < 18) harvest(b.tgt, b);
  }
}

function updateRainers(dt) {
  for (const r of rainers) {
    if (r.w !== S.w) continue;
    r.t += dt; r.raining = false;
    if (r.tgt && (r.tgt.state !== 'dry' || r.tgt.rc !== r)) r.tgt = null;
    if (!r.tgt) {
      // nearest dry field, own island first; never two helpers on one field
      let best = null, bd = 1e12;
      for (const f of fields) {
        if (f.w !== r.w || f.state !== 'dry' || f.appear < 1 || (f.rc && f.rc !== r && f.rc.tgt === f)) continue;
        const dd = d2(r.x, r.y, f.x, f.y) + (zoneAt(f.x, f.y) === r.z ? 0 : 4e6);
        if (dd < bd) { bd = dd; best = f; }
      }
      if (best) { r.tgt = best; best.rc = r; }
    }
    let tx, ty, sp;
    if (r.tgt) { tx = r.tgt.x; ty = r.tgt.y; sp = r.kind === 'ufo' ? 170 : 240; }
    else { tx = r.home.x + Math.cos(r.t * 0.9) * 40; ty = r.home.y - 10 + Math.sin(r.t * 1.4) * 20; sp = 70; }
    const dx = tx - r.x, dy = ty - r.y, dd = Math.hypot(dx, dy), v = Math.min(sp, dd * 3);
    if (dd > 1) { const k = 1 - Math.exp(-dt * 4); r.vx += (dx / dd * v - r.vx) * k; r.vy += (dy / dd * v - r.vy) * k; }
    r.x += r.vx * dt; r.y += r.vy * dt;
    if (r.tgt && dd < 34) {
      r.raining = true;
      waterField(r.tgt, r.rate * dt, false);
      if (Math.random() < dt * 16) addPart({ type: 'rain', x: r.x + rand(-22, 22), y: r.y + rand(-4, 8), z: 60, vx: 0, vy: 0, vz: -rand(380, 520), t: 0, life: 1, s: rand(10, 16) });
    }
  }
}

function updateHives(dt) {
  for (const h of hives) {
    if (h.w !== S.w) continue;
    if (h.appear < 1) h.appear = Math.min(1, h.appear + dt * 2.2);
    if (h.bump > 0) h.bump = Math.max(0, h.bump - dt * 3);
    if (h.stash >= 1) evOnce('hive', 'collect', 'visible');
    if (h.stash >= 1 && d2(P.x, P.y, h.x, h.y) < (S.pw.giant > 0 ? 120 : 70) ** 2) {
      evOnce('hive', 'collect', 'interact');
      spawnCoins(h.x, h.y - 20, h.stash, 'player');
      floater(h.x, h.y - 80, '+' + fmt(h.stash), '#ffe36b', 32);
      h.stash = 0; S.stash[h.id] = 0; h.bump = 1; AU.harvest();
    }
  }
}

function updateGolden(dt) {
  if (S.time > S.goldT && !puffs.some(p => p.gold) && started) {
    S.goldT = S.time + rand(55, 85);
    for (let i = 0; i < 30; i++) {
      const z = ZONES[pick(zonesOpen())], a = rand(0, TAU), rr = Math.sqrt(Math.random()) * 0.75;
      const x = z.cx + Math.cos(a) * z.rx * rr, y = z.cy + Math.sin(a) * z.ry * rr;
      if (d2(x, y, P.x, P.y) > 300 * 300 && puffArea(x, y) >= 0) { spawnPuff(x, y, 2, { gold: true, life: 24 }); toast(T('golden'), '', '#ffbf2e'); ev('golden', 'cloud', 'visible'); break; }
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; if (!p.gold) continue;
    p.life -= dt;
    if (p.life <= 0) { puffs.splice(i, 1); puffBurst(p.x, p.y, 8, 1); ev('golden', 'cloud', 'missed'); continue; }
    const dd = Math.sqrt(d2(p.x, p.y, P.x, P.y));
    let ax = 0, ay = 0;
    if (S.pw.magnet > 0 && dd < MAGNET_R) { ax = (P.x - p.x) / (dd || 1) * 1.6; ay = (P.y - p.y) / (dd || 1) * 1.6; }
    else if (dd < 260) { ax = (p.x - P.x) / (dd || 1); ay = (p.y - P.y) / (dd || 1); }
    else { p.a += rand(-1, 1) * dt * 2; ax = Math.cos(p.a) * 0.3; ay = Math.sin(p.a) * 0.3; }
    const sp = BASE_SPEED * 0.72;
    const nx = p.x + ax * sp * dt, ny = p.y + ay * sp * dt;
    if (puffArea(nx, ny) >= 0) { p.x = nx; p.y = ny; }
    else {
      // slide sideways along the edge, never get cornered forever
      const sx = p.x - ay * sp * dt, sy = p.y + ax * sp * dt;
      if (puffArea(sx, sy) >= 0) { p.x = sx; p.y = sy; } else { p.a += Math.PI; }
    }
    if (Math.random() < dt * 12) addPart({ type: 'spark', x: p.x + rand(-20, 20), y: p.y, z: 30 + rand(-10, 20), vx: 0, vy: 0, vz: rand(20, 80), t: 0, life: 0.6, c: '#ffe36b', s: rand(4, 8), r: 0, vr: 3 });
  }
}

// ---------- power-ups (v0.9): an orb drops onto the island every ~45 s (a shooting star in space, a seed pod in the jungle)
// or pops out of a jungle bush. Catch it for 20 s of power.
const POWERS = {
  magnet: { w: 1, col: '#ff5d6c' }, rocket: { w: 1, col: '#ff8a3d' }, comet: { w: 1, col: '#4cc3ff' },
  grow: { w: 2, col: '#7ee26b' }, frenzy: { w: 2, col: '#ffd23f' }, giant: { w: 2, col: '#b58cff' }
};
const PW_TIME = 20, MAGNET_R = 480;
const giantK = () => S.pw.giant > 0 ? 2.2 : 1;
function zonesOpen() { const a = []; for (let i = WORLDS[S.w].z0; i <= S.zone && i < ZONES.length && ZONES[i].w === S.w; i++) a.push(i); return a; }
function pickPower() {
  // the newest world's power-ups come up twice as often
  const pool = []; Object.keys(POWERS).forEach(k => { if (POWERS[k].w <= S.w) { pool.push(k); if (POWERS[k].w === S.w) pool.push(k); } });
  return pick(pool);
}
function spawnOrb(x, y, id, pop) {
  orbs.push({ x, y, id, t: 0, life: 24, z: pop ? 20 : 1100, vz: pop ? 620 : -500, landed: false, bob: 0 });
  toast(T('power'), T('pw_' + id), POWERS[id].col); ev('power', id, 'visible'); AU.whoosh();
}
function updateOrbs(dt) {
  if (S.w >= 1 && started && S.time > S.orbT && !orbs.length) {
    S.orbT = S.time + rand(38, 52);
    for (let i = 0; i < 40; i++) {
      const z = ZONES[pick(zonesOpen())], a = rand(0, TAU), rr = Math.sqrt(Math.random()) * 0.7;
      const x = z.cx + Math.cos(a) * z.rx * rr, y = z.cy + Math.sin(a) * z.ry * rr, dd = d2(x, y, P.x, P.y);
      if (dd > 220 * 220 && dd < 750 * 750 && puffArea(x, y) >= 0) { spawnOrb(x, y, pickPower(), false); break; }
    }
  }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.t += dt; o.bob += dt * 3;
    if (!o.landed) {
      o.vz -= 1300 * dt; o.z += o.vz * dt;
      if (Math.random() < dt * 50) addPart(S.w === 2 ? { type: 'leaf', x: o.x + rand(-8, 8), y: o.y, z: o.z + 20, vx: rand(-60, 60), vy: 0, vz: rand(-40, 60), t: 0, life: 0.8, c: pick(['#7ee26b', '#4fae43']), s: rand(6, 10), r: rand(0, TAU), vr: rand(-6, 6) }
        : { type: 'spark', x: o.x + rand(-6, 6), y: o.y, z: o.z + 30, vx: 0, vy: 0, vz: 0, t: 0, life: 0.6, c: pick(['#fff6c2', '#ffd23f', '#ffffff', POWERS[o.id].col]), s: rand(5, 10), r: 0, vr: 3 });
      if (o.z <= 0) { o.z = 0; o.landed = true; burst(o.x, o.y, 16, 'spark', ['#ffffff', '#ffe36b', POWERS[o.id].col], 220, 0.7); puffBurst(o.x, o.y, 6, 0.8); }
      continue;
    }
    o.life -= dt;
    if (o.life <= 0) { orbs.splice(i, 1); puffBurst(o.x, o.y, 8, 1); ev('power', o.id, 'missed'); continue; }

function load() {

    S.paidMap = d.p || {};
    (d.b || []).forEach(id => { if (PAD_BY_ID[id]) S.built.add(id); });
    PADS.forEach(p => { p.paid = S.paidMap[p.id] || 0; if (S.built.has(p.id)) p.paid = 0; });
    if (typeof d.px === 'number') { P.x = d.px; P.y = d.py; }
    S.miss = Array.isArray(d.ms) ? d.ms.filter(m => m && M_TYPES.includes(m.t)) : []; S.mi = d.mi || 0; S.stars = d.sr || 0;
    S.hat = typeof d.h === 'number' ? Math.min(d.h, hatsOwned() - 1) : -1;
    S.w = d.w || 0; S.pw = d.pw && typeof d.pw === 'object' ? d.pw : {}; S.orbT = d.ot || 0;
    S.zs = typeof d.zs === 'number' ? d.zs : null; EV.lastDay = d.day || 0; // saves from before v0.10: island start unknown
    return S.built.size > 0 || S.flags.harvested > 0;
  } catch (e) { return false; }
}
window.addEventListener('pagehide', save);

// ---------- boot
function boot() {
  const had = load();
  EV.isNew = !had;
  ev('session', had ? 'returning' : 'new', 'loaded'); vMark('load');
  if (had && EV.lastDay) {
    const d = Math.floor(Date.now() / 864e5) - EV.lastDay;
    ev('session', 'return', d <= 0 ? 'sameday' : d === 1 ? 'day1' : d <= 3 ? 'day2-3' : d <= 7 ? 'day4-7' : 'day8plus');
  }
  // replay saved builds in pad order so zones, springs, fields and hives come back correctly
  const keep = new Set(S.built); S.built = new Set(); S.zone = 0;
  resetWorld();
  PADS.forEach(p => { if (keep.has(p.id)) applyBuild(p, false); });
  // v0.9: a save that built a world's finale (e.g. the fountain in v0.8) still makes the trip to the next world
  S.w = Math.min(S.w, worldOf(S.zone));
  if (worldOf(S.zone) > S.w) { pendingTrans = worldOf(S.zone); transAt = 0; }
  AU.world = S.w;
  if (!walkable(P.x, P.y) || wAt(P.x, P.y) !== S.w) { const st = worldStart(S.w); P.x = st.x; P.y = st.y; }
  cam.x = P.x; cam.y = P.y - 40; hist = [{ x: P.x, y: P.y }];
  if (!had) {
    // safe, generous start: clouds right next to you
    spawnPuff(-70, -40, 1).s = 1; spawnPuff(80, 70, 1).s = 1; spawnPuff(-110, 90, 1).s = 1;
  } else {
    tutFade = 0; movedDist = 999;
    toast(T('welcome'), '', '#fff');
  }
  return had;
}

let bootDone = false;
function startGame() {
  if (bootDone) return; bootDone = true;
  boot();
  const bar = document.querySelector('#bar i'); if (bar) bar.style.width = '100%';
  try { poki().gameLoadingFinished(); } catch (e) {}
  const ld = document.getElementById('load');
  setTimeout(() => { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 400); }, 150);
  cv.focus();
  let last = performance.now();
  const frame = now => { const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now; watchPerf(raw); step(dt); render(); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  // prepare the other islands of this world in the background, so flying to one never hitches
  preloadIslands();
}
(function init() {
  const bar = document.querySelector('#bar i'); if (bar) bar.style.width = '35%';
  // game art on the loading screen: the cloud friends you are about to catch
  try {
    const art = document.getElementById('lart');
    [1, 4, 2].forEach(t => { const sp = cloudSprite(t), c = document.createElement('canvas'); c.width = c.height = sp.SZ; c.getContext('2d').drawImage(sp.c, 0, 0); art.appendChild(c); });
  } catch (e) {}
  const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('700 40px Fredoka').catch(() => {}) : Promise.resolve();
  const sdkReady = Promise.resolve(window.__pokiReady).then(ok => {
    if (!ok || !window.PokiSDK) return; // offline, ad blocker or own site: the game stays fully playable, rewards are never granted
    let p; try { p = PokiSDK.init(); } catch (e) { p = null; }
    return Promise.resolve(p).catch(() => {}).then(() => {
      pokiLive = true; SDK.flush();
      // SDK arrived after the game had already started: report what it missed
      if (bootDone) { try { PokiSDK.gameLoadingFinished(); if (SDK.playing) PokiSDK.gameplayStart(); } catch (e) {} }
    });
  });
  // keep the bar moving while the SDK loads, so a slow connection never looks frozen
  let pct = 35; const creep = setInterval(() => { if (bootDone) return clearInterval(creep); pct += (78 - pct) * 0.15; if (bar) bar.style.width = pct + '%'; }, 200);
  const timeout = new Promise(r => setTimeout(r, 4000));
  Promise.race([Promise.all([fontReady, sdkReady]), timeout]).then(() => { if (bar) bar.style.width = '80%'; startGame(); });
})();
</script>
