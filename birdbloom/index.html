<div id="load"><div id="lart"></div><h1>BirdBloom</h1><div id="bar"><i></i></div></div>
<script>
'use strict';
/* =========================================================
   BIRDBLOOM — a little bird herds clouds, merges them into storms,
   rain on thirsty fields and grow a floating sky-farm.
   ========================================================= */

// ---------- helpers
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function fmt(n) { n = Math.floor(n); if (n < 10000) return '' + n; if (n < 1e6) return (n / 1000).toFixed(n < 1e5 ? 1 : 0).replace('.0', '') + 'K'; return (n / 1e6).toFixed(1).replace('.0', '') + 'M'; }
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = lerp(pa >> 16, pb >> 16, t) | 0, g = lerp((pa >> 8) & 255, (pb >> 8) & 255, t) | 0, bl = lerp(pa & 255, pb & 255, t) | 0;
  return 'rgb(' + r + ',' + g + ',' + bl + ')';

    const a = Math.atan2(p.y - P.y, p.x - P.x); p.vx = Math.cos(a) * 160; p.vy = Math.sin(a) * 160;
    return;
  }
  puffs.splice(puffs.indexOf(p), 1);
  if (p.origin) p.origin.n = Math.max(0, p.origin.n - 1);
  const pc = partialCloud(), maxW = fullW(tierCap());
  if (pc && pc.water + p.water <= maxW + 1e-6) {
    // top up a half-empty cloud: it visibly grows
    pc.water += p.water; pc.tier = tierOf(pc.water); pc.pop = 0.8;
  } else trail.push({ x: p.x, y: p.y, tier: p.tier, water: p.water, pop: 0.6, raining: false, rt: 0 });
  tutStep('cloud');
  S.flags.collected++;
  AU.pop(p.tier); puffBurst(p.x, p.y, 5, 0.8);
  resolveMerges();
}
function catchGolden(p) {
  puffs.splice(puffs.indexOf(p), 1);
  const v = Math.max(20, Math.round(incomeRate * 25 + 15 * (S.zone + 1) * (S.zone + 1)));
  spawnCoins(p.x, p.y, v, 'player');
  burst(p.x, p.y, 34, 'confetti', ['#ffd23f', '#ff6fa8', '#4cc3ff', '#7ee26b', '#b58cff'], 320, 1.4);
  floater(p.x, p.y - 70, T('lucky') + ' +' + fmt(v), '#ffe36b', 40);
  AU.lucky(); shake(6);
  ev('golden', 'cloud', 'interact'); mTrack('golden', 1);
}
function harvest(f, bee) {
  const mul = S.boost > 0 ? 2 : 1, v = Math.round(CROPS[f.crop].coins * mul * fieldMul(Math.max(0, zoneAt(f.x, f.y))));
  f.state = 'dry'; f.prog = 0; f.t = 0; f.claimed = null; f.bump = 1;
  if (bee) { bee.hive.stash += v; S.stash[bee.hive.id] = bee.hive.stash; bee.hive.bump = 1; burst(f.x, f.y, 6, 'leaf', ['#7ee26b', '#4fae43'], 160, 0.7); }
  else {
    spawnCoins(f.x, f.y, v, 'player');
    floater(f.x, f.y - 60, '+' + fmt(v), '#ffe36b', 32);
    burst(f.x, f.y, 10, 'leaf', ['#7ee26b', '#4fae43', '#b8f08a'], 220, 0.8);
    AU.harvest();
  }
  if (!bee) tutStep('harvest'); else evOnce('bee', 'harvest', 'reached');
  if (!bee && !S.flags.harvested) celebrate();
  if (!bee) mTrack('harvest', 1, f.crop);
  S.flags.harvested++;
}
function padVisible(p) {
  if (S.built.has(p.id) || p.z > S.zone) return false;
  return p.req.every(r => r === 'harvest' ? S.flags.harvested > 0 : S.built.has(r));
}
function applyBuild(p, fresh) {
  S.built.add(p.id);
  switch (p.type) {
    case 'field': { const f = makeField(p.id, p.x, p.y, p.crop); f.appear = fresh ? 0 : 1; fields.push(f); break; }
    case 'spring': addSpring(p.x, p.y, p.z, fresh); break;
    case 'bee': addHive(p.id, p.x, p.y, fresh); break;
    case 'bridge': {
      S.zone = Math.max(S.zone, p.to);
      BASE_SPRINGS.forEach(s => { if (s.z === p.to) addSpring(s.x, s.y, s.z, fresh); });
      break;
    }
  }
}
function build(p) {
  p.paid = 0; delete S.paidMap[p.id];
  applyBuild(p, true);
  burst(p.x, p.y, 30, 'confetti', ['#ffd23f', '#ff6fa8', '#4cc3ff', '#7ee26b', '#b58cff', '#ff8a3d'], 300, 1.3);
  puffBurst(p.x, p.y, 10, 1.4);
  AU.build(); shake(5);
  const label = p.type === 'cap' ? T('slot') : p.type === 'speed' ? T('fast') : padName(p);
  floater(p.x, p.y - 70, label, '#fff', 30);
  if (islandDone(p.z)) { celebrate(T('islandDone'), T('z' + p.z)); ev('island', islandKey(p.z), 'all-built'); }
  else toast(praise(), '', '#ffe36b');
  ev('build', p.id, 'interact');
  tutStep('build'); tutStep('complete');
  if (p.type === 'bridge') {
    ev('island', islandKey(p.z), 'complete');
    ev('island', islandKey(p.to), 'start');
    setTimeout(() => { if (!modal) openModal('zone', { zone: p.to }); else pendingZone = p.to; }, 1100);
  }
  if (p.type === 'fountain') { ev('island', islandKey(p.z), 'complete'); ev('milestone', 'fountain', 'reached'); setTimeout(() => openModal('final'), 1200); }
  save();
}
let pendingZone = -1;
const islandDone = z => PADS.every(q => q.z !== z || S.built.has(q.id));
function padName(p) {
  if (p.type === 'field') return T('f_' + p.crop);
  return T('p_' + p.type);
}

// ---------- missions & hats (v0.8): three small goals of about a minute each, every one pays coins and a star;
// stars unlock hats for Pip. Icons and numbers only, so they need no translation.
const HATS = [{ id: 'straw', at: 1 }, { id: 'flower', at: 3 }, { id: 'party', at: 5 }, { id: 'propeller', at: 8 }, { id: 'crown', at: 12 }, { id: 'rainbow', at: 16 }];
const M_CYCLE = ['harvest', 'rain', 'tier', 'coins', 'harvest', 'golden', 'rain', 'tier', 'coins'];
const hatsOwned = () => HATS.filter(h => S.stars >= h.at).length;
const missionsOn = () => S.built.size >= 1;
function makeMission(i) {
  const z = S.zone;
  let t = M_CYCLE[i % M_CYCLE.length];
  if (t === 'golden' && i < 5) t = 'rain';
  const m = { t, c: 0, n: 1 };
  if (t === 'harvest') {
    // a crop from the newest island the player farms on
    const crops = fields.filter(f => zoneAt(f.x, f.y) === z).map(f => f.crop);
    m.k = crops.length ? pick(crops) : fields[0].crop;
    m.n = Math.max(4, Math.round(9 - CROPS[m.k].grow * 0.5 + z));
  } else if (t === 'rain') m.n = 6 + z * 2;
  else if (t === 'tier') { m.k = Math.min(tierCap(), 2 + z + (i % 2)); m.n = 1; }
  else if (t === 'coins') m.n = Math.max(30, Math.round(Math.max(30, incomeRate * 55) / 10) * 10);
  return m;
}
function updateMissions() {
  if (!missionsOn()) return;
  for (let i = 0; i < 3; i++) {
    const m = S.miss[i];
    if (!m || (m.done && S.time - m.done > 1.8)) {
      // never two of the same goal at once
      let nm = makeMission(S.mi++);
      for (let tries = 0; tries < 4 && S.miss.some((o, j) => j !== i && o && !o.done && o.t === nm.t); tries++) nm = makeMission(S.mi++);
      S.miss[i] = nm; ev('mission', nm.t, 'visible');
    }
  }
}
function mTrack(t, amount, key) {
  if (!missionsOn()) return;
  for (const m of S.miss) {
    if (!m || m.done || m.t !== t) continue;
    if (t === 'tier') { if (key >= m.k) m.c = 1; }
    else if (m.k === undefined || m.k === key) m.c = Math.min(m.n, m.c + amount);
    if (m.c >= m.n) completeMission(m);
  }
}
function completeMission(m) {
  m.done = S.time;
  // about 10 s of income: the star is the real prize, the coins must not skip the island
  const v = Math.max(5, Math.round(incomeRate * 10 + 3 * (S.zone + 1)));
  spawnCoins(P.x, P.y - 40, v, 'player', { reward: true });
  const had = hatsOwned(); S.stars++;
  ev('mission', m.t, 'complete');
  if (hatsOwned() > had) {
    S.hat = hatsOwned() - 1;
    celebrate(T('newHat'), '⭐ ' + S.stars); evOnce('hat', HATS[S.hat].id, 'unlock');
  } else celebrate(T('missionDone'), '+1 ⭐');
  save();
}

// ---------- update
function step(dt) {
  time += dt;
  if (hudCoinBump > 0) hudCoinBump = Math.max(0, hudCoinBump - dt * 4);
  if (hudCapFlash > 0) hudCapFlash = Math.max(0, hudCapFlash - dt * 1.5);
  toasts.forEach(t => t.t += dt); toasts = toasts.filter(t => t.t < t.life);
  if (modal) modal.t += dt;
  if (!modal && !SDK.ad) simulate(dt);
  // camera
  const k = 1 - Math.exp(-dt * 6);
  cam.x += (P.x - cam.x) * k; cam.y += (P.y - 40 - cam.y) * k;
  if (shakeT > 0) shakeT -= dt; else shakeA = 0;
  AU.setRain(modal || SDK.ad ? 0 : rainLevel);
}

function simulate(dt) {
  S.time += dt; trackTime(dt);
  if (S.boost > 0) S.boost = Math.max(0, S.boost - dt);
  P.fullCd -= dt;
  updatePlayer(dt);
  updateSprings(dt);
  updatePuffs(dt);
  updateTrail(dt);
  updateFields(dt);
  updatePads(dt);
  updateBees(dt);
  updateHives(dt);
  updateGolden(dt);
  updateCoins(dt);
  updateParts(dt);
  updateMissions();
  floaters.forEach(f => { f.t += dt; f.y -= 40 * dt; }); floaters = floaters.filter(f => f.t < f.life);
  incomeT += dt; if (incomeT >= 1) { incomeRate = lerp(incomeRate, incomeAcc / incomeT, 0.15); incomeAcc = 0; incomeT = 0; }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }
}

function updatePlayer(dt) {
  const inp = readInput();
  if ((inp.x || inp.y) && !started) onFirstInput();
  const sp = BASE_SPEED * speedMul(), k = 1 - Math.exp(-dt * 11);
  P.vx += (inp.x * sp - P.vx) * k; P.vy += (inp.y * sp - P.vy) * k;
  const nx = P.x + P.vx * dt, ny = P.y + P.vy * dt;
  if (walkable(nx, P.y)) P.x = nx; else P.vx *= 0.2;
  if (walkable(P.x, ny)) P.y = ny; else P.vy *= 0.2;
  const spd = Math.hypot(P.vx, P.vy);
  movedDist += spd * dt; if (movedDist > 250) tutFade = Math.max(0, tutFade - dt * 2);
  if (spd > 20) P.look = Math.atan2(P.vy, P.vx);
  if (Math.abs(P.vx) > 25) P.face = P.vx > 0 ? 1 : -1;
  P.flap += dt * (spd > 30 ? 16 + spd / 40 : 7);
  P.blink -= dt; P.nextBlink -= dt;
  if (P.nextBlink <= 0) { P.blink = 0.13; P.nextBlink = Math.random() < 0.2 ? 0.28 : rand(1.8, 4.5); }
  P.squash = lerp(P.squash, clamp(spd / 700, 0, 0.18), 1 - Math.exp(-dt * 8));
  const lh = hist[hist.length - 1];
  if (!lh || d2(lh.x, lh.y, P.x, P.y) > 25) { hist.push({ x: P.x, y: P.y }); if (hist.length > 700) hist.shift(); }
  if (spd > 120 && Math.random() < dt * 14) addPart({ type: 'wind', x: P.x - P.vx * 0.12 + rand(-14, 14), y: P.y - P.vy * 0.12 + rand(-10, 10), z: 26 + rand(-8, 8), vx: -P.vx * 0.2, vy: -P.vy * 0.2, vz: 0, t: 0, life: 0.35, a: Math.atan2(P.vy, P.vx), s: rand(14, 24) });
  // pickups
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; if (p.s < 0.6) continue;
    const r = cloudR(p.water) * 0.8 + P.r;
    if (d2(p.x, p.y, P.x, P.y) < r * r) tryPickup(p);
  }
}

function updateSprings(dt) {
  const rateMul = 1;
  for (const s of springs) {
    if (s.appear < 1) s.appear = Math.min(1, s.appear + dt * 2);
    s.puffAnim = Math.max(0, s.puffAnim - dt * 3);
    s.t -= dt * rateMul;
    if (s.t <= 0) {
      s.t = SPRING_EVERY * rand(0.8, 1.2);
      if (s.n < SPRING_MAX && puffs.length < PUFF_MAX) {
        const z = s.z, r = Math.random();
        let tier = 1;
        if (z === 1) tier = r < 0.4 ? 2 : 1;
        else if (z === 2) tier = r < 0.25 ? 3 : r < 0.7 ? 2 : 1;
        else if (z === 3) tier = r < 0.2 ? 4 : r < 0.6 ? 3 : 2;
        const a = rand(0, TAU);
        const p = spawnPuff(s.x, s.y, tier, { origin: s, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 });
        p.a = a; s.n++; s.puffAnim = 1;
      }
    }
  }
}

function updatePuffs(dt) {
  for (const p of puffs) {
    p.t += dt; p.bob += dt * 2.2;
    if (p.s < 1) p.s = Math.min(1, p.s + dt * 2.5);
    if (p.gold) continue;
    p.a += rand(-1, 1) * dt * 1.6;
    const sp = 20;
    p.vx *= Math.exp(-dt * 2.5); p.vy *= Math.exp(-dt * 2.5);
    const nx = p.x + (Math.cos(p.a) * sp + p.vx) * dt, ny = p.y + (Math.sin(p.a) * sp * 0.7 + p.vy) * dt;
    if (puffArea(nx, ny) >= 0) { p.x = nx; p.y = ny; }
    else {
      const z = ZONES[Math.max(0, zoneAt(p.x, p.y))] || ZONES[0];
      p.a = Math.atan2(z.cy - p.y, z.cx - p.x) + rand(-0.6, 0.6); p.vx *= -0.5; p.vy *= -0.5;
      if (puffArea(p.x, p.y) < 0) { p.x += (z.cx - p.x) * dt; p.y += (z.cy - p.y) * dt; }
    }
  }
}

function pointAlongHist(dist) {
  let acc = 0, px = P.x, py = P.y;
  for (let i = hist.length - 1; i >= 0; i--) {
    const h = hist[i], seg = Math.hypot(h.x - px, h.y - py);
    if (acc + seg >= dist) { const t = (dist - acc) / (seg || 1); return [lerp(px, h.x, t), lerp(py, h.y, t)]; }
    acc += seg; px = h.x; py = h.y;
  }
  return [px, py];
}

function rectDist2(x, y, f) {
  const dx = Math.max(Math.abs(x - f.x) - FIELD_W / 2, 0), dy = Math.max(Math.abs(y - f.y) - FIELD_H / 2, 0);
  return dx * dx + dy * dy;
}

function updateTrail(dt) {
  let dist = P.r + 6, raining = 0;
  const k = 1 - Math.exp(-dt * 9);
  for (let i = 0; i < trail.length; i++) {
    const c = trail[i], r = cloudR(c.water);
    dist += r * 0.95;
    const [tx, ty] = pointAlongHist(dist);
    c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
    dist += r * 0.85;
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 3);
  }
  for (let i = trail.length - 1; i >= 0; i--) {
    const c = trail[i], rr = cloudR(c.water) * 0.75;
    c.raining = false;
    for (const f of fields) {
      if (f.state !== 'dry' || f.appear < 1) continue;
      if (rectDist2(c.x, c.y, f) > rr * rr) continue;
      const rate = 1.1 + 0.9 * c.tier, give = Math.min(rate * dt, c.water, (f.need - f.prog) / EFF[c.tier] + 1e-4);
      f.prog += give * EFF[c.tier]; c.water -= give; c.raining = true; f.wet = 1;
      if (!S.flags.rained) { S.flags.rained = 1; tutStep('rain'); celebrate(); }
      if (f.prog >= f.need - 1e-3) { f.prog = f.need; f.state = 'grow'; f.t = 0; f.bump = 1; AU.grow(); tutStep('grow'); mTrack('rain', 1); burst(f.x, f.y, 8, 'spark', ['#bfe9ff', '#ffffff'], 140, 0.6); }
      if (c.water <= 0.01) break;
    }
    if (c.raining) {
      raining += 0.35 + c.tier * 0.1;
      c.rt += dt;
      const n = Math.min(6, (14 + c.tier * 10) * dt + Math.random());
      const r = cloudR(c.water);
      for (let j = 0; j < (n | 0); j++) addPart({ type: 'rain', x: c.x + rand(-r * 0.7, r * 0.7), y: c.y + rand(-4, 8), z: 30 + (c.hov || 34), vx: 0, vy: 0, vz: -rand(380, 520), t: 0, life: 1, s: rand(10, 16) });
    }
    if (c.water <= 0.01) {
      trail.splice(i, 1); puffBurst(c.x, c.y, 6, 0.8);
    } else c.tier = tierOf(c.water);
  }
  rainLevel = raining;
  // once the herd has left the field, leftover drizzle pools together and full clouds merge again
  if (!raining && trail.some(c => !isFull(c))) resolveMerges();
}

function updateFields(dt) {
  for (const f of fields) {
    if (f.appear < 1) f.appear = Math.min(1, f.appear + dt * 2.2);
    if (f.bump > 0) f.bump = Math.max(0, f.bump - dt * 3);
    if (f.wet > 0) f.wet = Math.max(0, f.wet - dt * 2);
    if (f.state === 'grow') {
      f.t += dt;
      if (f.t >= CROPS[f.crop].grow) { f.state = 'ripe'; f.t = 0; f.bump = 1; AU.ripe(); burst(f.x, f.y, 8, 'spark', ['#ffe36b', '#ffffff'], 160, 0.7); }
    } else if (f.state === 'ripe') {
      f.t += dt;
      if (Math.abs(P.x - f.x) < FIELD_W / 2 + 14 && Math.abs(P.y - f.y) < FIELD_H / 2 + 14) harvest(f, null);
    }
  }
}

function updatePads(dt) {
  padTick -= dt;
  for (const p of PADS) {
    if (!padVisible(p)) continue;
    if (p.appear < 0) { p.appear = 0; evOnce('build', p.id, 'visible'); if (p.type === 'bridge') evOnce('bridge', islandKey(p.z), 'visible'); }
    if (p.appear < 1) p.appear = Math.min(1, p.appear + dt * 2.5);
    if (d2(P.x, P.y, p.x, p.y) < 52 * 52 && S.coins > 1e-6 && p.appear >= 1) {
      const rate = Math.max(14, p.cost / 1.3), amt = Math.min(rate * dt, S.coins, p.cost - p.paid);
      p.paid += amt; S.coins -= amt; S.paidMap[p.id] = p.paid;
      if (S.coins < 1e-6) S.coins = 0;
      if (padTick <= 0) {
        padTick = 0.07;
        coinFx.push({ x: P.x, y: P.y, z: 40, vx: 0, vy: 0, vz: 160, t: 0, delay: 0, val: 0, to: 'pad', tx: p.x, ty: p.y });
        AU.tick(p.paid / p.cost);
      }
      if (p.paid >= p.cost - 1e-6) build(p);
    }
  }
}

function updateBees(dt) {
  for (const b of bees) {
    b.t += dt;
    if (b.tgt && (b.tgt.state !== 'ripe' || b.tgt.claimed !== b)) b.tgt = null;
    if (!b.tgt) {
      let best = null, bd = 1e12;
      for (const f of fields) if (f.state === 'ripe' && !f.claimed && f.t > 0.6) { const dd = d2(b.x, b.y, f.x, f.y); if (dd < bd) { bd = dd; best = f; } }
      if (best) { b.tgt = best; best.claimed = b; }
    }
    let tx, ty, sp;
    if (b.tgt) { tx = b.tgt.x; ty = b.tgt.y; sp = 190; }
    else { tx = b.hive.x + Math.cos(b.t * 1.3) * 50; ty = b.hive.y - 20 + Math.sin(b.t * 2.1) * 26; sp = 90; }
    const dx = tx - b.x, dy = ty - b.y, dd = Math.hypot(dx, dy);
    if (dd > 1) { const k = 1 - Math.exp(-dt * 5); b.vx += (dx / dd * sp - b.vx) * k; b.vy += (dy / dd * sp - b.vy) * k; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.tgt && dd < 18) harvest(b.tgt, b);
  }
}

function updateHives(dt) {
  for (const h of hives) {
    if (h.appear < 1) h.appear = Math.min(1, h.appear + dt * 2.2);
    if (h.bump > 0) h.bump = Math.max(0, h.bump - dt * 3);
    if (h.stash >= 1) evOnce('hive', 'collect', 'visible');
    if (h.stash >= 1 && d2(P.x, P.y, h.x, h.y) < 70 * 70) {
      evOnce('hive', 'collect', 'interact');
      spawnCoins(h.x, h.y - 20, h.stash, 'player');
      floater(h.x, h.y - 80, '+' + fmt(h.stash), '#ffe36b', 32);
      h.stash = 0; S.stash[h.id] = 0; h.bump = 1; AU.harvest();
    }
  }
}

function updateGolden(dt) {
  if (S.time > S.goldT && !puffs.some(p => p.gold) && started) {
    S.goldT = S.time + rand(55, 85);
    for (let i = 0; i < 30; i++) {
      const z = ZONES[(Math.random() * (S.zone + 1)) | 0], a = rand(0, TAU), rr = Math.sqrt(Math.random()) * 0.75;
      const x = z.cx + Math.cos(a) * z.rx * rr, y = z.cy + Math.sin(a) * z.ry * rr;
      if (d2(x, y, P.x, P.y) > 300 * 300 && puffArea(x, y) >= 0) { spawnPuff(x, y, 2, { gold: true, life: 24 }); toast(T('golden'), '', '#ffbf2e'); ev('golden', 'cloud', 'visible'); break; }
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; if (!p.gold) continue;
    p.life -= dt;
    if (p.life <= 0) { puffs.splice(i, 1); puffBurst(p.x, p.y, 8, 1); ev('golden', 'cloud', 'missed'); continue; }
    const dd = Math.sqrt(d2(p.x, p.y, P.x, P.y));
    let ax = 0, ay = 0;
    if (dd < 260) { ax = (p.x - P.x) / (dd || 1); ay = (p.y - P.y) / (dd || 1); }
    else { p.a += rand(-1, 1) * dt * 2; ax = Math.cos(p.a) * 0.3; ay = Math.sin(p.a) * 0.3; }
    const sp = BASE_SPEED * 0.72;
    const nx = p.x + ax * sp * dt, ny = p.y + ay * sp * dt;
    if (puffArea(nx, ny) >= 0) { p.x = nx; p.y = ny; }
    else {
      // slide sideways along the edge, never get cornered forever
      const sx = p.x - ay * sp * dt, sy = p.y + ax * sp * dt;
      if (puffArea(sx, sy) >= 0) { p.x = sx; p.y = sy; } else { p.a += Math.PI; }
    }

function updateCoins(dt) {

// ---------- goals / guidance

function currentGoal() {

  if (!S.flags.rained) return { icon: 'drop', text: T('rain'), tgt: trail.length ? nearest(fields, f => f.state === 'dry') : nearest(puffs, p => !p.gold) };
  if (!S.flags.harvested) {

    const g = nearest(fields, f => f.state === 'grow');

    return { icon: 'drop', text: T('rain'), tgt: trail.length ? nearest(fields, f => f.state === 'dry') : nearest(puffs, p => !p.gold) };
  }

  const vis = PADS.filter(padVisible).sort((a, b) => (a.cost - a.paid) - (b.cost - b.paid));

  const full = trail.length >= cap();

}

  // joystick
  if (joy.active) {
    const R = 62 * uiS;
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, R, 0, TAU); ctx.fill(); ctx.lineWidth = 4 * u; ctx.strokeStyle = 'rgba(38,49,89,0.35)'; ctx.stroke();
    const kx = joy.ox + joy.vx * R, ky = joy.oy + joy.vy * R;
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(kx, ky, 26 * u, 0, TAU); ctx.fill(); ctx.strokeStyle = NAVY; ctx.stroke();
  }
  // toasts
  toasts.forEach((t, i) => {
    const a = t.t < 0.25 ? outBack(t.t / 0.25) : t.t > t.life - 0.3 ? (t.life - t.t) / 0.3 : 1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, H * 0.32 + i * 70 * u); ctx.scale(a, a);
    txt(t.text, 0, 0, 46 * u, t.col);
    if (t.sub) txt(t.sub, 0, 44 * u, 26 * u, '#fff');
    ctx.restore();
  });
}

// missions column on the right: star counter with the next hat, then three goals (icon + progress, no text)
let hudGoal = null;
function drawMissions(u, pad, pr) {
  if (!missionsOn() || !S.miss.length) return;
  const rw = 132 * u, rh = 44 * u, x = W - pad - rw;
  let y = pad + pr * 2 + 18 * u;
  if (hudGoal && hudGoal.x + hudGoal.w > x - 8 * u) y = Math.max(y, hudGoal.b + 14 * u);
  // header: next hat and stars
  const nh = HATS.find(h => S.stars < h.at);
  roundRectPath(ctx, x, y + 4 * u, rw, rh, rh / 2); ctx.fillStyle = NAVY; ctx.fill();
  roundRectPath(ctx, x, y, rw, rh, rh / 2); ctx.fillStyle = '#fff6c2'; ctx.fill(); ctx.lineWidth = 4 * u; ctx.strokeStyle = NAVY; ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = NAVY; ctx.lineWidth = 3 * u; starPath(x + 24 * u, y + rh / 2, 14 * u); ctx.fill(); ctx.stroke();
  txt(nh ? S.stars + '/' + nh.at : '' + S.stars, x + 44 * u, y + rh / 2 + 1 * u, 22 * u, NAVY, 'left', null);
  if (nh) { ctx.save(); ctx.translate(x + rw - 26 * u, y + rh / 2 + 9 * u); ctx.scale(u * 0.62, u * 0.62); ctx.globalAlpha = 0.85; drawHat(nh.id); ctx.restore(); }
  y += rh + 12 * u;
  S.miss.forEach(m => {
    if (!m) return;
    const done = !!m.done, k = done ? 1 : m.c / m.n, pop = done ? 1 + Math.max(0, 0.15 - (S.time - m.done) * 0.3) : 1;
    ctx.save(); ctx.translate(x + rw / 2, y + rh / 2); ctx.scale(pop, pop); ctx.translate(-(x + rw / 2), -(y + rh / 2));
    if (done) ctx.globalAlpha = clamp(1.8 - (S.time - m.done), 0, 1);
    roundRectPath(ctx, x, y + 4 * u, rw, rh, 14 * u); ctx.fillStyle = NAVY; ctx.fill();
    roundRectPath(ctx, x, y, rw, rh, 14 * u); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    if (k > 0) { ctx.save(); roundRectPath(ctx, x, y, rw, rh, 14 * u); ctx.clip(); ctx.fillStyle = done ? '#7ee26b' : '#c9f3b4'; ctx.fillRect(x, y, rw * k, rh); ctx.restore(); }
    ctx.lineWidth = 4 * u; ctx.strokeStyle = NAVY; roundRectPath(ctx, x, y, rw, rh, 14 * u); ctx.stroke();
    ctx.save(); ctx.translate(x + 26 * u, y + rh / 2); missionIcon(m, u); ctx.restore();
    txt(done ? '✓' : fmt(m.c) + '/' + fmt(m.n), x + rw - 12 * u, y + rh / 2 + 1 * u, (done ? 28 : 21) * u, done ? '#2f8a2a' : NAVY, 'right', null, undefined, rw - 56 * u);
    ctx.restore();
    y += rh + 10 * u;
  });
}
function starPath(x, y, r) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function missionIcon(m, u) {
  if (m.t === 'harvest') { ctx.scale(u * 0.5, u * 0.5); ctx.translate(0, 8); drawCrop(m.k, 2, true); }
  else if (m.t === 'rain') { ctx.scale(u * 0.9, u * 0.9); drop(0, 0, 1); }
  else if (m.t === 'tier' || m.t === 'golden') {
    const sp = cloudSprite(m.t === 'golden' ? 2 : Math.min(6, m.k), m.t === 'golden'); ctx.drawImage(sp.c, -22 * u, -22 * u, 44 * u, 44 * u);
    if (m.t === 'tier') txt('' + m.k, 12 * u, 10 * u, 16 * u, '#fff');
  }
  else if (m.t === 'coins') drawCoin(0, 0, 14 * u);
}

// ---------- modals
function openModal(type, data) {
  if (modal) return;
  modal = Object.assign({ type, t: 0, focus: 0, kb: !isTouch, btns: [] }, data || {});
  SDK.stop(); keys.clear(); joy.active = false;
  if (type === 'zone') { modal.bonus = Math.round(Math.max(60, incomeRate * 60) + 40 * (data.zone || 1)); ev('rewarded', 'island-bonus', 'visible'); }
}
// menus work with the keyboard too: arrows / WASD move the focus, Enter or Space presses the focused button
const NAV_PREV = ['arrowup', 'arrowleft', 'w', 'a', 'z', 'q'], NAV_NEXT = ['arrowdown', 'arrowright', 's', 'd', 'tab'];
function modalKey(k) {
  if (modal.t < 0.25) return; // ignore keys still held from gameplay while the menu pops in
  const bs = modal.btns || [];
  if (NAV_PREV.includes(k) || NAV_NEXT.includes(k)) {
    if (!bs.length) return;
    modal.kb = true;
    modal.focus = (modal.focus + (NAV_NEXT.includes(k) ? 1 : -1) + bs.length) % bs.length;
    AU.tick(0.3);
  } else if (k === 'enter' || k === ' ') {
    const b = bs[modal.focus];
    if (b) { AU.click(); b.fn(); } else if (modal.def) modal.def();
  }
}
function closeModal() { modal = null; if (pendingZone >= 0) { const z = pendingZone; pendingZone = -1; setTimeout(() => openModal('zone', { zone: z }), 300); } }
function resumeFromPause() { closeModal(); SDK.commercial().then(() => SDK.start()); }
function drawModal() {
  const u = uiS, a = outBack(clamp(modal.t / 0.3, 0, 1));
  ctx.fillStyle = 'rgba(20,28,60,' + (0.5 * clamp(modal.t / 0.2, 0, 1)) + ')'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 40 * u, 520 * u), ph = modal.type === 'pause' ? 485 * u : modal.type === 'boost' ? 420 * u : 470 * u;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(a, a); ctx.translate(-W / 2, -H / 2);
  roundRectPath(ctx, px, py + 10 * u, pw, ph, 34 * u); ctx.fillStyle = NAVY; ctx.fill();
  roundRectPath(ctx, px, py, pw, ph, 34 * u); ctx.fillStyle = COL.white; ctx.fill(); ctx.lineWidth = 6 * u; ctx.strokeStyle = NAVY; ctx.stroke();
  // header ribbon
  const hcol = modal.type === 'boost' ? COL.purple : modal.type === 'pause' ? COL.blue : COL.orange;
  roundRectPath(ctx, px + 24 * u, py - 30 * u, pw - 48 * u, 70 * u, 26 * u); ctx.fillStyle = hcol; ctx.fill(); ctx.lineWidth = 6 * u; ctx.stroke();
  const title = modal.type === 'pause' ? T('paused') : modal.type === 'boost' ? T('x2title') : modal.type === 'final' ? T('restored') : T('newIsland');
  txt(title, W / 2, py + 4 * u, 40 * u, '#fff', 'center', undefined, undefined, pw - 90 * u);
  const bw = pw - 90 * u, bh = 70 * u, bx = W / 2 - bw / 2, b0 = uiBtns.length;
  if (modal.type === 'pause') {
    button(bx, py + 80 * u, bw, bh, T('resume'), COL.orange, COL.orangeLip, () => resumeFromPause());
    button(bx, py + 175 * u, bw, bh * 0.85, T('sound') + ': ' + (AU.on ? T('on') : T('off')), COL.blue, COL.blueLip, () => { AU.on = !AU.on; AU.apply(); saveSettings(); ev('settings', 'sound', AU.on ? 'on' : 'off'); }, { size: 26 * u });
    button(bx, py + 260 * u, bw, bh * 0.85, T('music') + ': ' + (AU.music ? T('on') : T('off')), COL.blue, COL.blueLip, () => { AU.music = !AU.music; AU.apply(); saveSettings(); ev('settings', 'music', AU.music ? 'on' : 'off'); }, { size: 26 * u });
    const hw = (bw - 14 * u) / 2, owned = hatsOwned();
    button(bx, py + 345 * u, hw, bh * 0.85, '🌐 ' + LANGS[LANG], COL.blue, COL.blueLip, () => { setLang(nextLang()); ev('settings', 'language', LANG); }, { size: 24 * u });
    // hat picker: cycles through the unlocked hats and "no hat"
    button(bx + hw + 14 * u, py + 345 * u, hw, bh * 0.85, '🎩 ' + (S.hat + 1) + '/' + owned, owned ? COL.purple : '#b9b3cc', owned ? COL.purpleLip : '#8f88a8', () => {
      if (!owned) return; S.hat = S.hat + 1 >= owned ? -1 : S.hat + 1; save(); ev('settings', 'hat', S.hat >= 0 ? HATS[S.hat].id : 'none');
    }, { size: 24 * u });
    modal.def = () => resumeFromPause();
    txt('BirdBloom v' + VERSION, W / 2, py + ph - 26 * u, 18 * u, 'rgba(38,49,89,0.5)', 'center', null);
  } else if (modal.type === 'boost') {
    ctx.save(); ctx.translate(W / 2, py + 120 * u); const s = 1 + Math.sin(time * 4) * 0.05; ctx.scale(s, s);
    drawCoin(-34 * u, 0, 34 * u); drawCoin(34 * u, 0, 34 * u); txt('x2', 0, 44 * u, 44 * u, '#ffe36b'); ctx.restore();
    txt(T('x2sub'), W / 2, py + 190 * u, 26 * u, NAVY, 'center', null, undefined, pw - 60 * u);
    // standard option first (equal size, above), rewarded below, never green
    button(bx, py + 230 * u, bw, bh, T('nothanks'), COL.blue, COL.blueLip, () => { closeModal(); SDK.start(); });
    button(bx, py + 320 * u, bw, bh, T('watch'), COL.purple, COL.purpleLip, () => {
      ev('rewarded', 'double-coins', 'interact');
      SDK.rewarded().then(ok => { if (ok) { S.boost = 90; toast(T('x2title'), T('x2sub'), '#ffe36b'); AU.lucky(); } closeModal(); SDK.start(); });
    }, { video: true });
    modal.def = () => { closeModal(); SDK.start(); };
  } else if (modal.type === 'zone') {
    const z = modal.zone;
    txt(T('z' + z), W / 2, py + 82 * u, 38 * u, COL.orange, 'center', undefined, undefined, pw - 60 * u);
    ZONES[z].crops.forEach((c, i) => { ctx.save(); ctx.translate(W / 2 + (i - 0.5) * 110 * u, py + 165 * u + Math.sin(time * 4 + i) * 5 * u); ctx.scale(u * 2.2, u * 2.2); drawCrop(c, 2 + i, true); ctx.restore(); });
    const sp = cloudSprite(Math.min(6, ZONES[z].tierCap)); ctx.drawImage(sp.c, W / 2 - pw / 2 + 40 * u, py + 205 * u, 70 * u, 70 * u);
    txt(T('bigger'), W / 2 + 30 * u, py + 242 * u, 24 * u, NAVY, 'center', null, undefined, pw - 180 * u);
    button(bx, py + 290 * u, bw, bh, T('cont'), COL.orange, COL.orangeLip, () => { closeModal(); SDK.commercial().then(() => SDK.start()); });
    button(bx + bw * 0.08, py + 375 * u, bw * 0.84, bh * 0.82, T('bonus') + ' +' + fmt(modal.bonus), COL.purple, COL.purpleLip, () => {
      const b = modal.bonus; ev('rewarded', 'island-bonus', 'interact');
      SDK.rewarded().then(ok => { if (ok) { spawnCoins(P.x, P.y - 40, b, 'player'); burst(P.x, P.y, 30, 'confetti', ['#ffd23f', '#ff6fa8', '#4cc3ff'], 300, 1.2); AU.lucky(); } closeModal(); SDK.start(); });
    }, { video: true, size: 26 * u });
    modal.def = () => { closeModal(); SDK.commercial().then(() => SDK.start()); };
  } else if (modal.type === 'final') {
    ctx.save(); ctx.translate(W / 2, py + 150 * u); ctx.scale(u * 2, u * 2); rainbowIcon(); ctx.restore();
    txt(T('thanks'), W / 2, py + 250 * u, 22 * u, NAVY, 'center', null, undefined, pw - 50 * u);
    button(bx, py + 330 * u, bw, bh, T('cont'), COL.orange, COL.orangeLip, () => { closeModal(); SDK.commercial().then(() => SDK.start()); });
    modal.def = () => { closeModal(); SDK.commercial().then(() => SDK.start()); };
  }
  if (!modal) { ctx.restore(); return; }
  modal.btns = uiBtns.slice(b0);
  const fb = modal.btns[modal.focus];
  if (fb && modal.kb) {
    // pulsing focus ring around the selected button
    const m = (5 + Math.sin(time * 7) * 2) * u;
    roundRectPath(ctx, fb.x - m, fb.y - m, fb.w + m * 2, fb.h + m * 2, (fb.h * 0.35) + m);
    ctx.lineWidth = 5 * u; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  }
  ctx.restore();
}

// ---------- save / load
S.paidMap = {};
function save() {
  try {
    localStorage.setItem(SKEY, JSON.stringify({ v: 1, c: S.coins, b: [...S.built], p: S.paidMap, f: S.flags, z: S.zone, t: S.time, st: S.stash, g: S.goldT, px: P.x, py: P.y, ms: S.miss, mi: S.mi, sr: S.stars, h: S.hat }));
  } catch (e) {}
}
function saveSettings() { try { localStorage.setItem(SKEY + '_s', JSON.stringify({ on: AU.on, m: AU.music })); } catch (e) {} }
function load() {
  try {
    const st = JSON.parse(localStorage.getItem(SKEY + '_s') || 'null'); if (st) { AU.on = !!st.on; AU.music = !!st.m; }
  } catch (e) {}
  try {
    const d = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (!d || d.v !== 1) return false;
    S.coins = d.c || 0; S.flags = Object.assign(S.flags, d.f || {}); S.time = d.t || 0; S.stash = d.st || {}; S.goldT = Math.max(d.g || 0, S.time + 30);
    S.paidMap = d.p || {};
    (d.b || []).forEach(id => { if (PAD_BY_ID[id]) S.built.add(id); });
    PADS.forEach(p => { p.paid = S.paidMap[p.id] || 0; if (S.built.has(p.id)) p.paid = 0; });
    if (typeof d.px === 'number') { P.x = d.px; P.y = d.py; }
    S.miss = Array.isArray(d.ms) ? d.ms.filter(m => m && M_CYCLE.includes(m.t)) : []; S.mi = d.mi || 0; S.stars = d.sr || 0;
    S.hat = typeof d.h === 'number' ? Math.min(d.h, hatsOwned() - 1) : -1;
    return S.built.size > 0 || S.flags.harvested > 0;
  } catch (e) { return false; }
}
window.addEventListener('pagehide', save);

// ---------- boot
function boot() {
  const had = load();
  EV.isNew = !had;
  // replay saved builds in pad order so zones, springs, fields and hives come back correctly
  const keep = new Set(S.built); S.built = new Set(); S.zone = 0;
  resetWorld();
  PADS.forEach(p => { if (keep.has(p.id)) applyBuild(p, false); });
  if (!walkable(P.x, P.y)) { P.x = 0; P.y = 30; }
  cam.x = P.x; cam.y = P.y - 40; hist = [{ x: P.x, y: P.y }];
  if (!had) {
    // safe, generous start: clouds right next to you
    spawnPuff(-70, -40, 1).s = 1; spawnPuff(80, 70, 1).s = 1; spawnPuff(-110, 90, 1).s = 1;
  } else {
    tutFade = 0; movedDist = 999;
    toast(T('welcome'), '', '#fff');
  }
  return had;
}

let bootDone = false;
function startGame() {
  if (bootDone) return; bootDone = true;
  boot();
  const bar = document.querySelector('#bar i'); if (bar) bar.style.width = '100%';
  try { poki().gameLoadingFinished(); } catch (e) {}
  const ld = document.getElementById('load');
  setTimeout(() => { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 400); }, 150);
  cv.focus();
  let last = performance.now();
  const frame = now => { const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now; watchPerf(raw); step(dt); render(); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  // prepare the other islands in the background, so flying to one never hitches
  ZONES.forEach((z, i) => setTimeout(() => islandImage(i), 400 + i * 150));
}
(function init() {
  const bar = document.querySelector('#bar i'); if (bar) bar.style.width = '35%';
  // game art on the loading screen: the cloud friends you are about to catch
  try {
    const art = document.getElementById('lart');
    [1, 4, 2].forEach(t => { const sp = cloudSprite(t), c = document.createElement('canvas'); c.width = c.height = sp.SZ; c.getContext('2d').drawImage(sp.c, 0, 0); art.appendChild(c); });
  } catch (e) {}
  const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('700 40px Fredoka').catch(() => {}) : Promise.resolve();
  const sdkReady = Promise.resolve(window.__pokiReady).then(ok => {
    if (!ok || !window.PokiSDK) return; // offline, ad blocker or own site: the game stays fully playable, rewards are never granted
    let p; try { p = PokiSDK.init(); } catch (e) { p = null; }
    return Promise.resolve(p).catch(() => {}).then(() => {
      pokiLive = true;
      // SDK arrived after the game had already started: report what it missed
      if (bootDone) { try { PokiSDK.gameLoadingFinished(); if (SDK.playing) PokiSDK.gameplayStart(); } catch (e) {} }
    });
  });
  // keep the bar moving while the SDK loads, so a slow connection never looks frozen
  let pct = 35; const creep = setInterval(() => { if (bootDone) return clearInterval(creep); pct += (78 - pct) * 0.15; if (bar) bar.style.width = pct + '%'; }, 200);
  const timeout = new Promise(r => setTimeout(r, 4000));
  Promise.race([Promise.all([fontReady, sdkReady]), timeout]).then(() => { if (bar) bar.style.width = '80%'; startGame(); });
})();
</script>
