function setTxt(id,v){if(UI.hud[id]!==v){UI.hud[id]=v;$(id).textContent=v}}
function updHUD(){if(!R)return;setTxt('vLives',R.lives);setTxt('vComp',fmtN(R.comp));setTxt('vScore',fmtN(R.score));
  const mw=R.maxWave>1e8?'':'/'+R.maxWave;setTxt('vWave',t('wave')+' '+Math.max(1,R.wave)+mw);
  $('wBar').style.width=(R.maxWave>1e8?((R.wave%10)/10*100):(R.wave/R.maxWave*100))+'%';
  const c=seedCost();setTxt('vCost',c);const can=R.comp>=c&&freeBeds().length>0;$('bBuy').classList.toggle('dis',!can);
  setTxt('buyTxt',freeBeds().length?t('plant'):t('full'));
  const cd=(id,v,max)=>{const b=$(id);const off=v>0||R.mod==='nowater';b.classList.toggle('cool',off);b.querySelector('.cd').style.height=(R.mod==='nowater'?100:Math.max(0,v/max*100))+'%'};
  cd('bWater',R.cdW,45);cd('bScare',R.cdS,60);
  setTxt('vMest',R.mest);$('bMest').classList.toggle('hide',R.mest<=0&&!UI.mestDrag);
  setTxt('bSpeed','x'+R.speed);
  const nb=$('bNext');if(R.nextT>0&&!R.g&&R.rev&&R.rev.has('next')&&R.wave>0){nb.classList.remove('hide');setTxt('vNext',t('nextWave')+' +'+Math.floor(4+R.wave*1.5))}else nb.classList.add('hide');
  const gb=$('bGold');const gs=R.wave>=5&&!R.goldUsed&&!R.guide&&freeBeds().length>0&&R.mode!=='daily';gb.classList.toggle('hide',!gs);if(gs&&!R.goldSeen){R.goldSeen=1;measure('rewarded','golden-seed','visible')}
  $('chips').querySelectorAll('[data-p]').forEach(b=>{const x=b.dataset.p;const pl=R.pl[x]||0;const k=x+pl+'_'+(R.comp>=powerCost(x));if(b._k===k)return;b._k=k;
    b.querySelector('.pl').textContent=pl?'+'+pl:'';b.querySelector('.pc i').textContent=pl>=5?'MAX':powerCost(x);b.classList.toggle('can',pl<5&&R.comp>=powerCost(x))})}

function flyComp(p){if(!R.rev||!R.rev.has('comp'))return;if(FX.filter(f=>f.k==='fly').length>10)return;const r=elRect($('vComp'));
  fx('fly',0,0,{scr:1,sx:bx(p.x),sy:by(p.y),tx:r.x+r.w/2,ty:r.y+r.h/2,life:.55,col:'#a8672f'});setTimeout(()=>bump('vComp'),550)}
/* ---------- humor lines ---------- */
const SAY_N=8;
function maybeTalk(p){if(p.boss)return;if(R.pests.some(q=>q.talk>0))return;if(Math.random()<.07){p.say=t('say'+Math.floor(Math.random()*SAY_N));p.talk=2.4}}

/* ---------- game events → effects ---------- */
listeners.push((ev,a,b)=>{if(!R)return;const T=L.T;
  switch(ev){
  case 'plant':puff(a.x,a.y,6,'#c9874a');sfx('plant');misProg('plant',1);introVeg(a.t);guideEvent('plant',a);break;
  case 'merge':{puff(a.x,a.y,10,LVC[a.l-1]);fx('ring',a.x,a.y,{life:.5,sz:1,col:'#ffe14d'});for(let i=0;i<5;i++)fx('star',a.x+fxr(-.4,.4),a.y+fxr(-.5,.2),{life:.7,sz:.14,vy:-.6});
    sfx('merge',a.l);floatText(a.x,a.y-.5,t('lvl')+' '+a.l+'!',LVC[a.l-1],.34);S.st.merges++;misProg('merges',1);
    if(a.l>S.st.maxLvl){S.st.maxLvl=a.l;measure('merge','level-'+a.l,'first')}misMax('lvl',a.l);
    if(a.l>=5){shake=.15;R.omaHappy=2;if(a.l>=6)banner(t('wow'),t('v_'+a.t)+' '+t('lvl')+' '+a.l,'#ffe14d')}
    guideEvent('merge',a);checkAch();break}
  case 'kill':{const d=PEST[a.k];puff(a.x,a.y,a.boss?18:6,a.k==='gold'?'#ffd23f':'#fff',a.boss?2:1);sfx('poof');misProg('kills',1);
    floatText(a.x,a.y-.3,'+'+b,'#c9f27a',.26);flyComp(a);guideEvent('kill',a);
    if(a.k==='gold'){sfx('gold');floatText(a.x,a.y-.7,t('jackpot'),'#ffd23f',.36);misProg('gold',1)}
    if(a.boss){shake=.4;banner(t('bossDown'),'+'+fmtN(500*(1+R.fi)),'#ffe14d');misProg('boss',1);measure('boss',a.k,'defeat');R.omaHappy=3}
    break}
  case 'eat':guideEvent('eat',a);sfx('munch');shake=.2;R.omaMad=2;floatText(R.P.end[0]+.5,R.P.end[1]-.1,'-'+(PEST[a.k].eat||1),'#ff5d6c',.4);
    if(Math.random()<.5)R.omaLine=t('oma'+Math.floor(Math.random()*4));break;
  case 'shielded':floatText(R.P.end[0]+.5,R.P.end[1]-.1,t('blocked'),'#7fd3ff',.3);break;
  case 'wave':{sfx('wave');const boss=R.spawnQ.find(o=>o.boss);measure('wave',runKey()+'-'+String(a).padStart(2,'0'),'start');
    if(boss){setTimeout(()=>{sfx('boss');banner(t('b_'+boss.k),t('bs_'+boss.k),'#ff8a9a')},300);measure('boss',boss.k,'spawn')}else banner(t('wave')+' '+a,R.maxWave<1e8&&a===R.maxWave?t('lastWave'):'');
    if(R.mode==='endless')misMax('ewave',a);
    guideEvent('wave',a);break}
  case 'waveDone':guideEvent('waveDone',a);measure('wave',runKey()+'-'+String(a).padStart(2,'0'),'complete');break;
  case 'spawn':maybeTalk(a);introPest(a.k);break;
  case 'perkOffer':coachOff();showPerks(a);break;
  case 'perk':sfx('perk');measure('perk',a,'selected');hide();break;
  case 'water':sfx('water');for(let i=0;i<20;i++)fx('dot',fxr(0,COLS),fxr(-1,ROWS*.5),{vy:5,life:.6,col:'#7fd3ff',sz:.05});misProg('water',1);measure('ability','water','use');if(coachOff('water'))measure('hint','water','used');break;
  case 'scare':sfx('scare');shake=.25;for(const p of R.pests)fx('star',p.x,p.y-.6,{life:.8,sz:.15});measure('ability','scare','use');if(coachOff('scare'))measure('hint','scare','used');break;
  case 'mestDrop':floatText(a.x,a.y-.9,t('mestFound'),'#fff6a0',.32);if(!S.mestHint){S.mestHint=1;toast(ic('mest')+' '+t('mestHint'),3500)}break;
  case 'mest':sfx('merge',a.l);puff(a.x,a.y,10,'#ffd23f');floatText(a.x,a.y-.5,t('lvl')+' '+a.l+'!','#ffd23f',.34);misMax('lvl',a.l);if(a.l>S.st.maxLvl)S.st.maxLvl=a.l;break;
  case 'sun':floatText(a.x,a.y-.5,'+'+b,'#ffe36b',.24);break;
  case 'fire':if(VEG[a.t].kind==='pop')sfx('pop');break;
  case 'impact':sfx('hit');fx('dot',b.x,b.y,{life:.2,sz:.08,col:a.k==='fire'?'#ffb02e':'#fff'});break;
  case 'land':if(a.k==='lob'){sfx('splat');DECAL.push({x:a.tx,y:a.ty,r:a.rad*.55,col:'#ff5d6c',t:0});puff(a.tx,a.ty,5,'#ff5d6c')}else{sfx('splat');shake=Math.max(shake,.08);fx('ring',a.tx,a.ty,{life:.4,sz:a.rad*2,col:'#ff9a1f'});puff(a.tx,a.ty,6,'#c9874a')}break;
  case 'aura':if(Math.random()<.5)for(const p of R.pests)if(p.slow>0&&Math.random()<.2)fx('tear',p.x+fxr(-.1,.1),p.y-.2,{vy:.8,life:.5});break;
  case 'shell':floatText(a.x,a.y-.8,t('shell'),'#9ad0ff',.32);break;
  case 'summon':floatText(a.x,a.y-.8,t('summon'),'#b58cff',.3);sfx('boss');break;
  case 'burrow':puff(a.x,a.y+.2,4,'#9b6a3d',.8);break;
  case 'early':if(coachOff('next'))measure('hint','next','used');floatText(COLS/2,.4,'+'+a,'#c9f27a',.36);sfx('coin');measure('button','next-wave','interact');break;
  case 'sell':if(coachOff('bin'))measure('hint','bin','used');puff(a.x,a.y,8,'#8bd75c');sfx('coin');floatText(a.x,a.y-.4,'+'+b,'#c9f27a',.3);break;
  case 'revive':sfx('win');banner(t('revived'),'');break;
  }});

/* ---------- perks ---------- */
function showPerks(o){gpStop();measure('perk','offer','visible');
  show('<h2>'+t('perkTitle')+'</h2><p class="hint">'+t('perkInfo')+'</p><div class="perks">'+o.map(id=>{const pk=PERKS.find(p=>p.id===id);
    const icon=pk.need?img(vegIcon(pk.need,3)):ic({soil:'mest',cheap:'comp',compost:'comp',lettuce:'lettuce',quick:'ff',cool:'water',shield:'lettuce',sharp:'star'}[id]||'star');
    return '<button class="perk" data-k="'+id+'">'+icon+'<b>'+t('p_'+id)+'</b><span>'+t('pd_'+id)+'</span></button>'}).join('')+'</div>','perkc');
  onClick('[data-k]',e=>{takePerk(e.dataset.k);gpStart()})}

/* ---------- pause ---------- */
function pause(){if(UI.state!=='run'||!R||R.over||UI.paused||R.perkPending)return;UI.paused=true;gpStop();measure('button','pause','interact');
  show('<h2>'+t('paused')+'</h2><div class="col"><button class="btn big green" id="res">'+t('resume')+'</button>'+
    '<div class="row"><button class="btn blue" id="snd">'+(S.muted?t('soundOff'):t('soundOn'))+'</button><button class="btn blue" id="mus">'+(S.music?t('musicOn'):t('musicOff'))+'</button></div>'+
    '<button class="btn" id="rst">'+t('restart')+'</button><button class="btn gray" id="quit">'+t('quit')+'</button></div>','pause');
  onClick('#res',resume);onClick('#snd',()=>{S.muted=!S.muted;Snd.apply();save();UI.paused=false;pause()});onClick('#mus',()=>{S.music=!S.music;Snd.apply();save();UI.paused=false;pause()});
  onClick('#rst',()=>{measure(R.mode,runKey(),'restart');const fi=R.fi,m=R.mode,bag=R.bag;UI.paused=false;startRun(fi,m,{bag})});
  onClick('#quit',()=>{measure(R.mode,runKey(),'quit');measure('wave',runKey()+'-'+String(R.wave).padStart(2,'0'),'quit');UI.paused=false;goHome()})}
function resume(){hide();UI.paused=false;gpStart()}

/* ---------- results ---------- */
function onOver(){if(R.over==='lose'&&!R.revived&&R.wave>=3){showRevive();return}showResult()}
function showRevive(){gpStop();UI.state='over';measure('rewarded','revive','visible');
  show(drawOmaImg(true)+'<h2>'+t('reviveTitle')+'</h2><p class="hint">'+t('reviveInfo')+'</p><div class="col"><button class="btn big green ad" id="rv">'+ic('ad')+t('reviveBtn')+'</button><button class="btn gray" id="no">'+t('noThanks')+'</button></div>','rev');
  onClick('#rv',()=>rewarded('revive').then(ok=>{if(ok){revive();hide();UI.state='run';gpStart()}else{toast(t('adFail'));showResult()}}));
  onClick('#no',showResult)}
function drawOmaImg(mad){const c=document.createElement('canvas');c.width=240;c.height=180;const x=c.getContext('2d');x.scale(2,2);drawOma(x,60,42,30,0,mad,!mad);return img(c.toDataURL(),'oma')}
function showResult(){gpStop();UI.state='over';coachOff();if(R.guide){S.fg=1;measure('tutorial','first-garden',R.over==='win'?'complete':'fail')}const res=finishRun();R.res=res;const win=res.win;
  if(win){sfx('win')}else sfx('lose');
  measure(R.mode,runKey(),win?'complete':'fail');
  if(R.mode==='field')measure('field',runKey(),'stars-'+res.stars);
  if(win)misProg('win',1);if(win&&res.stars===3){misProg('perfect',1);S.st.perfect=1}
  if(win&&R.lives===1)S.st.close=1;
  if(R.mode==='daily'&&win)measure('daily','challenge','complete');
  // chest roll
  S.chestPity=(S.chestPity||0)+1;let tier=0;const r=Math.random();if(S.chestPity>=10||r<.05){tier=2;S.chestPity=0}else if(r<.3)tier=1;
  const chestBonus=Math.round(res.coins*[.1,.5,1.5][tier])+[5,15,40][tier];
  let total=res.coins+chestBonus;S.coins+=total;save();checkAch();
  const head=win?t('head_win'+Math.floor(Math.random()*3)):t('head_lose'+Math.floor(Math.random()*3));
  const key=R.F.id;let riv='';
  if(R.mode==='field'){const best=S.best[key]||0;const nr=nextRival(R.fi,best);const passed=passedRival(R.fi,res.score);
    riv='<div class="rival">'+(nr?img(gnomeIcon(nr.i),'gn')+'<span>'+(passed?t('passed',passed.n)+' ':'')+t('nextR',nr.n,fmtN(nr.s))+'</span>':img(gnomeIcon(0),'gn')+'<span>'+t('topClub')+'</span>')+'</div>'}
  else if(R.mode==='endless'){const nr=ENDLESS_RIV.map((w,i)=>({n:RIVALS[i],w,i})).find(x=>x.w>(S.endless[key]?S.endless[key].w:0));riv='<div class="rival">'+(nr?img(gnomeIcon(nr.i),'gn')+'<span>'+t('nextRW',nr.n,nr.w)+'</span>':'<span>'+t('topClub')+'</span>')+'</div>'}
  const stars=R.mode==='field'?'<div class="stars big">'+[1,2,3].map(k=>'<span style="animation-delay:'+(k*.25)+'s" class="'+(k<=res.stars?'pop':'')+'">'+ic(k<=res.stars?'star':'star0')+'</span>').join('')+'</div>':'';
  const newBest=R.mode==='field'?(res.score>=(S.best[key]||0)):R.mode==='endless'?res.score>=((S.endless[key]||{}).s||0):res.score>=S.daily.best;
  show('<div class="paper"><small>'+t('paper')+'</small><b>'+head+'</b></div>'+drawOmaImg(!win)+stars+
    '<div class="score">'+fmtN(res.score)+(newBest?'<em>'+t('newBest')+'</em>':'')+'</div><div class="hint">'+(R.mode==='endless'?t('reachedWave',res.wave):t('wave')+' '+res.wave+(R.maxWave<1e8?'/'+R.maxWave:''))+'</div>'+riv+
    '<div class="loot"><div class="pill">'+ic('coin')+'<b>+'+fmtN(res.coins)+'</b></div><button class="chest t'+tier+'" id="chest">'+ic('chest')+'<span>'+t('chest'+tier)+' +'+chestBonus+'</span></button></div>'+
    '<button class="btn green ad" id="dbl">'+ic('ad')+t('double',fmtN(total))+'</button>'+
    '<div class="row">'+(win&&R.mode==='field'&&R.fi<FIELDS.length-1?'<button class="btn big green" id="nxt">'+t('next')+'</button>':'<button class="btn big" id="again">'+t('again')+'</button>')+'<button class="btn gray" id="home">'+t('home')+'</button></div>','result');
  measure('rewarded','double-coins','visible');
  onClick('#dbl',e=>rewarded('double-coins').then(ok=>{if(ok){S.coins+=total;save();e.disabled=true;e.innerHTML=ic('coin')+'+'+fmtN(total)+' ✓';sfx('coin')}else toast(t('adFail'))}));
  onClick('#again',()=>{const fi=R.fi,m=R.mode,bag=R.bag;startRun(fi,m,{bag})});onClick('#nxt',()=>prerun(R.fi+1,'field'));onClick('#home',goHome);
  onClick('#chest',e=>{e.classList.add('open');sfx('gold')})}

/* ---------- rivals ---------- */
function rivalList(fi){return RIVALS.map((n,i)=>({n,i,s:Math.round(FIELD_TOP[fi]*RIV_F[i]/10)*10}))}
function nextRival(fi,score){return rivalList(fi).find(r=>r.s>score)||null}
function passedRival(fi,score){const l=rivalList(fi).filter(r=>r.s<=score);return l.length?l[l.length-1]:null}
function showClub(tab){const tabs=FIELDS.map((f,i)=>'<button class="tab'+(i===tab?' on':'')+'" data-t="'+i+'">'+(i+1)+'</button>').join('')+'<button class="tab'+(tab===9?' on':'')+'" data-t="9">∞</button>';
  let rows;
  if(tab===9){const best=Math.max(0,...FIELDS.map(f=>(S.endless[f.id]||{}).w||0));const l=ENDLESS_RIV.map((w,i)=>({n:RIVALS[i],i,v:w,me:0}));l.push({n:t('you'),v:best,me:1});l.sort((a,b)=>b.v-a.v);
    rows=l.map((r,k)=>'<div class="rk'+(r.me?' me':'')+'"><b>'+(k+1)+'</b>'+(r.me?ic('lettuce'):img(gnomeIcon(r.i),'gn'))+'<span>'+r.n+'</span><em>'+t('wave')+' '+r.v+'</em></div>').join('')}
  else{const f=FIELDS[tab];const l=rivalList(tab).map(r=>({n:r.n,i:r.i,v:r.s}));l.push({n:t('you'),v:S.best[f.id]||0,me:1});l.sort((a,b)=>b.v-a.v);
    rows=l.map((r,k)=>'<div class="rk'+(r.me?' me':'')+'"><b>'+(k+1)+'</b>'+(r.me?ic('lettuce'):img(gnomeIcon(r.i),'gn'))+'<span>'+r.n+'</span><em>'+fmtN(r.v)+'</em></div>').join('')}
  show('<h2>'+t('club')+'</h2><p class="hint">'+t('clubInfo')+'</p><div class="tabs">'+tabs+'</div><div class="sub">'+(tab===9?t('endless'):t('f_'+FIELDS[tab].id))+'</div><div class="ranks">'+rows+'</div><button class="btn gray" id="back">'+t('back')+'</button>','club');
  onClick('[data-t]',e=>showClub(+e.dataset.t));onClick('#back',goHome);measure('screen','club','visible')}

/* ---------- shop ---------- */
function upCost(tp){return Math.round(40*Math.pow(1.55,S.up[tp]||0))}
const META=[{k:'comp',max:5,base:120,mul:1.8},{k:'lives',max:3,base:300,mul:2.2},{k:'soil',max:5,base:200,mul:1.7}];
function metaCost(m){return Math.round(m.base*Math.pow(m.mul,S.meta[m.k]||0))}
function showShop(tab){tab=tab||'veg';measure('screen','shop','visible');
  let body='';
  if(tab==='veg'){body=VORDER.map(tp=>{const d=VEG[tp];const u=S.unl[tp];const lv=S.up[tp]||0;
    const stat=d.kind==='eco'?t('st_eco'):t('st_'+d.kind);
    return '<div class="srow">'+img(vegIcon(tp,u?Math.min(7,1+Math.floor(lv/2)):1))+'<div class="si"><b>'+t('v_'+tp)+(u?' <small>'+t('lvl')+' '+lv+'/10</small>':'')+'</b><span>'+stat+'</span>'+(u&&lv<10?'<span class="up">'+t('upInfo')+'</span>':'')+'</div>'+
      (!u?'<button class="btn small'+(S.coins>=d.cost?' green':' gray')+'" data-u="'+tp+'">'+ic('lock')+fmtN(d.cost)+'</button>':lv<10?'<button class="btn small'+(S.coins>=upCost(tp)?' green':' gray')+'" data-g="'+tp+'">'+ic('coin')+fmtN(upCost(tp))+'</button>':'<b class="ok">MAX</b>')+'</div>'}).join('')}
  else{body=META.map(m=>{const lv=S.meta[m.k]||0;return '<div class="srow">'+ic(m.k==='comp'?'comp':m.k==='lives'?'lettuce':'mest')+'<div class="si"><b>'+t('m_'+m.k)+' <small>'+lv+'/'+m.max+'</small></b><span>'+t('md_'+m.k)+'</span></div>'+
    (lv<m.max?'<button class="btn small'+(S.coins>=metaCost(m)?' green':' gray')+'" data-m="'+m.k+'">'+ic('coin')+fmtN(metaCost(m))+'</button>':'<b class="ok">MAX</b>')+'</div>'}).join('');
    const ready=!S.adCoinT||Date.now()-S.adCoinT>6e5;body+='<div class="srow">'+ic('ad')+'<div class="si"><b>'+t('freeCoins')+'</b><span>'+t('freeCoinsInfo')+'</span></div>'+(ready?'<button class="btn small green ad" id="adc">+60</button>':'<b class="ok">⏳</b>')+'</div>';
    if(ready)measure('rewarded','shop-coins','visible')}
  show('<h2>'+t('shed')+'</h2><div class="row top"><div class="pill">'+ic('coin')+'<b>'+fmtN(S.coins)+'</b></div></div><div class="tabs"><button class="tab'+(tab==='veg'?' on':'')+'" data-tab="veg">'+t('tabVeg')+'</button><button class="tab'+(tab==='meta'?' on':'')+'" data-tab="meta">'+t('tabGarden')+'</button></div><div class="slist">'+body+'</div><button class="btn gray" id="back">'+t('back')+'</button>','shop');
  onClick('[data-tab]',e=>showShop(e.dataset.tab));onClick('#back',goHome);
  if(!S.hUp&&tab==='veg'){const b=[...scr.querySelectorAll('[data-g],[data-u]')].find(e=>e.classList.contains('green'));if(b)b.classList.add('pointme')}
  onClick('[data-u]',e=>{const tp=e.dataset.u;if(S.coins<VEG[tp].cost){toast(t('needCoins'));return}S.coins-=VEG[tp].cost;S.unl[tp]=1;save();sfx('perk');toast(img(vegIcon(tp,1),'ti')+t('unlocked',t('v_'+tp)));measure('shop-item','unlock-'+tp,'buy');checkAch();
    if(!S.bag||S.bag.length<5){S.bag=(S.bag||defaultBag()).concat(tp).slice(0,5)}showShop('veg')});
  onClick('[data-g]',e=>{const tp=e.dataset.g;const c=upCost(tp);if(S.coins<c){toast(t('needCoins'));return}S.coins-=c;S.up[tp]=(S.up[tp]||0)+1;S.hUp=1;save();sfx('merge',3);measure('shop-item','upgrade-'+tp,'buy');if(!S.firstUp){S.firstUp=1;measure('milestone','first-upgrade','reached')}showShop('veg')});
  onClick('[data-m]',e=>{const m=META.find(x=>x.k===e.dataset.m);const c=metaCost(m);if(S.coins<c){toast(t('needCoins'));return}S.coins-=c;S.meta[m.k]=(S.meta[m.k]||0)+1;save();sfx('merge',4);measure('shop-item','meta-'+m.k,'buy');showShop('meta')});
  onClick('#adc',()=>rewarded('shop-coins').then(ok=>{if(ok){S.adCoinT=Date.now();addCoins(60);sfx('coin')}else toast(t('adFail'));showShop('meta')}))}

/* ---------- achievements ---------- */
function achVal(a){const s=S.st;switch(a.s){case'kills':return s.kills;case'merges':return s.merges;case'maxLvl':return s.maxLvl;case'won':return S.won[FIELDS[a.fi].id]?1:0;
  case'allstars':return FIELDS.reduce((x,f)=>x+(S.stars[f.id]||0),0);case'perfect':return s.perfect?1:0;case'bosses':return s.bosses;
  case'ewave':return Math.max(0,...FIELDS.map(f=>(S.endless[f.id]||{}).w||0));case'daily':return s.daily;case'streak':return S.daily.streak;
  case'unl':return VORDER.filter(x=>S.unl[x]).length;case'gold':return s.gold;case'close':return s.close?1:0;case'sold':return s.sold}return 0}
function achCount(){return ACH.filter(a=>S.ach[a.id]).length}
function achName(a){const m=a.id.match(/^(\w+?)_(.+)$/);const base=a.s;
  if(a.s==='won')return t('a_won',t('f_'+FIELDS[a.fi].id));if(a.s==='maxLvl')return t('a_lvl',a.n);if(a.s==='ewave')return t('a_ewave',a.n);
  return t('a_'+a.id)}
function achDesc(a){if(a.s==='won')return t('ad_won');if(a.s==='maxLvl')return t('ad_lvl',a.n);if(a.s==='ewave')return t('ad_ewave',a.n);return t('ad_'+a.s,fmtN(a.n))}
let achQ=0;
function checkAch(){for(const a of ACH){if(S.ach[a.id])continue;if(achVal(a)>=a.n){S.ach[a.id]=1;S.coins+=25;measure('achievement',a.id,'unlocked');
  setTimeout(()=>{toast(ic('trophy')+'<b>'+achName(a)+'</b> +25'+ic('coin'),2600);sfx('gold')},achQ++*900);setTimeout(()=>achQ=Math.max(0,achQ-1),900)}}save()}
function showAch(){const L2=ACH.slice().sort((a,b)=>(S.ach[b.id]?1:0)-(S.ach[a.id]?1:0)||Math.min(1,achVal(b)/b.n)-Math.min(1,achVal(a)/a.n));const rows=L2.map(a=>{const v=Math.min(a.n,achVal(a));const ok=S.ach[a.id];return '<div class="arow'+(ok?' ok':'')+'">'+ic(ok?'trophy':'lock')+'<div class="si"><b>'+achName(a)+'</b><span>'+achDesc(a)+'</span>'+(ok?'':'<div class="bar"><i style="width:'+(v/a.n*100)+'%"></i></div>')+'</div></div>'}).join('');
  show('<h2>'+t('achievements')+' <small>'+achCount()+'/'+ACH.length+'</small></h2><div class="alist">'+rows+'</div><button class="btn gray" id="back">'+t('back')+'</button>','ach');onClick('#back',goHome);measure('screen','achievements','visible')}

/* ---------- missions & daily & login ---------- */
function checkDaily(){const tk=todayKey();if(S.mis.date!==tk){const r=mulberry(dayNum(tk)*131+3);const pool=MISSIONS.slice();const l=[];while(l.length<3){const j=Math.floor(r()*pool.length);l.push(Object.assign({p:0,c:0},pool.splice(j,1)[0]))}S.mis={date:tk,list:l};save()}
  if(S.st.lastDay!==tk){if(S.st.lastDay)S.st.days++;S.st.lastDay=tk}}
function misProg(k,n){if(!S.mis.list)return;let ch=0;for(const m of S.mis.list)if(m.k===k&&!m.c&&m.p<m.n){m.p+=n;ch=1;if(m.p>=m.n){m.p=m.n;toast(ic('cal')+' '+t('misDone'));measure('mission',k,'complete')}}if(ch&&Math.random()<.2)save()}
function misMax(k,v){for(const m of S.mis.list||[])if(m.k===k&&!m.c&&v>m.p){const was=m.p<m.n;m.p=Math.min(m.n,v);if(was&&m.p>=m.n){toast(ic('cal')+' '+t('misDone'));measure('mission',k,'complete')}}}
function showLogin(){if(UI.state!=='home'||UI.screen!=='home')return;const tk=todayKey(),y=todayKey.yest();let day=S.login.last===y?S.login.day%7+1:1;
  const cells=LOGIN_REW.map((c,i)=>'<div class="lday'+(i+1<day?' got':'')+(i+1===day?' now':'')+'"><small>'+t('day',i+1)+'</small>'+ic(i===6?'chest':'coin')+'<b>'+c+'</b></div>').join('');
  const prev=scr.innerHTML;show('<h2>'+t('loginTitle')+'</h2><p class="hint">'+t('loginInfo')+'</p><div class="lgrid">'+cells+'</div><button class="btn big green" id="claim">'+t('claim')+' +'+LOGIN_REW[day-1]+'</button>','login');measure('login','day-'+day,'visible');
  onClick('#claim',()=>{S.login={day,last:tk};addCoins(LOGIN_REW[day-1]);sfx('gold');measure('login','day-'+day,'claim');goHome()})}
function showDaily(){const tk=todayKey();if(S.daily.date!==tk){S.daily.date=tk;S.daily.best=0;S.daily.done=0}
  // preview modifier using same seeded rng as run
  const r=mulberry(dayNum(tk)*7919+17);const unl=Object.keys(S.won).length+1;const fi=Math.floor(r()*Math.min(FIELDS.length,Math.max(1,unl)));const mod=DAILY_MODS[Math.floor(r()*DAILY_MODS.length)];
  show('<h2>'+t('daily')+'</h2><div class="sub">'+t('f_'+FIELDS[fi].id)+'</div><div class="modcard"><b>'+t('mod_'+mod)+'</b><span>'+t('modd_'+mod)+'</span></div>'+
    '<p class="hint">'+t('dailyInfo')+'</p><div class="row"><div class="pill">🔥 <b>'+S.daily.streak+'</b></div><div class="pill">'+t('best')+': <b>'+fmtN(S.daily.best)+'</b></div></div>'+
    (S.daily.done?'<p class="ok">'+t('dailyDone')+'</p>':'')+'<div class="row"><button class="btn gray" id="back">'+t('back')+'</button><button class="btn big green" id="go">'+t('start')+'</button></div>','daily');
  onClick('#back',goHome);onClick('#go',()=>startRun(fi,'daily',{}));measure('daily','challenge','visible')}

/* ---------- settings ---------- */
const LANGS=[['en','English'],['nl','Nederlands'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['pt','Português'],['ru','Русский'],['tr','Türkçe'],['pl','Polski'],['ja','日本語'],['ko','한국어'],['zh','中文'],['hi','हिन्दी'],['bn','বাংলা'],['id','Bahasa Indonesia'],['vi','Tiếng Việt'],['th','ไทย'],['ar','العربية']];
function showSettings(back){const ls=LANGS.map(([k,n])=>'<button class="lang'+(k===lang?' on':'')+'" data-l="'+k+'">'+n+'</button>').join('');
  show('<h2>'+t('settings')+'</h2><div class="row"><button class="btn blue" id="snd">'+(S.muted?t('soundOff'):t('soundOn'))+'</button><button class="btn blue" id="mus">'+(S.music?t('musicOn'):t('musicOff'))+'</button></div><div class="sub">'+t('language')+'</div><div class="langs">'+ls+'</div><div class="ver">Veggie Siege v'+VERSION+'</div><button class="btn gray" id="back">'+t('back')+'</button>','set');
  onClick('#snd',()=>{S.muted=!S.muted;Snd.apply();save();showSettings(back)});onClick('#mus',()=>{S.music=!S.music;Snd.apply();save();showSettings(back)});
  onClick('[data-l]',e=>{lang=e.dataset.l;S.lang=lang;save();applyI18n();measure('settings','lang-'+lang,'selected');showSettings(back)});onClick('#back',back)}
function applyI18n(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));vIconCache.x=0;UI.hud={}}
function detectLang(){let l=null;try{if(window.PokiSDK&&PokiSDK.getLanguage)l=PokiSDK.getLanguage()}catch(e){}if(!l)l=(navigator.language||'en');l=String(l).slice(0,2).toLowerCase();if(l==='in')l='id';return TR[l]?l:'en'}

/* ---------- intro (opener b) ---------- */
function showIntro(done){const c=document.createElement('canvas');c.width=640;c.height=300;const x=c.getContext('2d');x.scale(2,2);
  const sv=L;L={W:320,H:150,dpr:1,T:60,bx:0,by:0};const keepR=R;R=null;
  x.fillStyle='#8fdc5d';rr(x,0,0,320,150,18);x.fill();x.fillStyle='#efcd93';x.fillRect(0,95,320,30);
  drawOma(x,262,62,28,0,true,false);
  for(let i=0;i<3;i++){const p={k:i===1?'cater':'snail',x:.7+i*1.05,y:1.75,dir:1,spd:.5,ph:i,hp:1,mhp:1,slow:0,burnT:0,under:0,fly:0,boss:0,shell:0,hit:0};drawPest(x,p,60,i*.3)}
  bubble(x,95,30,t('say2'),12);L=sv;R=keepR;
  show(img(c.toDataURL(),'intro')+'<h2>'+t('introTitle')+'</h2><p class="hint">'+t('introText')+'</p><button class="btn big green" id="go">'+t('defend')+'</button>','introc');
  let fired=false;const go=()=>{if(fired)return;fired=true;done()};onClick('#go',go);setTimeout(go,9000)}

/* ---------- input ---------- */
function ptr(e){return{x:e.clientX,y:e.clientY}}
function overEl(el,p){if(!el||el.classList.contains('hide'))return false;const r=el.getBoundingClientRect();return p.x>=r.left-6&&p.x<=r.right+6&&p.y>=r.top-6&&p.y<=r.bottom+6}
cv.addEventListener('pointerdown',e=>{Snd.resume();if(UI.state!=='run'||!R||UI.paused||R.over)return;const p=ptr(e);const ci=cellAt(p.x,p.y);
  if(ci>=0&&R.veg[ci]){UI.drag={v:R.veg[ci],sx:p.x,sy:p.y,px:p.x,py:p.y,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else{UI.sel=null;if(ci>=0&&R.P.beds.includes(ci))UI.tapBed={ci,sx:p.x,sy:p.y}}});
/* ---------- choose where to plant: tap an empty bed, or drag from the Plant button ---------- */
function plantAt(ci,how){if(!R||R.over||UI.paused||ci<0||!R.P.beds.includes(ci)||R.veg[ci])return false;
  if(R.g==='merge'||R.g==='pest'||R.g==='comp'||R.g==='merged'){sfx('click');return false}
  const force=(R.g==='plant1'||R.g==='plant2')?'carrot':null;const c=seedCost();
  if(R.comp<c){sfx('click');toast(t('needComp',c));return false}
  const v=buySeed(force,ci);if(v){measure('plant',how,'bed');if(!S.chosePlant){S.chosePlant=1;measure('milestone','first-chosen-bed','reached')}}return !!v}
function bestBed(){const fb=freeBeds();if(!fb.length)return -1;let best=fb[0],bs=1e9;for(const i of fb){const x=i%COLS+.5,y=Math.floor(i/COLS)+.5;
  for(const P of R.P.paths)P.pts.forEach((q,k)=>{const d=Math.hypot(q[0]-x,q[1]-y)+k*.04;if(d<bs){bs=d;best=i}})}return best}
$('bBuy').addEventListener('pointerdown',e=>{if(!R||R.over||UI.paused)return;Snd.resume();UI.seedDrag={sx:e.clientX,sy:e.clientY,px:e.clientX,py:e.clientY,moved:false}});
window.addEventListener('pointermove',e=>{const p=ptr(e);if(UI.drag){UI.drag.px=p.x;UI.drag.py=p.y;if(Math.hypot(p.x-UI.drag.sx,p.y-UI.drag.sy)>8)UI.drag.moved=true;$('bSell').classList.toggle('hot',overEl($('bSell'),p))}
  if(UI.mestDrag){UI.mestDrag.px=p.x;UI.mestDrag.py=p.y}
  if(UI.seedDrag){const d=UI.seedDrag;d.px=p.x;d.py=p.y;if(Math.hypot(p.x-d.sx,p.y-d.sy)>12)d.moved=true}});
window.addEventListener('pointerup',e=>{const p=ptr(e);
  if(UI.tapBed){const tb=UI.tapBed;UI.tapBed=null;if(Math.hypot(p.x-tb.sx,p.y-tb.sy)<14&&cellAt(p.x,p.y)===tb.ci)plantAt(tb.ci,'tap')}
  if(UI.seedDrag){const d=UI.seedDrag;UI.seedDrag=null;if(d.moved){UI.skipBuyClick=1;setTimeout(()=>UI.skipBuyClick=0,50);const ci=cellAt(p.x,p.y);if(ci>=0)plantAt(ci,'drag')}}
  if(UI.drag){const d=UI.drag;UI.drag=null;$('bSell').classList.remove('hot');if(!R||R.over)return;
    if(!d.moved){UI.sel=UI.sel===d.v?null:d.v;if(UI.sel){const v=d.v;toast(img(vegIcon(v.t,v.l),'ti')+'<b>'+t('v_'+v.t)+'</b> '+t('lvl')+' '+v.l+(VEG[v.t].kind==='eco'?' · +'+Math.ceil(vProd(v))+'/6s':' · '+t('dmg')+' '+Math.round(vDmg(v))),1400)}return}
    if(overEl($('bSell'),p)){sellVeg(d.v);measure('button','sell','interact');return}
    const ci=cellAt(p.x,p.y);if(ci<0||!R.P.beds.includes(ci)||ci===d.v.i)return;const o=R.veg[ci];
    if(o&&canMerge(d.v,o)){UI.lastDrop={x:(p.x-L.bx)/L.T,y:(p.y-L.by)/L.T-.2,t:performance.now()};doMerge(d.v,o)}else if(o&&o.t===d.v.t&&o.l===d.v.l){toast(t('maxLvl'))}else{if(o&&(S.hSwap||0)<3){S.hSwap=(S.hSwap||0)+1;toast(t('h_swap'),2600);measure('hint','swap','shown')}moveVeg(d.v,ci);sfx('click')}}
  if(UI.mestDrag){UI.mestDrag=null;const ci=cellAt(p.x,p.y);if(ci>=0&&R&&R.veg[ci]){if(!useMest(R.veg[ci]))toast(t('maxLvl'))}}});
$('bMest').addEventListener('pointerdown',e=>{if(!R||R.mest<=0)return;Snd.resume();UI.mestDrag={px:e.clientX,py:e.clientY};e.preventDefault()});
$('bBuy').addEventListener('click',()=>{Snd.resume();if(!R||R.over||UI.paused||UI.skipBuyClick)return;if(guideBuy())return;
  const v=buySeed();if(!v){sfx('click');if(!freeBeds().length)toast(t('fullInfo'));else toast(t('needComp',seedCost()))}});
$('bWater').addEventListener('click',()=>{if(R&&!useWater()){if(R.mod==='nowater')toast(t('mod_nowater'));else toast(t('cooldown'))}});
$('bScare').addEventListener('click',()=>{if(R&&!useScare()){if(R.mod==='nowater')toast(t('mod_nowater'));else toast(t('cooldown'))}});
$('bSpeed').addEventListener('click',()=>{if(!R)return;coachOff('speed');R.speed=R.speed===1?2:1;sfx('click');measure('button','speed-x'+R.speed,'interact')});
$('bPause').addEventListener('click',()=>{sfx('click');pause()});
$('bNext').addEventListener('click',()=>{if(R)callEarly()});
$('bSell').addEventListener('click',()=>toast(t('sellInfo')));
$('bGold').addEventListener('click',()=>{if(!R||R.goldUsed)return;rewarded('golden-seed').then(ok=>{if(!R)return;if(ok){R.goldUsed=1;const fb=freeBeds();if(fb.length){const i=fb[Math.floor(Math.random()*fb.length)];const tp=R.bag[Math.floor(Math.random()*R.bag.length)];const v=mkVeg(tp,3,i);R.veg[i]=v;puff(v.x,v.y,14,'#ffd23f');sfx('gold');floatText(v.x,v.y-.6,t('goldenSeed'),'#ffd23f',.34)}}else toast(t('adFail'));if(!R.over)gpStart()})});
window.addEventListener('keydown',e=>{if(UI.state!=='run'||!R)return;const k=e.key.toLowerCase();
  if(k===' '||k==='b'){e.preventDefault();$('bBuy').click()}else if(k==='1')$('bWater').click();else if(k==='2')$('bScare').click();else if(k==='f')$('bSpeed').click();else if(k==='n')$('bNext').click();else if(k==='escape'||k==='p'){if(UI.paused)resume();else pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('blur',()=>{if(UI.state==='run')pause()});
window.addEventListener('resize',()=>{resize();coachTick()});
['contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
window.addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});
window.addEventListener('wheel',e=>{if(!e.target.closest('#scr'))e.preventDefault()},{passive:false});

/* ---------- home scene ---------- */
let homeP=null,homeVeg=null;
function drawHome(dt){if(!homeP){homeP=parseField(FIELDS[0]);homeVeg=homeP.beds.filter((b,i)=>i%2===0).map((b,i)=>({t:VORDER[i%3+(i%5===4?1:0)],l:1+i%5,x:b%COLS+.5,y:Math.floor(b/COLS)+.5,id:i}))}
  const c=ctx;c.setTransform(L.dpr,0,0,L.dpr,0,0);buildBg();c.drawImage(bg,0,0,L.W,L.H);
  for(const v of homeVeg)drawVeg(c,v.t,v.l,bx(v.x),by(v.y),L.T,gT,{ph:v.id,noBadge:1});
  const P=homeP.paths[0];for(let i=0;i<4;i++){const s=((gT*.6+i*6.5)%P.len);const pp=pathPos(P,s);drawPest(c,{k:['snail','cater','snail','beetle'][i],x:pp[0],y:pp[1],dir:pp[2]||1,spd:.6,ph:i,hp:1,mhp:1,slow:0,burnT:0,under:0,fly:0,boss:0,shell:0,hit:0},L.T,gT)}
  c.fillStyle='rgba(30,30,60,.28)';c.fillRect(0,0,L.W,L.H)}

/* ---------- thumbnail scene (store art) ---------- */
function thumbScene(){S.tut=1;newRun(0,'field',{bag:['carrot','tomato','onion','corn','chili']});UI.state='run';UI.paused=true;$('hud').className='hidden';resize();
  const lv=[7,5,3,6,2,4,1,5,3,6,2,4,3,5,2,6,4];const ty=['corn','tomato','carrot','chili','onion','carrot','tomato','onion','corn','carrot','tomato','chili','onion','carrot','corn','tomato','onion'];
  R.P.beds.forEach((b,i)=>{const v=mkVeg(ty[i%ty.length],lv[i%lv.length],b);v.pop=1;R.veg[b]=v});
  const ks=['snail','cater','snail','beetle','gold','snail','cater','crow','snail','baron'];const P=R.P.paths[0];
  ks.forEach((k,i)=>{R.wave=6;const p=spawnPest({k});p.s=2+i*2.2;const pp=pathPos(P,p.s);p.x=pp[0];p.y=pp[1];if(pp[2])p.dir=pp[2];if(i%3===0){p.hp=p.mhp*.5}});
  R.pests[0].say=t('say0');R.pests[0].talk=99;R.omaMad=99;
  $('scr').className='on';$('scr').style.background='none';scr.innerHTML='<div class="logo thumb"><span class="l1">Veggie</span><span class="l2">Siege</span></div>'}

/* ---------- main loop ---------- */
let lastT=0;
function frame(ts){const dt=Math.min(.05,Math.max(0,(ts-lastT)/1000));lastT=ts;gT+=dt;
  try{if(UI.state==='run'&&R&&!UI.paused&&!inAd){const was=R.over;if(R.hitStop>0)R.hitStop-=dt;else update(dt*CO.slow);guideTick(dt);if(!was&&R.over)setTimeout(onOver,R.over==='win'?900:700)}
    if(R&&(UI.state==='run'||UI.state==='over')){if(R.omaMad>0)R.omaMad-=dt;if(R.omaHappy>0)R.omaHappy-=dt;drawWorld(dt);updHUD()}else drawHome(dt);glRender(dt);coachTick();
    if(!inAd&&!document.hidden){UI.sess+=dt;S.play+=dt;const ms=[1,3,5,7,10,15,20,30];for(const m of ms)if(UI.sess>=m*60&&!UI.msent[m]){UI.msent[m]=1;measure('session','m'+m,'reached');
      if(m===3||m===7)measure('opener',S.opener||'x','alive-'+m+'m')}}
    if((saveT+=dt)>10){saveT=0;save()}
    Snd.musicTick()}catch(e){console.warn('frame',e)}
  requestAnimationFrame(frame)}

/* ---------- boot ---------- */
load();lang=S.lang&&TR[S.lang]?S.lang:detectLang();applyI18n();
if(S.opener==='c')S.opener=null;if(!S.fg&&S.st.runs>0)S.fg=1;
if(!S.opener){S.opener=['a','b'][Math.floor(Math.random()*2)];save();measure('opener',S.opener,'assigned')}
console.log('Veggie Siege v'+VERSION);
try{if(!new URLSearchParams(location.search).get('nogl'))glInit()}catch(e){}$('ver0').textContent='v'+VERSION;
resize();
Promise.resolve(window.__pokiReady).catch(()=>{}).then(()=>{if(window.PokiSDK)SDK=window.PokiSDK;return SDK.init()}).catch(()=>{}).then(()=>{
  if(!S.lang){lang=detectLang();applyI18n()}
  $('load').classList.add('gone');try{SDK.gameLoadingFinished()}catch(e){}
  checkDaily();
  requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(frame)});
  const qs=new URLSearchParams(location.search);if(qs.get('opener'))S.opener=qs.get('opener');
  if(qs.get('home')){goHome();return}
  if(qs.get('thumb')){thumbScene();return}
  if(!S.fg){const v=S.opener;measure('opener',v,'start');
    if(v==='b'&&!S.tut){UI.state='home';showIntro(()=>startRun(0,'field',{}))}
    else startRun(0,'field',{})}
  else goHome()});

</script>
