:root{--ink:#2b2d4e;--card:#fffaf0;--green:#5fd06a;--greenD:#3f9a4c;--orange:#ff8a3d;--orangeD:#c9612a;--blue:#4cc3ff;--blueD:#2a8fc4;--gray:#8a86a0;--grayD:#5f5b75;--yellow:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#6cc24f;font-family:Fredoka,'Arial Rounded MT Bold','Hiragino Maru Gothic ProN','Yu Gothic','Malgun Gothic','PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-weight:700;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ic{display:inline-block;width:1.4em;height:1.4em;vertical-align:middle;flex:none}.ic svg{width:100%;height:100%;display:block}
.hidden,.hide{display:none!important}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.btn{font-weight:700;border-radius:1rem;padding:.6rem 1.2rem;font-size:1.15rem;color:#fff;background:var(--orange);border:3px solid var(--ink);box-shadow:0 .3rem 0 var(--ink);position:relative;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .07s}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 var(--ink)}
.btn::after{content:"";position:absolute;left:.4rem;right:.4rem;top:.2rem;height:40%;border-radius:.7rem .7rem 1.4rem 1.4rem;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.btn.big{font-size:1.5rem;padding:.7rem 2rem}.btn.small{font-size:1rem;padding:.35rem .8rem;border-radius:.8rem}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.gray{background:var(--gray)}
.btn.ad .ic:first-child{width:1.5em}
.btn:focus-visible,.tile:focus-visible{outline:4px solid #ffe14d;outline-offset:3px}
.rbtn{width:2.9rem;height:2.9rem;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 .2rem 0 var(--ink);display:flex;align-items:center;justify-content:center}
.rbtn .ic{width:1.6rem;height:1.6rem}
.pill{background:#fff;border:3px solid var(--ink);border-radius:1.2rem;padding:.15rem .7rem .15rem .3rem;display:inline-flex;align-items:center;gap:.3rem;font-size:1.15rem;box-shadow:0 .2rem 0 rgba(43,45,78,.35);white-space:nowrap}
.pill .ic{width:1.6rem;height:1.6rem}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud button,#hud .pchip{pointer-events:auto}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:.4rem;align-items:center;padding:.5rem .6rem;padding-top:max(.5rem,env(safe-area-inset-top));justify-content:center;flex-wrap:nowrap}
#top .grow{flex:0 1 13rem;min-width:7rem;flex-direction:column;align-items:stretch;gap:.1rem;padding:.15rem .7rem;font-size:.95rem}

/* ================= MAP PARSE ================= */
function parseField(f){
  const g=[],beds=[],starts=[];let end=null;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const ch=f.map[y][x];g.push(ch);
    if(ch==='B')beds.push(y*COLS+x);if(ch==='S'||ch==='R')starts.push([x,y]);if(ch==='E')end=[x,y]}
  const isP=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS&&'#SRE'.includes(g[y*COLS+x]);
  const D=new Array(COLS*ROWS).fill(-1);const q=[end];D[end[1]*COLS+end[0]]=0;
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
    if(isP(nx,ny)&&D[ny*COLS+nx]<0){D[ny*COLS+nx]=D[y*COLS+x]+1;q.push([nx,ny])}}}
  const paths=starts.map(([sx,sy])=>{const pts=[];let x=sx,y=sy;
    // entry point just outside the board edge
    let ex=sx+.5,ey=sy+.5;if(sx===0)ex=-.6;else if(sx===COLS-1)ex=COLS+.6;else if(sy===0)ey=-.6;else if(sy===ROWS-1)ey=ROWS+.6;pts.push([ex,ey]);
    pts.push([x+.5,y+.5]);let guard=0;
    while(D[y*COLS+x]>0&&guard++<200){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
      if(isP(nx,ny)&&D[ny*COLS+nx]===D[y*COLS+x]-1){x=nx;y=ny;break}}pts.push([x+.5,y+.5])}
    const seg=[];let len=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);len+=l}
    return{pts,seg,len}});
  return{g,beds,starts,end,paths,isP}
}
function pathPos(P,s){let i=0;while(i<P.seg.length&&s>P.seg[i]){s-=P.seg[i];i++}
  if(i>=P.seg.length){const p=P.pts[P.pts.length-1];return[p[0],p[1],0]}
  const a=P.pts[i],b=P.pts[i+1],t=s/P.seg[i];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.sign(b[0]-a[0])]}

  const daily=mode==='daily';let seed=0;
  if(daily){seed=dayNum(todayKey())*7919+17;rng=mulberry(seed)}else rng=Math.random;
  let mod=null,bag=opt.bag||defaultBag();
  if(daily){const unl=Object.keys(S.won).length+1;fi=Math.floor(rng()*Math.min(FIELDS.length,Math.max(1,unl)));
    mod=DAILY_MODS[Math.floor(rng()*DAILY_MODS.length)];const u=VORDER.filter(t=>S.unl[t]);const b=[];
    while(b.length<Math.min(4,u.length)){const t=u[Math.floor(rng()*u.length)];if(!b.includes(t))b.push(t)}bag=b}
  const F=FIELDS[fi],P=parseField(F);
  R={fi,F,P,mode,mod,seed,bag,veg:new Array(COLS*ROWS).fill(null),pests:[],shots:[],
    wave:0,maxWave:mode==='field'?20:daily?15:1e9,spawnQ:[],spawnT:0,nextT:4,waveOn:false,
    comp:60+S.meta.comp*10,lives:10+S.meta.lives,lives0:10+S.meta.lives,buys:0,score:0,kills:0,merges:0,plants:0,
    pl:{},mods:{},perks:[],perkPending:null,cdW:0,cdS:0,waterT:0,stunT:0,mest:0,goldNoMest:0,revived:false,
    time:0,speed:1,over:null,shield:0,bossAlive:0,id:0,maxL:1,golds:0,bossKills:0,firstMergeT:0,tut:opt.tut?1:0,
    sunT:0,usedWater:0,early:0,guide:opt.guide?1:0,g:null,lastMergeT:0,lastPlantT:0,hintCD:0,hints:{}};
  if(mod==='rich')R.comp*=2;
  for(const t of bag)R.pl[t]=0;
  if(R.guide&&!S.tut){R.nextT=null}
  emit('runStart');
  return R}

function freeBeds(){return R.P.beds.filter(i=>!R.veg[i])}
function seedCost(){let c=8+3*R.buys;if(R.mods.cheap)c*=.8;if(R.mod==='cheap5')c*=.6;return Math.floor(c)}
function lvlCap(){return R.mod==='cheap5'?5:MAXL}
function buySeed(force,bed){const fb=freeBeds();const c=seedCost();if(!fb.length||R.comp<c)return null;
  R.comp-=c;R.buys++;R.plants++;
  const i=bed!=null&&!R.veg[bed]?bed:fb[Math.floor(rng()*fb.length)];
  let t=force||R.bag[Math.floor(rng()*R.bag.length)];
  let l=1;const sc=(S.meta.soil*.03)+(R.mods.soil?.15:0);if(bed==null&&rng()<sc)l=2;
  const v=mkVeg(t,l,i);R.veg[i]=v;emit('plant',v);return v}
function mkVeg(t,l,i){return{t,l,i,x:i%COLS+.5,y:Math.floor(i/COLS)+.5,cd:fxr(0,.5),pop:0,blink:fxr(1,5),att:0,ang:0,id:++R.id,sunT:fxr(0,2)}}
function canMerge(a,b){return a&&b&&a!==b&&a.t===b.t&&a.l===b.l&&a.l<lvlCap()}
function doMerge(a,b){b.l++;b.pop=0;b.cd=.2;R.veg[a.i]=null;R.merges++;if(!R.firstMergeT)R.firstMergeT=R.time;
  if(b.l>R.maxL)R.maxL=b.l;R.comp+=0;emit('merge',b);return b}
function moveVeg(a,i){if(R.veg[i]){const b=R.veg[i];R.veg[a.i]=b;b.i=a.i;b.x=a.i%COLS+.5;b.y=Math.floor(a.i/COLS)+.5}else R.veg[a.i]=null;
  R.veg[i]=a;a.i=i;a.x=i%COLS+.5;a.y=Math.floor(i/COLS)+.5}
function sellVeg(a){const g=Math.floor(4*Math.pow(2,a.l-1));R.comp+=g;R.veg[a.i]=null;S.st.sold++;emit('sell',a,g);return g}
function powerCost(t){return Math.floor(50*Math.pow(2,R.pl[t]||0))}
function powerUp(t){if((R.pl[t]||0)>=5)return false;const c=powerCost(t);if(R.comp<c)return false;R.comp-=c;R.pl[t]=(R.pl[t]||0)+1;emit('power',t);return true}
function useMest(v){if(R.mest<=0||!v||v.l>=lvlCap())return false;R.mest--;v.l++;v.pop=0;if(v.l>R.maxL)R.maxL=v.l;emit('mest',v);return true}

/* ---------- stats of a veggie ---------- */
function vDmg(v){const d=VEG[v.t];let m=Math.pow(LV_MUL,v.l-1)*(1+.1*(S.up[v.t]||0))*(1+.25*(R.pl[v.t]||0));
  if(R.mods.sharp)m*=1.12;if(v.t==='pumpkin'&&R.mods.pump)m*=1.4;return d.dmg*m}
function vRange(v){let r=VEG[v.t].rng+.1*(v.l-1);if(v.t==='onion'&&R.mods.tears)r+=.3;return r}
function vRate(v){let r=VEG[v.t].rate*(1+.05*(v.l-1));if(R.waterT>0)r*=1.6;if(R.mods.quick)r*=1.12;if(v.t==='corn'&&R.mods.popcorn)r*=1.3;return r}
function vSlow(v){let s=Math.min(.68,VEG.onion.slow+.06*(v.l-1));if(R.mods.tears)s=Math.min(.78,s+.15);return s}
function vProd(v){let p=VEG.sun.prod*Math.pow(1.9,v.l-1)*(1+.1*(S.up.sun||0))*(1+.25*(R.pl.sun||0));if(R.mods.sunny)p*=1.5;return p}

/* ---------- waves ---------- */
function hpMul(w){const f=1+(R.F.mult-1)*clamp((w-1)/10,0,1);return(1+.14*w+.018*w*w)*f*(R.mod==='rich'?1.6:1)*(w>20?Math.pow(1.07,w-20):1)}
function buildWave(w){const q=[];let n=Math.floor(6+w*1.15);if(R.guide&&w<=4)n=Math.min(n,2+w*2);const pool=R.F.pool.filter(p=>w>=p[1]||R.mode==='endless'&&p[1]<=w+3);
  const tot=pool.reduce((a,p)=>a+p[2],0);
  const isBoss=(w%10===0)||(R.mod==='bossy'&&w%5===0);
  if(isBoss){const bi=Math.floor((w/10-1))%2;const bk=R.F.boss[Math.max(0,bi)%2];q.push({k:bk,boss:1,big:w>=20?1+(w-10)/10*.7:1})}
  const cnt=isBoss?Math.floor(n*.6):n;
  for(let i=0;i<cnt;i++){let r=rng()*tot,k=pool[0][0];for(const p of pool){r-=p[2];if(r<=0){k=p[0];break}}q.push({k})}
  if(w>=2&&(R.mod==='golden'||w%3===0&&rng()<.6))q.splice(Math.floor(q.length*rng()),0,{k:'gold'});
  return q}
function startWave(){R.wave++;R.spawnQ=buildWave(R.wave);R.spawnT=.3;R.waveOn=true;R.nextT=null;emit('wave',R.wave)}
function callEarly(){if(R.nextT===null||R.nextT<=0||R.g)return 0;const b=Math.floor(4+R.wave*1.5);R.comp+=b;R.score+=25*R.wave;R.early++;R.nextT=0;emit('early',b);return b}
function spawnPest(o){const d=PEST[o.k];const pi=R.P.paths.length>1?(R.id%R.P.paths.length):0;
  let hp=d.hp*hpMul(R.wave)*(o.big||1);if(d.boss)hp*=1;
  const spd=d.spd*(R.mod==='fast'?1.3:1)*(1+Math.min(.25,R.wave*.008));
  const p={k:o.k,hp,mhp:hp,spd,s:0,pi,x:-1,y:-1,dir:1,slow:0,slowT:0,stun:0,burn:0,burnT:0,under:0,uT:fxr(1,3),
    val:Math.ceil(d.val*(1+R.wave*.15)),armor:(d.armor||0)*(1+R.wave*.06),boss:!!d.boss,fly:!!d.fly,id:++R.id,ph:fxr(0,TAU),hit:0,shell:0,shellUsed:0,sumT:4,talk:0};
  if(d.boss)R.bossAlive++;
  const pp=pathPos(R.P.paths[pi],0);p.x=pp[0];p.y=pp[1];R.pests.push(p);emit('spawn',p);return p}

/* ---------- combat ---------- */
function pestRem(p){return R.P.paths[p.pi].len-p.s}
function findTarget(v,r){let best=null,bs=1e9;const r2=r*r;
  for(const p of R.pests){if(p.under||p.hp<=0)continue;if(dist2(v.x,v.y,p.x,p.y)<=r2){const rem=pestRem(p);if(rem<bs){bs=rem;best=p}}}return best}
function hurt(p,dmg,src){if(p.hp<=0||p.under)return 0;if(p.shell>0){emit('block',p);return 0}
  let d=Math.max(dmg*.25,dmg-p.armor);if(src==='pumpkin')d=dmg;p.hp-=d;if(src!=='onion')p.hit=.07;
  if(p.k==='baron'&&!p.shellUsed&&p.hp<p.mhp*.5){p.shellUsed=1;p.shell=3;emit('shell',p)}
  if(p.hp<=0)killPest(p);return d}
function killPest(p){p.hp=0;R.kills++;S.st.kills++;let c=p.val*(R.mods.compost?1.25:1)*(R.mod==='rich'?2:1);c=Math.ceil(c);R.comp+=c;
  R.score+=p.val*10;if(p.boss){R.bossAlive--;R.bossKills++;S.st.bosses++;R.score+=500*(1+R.fi)}
  if(p.k==='gold'){R.golds++;S.st.gold++;R.goldNoMest++;if(rng()<.35||R.goldNoMest>=3){R.mest++;R.goldNoMest=0;emit('mestDrop',p)}}
  emit('kill',p,c)}
function splash(x,y,rad,dmg,src,burn){let n=0;const r2=rad*rad;for(const p of R.pests){if(p.hp>0&&!p.under&&dist2(x,y,p.x,p.y)<=r2){hurt(p,dmg,src);if(burn){p.burn=Math.max(p.burn,burn);p.burnT=VEG.chili.burnT*(R.mods.spicy?1.5:1)}n++}}return n}

function fire(v,p){const k=VEG[v.t].kind,d=vDmg(v);v.att=.18;v.ang=Math.atan2(p.y-v.y,p.x-v.x);
  if(k==='dart')R.shots.push({k,x:v.x,y:v.y-.1,tg:p,dmg:d,spd:9,pierce:R.mods.pierce?1:0,hitIds:[],t:0});
  else if(k==='pop')R.shots.push({k,x:v.x,y:v.y-.15,tg:p,dmg:d,spd:11,t:0});
  else if(k==='fire')R.shots.push({k,x:v.x,y:v.y-.1,tg:p,dmg:d,spd:7,burn:d*VEG.chili.burn/VEG.chili.dmg*(R.mods.spicy?1.5:1),t:0});
  else if(k==='lob'||k==='slam'){const ft=k==='lob'?.5:.6;const P=R.P.paths[p.pi];const pp=pathPos(P,Math.min(P.len,p.s+p.spd*(p.slow>0?1-p.slow:1)*ft*(p.stun>0?0:1)));
    R.shots.push({k,x:v.x,y:v.y-.15,sx:v.x,sy:v.y-.15,tx:pp[0],ty:pp[1],dmg:d,t:0,ft,rad:VEG[v.t].splash*(k==='lob'&&R.mods.ketchup?1.4:1)})}
  emit('fire',v)}

function update(dt){if(!R||R.over||R.perkPending)return;
  dt*=R.speed;R.time+=dt;
  if(R.cdW>0)R.cdW-=dt;if(R.cdS>0)R.cdS-=dt;if(R.waterT>0)R.waterT-=dt;if(R.stunT>0)R.stunT-=dt;
  // waves
  if(R.spawnQ.length){R.spawnT-=dt;if(R.spawnT<=0){spawnPest(R.spawnQ.shift());R.spawnT=Math.max(.32,1-R.wave*.025)*(R.spawnQ[0]&&R.spawnQ[0].k==='gold'?.4:1)}}
  else if(R.waveOn){R.waveOn=false;R.score+=50*R.wave;emit('waveDone',R.wave);if(R.wave<R.maxWave)R.nextT=R.wave===0?3:6}
  if(R.nextT!==null){R.nextT-=dt;if(R.nextT<=0){R.nextT=null;
      if(R.wave>0&&R.wave%5===0&&R.wave<R.maxWave&&R.lastPerk!==R.wave){R.lastPerk=R.wave;offerPerks();R.pendStart=1;return}
      startWave()}}
  if(R.pendStart&&!R.perkPending){R.pendStart=0;startWave()}
  // veggies
  for(const v of R.veg){if(!v)continue;v.pop=Math.min(1,v.pop+dt*4);if(v.att>0)v.att-=dt;
    const d=VEG[v.t];
    if(d.kind==='eco'){v.sunT+=dt;if(v.sunT>=d.every){v.sunT=0;const g=Math.ceil(vProd(v));R.comp+=g;emit('sun',v,g)}continue}
    v.cd-=dt*vRate(v);
    if(d.kind==='aura'){if(v.cd<=0){v.cd+=1;const r2=vRange(v)**2;const sl=vSlow(v),dm=vDmg(v)/d.rate;let any=0;
        for(const p of R.pests){if(p.hp>0&&!p.under&&dist2(v.x,v.y,p.x,p.y)<=r2){p.slow=Math.max(p.fly?sl*.5:sl,p.slowT>0?p.slow:0);p.slowT=.6;hurt(p,dm*(1/1),'onion');any=1}}
        if(any){v.att=.2;emit('aura',v)}}if(v.cd<-1)v.cd=0;continue}
    if(v.cd<=0){const p=findTarget(v,vRange(v));if(p){fire(v,p);v.cd+=1}else v.cd=0}}
  // shots
  for(let i=R.shots.length-1;i>=0;i--){const s=R.shots[i];s.t+=dt;
    if(s.k==='lob'||s.k==='slam'){const u=s.t/s.ft;s.x=lerp(s.sx,s.tx,u);s.y=lerp(s.sy,s.ty,u)-Math.sin(Math.min(1,u)*Math.PI)*(s.k==='slam'?1.3:1);
      if(u>=1){splash(s.tx,s.ty,s.rad,s.dmg,s.k==='slam'?'pumpkin':'tomato');emit('land',s);R.shots.splice(i,1)}continue}
    let tg=s.tg;if(!tg||tg.hp<=0||tg.under){// retarget
      let best=null,bd=4;for(const p of R.pests){if(p.hp>0&&!p.under&&(!s.hitIds||!s.hitIds.includes(p.id))){const d=dist2(s.x,s.y,p.x,p.y);if(d<bd){bd=d;best=p}}}
      if(!best||s.t>1.5){R.shots.splice(i,1);continue}s.tg=tg=best}
    const dx=tg.x-s.x,dy=tg.y-s.y,dd=Math.hypot(dx,dy),st=s.spd*dt;
    if(dd<=st+.12){hurt(tg,s.dmg,s.k);if(s.k==='fire'){tg.burn=Math.max(tg.burn,s.burn);tg.burnT=VEG.chili.burnT*(R.mods.spicy?1.5:1)}
      emit('impact',s,tg);if(s.pierce>0){s.pierce--;s.hitIds.push(tg.id);s.tg=null}else R.shots.splice(i,1)}
    else{s.x+=dx/dd*st;s.y+=dy/dd*st;s.ang=Math.atan2(dy,dx)}}
  // pests
  for(let i=R.pests.length-1;i>=0;i--){const p=R.pests[i];
    if(p.hp<=0){R.pests.splice(i,1);continue}
    if(p.hit>0)p.hit-=dt;if(p.shell>0)p.shell-=dt;if(p.talk>0)p.talk-=dt;
    if(p.burnT>0){p.burnT-=dt;const bd=p.burn*dt;p.hp-=bd;if(p.hp<=0){killPest(p);R.pests.splice(i,1);continue}}
    if(p.slowT>0){p.slowT-=dt;if(p.slowT<=0)p.slow=0}
    if(PEST[p.k].burrow){p.uT-=dt;if(p.uT<=0){p.under=!p.under;p.uT=p.under?(p.boss?2:1.5):(p.boss?4:fxr(2.5,3.5));emit('burrow',p)}}
    if(p.k==='queen'){p.sumT-=dt;if(p.sumT<=0){p.sumT=8;for(let j=0;j<2;j++){const c=spawnPest({k:'crow'});c.s=Math.max(0,p.s-1-j*.6);c.pi=p.pi;c.hp=c.mhp=PEST.crow.hp*hpMul(R.wave)*.55}emit('summon',p)}}
    let sp=p.spd;if(p.slow>0)sp*=1-p.slow;if(p.under)sp*=1.3;
    if(R.stunT>0&&!(p.boss&&R.stunT<1.3))sp=0;
    p.s+=sp*dt;const P=R.P.paths[p.pi];const pp=pathPos(P,p.s);p.x=pp[0];p.y=pp[1];if(pp[2])p.dir=pp[2];
    if(p.s>=P.len){R.pests.splice(i,1);if(p.boss)R.bossAlive--;
      if(R.shield>0){R.shield--;emit('shielded',p)}else{R.lives-=PEST[p.k].eat||1;emit('eat',p)}
      if(R.lives<=0){R.lives=0;R.over='lose';emit('lose');return}}}
  if(R.wave>=R.maxWave&&!R.spawnQ.length&&!R.pests.length&&R.nextT===null&&!R.waveOn){R.over='win';emit('win')}
}
function offerPerks(){const have=new Set(R.perks);const ok=PERKS.filter(p=>!have.has(p.id)&&(!p.need||R.bag.includes(p.need)));
  const o=[];while(o.length<3&&ok.length){const j=Math.floor(rng()*ok.length);o.push(ok.splice(j,1)[0].id)}R.perkPending=o;emit('perkOffer',o)}
function takePerk(id){R.perks.push(id);R.mods[id]=1;if(id==='lettuce'){R.lives+=3;R.lives0+=3}if(id==='shield')R.shield+=3;if(id==='cool'){R.cdW*=.7;R.cdS*=.7}
  R.perkPending=null;emit('perk',id)}
function useWater(){if(R.cdW>0||R.mod==='nowater')return false;R.waterT=6;R.cdW=45*(R.mods.cool?.7:1);R.usedWater++;S.st.water++;emit('water');return true}
function useScare(){if(R.cdS>0||R.mod==='nowater')return false;R.stunT=2.5;R.cdS=60*(R.mods.cool?.7:1);emit('scare');return true}
function revive(){R.revived=true;R.over=null;R.lives=5;for(const p of R.pests){if(pestRem(p)<3&&!p.boss){p.hp=0}else p.s=Math.max(0,p.s-3)}R.pests=R.pests.filter(p=>p.hp>0);R.stunT=2;emit('revive')}

/* ---------- results ---------- */
function starsFor(){if(R.over!=='win')return 0;const lost=R.lives0-R.lives;return lost===0?3:R.lives>=7?2:1}
function finishRun(){const win=R.over==='win';const st=starsFor();let bonus=0;
  if(win)R.score+=R.lives*250;
  let newStars=0;
  if(R.mode==='field'){const k=R.F.id;const old=S.stars[k]||0;if(st>old){newStars=st-old;S.stars[k]=st}if(R.score>(S.best[k]||0))S.best[k]=R.score;if(win){S.won[k]=1;S.st.wins++}}
  if(R.mode==='endless'){const k=R.F.id;const e=S.endless[k]||{w:0,s:0};const w=win?R.wave:R.wave-1;if(R.wave>e.w)e.w=R.wave;if(R.score>e.s)e.s=R.score;S.endless[k]=e}
  if(R.mode==='daily'){const d=S.daily;const t=todayKey();if(d.date!==t){d.date=t;d.best=0;d.done=0}if(R.score>d.best)d.best=R.score;
    if(win&&!d.done){d.done=1;S.st.daily++;const y=todayKey.yest();d.streak=d.last===y?d.streak+1:1;d.last=t}}
  let coins=Math.floor(R.score/120)+newStars*30;if(R.mode==='daily'&&win)coins+=60;
  S.st.runs++;
  return{win,stars:st,newStars,coins,score:R.score,wave:R.wave}}
todayKey.yest=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- headless balance sim ---------- */
window.__sim=function(fi,o){o=o||{};const keepS=JSON.stringify(S);
  if(o.up)for(const t of VORDER)S.up[t]=o.up;if(o.meta)S.meta=o.meta;if(o.unl)for(const t of VORDER)S.unl[t]=1;
  const saveL=listeners.splice(0);newRun(fi,o.mode||'field',{bag:o.bag});R.speed=1;const dt=1/20;let guard=0;
  while(!R.over&&guard++<20*60*30){
    if(R.perkPending)takePerk(R.perkPending[0]);
    let tries=0;while(buySeed()&&tries++<5);
    // merge lowest pairs
    let merged=true;while(merged){merged=false;const vs=R.veg.filter(Boolean).sort((a,b)=>a.l-b.l);
      for(let i=0;i<vs.length&&!merged;i++)for(let j=i+1;j<vs.length;j++)if(canMerge(vs[i],vs[j])){doMerge(vs[i],vs[j]);merged=true;break}}
    if(!freeBeds().length){const t=R.bag.filter(t=>VEG[t].kind!=='eco').sort((a,b)=>powerCost(a)-powerCost(b))[0];if(t&&R.comp>powerCost(t)+seedCost())powerUp(t)}
    if(R.pests.some(p=>pestRem(p)<4)){useWater();if(R.pests.filter(p=>pestRem(p)<3).length>3)useScare()}
    if(o.early&&R.nextT>0)callEarly();
    update(dt);if(R.over==='lose'&&o.revive&&!R.revived)revive()}
  const res={buys:R.buys,merges:R.merges,fm:Math.round(R.firstMergeT),field:FIELDS[fi].id,over:R.over,wave:R.wave,lives:R.lives,score:R.score,time:Math.round(R.time),kills:R.kills,maxL:R.maxL,comp:Math.round(R.comp),
    veg:R.veg.filter(Boolean).map(v=>v.t[0]+v.l).join(' ')};
  listeners.push(...saveL);S=JSON.parse(keepS);R=null;return res};

/* ================= RENDER ================= */
const INK='#2b2d4e';

    circ(c,r*.85,-r*.3+Math.sin(time*20)*r*.1,r*.18);fillO(c,'#ffd9c2',lw*.8)}
  else{c.beginPath();c.arc(0,r*.24,r*.16,.15*Math.PI,.85*Math.PI);c.stroke()}
  c.fillStyle='rgba(255,105,140,.5)';circ(c,-r*.42,r*.22,r*.1);c.fill();circ(c,r*.42,r*.22,r*.1);c.fill();c.restore()}

/* ---------- FX ---------- */
function fx(k,x,y,o){if(FX.length>400)FX.shift();FX.push(Object.assign({k,x,y,t:0,life:.6,vx:0,vy:0,sz:.15,col:'#fff'},o||{}))}
function puff(x,y,n,col,sz){for(let i=0;i<n;i++){const a=fxr(0,TAU),v=fxr(.5,1.8);fx('puff',x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v-.3,life:fxr(.35,.6),sz:fxr(.1,.2)*(sz||1),col:col||'#fff'})}}
function floatText(x,y,txt,col,sz){fx('txt',x,y,{txt,vy:-.9,life:.9,col:col||'#fff',sz:sz||.32})}
function drawFX(c,dt){const T=L.T;for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;if(f.t>=f.life){FX.splice(i,1);continue}const u=f.t/f.life;
  f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g)f.vy+=f.g*dt;const X=f.scr?f.x:bx(f.x),Y=f.scr?f.y:by(f.y);
  if(f.k==='puff'){c.globalAlpha=1-u;circ(c,X,Y,f.sz*T*(1+u));c.fillStyle=f.col;c.fill();c.globalAlpha=1}
  else if(f.k==='dot'){c.globalAlpha=1-u;circ(c,X,Y,f.sz*T);c.fillStyle=f.col;c.fill();c.globalAlpha=1}
  else if(f.k==='ring'){c.globalAlpha=1-u;circ(c,X,Y,f.sz*T*(.3+u));c.lineWidth=T*.08*(1-u);c.strokeStyle=f.col;c.stroke();c.globalAlpha=1}
  else if(f.k==='star'){c.globalAlpha=1-u;sparkle(c,X,Y,f.sz*T*(1-u*.5));c.globalAlpha=1}
  else if(f.k==='tear'){c.globalAlpha=1-u;c.fillStyle='#7fd3ff';c.beginPath();c.ellipse(X,Y,T*.05,T*.08,0,0,TAU);c.fill();c.globalAlpha=1}
  else if(f.k==='txt'){c.globalAlpha=u<.7?1:1-(u-.7)/.3;const fs=Math.round(f.sz*T*(u<.15?u/.15*1.2:1));c.font='700 '+fs+'px Fredoka,sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=fs*.22;c.strokeStyle=INK;c.lineJoin='round';c.strokeText(f.txt,X,Y);c.fillStyle=f.col;c.fillText(f.txt,X,Y);c.globalAlpha=1}
  else if(f.k==='fly'){// coin/compost flying to HUD
    const tx=f.tx,ty=f.ty,e=u*u;const px=lerp(f.sx,tx,e),py=lerp(f.sy,ty,e)-Math.sin(u*Math.PI)*40;circ(c,px,py,T*.1);fillO(c,f.col,2)}}}
function drawDecals(c,dt){for(let i=DECAL.length-1;i>=0;i--){const d=DECAL[i];d.t+=dt;if(d.t>2.5){DECAL.splice(i,1);continue}c.globalAlpha=Math.min(.45,(2.5-d.t)/1.5*.45);
  c.fillStyle=d.col;const X=bx(d.x),Y=by(d.y),r=d.r*L.T;c.beginPath();for(let k=0;k<10;k++){const a=k/10*TAU,rr2=r*(k%2?.78:1);c.lineTo(X+Math.cos(a)*rr2,Y+Math.sin(a)*rr2*.7)}c.fill();c.globalAlpha=1}}

/* ---------- shots ---------- */
function drawShot(c,s){const X=bx(s.x),Y=by(s.y),T=L.T,lw=Math.max(1.5,T*.04);
  if(s.k==='dart'){c.save();c.translate(X,Y);c.rotate(s.ang||0);c.beginPath();c.moveTo(T*.18,0);c.lineTo(-T*.1,-T*.06);c.lineTo(-T*.1,T*.06);c.closePath();fillO(c,'#ff8a3d',lw);
    c.fillStyle='#5fd06a';c.beginPath();c.moveTo(-T*.1,0);c.lineTo(-T*.2,-T*.07);c.lineTo(-T*.2,T*.07);c.fill();c.restore()}
  else if(s.k==='pop'){circ(c,X,Y,T*.07);fillO(c,'#fff6c2',lw*.8)}
  else if(s.k==='fire'){circ(c,X,Y,T*.1);c.fillStyle='#ffb02e';c.fill();circ(c,X,Y,T*.06);c.fillStyle='#ff3d3d';c.fill()}
  else if(s.k==='lob'){circ(c,X,Y,T*.12);fillO(c,'#ff5d6c',lw);c.fillStyle='#4fae43';circ(c,X,Y-T*.1,T*.04);c.fill()}
  else if(s.k==='slam'){circ(c,X,Y,T*.17);fillO(c,'#ff9a1f',lw)}}

function drawRange(c,v,col){const r=vRange(v)*L.T;circ(c,bx(v.x),by(v.y),r);c.fillStyle=col||'rgba(255,255,255,.14)';c.fill();c.lineWidth=2;c.setLineDash([6,6]);c.strokeStyle='rgba(255,255,255,.8)';c.stroke();c.setLineDash([])}

function drawWorld(dt){const c=ctx;c.setTransform(L.dpr,0,0,L.dpr,0,0);
  buildBg();let sx=0,sy=0;if(shake>0){shake-=dt;sx=fxr(-1,1)*shake*12;sy=fxr(-1,1)*shake*12}
  c.save();c.translate(sx,sy);c.drawImage(bg,0,0,L.W,L.H);
  if(!R){c.restore();return}
  const T=L.T;drawDecals(c,dt);
  if(R.g==='pest'||R.g==='comp')drawPathArrows(c);
  // ambient
  if(PAL[R.fi].night||PAL[R.fi].snow||PAL[R.fi].leaves){for(let i=0;i<14;i++){const k=i*97.3;
    if(PAL[R.fi].night){const x=(Math.sin(gT*.3+k)*.5+.5)*COLS,y=(Math.cos(gT*.23+k*1.3)*.5+.5)*ROWS;c.globalAlpha=.5+.5*Math.sin(gT*3+k);circ(c,bx(x),by(y),T*.05);c.fillStyle='#fff6a0';c.fill();c.globalAlpha=1}
    else{const x=((k*.37+gT*.15)%1)*COLS*1.1-.3,y=((k*.71+gT*(PAL[R.fi].snow?.12:.08))%1)*ROWS;c.fillStyle=PAL[R.fi].snow?'#fff':'#ff9a3d';c.globalAlpha=.8;
      if(PAL[R.fi].snow){circ(c,bx(x),by(y),T*.04);c.fill()}else{c.beginPath();c.ellipse(bx(x),by(y),T*.07,T*.035,gT*2+k,0,TAU);c.fill()}c.globalAlpha=1}}}
  if(UI.sel&&R.veg[UI.sel.i]===UI.sel)drawRange(c,UI.sel);
  if(UI.drag){const dv=UI.drag.v;for(const v of R.veg)if(v&&canMerge(dv,v)){circ(c,bx(v.x),by(v.y),T*.48+Math.sin(gT*8)*T*.03);c.lineWidth=T*.07;c.strokeStyle='#ffe14d';c.stroke()}
    const ci=cellAt(UI.drag.px,UI.drag.py);if(ci>=0&&R.P.beds.includes(ci)){c.fillStyle='rgba(255,255,255,.25)';rr(c,bx(ci%COLS)+T*.08,by(Math.floor(ci/COLS))+T*.08,T*.84,T*.84,T*.2);c.fill()}}
  if(UI.mestDrag){for(const v of R.veg)if(v&&v.l<lvlCap()){circ(c,bx(v.x),by(v.y),T*.46);c.lineWidth=T*.05;c.strokeStyle='#ffe14d';c.stroke()}}
  drawCrate(c,gT);
  // sorted entities
  const ents=[];for(const v of R.veg)if(v&&!(UI.drag&&UI.drag.v===v))ents.push([v.y,0,v]);for(const p of R.pests)ents.push([p.y+(p.fly?.5:0),1,p]);
  ents.sort((a,b)=>a[0]-b[0]);
  for(const [,k,o] of ents){if(k===0){drawVeg(c,o.t,o.l,bx(o.x),by(o.y),T,gT,{pop:o.pop,att:o.att,ph:o.id});
      if(R.waterT>0&&Math.random()<.04)fx('dot',o.x+fxr(-.3,.3),o.y-.5,{vy:1.4,life:.4,col:'#7fd3ff',sz:.04});
      if(o.l>=7&&Math.random()<.05)fx('star',o.x+fxr(-.4,.4),o.y+fxr(-.5,.2),{life:.6,sz:.12})}
    else drawPest(c,o,T,gT)}
  for(const s of R.shots)drawShot(c,s);
  drawFX(c,dt);
  if(UI.drag){const v=UI.drag.v;drawVeg(c,v.t,v.l,UI.drag.px,UI.drag.py-T*.2,T*1.12,gT,{ph:v.id})}
  if(UI.mestDrag){drawMest(c,UI.mestDrag.px,UI.mestDrag.py,T*.5)}
  if(R.waterT>0){c.fillStyle='rgba(76,195,255,'+(.08+.04*Math.sin(gT*6))+')';rr(c,L.bx,L.by,COLS*T,ROWS*T,T*.32);c.fill()}
  c.restore()}
function drawMest(c,x,y,r){const lw=Math.max(2,r*.1);c.beginPath();c.moveTo(x-r*.7,y+r*.6);c.quadraticCurveTo(x-r*.8,y-r*.4,x,y-r*.7);c.quadraticCurveTo(x+r*.8,y-r*.4,x+r*.7,y+r*.6);c.closePath();fillO(c,'#c9874a',lw);
  c.fillStyle='#fff6c2';rr(c,x-r*.45,y-r*.15,r*.9,r*.4,r*.1);c.fill();c.fillStyle='#4fae43';leaf(c,x,y-r*.05,r*.3,0,lw*.6,'#5fd06a');sparkle(c,x+r*.6,y-r*.6,r*.25)}

/* ================= GFX v0.3: light, depth and a living garden =================
   Overrides the flat v0.2 drawing with shaded, layered art. Heavy work is cached:
   the garden is painted once per layout, every veggie pose is painted once into a sprite. */
function hexRgb(h){h=String(h).replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixc(a,b,t){const A=hexRgb(a),B=hexRgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function softShadow(c,x,y,rx,ry,a){if(rx<=0)return;c.save();c.translate(x,y);c.scale(1,ry/rx);const g=c.createRadialGradient(0,0,0,0,0,rx);
  g.addColorStop(0,'rgba(30,25,60,'+a+')');g.addColorStop(.55,'rgba(30,25,60,'+(a*.6)+')');g.addColorStop(1,'rgba(30,25,60,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,TAU);c.fill();c.restore()}
let NOISE=null;
function noisePat(c,amt){if(!NOISE){NOISE=document.createElement('canvas');NOISE.width=NOISE.height=128;const x=NOISE.getContext('2d');const r=mulberry(77);
  for(let i=0;i<1400;i++){const v=r();x.fillStyle=v<.5?'rgba(255,255,255,'+(.05+r()*.08)+')':'rgba(0,30,10,'+(.05+r()*.08)+')';x.fillRect(Math.floor(r()*128),Math.floor(r()*128),1+Math.floor(r()*2),1+Math.floor(r()*2))}}
  return c.createPattern(NOISE,'repeat')}
const GFX={lite:false,acc:0,n:0,slow:0};

/* ---------- garden scenery ---------- */
function drawBush(c,x,y,r,pal,lw){softShadow(c,x,y+r*.72,r*1.1,r*.34,.3);
  const blobs=[[-.45,.12,.58],[.45,.12,.58],[0,-.28,.72],[-.18,.3,.5],[.22,.32,.48]];
  const path=()=>{c.beginPath();for(const [a,b,s2] of blobs){c.moveTo(x+a*r+s2*r,y+b*r);c.arc(x+a*r,y+b*r,s2*r,0,TAU)}};
  path();c.lineWidth=lw*2;c.lineJoin='round';c.strokeStyle=INK;c.stroke();path();c.fillStyle=pal.tree;c.fill();
  c.save();path();c.clip();const g=c.createLinearGradient(x-r*.6,y-r,x+r*.5,y+r*.9);g.addColorStop(0,'rgba(255,255,220,.38)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,30,25,.38)');
  c.fillStyle=g;c.fillRect(x-r*2,y-r*2,r*4,r*4);
  c.fillStyle=pal.tree2;for(const [a,b,s2] of [[-.25,-.55,.26],[.25,-.62,.2],[-.62,-.02,.2],[.55,-.1,.2],[0,.05,.18]]){c.beginPath();c.arc(x+a*r,y+b*r,s2*r,Math.PI,0);c.fill()}
  c.fillStyle='rgba(255,255,255,.35)';for(const [a,b] of [[-.3,-.7],[.2,-.75]]){c.beginPath();c.ellipse(x+a*r,y+b*r,r*.1,r*.05,-.4,0,TAU);c.fill()}
  c.restore();
  if(pal.snow){c.fillStyle='#fff';c.beginPath();c.ellipse(x,y-r*.86,r*.55,r*.2,0,0,TAU);c.fill();c.beginPath();c.ellipse(x-r*.5,y-r*.32,r*.3,r*.12,0,0,TAU);c.fill()}
  else if(pal.leaves){[[.3,-.1,'#ffd23f'],[-.5,.2,'#ff8a3d'],[.05,-.5,'#ff5d6c']].forEach(([a,b,col])=>{c.fillStyle=col;c.beginPath();c.ellipse(x+a*r,y+b*r,r*.12,r*.07,a,0,TAU);c.fill()})}
  else if(!pal.night&&(Math.floor(x*7+y*3)%3===0)){[[.35,-.05],[-.4,.15],[.05,-.45]].forEach(([a,b])=>{circ(c,x+a*r,y+b*r,r*.075);c.fillStyle='#ff5d6c';c.fill();c.lineWidth=Math.max(1,lw*.4);c.strokeStyle=INK;c.stroke();circ(c,x+a*r-r*.025,y+b*r-r*.025,r*.022);c.fillStyle='#fff';c.fill()})}}
function drawFlowers(c,x,y,r,pal,rnd){for(let i=0;i<4;i++){const fx=x+(rnd()-.5)*r*1.6,fy=y+(rnd()-.5)*r*1.4,col=pal.fl[Math.floor(rnd()*pal.fl.length)],s=r*(.15+rnd()*.06);
  softShadow(c,fx,fy+s*2.3,s*1.1,s*.35,.22);
  c.strokeStyle='#3f9a3c';c.lineWidth=s*.45;c.lineCap='round';c.beginPath();c.moveTo(fx,fy);c.quadraticCurveTo(fx-s*.3,fy+s*1.2,fx,fy+s*2.3);c.stroke();
  c.fillStyle='#5fd06a';c.beginPath();c.ellipse(fx+s*.45,fy+s*1.5,s*.45,s*.2,-.5,0,TAU);c.fill();
  for(let k=0;k<5;k++){const a=k/5*TAU+i;const px=fx+Math.cos(a)*s,py=fy+Math.sin(a)*s;circ(c,px,py,s*.72);c.fillStyle=col;c.fill();c.lineWidth=s*.14;c.strokeStyle='rgba(43,45,78,.55)';c.stroke()}
  for(let k=0;k<5;k++){const a=k/5*TAU+i;circ(c,fx+Math.cos(a)*s*.95-s*.15,fy+Math.sin(a)*s*.95-s*.18,s*.22);c.fillStyle='rgba(255,255,255,.55)';c.fill()}
  const g=c.createRadialGradient(fx-s*.2,fy-s*.2,0,fx,fy,s*.65);g.addColorStop(0,'#fff3a0');g.addColorStop(1,'#f2a81f');circ(c,fx,fy,s*.6);c.fillStyle=g;c.fill();c.lineWidth=s*.22;c.strokeStyle=INK;c.stroke()}}
function drawTuft(c,x,y,r,pal){const dark=pal.night?'#4d7f7a':pal.snow?'#b9cbe4':'rgba(40,110,40,.55)',light=pal.night?'#7fb3ac':pal.snow?'#ffffff':'rgba(200,255,150,.6)';
  c.lineCap='round';for(let k=-1;k<=1;k++){c.strokeStyle=dark;c.lineWidth=Math.max(1.5,r*.2);c.beginPath();c.moveTo(x+k*r*.25,y+r*.3);c.quadraticCurveTo(x+k*r*.35,y-r*.1,x+k*r*.62,y-r*.38);c.stroke();
    c.strokeStyle=light;c.lineWidth=Math.max(.8,r*.08);c.beginPath();c.moveTo(x+k*r*.27,y+r*.15);c.quadraticCurveTo(x+k*r*.34,y-r*.05,x+k*r*.5,y-r*.25);c.stroke()}}
function drawPebble(c,x,y,r,col){softShadow(c,x,y+r*.5,r*1.2,r*.45,.25);c.beginPath();c.ellipse(x,y,r,r*.72,0,0,TAU);c.fillStyle=col;c.fill();c.lineWidth=Math.max(1,r*.22);c.strokeStyle='rgba(43,45,78,.6)';c.stroke();
  c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(x-r*.3,y-r*.28,r*.35,r*.18,-.3,0,TAU);c.fill()}

function buildBg(){const key=L.W+'x'+L.H+'_'+L.T+'_'+L.bx+'_'+L.by+'_'+(R?R.fi:0)+'_'+L.dpr;if(bg&&bgKey===key)return;bgKey=key;
  if(!bg)bg=document.createElement('canvas');bg.width=Math.round(L.W*L.dpr);bg.height=Math.round(L.H*L.dpr);
  const c=bg.getContext('2d');c.setTransform(L.dpr,0,0,L.dpr,0,0);c.clearRect(0,0,L.W,L.H);const fi=R?R.fi:0,pal=PAL[fi],T=L.T,lw=Math.max(2,T*.06);
  const F=FIELDS[fi],P=R?R.P:parseField(F);const X=L.bx,Y=L.by,W=COLS*T,H=ROWS*T;
  let seed=fi*1000+7;const rnd=()=>{seed++;return hash(seed)};
  // vegetation mask (what sways in the wind), built alongside the art for the WebGL pass
  if(!MKV)MKV=document.createElement('canvas');MKV.width=bg.width;MKV.height=bg.height;const mk=MKV.getContext('2d');mk.setTransform(L.dpr,0,0,L.dpr,0,0);mk.clearRect(0,0,L.W,L.H);
  // ---- outer ground: light falloff, mowing stripes, fine texture
  let g=c.createRadialGradient(L.W*.35,L.H*.2,0,L.W*.5,L.H*.5,Math.max(L.W,L.H)*.85);g.addColorStop(0,mixc(pal.out,'#ffffff',.12));g.addColorStop(1,mixc(pal.out,'#000000',.12));
  c.fillStyle=g;c.fillRect(0,0,L.W,L.H);
  const st=Math.max(30,T*.9);c.save();c.globalAlpha=.55;for(let x=-L.H;x<L.W;x+=st*2){c.fillStyle=pal.out2;c.beginPath();c.moveTo(x,0);c.lineTo(x+st,0);c.lineTo(x+st+L.H*.5,L.H);c.lineTo(x+L.H*.5,L.H);c.fill()}c.restore();
  c.fillStyle=noisePat(c);c.fillRect(0,0,L.W,L.H);
  const inBoard=(x,y,m)=>x>X-T*m&&x<X+W+T*m&&y>Y-T*m&&y<Y+H+T*m;
  for(let i=0;i<260;i++){const x=rnd()*L.W,y=rnd()*L.H;if(inBoard(x,y,.5))continue;const s_=T*(.14+rnd()*.12);drawTuft(c,x,y,s_,pal);drawTuft(mk,x,y,s_,pal)}
  for(let i=0;i<26;i++){const x=rnd()*L.W,y=rnd()*L.H;if(inBoard(x,y,.5))continue;drawPebble(c,x,y,T*(.05+rnd()*.05),pal.peb)}
  const deco=[];for(let i=0;i<80;i++){const x=rnd()*L.W,y=rnd()*L.H;if(inBoard(x,y,.7))continue;deco.push([y,x,rnd(),rnd()])}deco.sort((a,b)=>a[0]-b[0]);
  for(const [y,x,k,s2] of deco){if(k<.38){drawBush(c,x,y,T*(.36+s2*.3),pal,lw);drawBush(mk,x,y,T*(.36+s2*.3),pal,lw)}else if(k<.72){drawFlowers(c,x,y,T*.42,pal,rnd);circ(mk,x,y,T*.42);mk.fillStyle='#fff';mk.fill()}}
  // ---- board: hedge with leafy edge and a soft drop shadow
  const hedge=pal.snow?'#e6eef9':pal.night?'#244a44':'#3f9a3c',hedgeL=pal.snow?'#ffffff':pal.night?'#3a6a62':'#5fbf4f';
  c.save();c.shadowColor='rgba(20,30,40,.4)';c.shadowBlur=T*.7;c.shadowOffsetY=T*.22;rr(c,X-T*.26,Y-T*.26,W+T*.52,H+T*.52,T*.5);c.fillStyle=hedge;c.fill();c.restore();
  const bumps=[];const per=(x0,y0,x1,y1)=>{const len=Math.hypot(x1-x0,y1-y0),n=Math.ceil(len/(T*.3));for(let i=0;i<=n;i++){bumps.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)])}};
  const o=T*.2;per(X-o,Y-o,X+W+o,Y-o);per(X+W+o,Y-o,X+W+o,Y+H+o);per(X+W+o,Y+H+o,X-o,Y+H+o);per(X-o,Y+H+o,X-o,Y-o);
  c.beginPath();for(const [bx2,by2] of bumps){c.moveTo(bx2+T*.17,by2);c.arc(bx2,by2,T*.17,0,TAU)}c.lineWidth=lw*2;c.strokeStyle=INK;c.stroke();
  rr(c,X-T*.24,Y-T*.24,W+T*.48,H+T*.48,T*.45);c.fillStyle=hedge;c.fill();
  c.beginPath();for(const [bx2,by2] of bumps){c.moveTo(bx2+T*.17,by2);c.arc(bx2,by2,T*.17,0,TAU)}c.fillStyle=hedge;c.fill();
  c.fillStyle=hedgeL;for(const [bx2,by2] of bumps){c.beginPath();c.arc(bx2-T*.03,by2-T*.04,T*.1,Math.PI*1.05,Math.PI*1.95);c.fill()}
  mk.clearRect(X-T*.45,Y-T*.45,W+T*.9,H+T*.9);
  // ---- lawn

function drawDecals(c,dt){for(let i=DECAL.length-1;i>=0;i--){const d=DECAL[i];d.t+=dt;if(d.t>2.5){DECAL.splice(i,1);continue}const a=Math.min(.5,(2.5-d.t)/1.5*.5);

      const g=c.createRadialGradient(cx,cy,0,cx,cy,T*2.6);g.addColorStop(0,'rgba(20,40,60,.13)');g.addColorStop(1,'rgba(20,40,60,0)');c.fillStyle=g;c.beginPath();c.ellipse(cx,cy,T*2.8,T*1.6,0,0,TAU);c.fill()}c.restore()}
  if(!pal.night&&!pal.snow){for(const b of BUGS){const t2=gT*.35+b.p;const x=X+W*(.5+.48*Math.sin(t2*.9+b.p)),y=Y+H*(.45+.42*Math.sin(t2*1.3)*Math.cos(t2*.5));const fl=Math.abs(Math.sin(gT*14+b.p));const s=T*.13;
    c.save();c.translate(x,y);c.rotate(Math.sin(t2)*.4);softShadow(c,0,T*.7,s,s*.3,.15);c.fillStyle=b.p<1?'#ff8ad8':b.p<3?'#ffd23f':'#7fd3ff';

    c.fillStyle=INK;c.beginPath();c.ellipse(0,0,s*.13,s*.45,0,0,TAU);c.fill();c.restore()}}

    c.fillStyle=g;c.beginPath();c.moveTo(x,Y-T);c.lineTo(x+T*.8,Y-T);c.lineTo(x+T*2.6,Y+H);c.lineTo(x+T*1.2,Y+H);c.fill()}c.restore()}}

function drawWorld(dt){const c=ctx;c.setTransform(L.dpr,0,0,L.dpr,0,0);
  // adaptive quality: if frames get slow, drop the expensive extras
  GFX.acc+=dt;GFX.n++;if(GFX.acc>2){const avg=GFX.acc/GFX.n;GFX.slow=avg>.024?GFX.slow+1:Math.max(0,GFX.slow-1);if(GFX.slow>=2)GFX.lite=true;GFX.acc=0;GFX.n=0}
  buildBg();let sx=0,sy=0;if(shake>0){shake-=dt;sx=fxr(-1,1)*shake*12;sy=fxr(-1,1)*shake*12}
  c.save();c.translate(sx,sy);c.drawImage(bg,0,0,L.W,L.H);

    if(PAL[R.fi].night){const x=(Math.sin(gT*.3+k)*.5+.5)*COLS,y=(Math.cos(gT*.23+k*1.3)*.5+.5)*ROWS;const a=.5+.5*Math.sin(gT*3+k);c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(bx(x),by(y),0,bx(x),by(y),T*.16);g.addColorStop(0,'rgba(255,246,160,'+a+')');g.addColorStop(1,'rgba(255,246,160,0)');c.fillStyle=g;circ(c,bx(x),by(y),T*.16);c.fill();c.restore()}
    else{const x=((k*.37+gT*.15)%1)*COLS*1.1-.3,y=((k*.71+gT*(PAL[R.fi].snow?.12:.08))%1)*ROWS;c.fillStyle=PAL[R.fi].snow?'#fff':(i%2?'#ff9a3d':'#ffd23f');c.globalAlpha=.85;
      if(PAL[R.fi].snow){circ(c,bx(x),by(y),T*.045);c.fill()}else{c.beginPath();c.ellipse(bx(x),by(y),T*.08,T*.04,gT*2+k,0,TAU);c.fill()}c.globalAlpha=1}}}
  if(UI.sel&&R.veg[UI.sel.i]===UI.sel)drawRange(c,UI.sel);

    const ci=cellAt(UI.drag.px,UI.drag.py);if(ci>=0&&R.P.beds.includes(ci)){c.fillStyle='rgba(255,255,255,.28)';rr(c,bx(ci%COLS)+T*.08,by(Math.floor(ci/COLS))+T*.08,T*.84,T*.84,T*.2);c.fill()}}
  if(UI.mestDrag){for(const v of R.veg)if(v&&v.l<lvlCap()){circ(c,bx(v.x),by(v.y),T*.46);c.lineWidth=T*.05;c.strokeStyle='#ffe14d';c.stroke()}}

function drawSeedBag(c,x,y,r){const lw=Math.max(2,r*.1);softShadow(c,x,y+r*.9,r*.7,r*.2,.3);c.save();c.translate(x,y);

function drawPlantable(c){const T=L.T;const dragging=UI.seedDrag&&UI.seedDrag.moved;const can=R.comp>=seedCost();if(!can&&!dragging)return;
  const hov=dragging?cellAt(UI.seedDrag.px,UI.seedDrag.py):-1;const pulse=.5+.5*Math.sin(gT*3);
  for(const i of R.P.beds){if(R.veg[i])continue;const x=bx(i%COLS+.5),y=by(Math.floor(i/COLS)+.45);
    if(dragging){c.save();rr(c,bx(i%COLS)+T*.1,by(Math.floor(i/COLS))+T*.1,T*.8,T*.72,T*.18);c.lineWidth=T*(i===hov?.08:.045);c.strokeStyle=i===hov?'#ffe14d':'rgba(255,255,255,.75)';

let omaSrc=null;
function omaIcon(){if(omaSrc)return omaSrc;const c=document.createElement('canvas');c.width=168;c.height=168;const x=c.getContext('2d');x.scale(2,2);drawOma(x,42,44,30,0,false,true);return omaSrc=c.toDataURL()}
function setPos(e,x,y){e.style.left=x+'px';e.style.top=y+'px'}
function elRect(el){const r=el.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}}
function cellsRect(cells){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const i of cells){const x=i%COLS,y=Math.floor(i/COLS);x0=Math.min(x0,bx(x));y0=Math.min(y0,by(y));x1=Math.max(x1,bx(x+1));y1=Math.max(y1,by(y+1))}return{x:x0,y:y0,w:x1-x0,h:y1-y0}}

function coach(o){CO.on=true;CO.hand=o.hand||null;CO.spot=o.spot||null;CO.slow=o.slow||1;CO.until=o.dur?performance.now()+o.dur*1000:0;CO.key=o.key||null;

  if(o.key)measure('hint',o.key,'shown');coachTick()}

  $('tut').className='hidden';$('hand').className='hide';$('spot').className='hide';if(R&&was)R.hintCD=4;return true}

  const h=$('hand'),sp=$('spot');
  if(CO.hand&&!UI.paused&&!(R&&R.perkPending)){const H=CO.hand;let cls='';
    if(H.k==='tap'){const r=elRect(H.el);setPos(h,r.x+r.w*.55,r.y+r.h*.42);cls='tap'}

  else if(sp.className!=='hide')sp.className='hide'}

/* ---------- guided first steps ---------- */
function gMeasure(s,a){measure('tutorial',(GSTEPS.indexOf(s)+1)+'-'+s,a)}
function gStep(s){if(R.g)gMeasure(R.g,'complete');R.g=s;gMeasure(s,'start');const buy=$('bBuy');
  if(s==='plant1')coach({txt:t('tut_plant'),hand:{k:'tapCell',i:BED_A},spot:{cells:[BED_A],pad:6}});
  else if(s==='plant2'){const b=R.veg[BED_B]?freeBeds()[0]:BED_B;R.gB=b;coach({txt:t('tut_plant2'),hand:{k:'tapCell',i:b},spot:{cells:[b],pad:6}})}
  else if(s==='merge'){const a=R.veg.find(v=>v&&v.t==='carrot'),b=R.veg.find(v=>v&&v!==a&&canMerge(a,v));
    if(!a||!b){gStep('pest');return}coach({txt:t('tut_merge'),hand:{k:'drag',va:a,vb:b},spot:{cells:[a,b],pad:10}})}
  else if(s==='pest'){reveal('lives');R.omaMad=1.5;const p=spawnPest({k:'snail'});p.spd=.5;p.hp=p.mhp=Math.min(p.mhp,20);p.say=t('say2');p.talk=4;
    coach({txt:t('tut_pest'),top:true})}
  else if(s==='comp'){reveal('comp');reveal('score',true);bump('vComp');coach({txt:t('tut_comp'),spot:{el:$('vComp').closest('.pill'),pad:6}});setTimeout(()=>{if(R&&R.g==='comp')gStep('plant3')},2800)}
  else if(s==='plant3'){R.g3=R.plants;const b=bestBed();coach({txt:t('tut_plant3'),hand:b>=0?{k:'tapCell',i:b}:{k:'tap',el:buy}})}
  else if(s==='go'){reveal('wave');coach({txt:t('tut_go'),dur:2.6,top:true});R.nextT=1.5;gMeasure('go','complete');R.g=null;S.tut=1;save();measure('tutorial','done','complete')}}
function guideBuy(){// returns true when the click was handled by the guide

  if(R.g==='plant2'){buySeed('carrot',R.gB!=null?R.gB:BED_B);return true}
  if(R.g==='merge'||R.g==='pest'||R.g==='comp'){sfx('click');return true}
  return false}

  else if(ev==='merge'){R.lastMergeT=R.time;if(R.g==='merge'){gMeasure('merge','complete');R.g='merged';coach({txt:t('tut_merged'),spot:{cells:[a],pad:12}});

const pIconCache={};
function pestIcon(k,sz){if(pIconCache[k])return pIconCache[k];const s=sz||84,c=document.createElement('canvas');c.width=c.height=s*2;const x=c.getContext('2d');x.scale(2,2);
  const sv=L;L={W:s,H:s,dpr:1,T:s*.9,bx:0,by:0};const p={k,x:.55,y:.6,dir:1,spd:.5,ph:0,hp:1,mhp:1,slow:0,burnT:0,under:0,fly:!!PEST[k].fly,boss:!!PEST[k].boss,shell:0,hit:0};
  const keepR=R;R=null;drawPest(x,p,s*(PEST[k].boss?.6:.9),0);R=keepR;L=sv;return pIconCache[k]=c.toDataURL()}
function gnomeIcon(i){const k='g'+i;if(pIconCache[k])return pIconCache[k];const s=64,c=document.createElement('canvas');c.width=c.height=s*2;const x=c.getContext('2d');x.scale(2,2);
  x.lineWidth=3;x.strokeStyle=INK;x.beginPath();x.moveTo(32,3);x.lineTo(48,28);x.lineTo(16,28);x.closePath();x.fillStyle=RIVAL_HAT[i%8];x.fill();x.stroke();
  x.beginPath();x.arc(32,36,14,0,TAU);x.fillStyle='#ffd9c2';x.fill();x.stroke();x.beginPath();x.moveTo(19,40);x.quadraticCurveTo(32,66,45,40);x.fillStyle='#fff';x.fill();x.stroke();
  x.fillStyle=INK;x.beginPath();x.arc(27,34,2.2,0,TAU);x.arc(37,34,2.2,0,TAU);x.fill();x.fillStyle='#ff8fb0';x.beginPath();x.arc(32,39,3.5,0,TAU);x.fill();return pIconCache[k]=c.toDataURL()}

/* ---------- layout ---------- */
function resize(){const W=window.innerWidth,H=window.innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);L.W=W;L.H=H;L.dpr=dpr;
  const u=clamp(Math.min(W/440,H/700),.72,1.45);document.documentElement.style.fontSize=(16*u)+'px';
  const top=UI.state==='run'?($('top').getBoundingClientRect().height+12):12,bot=UI.state==='run'?($('bot').getBoundingClientRect().height+10):12;
  const aw=W-16,ah=H-top-bot;const T=Math.floor(Math.min(aw/(COLS+.6),ah/(ROWS+.6)));L.T=Math.max(16,T);
  document.documentElement.style.setProperty('--topH',top+'px');document.documentElement.style.setProperty('--botH',bot+'px');
  L.bx=Math.round((W-COLS*L.T)/2);L.by=Math.round(top+(ah-ROWS*L.T)/2);bg=null;
  const nb=$('bNext');nb.style.top=Math.max(top-6,L.by-L.T*.3)+'px';
  const gb=$('bGold'),endTR=R&&R.P&&R.P.end[0]>=COLS-3&&R.P.end[1]<=1;gb.style.right=(W-L.bx-COLS*L.T+L.T*.1)+'px';
  if(endTR){gb.style.top=(L.by+ROWS*L.T-L.T*.75)+'px';gb.style.right=(W-L.bx-COLS*L.T+L.T*1.1)+'px'}else gb.style.top=(L.by+L.T*.1)+'px'}
function cellAt(px,py){const x=Math.floor((px-L.bx)/L.T),y=Math.floor((py-L.by)/L.T);if(x<0||y<0||x>=COLS||y>=ROWS)return -1;return y*COLS+x}

const scr=$('scr');

function hide(){scr.className='';scr.innerHTML='';UI.screen=null}
function toast(txt,ms){const d=document.createElement('div');d.className='toast';d.innerHTML=txt;$('toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),ms||2200);setTimeout(()=>d.remove(),(ms||2200)+400)}
function banner(txt,sub,col){const b=$('banner');b.innerHTML='<div>'+txt+'</div>'+(sub?'<small>'+sub+'</small>':'');b.style.color=col||'#fff';b.className='';void b.offsetWidth;b.className='go'}

function fieldUnlocked(i){return i===0||!!S.won[FIELDS[i-1].id]}
function nextFieldIdx(){for(let i=0;i<FIELDS.length;i++)if(!S.won[FIELDS[i].id])return i;return FIELDS.length-1}
function goHome(){UI.state='home';coachOff();R=null;gpStop();$('hud').className='hidden';resize();UI.sel=null;
  checkDaily();const nf=nextFieldIdx();
  const mis=S.mis.list.map((m,i)=>{const pr=Math.min(m.n,m.p);const done=pr>=m.n;return '<div class="mis'+(m.c?' claimed':'')+'"><div class="mt">'+t('mis_'+m.k,m.n)+'</div><div class="bar"><i style="width:'+(pr/m.n*100)+'%"></i></div>'+
    (m.c?'<b class="ok">✓</b>':done?'<button class="btn small green" data-claim="'+i+'">'+ic('coin')+'75</button>':'<span class="pr">'+fmtN(pr)+'/'+fmtN(m.n)+'</span>')+'</div>'}).join('');
  const dd=S.daily.date===todayKey()&&S.daily.done;
  show('<div class="logo"><span class="l1">Veggie</span><span class="l2">Siege</span><small>'+t('tagline')+'</small></div>'+
    '<div class="row top"><div class="pill">'+ic('coin')+'<b>'+fmtN(S.coins)+'</b></div><button class="rbtn" id="hSet">'+ic('gear')+'</button></div>'+
    '<button class="btn big green" id="hPlay">'+ic('play')+'<span>'+t('play')+'</span><small>'+t('f_'+FIELDS[nf].id)+'</small></button>'+
    '<div class="grid3">'+
      '<button class="tile" id="hFields">'+ic('star')+'<span>'+t('gardens')+'</span></button>'+
      '<button class="tile'+(S.won.grandma?'':' locked')+'" id="hEndless">'+ic('inf')+'<span>'+t('endless')+'</span>'+(S.won.grandma?'':'<em class="lk">'+ic('lock')+'</em>')+'</button>'+
      '<button class="tile'+(S.won.grandma?(dd?'':' glow'):' locked')+'" id="hDaily">'+ic('cal')+'<span>'+t('daily')+'</span>'+(!S.won.grandma?'<em class="lk">'+ic('lock')+'</em>':S.daily.streak>1?'<em>🔥'+S.daily.streak+'</em>':'')+'</button>'+
      '<button class="tile" id="hShop">'+ic('shed')+'<span>'+t('shed')+'</span>'+(canAffordSomething()?'<em class="dot"></em>':'')+'</button>'+
      '<button class="tile" id="hAch">'+ic('trophy')+'<span>'+t('achievements')+'</span><em class="sm">'+achCount()+'/'+ACH.length+'</em></button>'+
      '<button class="tile" id="hClub">'+ic('club')+'<span>'+t('club')+'</span></button>'+
    '</div><div class="sub">'+t('missions')+'</div><div class="mislist">'+mis+'</div><div class="ver">v'+VERSION+'</div>','home');
  onClick('#hPlay',()=>prerun(nf,'field'));onClick('#hFields',showFields);onClick('#hEndless',()=>S.won.grandma?showFields('endless'):toast(t('h_lock')));onClick('#hDaily',()=>S.won.grandma?showDaily():toast(t('h_lock')));
  onClick('#hShop',()=>{if(!S.hShed&&$('hShop').classList.contains('pointme')){S.hShed=1;measure('hint','shed','used')}showShop()});onClick('#hAch',showAch);onClick('#hClub',()=>showClub(0));onClick('#hSet',()=>showSettings(goHome));
  onClick('[data-claim]',e=>{const m=S.mis.list[+e.dataset.claim];if(!m||m.c)return;m.c=1;addCoins(75);measure('mission',m.k,'claim');
    if(S.mis.list.every(x=>x.c)){addCoins(100);toast(ic('chest')+' '+t('allMissions'))}save();goHome()});
  measure('screen','home','visible');
  if(S.fg&&!S.hShed&&canAffordSomething()){$('hShop').classList.add('pointme');measure('hint','shed','shown')}
  if(S.login.last!==todayKey()&&S.st.days>=1)setTimeout(showLogin,350)}
function canAffordSomething(){for(const tp of VORDER){if(!S.unl[tp]){if(S.coins>=VEG[tp].cost)return true}else if(S.coins>=upCost(tp))return true}return false}
function addCoins(n){S.coins+=n;save()}

function showFields(mode){mode=mode==='endless'?'endless':'field';
  const cards=FIELDS.map((f,i)=>{const un=fieldUnlocked(i);const st=S.stars[f.id]||0;const e=S.endless[f.id];
    return '<button class="fcard'+(un?'':' locked')+'" data-f="'+i+'" style="--fc:'+PAL[i].g1+';--fo:'+PAL[i].out+'"><div class="fn">'+(i+1)+'. '+t('f_'+f.id)+'</div>'+
    (un?(mode==='field'?'<div class="stars">'+[1,2,3].map(k=>ic(k<=st?'star':'star0')).join('')+'</div><div class="fb">'+t('best')+': '+fmtN(S.best[f.id]||0)+'</div>':'<div class="fb">'+t('bestWave')+': '+(e?e.w:0)+'</div><div class="fb">'+t('best')+': '+fmtN(e?e.s:0)+'</div>'):ic('lock')+'<div class="fb">'+t('winPrev')+'</div>')+'</button>'}).join('');
  show('<h2>'+(mode==='field'?t('gardens'):t('endless'))+'</h2>'+(mode==='endless'?'<p class="hint">'+t('endlessInfo')+'</p>':'')+'<div class="fgrid">'+cards+'</div><button class="btn gray" id="back">'+t('back')+'</button>','fields');
  onClick('[data-f]',e=>{const i=+e.dataset.f;if(!fieldUnlocked(i)){toast(t('winPrev'));return}prerun(i,mode)});onClick('#back',goHome)}

function prerun(fi,mode){const f=FIELDS[fi];let bag=defaultBag();const unl=VORDER.filter(x=>S.unl[x]);
  const daily=mode==='daily';
  function render(){const chips=unl.map(x=>'<button class="vchip'+(bag.includes(x)?' on':'')+'" data-v="'+x+'">'+img(vegIcon(x,1))+'<span>'+t('v_'+x)+'</span></button>').join('');
    const riv=mode==='field'?nextRival(fi,S.best[f.id]||0):null;
    show('<h2>'+t('f_'+f.id)+'</h2><div class="hint">'+(mode==='endless'?t('endless'):t('waves',20))+'</div>'+
      '<div class="sub">'+t('seedBag')+' <small>('+bag.length+'/5)</small></div><p class="hint">'+t('bagInfo')+'</p><div class="vchips">'+chips+'</div>'+
      (riv?'<div class="rival">'+img(gnomeIcon(riv.i),'gn')+'<span>'+t('toBeat',riv.n,fmtN(riv.s))+'</span></div>':'')+
      '<div class="row"><button class="btn gray" id="back">'+t('back')+'</button><button class="btn big green" id="go">'+t('start')+'</button></div>','pre');
    onClick('[data-v]',e=>{const x=e.dataset.v;if(bag.includes(x)){if(bag.length>3)bag=bag.filter(y=>y!==x);else toast(t('bagMin'))}else{if(bag.length<5)bag.push(x);else toast(t('bagMax'))}render()});
    onClick('#back',()=>mode==='field'?goHome():showFields(mode));onClick('#go',()=>{S.bag=bag.slice();save();startRun(fi,mode,{bag})})}
  if(unl.length<=3){startRun(fi,mode,{bag:unl});return}
  render()}

function startRun(fi,mode,opt){opt=opt||{};hide();coachOff();if(!S.fg&&fi===0&&mode==='field'){opt.guide=1;opt.bag=['carrot','tomato','onion']}
  const go=()=>{newRun(fi,mode,opt);UI.state='run';UI.paused=false;$('hud').className='';UI.sel=null;FX.length=0;DECAL.length=0;bg=null;resize();
    R.omaMad=0;R.omaHappy=0;buildChips();revInit();resize();gpStart();const fk=runKey();measure(mode,fk,'start');
    if(R.guide&&!S.tut)gStep('plant1');else banner(t('f_'+R.F.id),mode==='daily'?t('mod_'+R.mod):t('getReady'));
    if(mode==='daily')measure('daily','challenge','start')};
  if(!UI.firstRunThisSession){commercial().then(go)}else{UI.firstRunThisSession=false;go()}}
function runKey(){return R.mode==='daily'?'daily':(R.mode==='endless'?'e-':'f')+(R.fi+1)}

  el.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{const x=b.dataset.p;if(powerUp(x)){if(coachOff('power'))measure('hint','power','used');sfx('perk');toast(t('poweredUp',t('v_'+x),R.pl[x]));measure('powerup',x,'buy')}else{sfx('click');if(R.pl[x]>=5)toast(t('maxPower'));else toast(t('needComp',powerCost(x)))}}));
