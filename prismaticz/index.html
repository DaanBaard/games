<style>
/* Layout: one-screen game. Portrait: header, board, tray stacked. Landscape (Poki 16:9): board left, controls right.
   Colours of floor/walls/background come from the chapter theme (set from JS). */
:root{
  --bg:#0d0e18; --panel:#171927; --panel2:#1f2233; --ink:#eceaf6; --muted:#9a98b4; --line:rgba(236,234,246,.12);
  --floor:#141626; --dot:#262a40; --wall:#2b2f45; --wallTop:#373c57;
  --accent:#ffd84d; --red:#ff3b4f; --green:#2bf08a; --blue:#4a86ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg2,#1a2333),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .6s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#rec{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"head" "sub" "bar2" "stage" "tray" "bar";max-width:720px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;padding-block:12px 2px;flex-wrap:wrap}

.brand{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:27px;filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
h1{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--red),var(--accent) 35%,var(--green) 65%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.lvl{font-size:.92rem;color:var(--muted);display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.lvl b{font-family:var(--display);font-weight:600;color:var(--ink);font-size:.9rem}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--theme,var(--muted))}
.score b{color:var(--accent);font-family:var(--body);font-weight:600;font-size:1rem}
.num{font-variant-numeric:tabular-nums}
.sub{grid-area:sub;display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 6px;min-width:0}
#hint{margin:0;min-height:1.35em;color:var(--muted);font-size:.92rem;line-height:1.35}
.taps{color:var(--muted);font-size:.9rem;white-space:nowrap}
#stage{grid-area:stage;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}
#cv{display:block;max-width:100%;touch-action:none}
.tray{grid-area:tray;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-block:8px 4px}
.piece{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:5px 12px 5px 5px;color:var(--ink);font-family:var(--body);font-weight:600;font-size:.92rem;cursor:pointer;min-height:46px}
.piece canvas{width:34px;height:34px}
.piece.sel{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 3px rgba(255,216,77,.18)}
.piece:disabled{opacity:.35;cursor:default}
.piece .cnt{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{grid-area:bar;display:flex;gap:8px;justify-content:center;align-items:center;padding-block:4px 12px;flex-wrap:wrap}
button,input{font-family:var(--body)}
.btn{font-weight:600;font-size:.9rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover,.piece:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:20px;height:16px;flex:none}
.btn.reward{border-color:rgba(255,216,77,.55);color:var(--accent)}
.btn.primary{background:var(--accent);color:#14131c;border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:8px 14px;font-size:.9rem;white-space:normal;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.3;pointer-events:none;z-index:3}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:320px;box-sizing:border-box}
.card h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0 0 6px;color:var(--accent)}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.45}
.card .actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.card .actions .btn{justify-content:center}
.card .actions .primary{font-size:1rem;padding:12px 20px}
.stars{font-size:1.6rem;letter-spacing:.15em;color:var(--accent);margin:-2px 0 8px}
.stars .off{color:#3a3d55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{background:var(--panel2);border-radius:12px;padding:7px 4px}
.stats dt{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats dd{margin:2px 0 0;font-size:1.2rem;font-weight:600}
/* menu hub */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,12,.78);z-index:5;padding:16px;box-sizing:border-box}
.hub{max-width:520px;width:100%;max-height:100%;overflow:auto;touch-action:pan-y;text-align:left}
.hub h2{text-align:center}
.daily.endless{margin-top:8px;background:linear-gradient(135deg,rgba(74,134,255,.14),rgba(255,59,79,.1));border-color:rgba(74,134,255,.4)}
.toggle select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-weight:600;max-width:60%}
.grp{display:inline-flex;gap:inherit;flex-wrap:nowrap}
.langbtn{position:relative;cursor:pointer}
@media (max-width:480px){ .bar{gap:6px} .bar .btn{padding:7px 10px;font-size:.85rem;gap:5px} .bar .btn svg{width:16px;height:14px} .langbtn svg{width:16px;height:16px} }
.langbtn svg{width:18px;height:18px}
.langbtn select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.langbtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.skin{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 9px;color:var(--ink);cursor:pointer;font-weight:600;font-size:.82rem;text-align:left}
.skin.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,216,77,.25)}
.skin.locked{opacity:.55;cursor:default}
.skin small{margin-left:auto;color:var(--accent);font-size:.72rem}
.sw{width:22px;height:8px;border-radius:999px;flex:none}
.sw0{background:linear-gradient(90deg,#ff3b4f,#fff 50%,#4a86ff)}
.sw1{background:#3cf0ff;box-shadow:0 0 8px #3cf0ff}
.sw2{background:linear-gradient(90deg,#ff3b4f,#ffd84d,#2bf08a,#4a86ff,#b05bff)}
.sw3{background:radial-gradient(circle,#fff 1px,transparent 1.5px) 0 0/5px 5px,#6a5cff}
.sw5{background:linear-gradient(90deg,#ffd75a,#fff3c4 50%,#e0a92a);box-shadow:0 0 8px #ffd75a}
.sw6{background:linear-gradient(90deg,#9fe8ff,#ffffff 50%,#6fc6ff);box-shadow:0 0 8px #9fe8ff}
.sw7{background:linear-gradient(90deg,#ff3d00,#ffb13b 50%,#ff3d00);box-shadow:0 0 8px #ff7a1a}
.sw8{background:linear-gradient(90deg,#3dff9e,#5ad1ff 50%,#b46bff);box-shadow:0 0 8px #5ad1ff}
.sw4{background:linear-gradient(90deg,#ff6a00,#ff2bd6,#ff6a00);box-shadow:0 0 8px #ff2bd6}
.piece{touch-action:none}
.hub h3{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:16px 0 8px;font-weight:600}
.daily{background:linear-gradient(135deg,rgba(255,216,77,.12),rgba(74,134,255,.1));border:1px solid rgba(255,216,77,.35);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daily b{font-family:var(--display);font-size:.95rem}
.daily small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.chap{margin-bottom:10px}
.chap-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.chap-h b{font-family:var(--display);font-size:.85rem;font-weight:600}
.chap-h span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:6px 0 4px;cursor:pointer;font-weight:600;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.grid button small{font-size:.6rem;color:var(--accent);letter-spacing:.04em;min-height:1em}
.grid button.cur{border-color:var(--accent)}
.chap .grid button{border-color:color-mix(in srgb,var(--chap,#fff) 22%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 10px;font-size:.9rem}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:600;font-size:.88rem;text-align:left}
.toggle i{width:34px;height:20px;border-radius:999px;background:#3a3d55;position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}
.hub .close{display:flex;justify-content:center;margin-top:16px}
.ver{text-align:center;color:var(--muted);font-size:.72rem;margin:10px 0 0;letter-spacing:.06em}
/* editor */
.edtools{grid-area:tray;display:flex;flex-direction:column;gap:8px;padding-block:6px 4px;min-height:0;overflow:auto;touch-action:pan-y}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tool{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;color:var(--ink);cursor:pointer;font-weight:600;font-size:.82rem}
.tool canvas{width:28px;height:28px}
.tool.sel{border-color:var(--accent);background:var(--panel2)}
.stock{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.stock .lbl{color:var(--muted);font-size:.78rem;width:100%;text-align:center}
.cnt-ctl{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.cnt-ctl canvas{width:24px;height:24px}
.cnt-ctl button{width:26px;height:26px;border:0;border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1}
.cnt-ctl b{min-width:16px;text-align:center;font-variant-numeric:tabular-nums;font-size:.85rem}
#edmsg{min-height:1.3em;text-align:center;color:var(--muted);font-size:.86rem;margin:0}
#edmsg.ok{color:var(--green)} #edmsg.err{color:var(--red)}
#share textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px;font-size:.8rem;resize:none;height:70px;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
.chapbar{grid-area:bar2;display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:.8rem;color:var(--muted)}
.chapbar .track{flex:1;max-width:160px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.chapbar .fill{height:100%;background:linear-gradient(90deg,var(--theme,#fff),var(--accent));border-radius:999px;transition:width .5s}
.chapbar .swatch{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.25)}
#hand{position:fixed;left:0;top:0;width:66px;height:66px;z-index:4;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#hand svg{width:100%;height:100%;animation:tapme 1.1s ease-in-out infinite;transform-origin:30% 20%}
#hand .ring{fill:none;stroke:#ffd84d;stroke-width:3;opacity:0;animation:ring 1.1s ease-out infinite}
@keyframes tapme{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(0,4px) scale(.9)}}
@keyframes ring{40%{opacity:0;r:4}55%{opacity:1;r:6}100%{opacity:0;r:16}}
#dailybanner{position:absolute;top:6px;left:0;right:0;margin:0 auto;width:max-content;z-index:3;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid rgba(255,216,77,.45);border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:.88rem;white-space:nowrap;max-width:calc(100% - 16px)}
#dailybtext{white-space:normal;line-height:1.2}
#dailybanner .btn{padding:6px 12px}
#nudgebtn{animation:nudgepulse 1.2s ease-in-out infinite}@keyframes nudgepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.55)}50%{box-shadow:0 0 0 8px rgba(255,216,77,0)}}
#dailybanner .x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 6px}
#tapbubble{position:fixed;left:0;top:0;z-index:4;pointer-events:none;background:var(--accent);color:#14131c;font-weight:800;font-family:var(--display);font-size:.95rem;padding:7px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.45);white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-4px}}
.chap.locked .grid{opacity:.4}
.chap.locked .chap-h span{color:var(--accent)}
.piece.guide{box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(255,216,77,.6)}
@media (prefers-reduced-motion: reduce){ #hand svg,#hand .ring{animation:none} #hand{transition:none} }
@media (max-width:480px){ h1{font-size:1.1rem} .toggles{grid-template-columns:1fr} }
@media (min-aspect-ratio: 5/4){
  #app{max-width:none;grid-template-columns:minmax(0,1fr) minmax(220px,33%);grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"stage head" "stage sub" "stage bar2" "stage tray" "stage bar";column-gap:20px;padding-block:10px}
  header{flex-direction:column;align-items:flex-start;padding-block:4px 0}
  .sub{flex-direction:column;gap:6px}
  .tray{flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto;touch-action:pan-y}
  .bar{justify-content:flex-start;padding-block:4px}
  .tools,.stock{justify-content:flex-start} .stock .lbl{text-align:left}
}
@media (min-aspect-ratio: 5/4) and (max-height:440px){
  h1{font-size:1rem} .lvl,.sub,#hint{font-size:.8rem} .piece{min-height:34px;font-size:.8rem;padding:3px 10px 3px 3px} .piece canvas{width:26px;height:26px}
  .btn{padding:6px 10px;font-size:.8rem} .tray{gap:5px;padding-block:4px} .tool{font-size:.75rem}
}
@media (prefers-reduced-motion: reduce){ body{transition:none} }
.setmeter{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted)}
.setmeter b{font-family:var(--body)!important;font-size:.74rem!important;color:var(--muted)!important;font-weight:600;margin-right:2px;text-transform:uppercase;letter-spacing:.06em}
.setmeter i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:inline-block}
.setmeter i.on{background:#ffd84d;border-color:#ffd84d;box-shadow:0 0 6px rgba(255,216,77,.7)}
.setmeter i.cur{border-color:#ffd84d}
.starpill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 6px;border-radius:999px;background:rgba(255,216,77,.12);border:1px solid rgba(255,216,77,.35);font-size:.78rem;color:var(--ink);transition:transform .2s}
.starpill b{color:#ffd84d!important;font-size:.85rem!important}
.starpill .sbar{width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}

<script>
// ---------- compatibility: older browsers (e.g. Chrome < 99, Safari < 16, Firefox < 112) have no canvas roundRect ----------
(function(){

    r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r); this.arcTo(x+w,y+h,x+w-r,y+h,r);

// ---- Prismaticz core ----
// colour masks: R=1 G=2 B=4 ; white=7
const CRYSTAL={r:1,g:2,b:4,y:3,c:6,m:5,w:7};
const FILTER={R:1,G:2,B:4,Y:3,C:6,M:5};
const SRC={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};
// fixed map chars for splitters: L = '/' half mirror, J = '\' half mirror. O = portal (pairs). K = colour shifter.
const MAPPIECE={'/':'/','\\':'\\','P':'P','K':'K','L':'S/','J':'S\\'};
for(const f in FILTER) MAPPIECE[f]=f;
const shiftMask=m=>((m<<1)|(m>>2))&7; // R->G->B->R
function parseLevel(def){
  const rows=def.map, h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const grid=[], portals=[];
  for(let y=0;y<h;y++){grid.push([]);for(let x=0;x<w;x++){const c=rows[y][x]||'#';grid[y].push(c===' '?'#':c); if(c==='O') portals.push([x,y]);}}
  return {w,h,grid,inv:def.inv,portals};
}
function pieceAt(L,pieces,x,y){
  const k=x+','+y; if(pieces[k]) return pieces[k].t;
  return MAPPIECE[L.grid[y][x]]||null;
}
function trace(L,pieces){
  const hits={}, segs=[]; const seen=new Set(); const q=[];
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=L.grid[y][x]; if(SRC[c]) q.push({x,y,dx:SRC[c][0],dy:SRC[c][1],m:7});}
  let guard=0;
  while(q.length&&guard++<8000){
    const b=q.shift(); const k=b.x+','+b.y+','+b.dx+','+b.dy+','+b.m; if(seen.has(k)) continue; seen.add(k);
    const nx=b.x+b.dx, ny=b.y+b.dy;
    const out=nx<0||ny<0||nx>=L.w||ny>=L.h; const c=out?'#':L.grid[ny][nx];
    if(c==='#'||SRC[c]){ segs.push({x1:b.x,y1:b.y,x2:b.x+b.dx*.5,y2:b.y+b.dy*.5,m:b.m}); continue; }
    segs.push({x1:b.x,y1:b.y,x2:nx,y2:ny,m:b.m});
    if(CRYSTAL[c]){ const kk=nx+','+ny; hits[kk]=(hits[kk]||0)|b.m; continue; }
    if(c==='O'){ const o=L.portals.find(p=>p[0]!==nx||p[1]!==ny); if(o){ segs.push({x1:o[0],y1:o[1],x2:o[0],y2:o[1],m:b.m,portal:1}); q.push({x:o[0],y:o[1],dx:b.dx,dy:b.dy,m:b.m}); } continue; }
    const p=pieceAt(L,pieces,nx,ny);
    if(p==='/'){ q.push({x:nx,y:ny,dx:-b.dy,dy:-b.dx,m:b.m}); continue; }
    if(p==='\\'){ q.push({x:nx,y:ny,dx:b.dy,dy:b.dx,m:b.m}); continue; }
    if(p==='S/'){ q.push({x:nx,y:ny,dx:-b.dy,dy:-b.dx,m:b.m}); q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m}); continue; }
    if(p==='S\\'){ q.push({x:nx,y:ny,dx:b.dy,dy:b.dx,m:b.m}); q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m}); continue; }
    if(p==='K'){ q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:shiftMask(b.m)}); continue; }
    if(p==='P'){
      if(b.m&1) q.push({x:nx,y:ny,dx:b.dy,dy:-b.dx,m:1});   // red bends left
      if(b.m&2) q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:2});    // green straight
      if(b.m&4) q.push({x:nx,y:ny,dx:-b.dy,dy:b.dx,m:4});   // blue bends right
      continue; }
    if(p&&FILTER[p]){ const m=b.m&FILTER[p]; if(m) q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m}); continue; }
    q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m});
  }
  let all=true, any=false; const lit={};
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=L.grid[y][x]; if(CRYSTAL[c]){any=true; const kk=x+','+y; lit[kk]=(hits[kk]||0)===CRYSTAL[c]; if(!lit[kk]) all=false;}}
  return {segs,hits,lit,win:all&&any};
}
function emptyCells(L){const e=[];for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++)if(L.grid[y][x]==='.')e.push([x,y]);return e;}
// Beam-guided Dijkstra: minimum number of taps. '/'=1, '\'=2 (place + rotate), splitters the same, others 1.
const TAPCOST={'/':1,'\\':2,'S/':1,'S\\':2};
const KIND=t=>(t==='/'||t==='\\')?'M':(t==='S/'||t==='S\\')?'S':t;
const OPTS={M:['/','\\'],S:['S/','S\\']};
function solveMin(def,maxNodes=300000){
  const L=parseLevel(def);
  if(trace(L,{}).win) return {trivial:true};
  const key=p=>Object.keys(p).sort().map(k=>k+p[k].t).join(';');
  const heap=[{cost:0,pieces:{},inv:{...def.inv},order:[]}]; const seen=new Set(); let nodes=0;
  const push=s=>{heap.push(s); let i=heap.length-1; while(i>0){const j=(i-1)>>1; if(heap[j].cost<=heap[i].cost)break; [heap[i],heap[j]]=[heap[j],heap[i]]; i=j;}};
  const pop=()=>{const top=heap[0]; const last=heap.pop(); if(heap.length){heap[0]=last; let i=0; for(;;){let l=2*i+1,r=l+1,m=i; if(l<heap.length&&heap[l].cost<heap[m].cost)m=l; if(r<heap.length&&heap[r].cost<heap[m].cost)m=r; if(m===i)break; [heap[i],heap[m]]=[heap[m],heap[i]]; i=m;}} return top;};
  while(heap.length){
    const s=pop(); const k=key(s.pieces); if(seen.has(k)) continue; seen.add(k);
    if(++nodes>maxNodes) return {timeout:true,nodes};
    const r=trace(L,s.pieces); if(r.win) return {cost:s.cost,pieces:s.pieces,order:s.order,nodes,count:s.order.length};
    const cells=new Set(); for(const g of r.segs){ if(!g.portal&&g.x2%1===0&&g.y2%1===0){ const kk=g.x2+','+g.y2; if(L.grid[g.y2][g.x2]==='.'&&!s.pieces[kk]) cells.add(kk);} }
    for(const t in s.inv){ if(s.inv[t]<=0) continue;
      for(const cell of cells) for(const o of (OPTS[t]||[t])){
        push({cost:s.cost+(TAPCOST[o]||1),pieces:{...s.pieces,[cell]:{t:o}},inv:{...s.inv,[t]:s.inv[t]-1},order:[...s.order,[cell,o]]});
      }
    }
  }

if(typeof module!=='undefined') module.exports={CRYSTAL,FILTER,SRC,MAPPIECE,parseLevel,trace,emptyCells,solveMin,KIND,TAPCOST};

// ---------- endless mode: build a fresh, solver-checked puzzle (runs in a Web Worker when possible) ----------
// needs parseLevel, trace, solveMin, KIND, SRC from the core logic
function endlessAttempt(seed,n,allow){
  let s=(seed>>>0)%2147483646+1; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647}; const ri=k=>Math.floor(rnd()*k); const pick=a=>a[ri(a.length)];
  const tier=n<3?{W:[5,6],H:[4,5],walls:[0,3],pieces:[2,3],fixed:[0,0],minP:2,minC:2}:
             n<8?{W:[5,6],H:[5,6],walls:[1,4],pieces:[2,4],fixed:[0,1],minP:2,minC:3}:
             n<16?{W:[6,6],H:[5,6],walls:[1,4],pieces:[3,4],fixed:[0,1],minP:3,minC:4}:
                  {W:[6,7],H:[6,6],walls:[2,5],pieces:[3,5],fixed:[1,2],minP:3,minC:5};
  const pool=n<5?['M','M','M','P','R','G','B']:n<10?['M','M','M','P','P','R','G','B','S']:['M','M','M','P','P','R','G','B','S','K'];
  if(allow){ const f=pool.filter(k=>allow.includes(k)); pool.length=0; (f.length?f:['M']).forEach(k=>pool.push(k)); if(!pool.includes('M')) pool.push('M','M'); } // only pieces the player already met
  const rr=a=>a[0]+ri(a[1]-a[0]+1);
  const maskCh={1:'r',2:'g',4:'b',3:'y',6:'c',5:'m',7:'w'};
  const pieceChar={'/':'/','\\':'\\','P':'P','K':'K','S/':'L','S\\':'J','R':'R','G':'G','B':'B'};
  const W=rr(tier.W),H=rr(tier.H);
  const g=[];for(let y=0;y<H+2;y++){g.push([]);for(let x=0;x<W+2;x++)g[y].push(x==0||y==0||x==W+1||y==H+1?'#':'.');}
  const nW=rr(tier.walls); for(let i=0;i<nW;i++) g[1+ri(H)][1+ri(W)]='#';
  if(n>=12&&(!allow||allow.includes('O'))&&rnd()<.2){ for(let i=0;i<2;i++){ const x=1+ri(W),y=1+ri(H); if(g[y][x]==='.') g[y][x]='O'; } if(g.flat().filter(c=>c==='O').length!==2) return null; }
  const nS=n>=10&&rnd()<.25?2:1;
  for(let i=0;i<nS;i++){ const x=1+ri(W),y=1+ri(H); if(g[y][x]!=='.') return null; const d=pick(Object.keys(SRC)); const[dx,dy]=SRC[d]; if(g[y+dy][x+dx]!=='.') return null; g[y][x]=d; }
  const def0=()=>({map:g.map(r=>r.join('')),inv:{}});
  const pieces={}; const nP=rr(tier.pieces)+rr(tier.fixed);
  for(let i=0;i<nP;i++){
    const L=parseLevel(def0()); const r=trace(L,pieces);
    const cells=[...new Set(r.segs.filter(q=>!q.portal&&q.x2%1===0&&q.y2%1===0).map(q=>q.x2+','+q.y2))].filter(k=>{const[x,y]=k.split(',').map(Number);return g[y][x]==='.'&&!pieces[k];});
    if(!cells.length) return null;
    const t=pick(pool); const o=t==='M'?pick(['/','\\']):t==='S'?pick(['S/','S\\']):t;
    pieces[pick(cells)]={t:o};

const WORKER_SRC="// ---- Prismaticz core ----\n// colour masks: R=1 G=2 B=4 ; white=7\nconst CRYSTAL={r:1,g:2,b:4,y:3,c:6,m:5,w:7};\nconst FILTER={R:1,G:2,B:4,Y:3,C:6,M:5};\nconst SRC={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};\n// fixed map chars for splitters: L = '/' half mirror, J = '\\' half mirror. O = portal (pairs). K = colour shifter.\nconst MAPPIECE={'/':'/','\\\\':'\\\\','P':'P','K':'K','L':'S/','J':'S\\\\'};\nfor(const f in FILTER) MAPPIECE[f]=f;\nconst shiftMask=m=>((m<<1)|(m>>2))&7; // R->G->B->R\nfunction parseLevel(def){\n  const rows=def.map, h=rows.length, w=Math.max(...rows.map(r=>r.length));\n  const grid=[], portals=[];\n  for(let y=0;y<h;y++){grid.push([]);for(let x=0;x<w;x++){const c=rows[y][x]||'#';grid[y].push(c===' '?'#':c); if(c==='O') portals.push([x,y]);}}\n  return {w,h,grid,inv:def.inv,portals};\n}\nfunction pieceAt(L,pieces,x,y){\n  const k=x+','+y; if(pieces[k]) return pieces[k].t;\n  return MAPPIECE[L.grid[y][x]]||null;\n}\nfunction trace(L,pieces){\n  const hits={}, segs=[]; const seen=new Set(); const q=[];\n  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=L.grid[y][x]; if(SRC[c]) q.push({x,y,dx:SRC[c][0],dy:SRC[c][1],m:7});}\n  let guard=0;\n  while(q.length&&guard++<8000){\n    const b=q.shift(); const k=b.x+','+b.y+','+b.dx+','+b.dy+','+b.m; if(seen.has(k)) continue; seen.add(k);\n    const nx=b.x+b.dx, ny=b.y+b.dy;\n    const out=nx<0||ny<0||nx>=L.w||ny>=L.h; const c=out?'#':L.grid[ny][nx];\n    if(c==='#'||SRC[c]){ segs.push({x1:b.x,y1:b.y,x2:b.x+b.dx*.5,y2:b.y+b.dy*.5,m:b.m}); continue; }\n    segs.push({x1:b.x,y1:b.y,x2:nx,y2:ny,m:b.m});\n    if(CRYSTAL[c]){ const kk=nx+','+ny; hits[kk]=(hits[kk]||0)|b.m; continue; }\n    if(c==='O'){ const o=L.portals.find(p=>p[0]!==nx||p[1]!==ny); if(o){ segs.push({x1:o[0],y1:o[1],x2:o[0],y2:o[1],m:b.m,portal:1}); q.push({x:o[0],y:o[1],dx:b.dx,dy:b.dy,m:b.m}); } continue; }\n    const p=pieceAt(L,pieces,nx,ny);\n    if(p==='/'){ q.push({x:nx,y:ny,dx:-b.dy,dy:-b.dx,m:b.m}); continue; }\n    if(p==='\\\\'){ q.push({x:nx,y:ny,dx:b.dy,dy:b.dx,m:b.m}); continue; }\n    if(p==='S/'){ q.push({x:nx,y:ny,dx:-b.dy,dy:-b.dx,m:b.m}); q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m}); continue; }\n    if(p==='S\\\\'){ q.push({x:nx,y:ny,dx:b.dy,dy:b.dx,m:b.m}); q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m}); continue; }\n    if(p==='K'){ q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:shiftMask(b.m)}); continue; }\n    if(p==='P'){\n      if(b.m&1) q.push({x:nx,y:ny,dx:b.dy,dy:-b.dx,m:1});   // red bends left\n      if(b.m&2) q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:2});    // green straight\n      if(b.m&4) q.push({x:nx,y:ny,dx:-b.dy,dy:b.dx,m:4});   // blue bends right\n      continue; }\n    if(p&&FILTER[p]){ const m=b.m&FILTER[p]; if(m) q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m}); continue; }\n    q.push({x:nx,y:ny,dx:b.dx,dy:b.dy,m:b.m});\n  }\n  let all=true, any=false; const lit={};\n  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=L.grid[y][x]; if(CRYSTAL[c]){any=true; const kk=x+','+y; lit[kk]=(hits[kk]||0)===CRYSTAL[c]; if(!lit[kk]) all=false;}}\n  return {segs,hits,lit,win:all&&any};\n}\nfunction emptyCells(L){const e=[];for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++)if(L.grid[y][x]==='.')e.push([x,y]);return e;}\n// Beam-guided Dijkstra: minimum number of taps. '/'=1, '\\'=2 (place + rotate), splitters the same, others 1.\nconst TAPCOST={'/':1,'\\\\':2,'S/':1,'S\\\\':2};\nconst KIND=t=>(t==='/'||t==='\\\\')?'M':(t==='S/'||t==='S\\\\')?'S':t;\nconst OPTS={M:['/','\\\\'],S:['S/','S\\\\']};\nfunction solveMin(def,maxNodes=300000){\n  const L=parseLevel(def);\n  if(trace(L,{}).win) return {trivial:true};\n  const key=p=>Object.keys(p).sort().map(k=>k+p[k].t).join(';');\n  const heap=[{cost:0,pieces:{},inv:{...def.inv},order:[]}]; const seen=new Set(); let nodes=0;\n  const push=s=>{heap.push(s); let i=heap.length-1; while(i>0){const j=(i-1)>>1; if(heap[j].cost<=heap[i].cost)break; [heap[i],heap[j]]=[heap[j],heap[i]]; i=j;}};\n  const pop=()=>{const top=heap[0]; const last=heap.pop(); if(heap.length){heap[0]=last; let i=0; for(;;){let l=2*i+1,r=l+1,m=i; if(l<heap.length&&heap[l].cost<heap[m].cost)m=l; if(r<heap.length&&heap[r].cost<heap[m].cost)m=r; if(m===i)break; [heap[i],heap[m]]=[heap[m],heap[i]]; i=m;}} return top;};\n  while(heap.length){\n    const s=pop(); const k=key(s.pieces); if(seen.has(k)) continue; seen.add(k);\n    if(++nodes>maxNodes) return {timeout:true,nodes};\n    const r=trace(L,s.pieces); if(r.win) return {cost:s.cost,pieces:s.pieces,order:s.order,nodes,count:s.order.length};\n    const cells=new Set(); for(const g of r.segs){ if(!g.portal&&g.x2%1===0&&g.y2%1===0){ const kk=g.x2+','+g.y2; if(L.grid[g.y2][g.x2]==='.'&&!s.pieces[kk]) cells.add(kk);} }\n    for(const t in s.inv){ if(s.inv[t]<=0) continue;\n      for(const cell of cells) for(const o of (OPTS[t]||[t])){\n        push({cost:s.cost+(TAPCOST[o]||1),pieces:{...s.pieces,[cell]:{t:o}},inv:{...s.inv,[t]:s.inv[t]-1},order:[...s.order,[cell,o]]});\n      }\n    }\n  }\n  return {unsolvable:true,nodes};\n}\nif(typeof module!=='undefined') module.exports={CRYSTAL,FILTER,SRC,MAPPIECE,parseLevel,trace,emptyCells,solveMin,KIND,TAPCOST};\n\n// ---------- endless mode: build a fresh, solver-checked puzzle (runs in a Web Worker when possible) ----------\n// needs parseLevel, trace, solveMin, KIND, SRC from the core logic\nfunction endlessAttempt(seed,n,allow){\n  let s=(seed>>>0)%2147483646+1; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647}; const ri=k=>Math.floor(rnd()*k); const pick=a=>a[ri(a.length)];\n  const tier=n<3?{W:[5,6],H:[4,5],walls:[0,3],pieces:[2,3],fixed:[0,0],minP:2,minC:2}:\n             n<8?{W:[5,6],H:[5,6],walls:[1,4],pieces:[2,4],fixed:[0,1],minP:2,minC:3}:\n             n<16?{W:[6,6],H:[5,6],walls:[1,4],pieces:[3,4],fixed:[0,1],minP:3,minC:4}:\n                  {W:[6,7],H:[6,6],walls:[2,5],pieces:[3,5],fixed:[1,2],minP:3,minC:5};\n  const pool=n<5?['M','M','M','P','R','G','B']:n<10?['M','M','M','P','P','R','G','B','S']:['M','M','M','P','P','R const MAPCHARS=/^[#.<>^vrgbycmw\/\\PKLJORGBYCM]+$/;
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function encodeLevel(d){ return b64e(JSON.stringify({m:d.map.join('|'),i:d.inv,n:d.min,s:d.sol.map(([c,t])=>c+':'+t).join(';')})); }
function decodeLevel(raw){
  try{
    let code=String(raw||'').trim(); if(!code) return null;
    const m1=code.match(/[?&](?:gd)?lvl=([A-Za-z0-9_-]+)/); if(m1) code=m1[1];
    const m2=code.match(/#L([A-Za-z0-9_-]+)/); if(m2) code=m2[1];
    if(!/^[A-Za-z0-9_-]+$/.test(code)||code.length>4000) return null;
    const o=JSON.parse(b64d(code)); const map=String(o.m).split('|');
    if(map.length<3||map.length>14||map.some(r=>r.length<3||r.length>14||!MAPCHARS.test(r))) return null;
    const inv={}; for(const k in o.i){ if(!'MPRGBSK'.includes(k)||k.length!==1) return null; const n=o.i[k]|0; if(n<0||n>9) return null; if(n) inv[k]=n; }
    const sol=String(o.s||'').split(';').filter(Boolean).map(x=>{ const i=x.lastIndexOf(':'); return [x.slice(0,i),x.slice(i+1)]; });
    const def={map,inv,min:o.n|0,sol};
    // never trust a code: its solution must really work, and cost exactly the stated minimum
    const Lx=parseLevel(def); const p={}; let cost=0; const left={...inv};
    for(const [c,t] of sol){ const [x,y]=c.split(',').map(Number); if(!(x>=0&&y>=0&&x<Lx.w&&y<Lx.h)||Lx.grid[y][x]!=='.'||!['/','\\','P','R','G','B','K','S/','S\\'].includes(t)) return null;
      const k=KIND(t); if(!left[k]) return null; left[k]--; p[c]={t}; cost+=TAPCOST[t]||1; }
    if(!trace(Lx,p).win||cost!==def.min||trace(Lx,{}).win) return null;
    return def;
  }catch(e){ return null; }
}

  let nW=W+dw, nH=H+dh; if(nW>9) nW=4; if(nH>8) nH=4;
  const rows=[]; for(let y=0;y<nH+2;y++){ let r=''; for(let x=0;x<nW+2;x++){ const border=x===0||y===0||x===nW+1||y===nH+1;
    r+=border?'#':(y<=H&&x<=W?ed.rows[y][x]:'.'); } rows.push(r); }
  ed.rows=rows; edChanged(); edSync(); edButtons();
}
$('edw').onclick=()=>edResize(1,0);
$('edh').onclick=()=>edResize(0,1);
$('edclear').onclick=()=>{ const W=ed.rows[0].length-2, H=ed.rows.length-2; const t=ed.tool; ed=newEd(W,H); ed.tool=t; ed.inv={M:0,P:0,S:0,K:0,R:0,G:0,B:0}; edChanged(); edSync(); buildStock(); buildTools(); };
$('edback').onclick=()=>{ if(mode==='edit') goTo(()=>startLevel(lvIndex)); };
$('edtest').onclick=()=>{
  const all=ed.rows.join(''); const msg=$('edmsg');
  if(!/[<>^v]/.test(all)||!/[rgbycmw]/.test(all)){ msg.textContent=S.edNeedSrc; msg.className='err'; Sfx.error(); return; }
  const np=all.split('O').length-1; if(np!==0&&np!==2){ msg.textContent=S.edPortals; msg.className='err'; Sfx.error(); return; }
  msg.textContent=S.edBusy; msg.className=''; $('edtest').disabled=true;
  const def={map:ed.rows.slice(),inv:edInv()};
  solveAsync(def,250000,r=>{ $('edtest').disabled=false;
    if(r.trivial){ msg.textContent=S.edTrivial; msg.className='err'; ed.result=null; }
    else if(r.timeout){ msg.textContent=S.edTimeout; msg.className='err'; ed.result=null; }
    else if(r.unsolvable){ msg.textContent=S.edNo; msg.className='err'; ed.result=null; }
    else { msg.textContent=S.edOk(r.cost); msg.className='ok'; ed.result={min:r.cost,sol:r.order}; Sfx.crystal(7); }
    edButtons(); edSave();
  });
};
const edDef=()=>({map:ed.rows.slice(),inv:edInv(),min:ed.result.min,sol:ed.result.sol});
$('edplay').onclick=()=>{ if(ed.result) startCustom(edDef(),true); };
$('edshare').onclick=()=>{ if(!ed.result) return; const code=encodeLevel(edDef());
  const show=(text,box)=>{ $('sharetext').textContent=text; $('sharebox').value=box; $('share').hidden=false; $('copy').textContent=S.copy; };
  Poki.shareURL({lvl:code}).then(url=>{ if(url) show(S.shareUrl,url); else show(S.shareCode,code); }); };
$('copy').onclick=()=>{ const v=$('sharebox').value; const done=()=>{ $('copy').textContent=S.copied; };
  try{ navigator.clipboard.writeText(v).then(done,()=>{ $('sharebox').select(); }); }catch(e){ $('sharebox').select(); } };
$('shareclose').onclick=()=>$('share').hidden=true;

  const CROP=.62; T=Math.max(16,Math.floor(Math.min(r.width/(L.w-2*CROP), r.height/(L.h-2*CROP), 84))); OFF=Math.round(CROP*T);

function drawPortal(g,cx,cy,s,time){
  g.save(); g.translate(cx,cy); const t=(time==null||reduce)?0:time;
  const gr=g.createRadialGradient(0,0,0,0,0,s*.44); gr.addColorStop(0,'rgba(20,0,40,.95)'); gr.addColorStop(.55,'rgba(120,40,220,.55)'); gr.addColorStop(.8,'rgba(255,80,210,.35)'); gr.addColorStop(1,'rgba(255,80,210,0)');

  for(let i=0;i<3;i++){ const rr=s*(.36-i*.08), a=t/(700+i*250)*(i%2?-1:1)+i*2; g.strokeStyle=i%2?'rgba(255,120,220,.9)':'rgba(170,130,255,.95)'; g.lineWidth=Math.max(1.5,s*.045); g.lineCap='round';

function hexPath(g,rr){ g.beginPath(); for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3; g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} g.closePath(); }
function drawCrystal(g,cx,cy,s,mask,lit,hit,time,fl,pulse){

// beams: each colour on its own layer (so overlapping strokes of one colour do not double up), layers added together so colours mix
const beamCv=document.createElement('canvas'), beamG=beamCv.getContext('2d');

  if(!tg){ hand.hidden=true; bub.hidden=true; if(old) old.classList.remove('guide'); return; }
  let x,y;
  if(tg.tray){ const el=$('piece-'+tg.tray); if(!el){ hand.hidden=true; return; } if(old&&old!==el) old.classList.remove('guide'); el.classList.add('guide');
    const r=el.getBoundingClientRect(); x=r.left+26; y=r.top+r.height/2; }
  else { if(old) old.classList.remove('guide'); const r=cv.getBoundingClientRect(); x=r.left-OFF+tg.cell[0]*T+T/2; y=r.top-OFF+tg.cell[1]*T+T/2; }
  if(hand.hidden&&mode==='level'&&lvIndex===0&&!tutSent){ tutSent=true; Poki.measure('tutorial','hand','visible'); }
  hand.hidden=false; hand.style.transform=`translate(${Math.round(x-17)}px,${Math.round(y-7)}px)`;
  const misplaced=D&&D.sol&&Object.keys(pieces).some(q=>!D.sol.some(([sc])=>sc===q));
  const intro=((mode==='level'&&(lvIndex<=2||isConceptNew(lvIndex))&&(taps===0||misplaced))||(mode==='show'&&taps===0))&&guideMode&&!nudge;
  const pointing=performance.now()<pointUntil;
  if((intro||pointing)&&tg.cell) spot=tg.cell;
  if(intro||pointing){ bub.textContent=S.tapHere; bub.hidden=false; bub.style.transform=`translate(${Math.round(x-bub.offsetWidth/2)}px,${Math.round(y-T*.9-bub.offsetHeight)}px)`; } else bub.hidden=true;
}
$('skipbtn').onclick=()=>{ if(busy||won||(mode!=='level'&&mode!=='endless')||Poki.inAd) return; busy=true; Poki.measure('reward','skip','interact');
  Poki.rewarded().then(ok=>{ busy=false; if(!ok){ toast(S.skipNone); return; }
    trackEnd('fail');
    if(mode==='endless'){ endless.n=Math.max(endless.n,endlessCur+1); store.set('lichtbrekers-endless',endless); startEndless(); return; }
    if(!progress[lvIndex]){ progress[lvIndex]={pts:0,stars:0,taps:0,skipped:true}; store.set('lichtbrekers-v2',progress); }
    const nx=lvIndex+1; if(nx>=LEVELS.length||!chapterOpen(chapterOf(nx))){ startLevel(lvIndex); openMenu(); } else startLevel(nx); }); };
function updateChapBar(){
  updateSetMeter(false); updateEndlessBtn(); updateHintBtn(); if(!won) updateStarPill(false);
  const bar=$('chapbar'); $('score').parentNode.hidden=(mode==='level'&&lvIndex<3&&totals().p===0);
  if(mode!=='level'||lvIndex<3){ bar.hidden=true; return; } bar.hidden=false;
  const ci=chapterOf(lvIndex), ch=CHAPTERS[ci]; let done=0; for(let i=ch.from;i<ch.to;i++) if(progress[i]) done++;
  $('chapfill').style.width=Math.round(done/(ch.to-ch.from)*100)+'%';
  const rem=ch.to-lvIndex-1, nci=ci+1; let txt;
  if(nci>=CHAPTERS.length) txt=rem?S.toEnd(rem):S.lastOf(CHAPTER_NAMES[lang][ci]);
  else if(rem===0) txt=S.lastOf(CHAPTER_NAMES[lang][ci]); else txt=S.toNext(rem,CHAPTER_NAMES[lang][nci]);
  if(nci<CHAPTERS.length&&!chapterOpen(nci)) txt+=' · '+S.lockedNext(CH_NEED[nci]-starCount(),CHAPTER_NAMES[lang][nci]);
  { let nb=-1; for(let i=Math.max(lvIndex,CHAPTERS[0].to-1);i<LEVELS.length-1;i++) if((i+1)%5===0&&i>settings.bonusAt&&!progress[i]){ nb=i; break; } if(nb>=0&&nb-lvIndex<=3) txt=S.bonusIn(nb-lvIndex+1)+' · '+txt; }
  const ns=nextSkin(); if(ns>0&&SKINS[ns].need-starCount()<=8) txt+=' · '+S.skinNext(SKINS[ns].need-starCount(),S.skinNames[ns]);
  $('chaptext').textContent=txt;
  const sw=$('chapswatch'); sw.hidden=nci>=CHAPTERS.length;
  if(!sw.hidden){ const th=THEMES[CHAPTERS[nci].theme]; sw.style.background=`linear-gradient(135deg,${th.bg2},${th.wallTop} 55%,${th.accent})`; sw.title=CHAPTER_NAMES[lang][nci]; }
}
function showDailyBanner(){ Poki.measure('banner','daily','visible'); const b=$('dailybanner'); $('dailybendless').hidden=true; b.dataset.kind='daily'; $('dailybtext').textContent=S.dailyReady; $('dailybplay').textContent=S.play; b.hidden=false; setTimeout(()=>{ b.hidden=true; },15000); }
$('dailybplay').onclick=()=>{ Poki.measure('banner',$('dailybanner').dataset.kind==='modes'?'modes':'daily',$('dailybanner').dataset.kind==='modes'?'daily':'interact'); $('dailybanner').hidden=true; goTo(startDaily); };
$('dailybclose').onclick=()=>{ $('dailybanner').hidden=true; };
function endlessUnlocked(){ for(let i=CHAPTERS[0].from;i<CHAPTERS[0].to;i++) if(!progress[i]) return false; return true; }
let endBtnSent=false;
function updateEndlessBtn(){ const b=$('endbarbtn'); if(!b) return; const show=endlessUnlocked()&&mode!=='endless'&&mode!=='edit'; b.hidden=!show; b.textContent='∞ '+S.endless; if(show&&!endBtnSent){ endBtnSent=true; Poki.measure('endless','button','visible'); } }
$('endbarbtn').onclick=()=>{ if(busy||Poki.inAd) return; Poki.measure('endless','button','interact'); bonusReturn=null; goTo(startEndless); };
let pointUntil=0;
$('nudgebtn').onclick=()=>{ if(won||busy||genPending||Poki.inAd||replaying||!D||!D.sol) return; Poki.measure('help','nudge','interact'); Poki.start(); $('nudgebtn').hidden=true; pointUntil=performance.now()+6000; Sfx.click(); }; // v28: point at the move, the player makes it
$('dailybendless').onclick=()=>{ Poki.measure('banner','modes','endless'); $('dailybanner').hidden=true; goTo(startEndless); };
function showModeBanner(){ Poki.measure('banner','modes','visible'); const b=$('dailybanner'); $('dailybtext').textContent=S.modesNew; $('dailybplay').textContent=S.daily; const e=$('dailybendless'); e.textContent=S.endless; e.hidden=false; b.hidden=false; b.dataset.kind='modes'; clearTimeout(showModeBanner.t); showModeBanner.t=setTimeout(()=>{ b.hidden=true; },20000); }
function maybeModePromo(){ if(mode!=='level') return; for(const ci of [0,1]){ const key='promo'+ci; if(settings[key]) continue; const ch=CHAPTERS[ci]; let all=true; for(let i=ch.from;i<ch.to;i++) if(!progress[i]){ all=false; break; } if(all){ settings[key]=1; saveSettings(); setTimeout(showModeBanner,900); return; } } }

// ---------- endless mode: puzzles are generated on the fly (in a worker when the browser allows it) ----------
let genWorker=null, genReqId=0; const genWaiting={}; let prefetched=null;
try{ genWorker=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));
  genWorker.onmessage=e=>{ const cb=genWaiting[e.data.id]; delete genWaiting[e.data.id]; if(cb) cb(e.data.def); };
  genWorker.onerror=()=>{ genWorker=null; for(const id in genWaiting){ const cb=genWaiting[id]; delete genWaiting[id]; if(cb.n!=null) fallbackGen(cb.seed,cb.n,cb,cb.allow); else cb({timeout:true}); } };
}catch(e){ genWorker=null; }
function fallbackGen(seed,n,cb,allow){ let i=0; const step=()=>{ const d=endlessAttempt(seed+i*7919,n,allow); i++; if(d||i>600) cb(d); else setTimeout(step,0); }; setTimeout(step,0); }
function solveAsync(def,max,cb){
  if(genWorker){ const id=++genReqId; genWaiting[id]=r=>cb(r); genWorker.postMessage({id,solve:def,max}); }
  else setTimeout(()=>cb(solveMin(def,max)),40);
}
function knownPieces(){ const k=new Set(['M']); const mp={L:'S',J:'S',K:'K',O:'O',R:'R',G:'G',B:'B',P:'P'};
  for(const i in progress){ const l=LEVELS[i]; if(!l) continue; Object.keys(l.inv).forEach(q=>k.add(q)); for(const row of l.map) for(const c of row) if(mp[c]) k.add(mp[c]); }
  return [...k]; }
function requestPuzzle(n,cb){
  const seed=(Date.now()^(n*2654435761))>>>0;
  const allow=knownPieces(); const done=d=>cb(d||DAILY_EASY[(n*37+seed)%DAILY_EASY.length]); done.seed=seed; done.n=n; done.allow=allow;   // never leave the player waiting on a failure
  if(genWorker){ const id=++genReqId; genWaiting[id]=done; genWorker.postMessage({id,seed,n,allow}); } else fallbackGen(seed,n,done,allow);
}
function prefetch(n){ prefetched={n,def:null}; const p=prefetched; requestPuzzle(n,d=>{ p.def=d; }); }
function startEndless(){
  mode='endless'; const n=endless.n; endlessCur=n; genPending=true; won=false; replaying=false; variant=n%3; applyTheme(THEME_ORDER[Math.floor((n-1)/4)%7]); Music.setTrack(Math.floor((n-1)/4)%2);
  const go=d=>{ if(mode!=='endless'||endlessCur!==n) return; genPending=false; setup(d); prefetch(n+1); };
  if(prefetched&&prefetched.n===n&&prefetched.def){ const d=prefetched.def; prefetched=null; go(d); return; }
  // show the empty board state while the next puzzle is being made
  closeMenu(); $('win').hidden=true; showGameUI(true); $('ltag').textContent=S.endlessTag; $('lname').textContent=S.endlessNo(n); $('hint').hidden=false; $('hint').textContent=S.endlessGen;
  if(prefetched&&prefetched.n===n){ const p=prefetched; const wait=()=>{ if(p.def){ prefetched=null; go(p.def); } else setTimeout(wait,60); }; wait(); return; }
  requestPuzzle(n,go);
}

// ---------- v10: beam skins earned with stars ----------
const SKINS=[{need:0},{need:9},{need:30},{need:55},{need:90},{need:18},{need:42},{need:70},{need:120}];   // classic, neon, rainbow, stardust, plasma, gold, ice, fire, aurora (v27: denser ladder)
const SKIN_ORDER=SKINS.map((s,i)=>i).sort((a,b)=>SKINS[a].need-SKINS[b].need);
const SKIN_IDS=['classic','neon','rainbow','stardust','plasma','gold','ice','fire','aurora'];
function skinOpen(i){ return starCount()>=SKINS[i].need; }
function curSkin(){ const i=settings.skin|0; return (i>=0&&i<SKINS.length&&skinOpen(i))?i:0; }
function nextSkin(){ const s=starCount(); for(const i of SKIN_ORDER) if(SKINS[i].need>s) return i; return -1; }
function prevNeed(n){ let lo=0; for(const s of SKINS) if(s.need<=n&&s.need>lo) lo=s.need; return lo; }
function buildSkins(){
  const w=$('skins'); if(!w) return; w.innerHTML=''; const cur=curSkin();
  SKIN_ORDER.forEach(i=>{ const sk=SKINS[i]; const b=document.createElement('button'); const open=skinOpen(i);
    b.className='skin'+(i===cur?' sel':'')+(open?'':' locked'); b.disabled=!open; b.setAttribute('aria-pressed',i===cur);
    b.innerHTML='<i class="sw sw'+i+'"></i><span></span><small></small>';
    b.querySelector('span').textContent=S.skinNames[i]; b.querySelector('small').textContent=open?'':S.skinLock(sk.need);
    b.onclick=()=>{ settings.skin=i; saveSettings(); Sfx.click(); buildSkins(); }; w.appendChild(b); });
}
// called after stars changed: equips a newly earned beam and tells the player
function checkSkinUnlock(before){
  const after=starCount(); let got=-1; SKINS.forEach((sk,i)=>{ if(i>0&&before<sk.need&&after>=sk.need) got=i; });
  if(got>0){ settings.skin=got; saveSettings(); Poki.measure('beam',SKIN_IDS[got],'unlock'); return S.skinNew(S.skinNames[got]); } return '';
}

// ---------- v10: hold / drag a piece to see the beam before letting go (mouse: hover preview) ----------
let drag=null, previewTrc=null, previewKey='', downCell=null;
function validDrop(x,y){ return L&&x>0&&y>0&&x<L.w&&y<L.h&&L.grid[y][x]==='.'&&!pieces[x+','+y]; }
function canPlay(){ return !!L&&!!D&&mode!=='edit'&&!won&&!busy&&!replaying&&!genPending&&!Poki.inAd&&$('menu').hidden&&$('share').hidden; }
function setPreview(kind,cell){
  const key=cell&&kind?kind+'@'+cell.join(','):'';
  if(key===previewKey) return; previewKey=key;
  if(!key){ previewTrc=null; return; }
  const p=Object.assign({},pieces); p[cell.join(',')]={t:trayType(kind)}; previewTrc=trace(L,p);
}
function clearPreview(){ previewKey=''; previewTrc=null; }
function placeAt(x,y,kind){
  if(!canPlay()||!validDrop(x,y)||!kind||left(kind)<=0) return false;
  { const gt=guideCellTarget(); if(gt&&gt.k!==x+','+y&&!pieces[gt.k]&&KIND(gt.t)===kind){ const [gx,gy]=gt.k.split(',').map(Number); if(guideMode==='all'||Math.max(Math.abs(gx-x),Math.abs(gy-y))<=1){ x=gx; y=gy; } } } // v25: guided magnet
  Poki.start(); act(); pushHist(); sel=kind;
  pieces[x+','+y]={t:trayType(kind),born:performance.now()}; used[kind]++; taps++; updateTaps(); Sfx.place();
  if(left(sel)<=0){ const alt=Object.keys(L.inv).find(q=>left(q)>0); if(alt) sel=alt; }
  clearPreview(); retrace(); buildTray(); return true;
}
function pickKind(){ if(!L) return null; if(sel&&left(sel)>0) return sel; return Object.keys(L.inv).find(q=>left(q)>0)||null; }
cv.addEventListener('pointerdown',e=>{
  if(e.button>0) return; const [x,y]=cellFromEvent(e); downCell=[x,y];
  if(mode!=='edit'&&canPlay()&&validDrop(x,y)){ const k=pickKind(); if(k){ drag={kind:k,cell:[x,y],fromTray:false,id:e.pointerId}; setPreview(k,[x,y]); try{ cv.setPointerCapture(e.pointerId); }catch(err){} } }
});
cv.addEventListener('pointermove',e=>{
  const c=cellFromEvent(e);
  if(e.pointerType==='mouse') hover=c;
  if(drag&&!drag.fromTray){ drag.cell=validDrop(c[0],c[1])?c:null; setPreview(drag.kind,drag.cell); return; }
  if(!drag&&e.pointerType==='mouse'&&e.buttons===0&&canPlay()&&mode!=='edit'){ const k=pickKind(); setPreview(k,validDrop(c[0],c[1])?c:null); }
});
cv.addEventListener('pointerleave',()=>{ hover=null; if(!drag) clearPreview(); });
cv.addEventListener('pointercancel',()=>{ drag=null; clearPreview(); });
cv.addEventListener('pointerup',e=>{
  const [x,y]=cellFromEvent(e);
  if(drag&&!drag.fromTray){ const d=drag; drag=null; if(d.cell) placeAt(d.cell[0],d.cell[1],d.kind); else clearPreview(); return; }
  if(downCell&&downCell[0]===x&&downCell[1]===y) tap(x,y);   // plain tap: rotate / remove / edit
  downCell=null;
});
// dragging straight from the tray onto the board
$('tray').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.piece'); if(!b||b.disabled||!canPlay()) return; const k=b.id.replace('piece-','');
  if(left(k)<=0) return; drag={kind:k,cell:null,fromTray:true,id:e.pointerId,moved:false};
});
addEventListener('pointermove',e=>{
  if(!drag||!drag.fromTray||e.pointerId!==drag.id) return; drag.moved=true;
  const r=cv.getBoundingClientRect(); const inside=e.clientX>=r.left&&e.clientX<r.right&&e.clientY>=r.top&&e.clientY<r.bottom;
  const c=inside?cellFromEvent(e):null; drag.cell=c&&validDrop(c[0],c[1])?c:null; setPreview(drag.kind,drag.cell);
  if(drag.cell){ sel=drag.kind; }
});
addEventListener('pointerup',e=>{
  if(!drag||!drag.fromTray||e.pointerId!==drag.id) return; const d=drag; drag=null;
  if(d.cell) placeAt(d.cell[0],d.cell[1],d.kind); else clearPreview();
});
addEventListener('pointercancel',()=>{ if(drag&&drag.fromTray){ drag=null; clearPreview(); } });

// ---------- boot ----------
applyLang(); sizeFx(); applyTheme('lab');
Poki.init().then(()=>{
  const shared=decodeLevel(Poki.param('lvl')||((location.hash||'').startsWith('#L')?location.hash:''));
  if(shared) startCustom(shared,false); else startLevel(firstOpen());

  Poki.measure('session','first-input','visible'); vMeasure('load');
  (()=>{ const today=dayNum(todayKey()), last=store.get('lichtbrekers-lastday',null); // v20: do players come back?
    if(typeof last==='number'&&last<=today){ const d=today-last; const tag=d===0?'sameday':d===1?'day1':d<=3?'day2-3':d<=7?'day4-7':'day8plus'; Poki.measure('session','return',tag); vMeasure('return'); if(d>=1) vMeasure('return-nextday'); }
    else Poki.measure('session','new','visit');
    store.set('lichtbrekers-lastday',today); })();
  requestAnimationFrame(frame);
  Poki.loaded(); // gameplayStart follows on the player's first input
});
})();
