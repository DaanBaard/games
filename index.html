<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daan's Games</title>
<meta name="description" content="Browsergames van Daan — speel direct, geen installatie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1916;
    --line: #2e2a25;
    --ink: #f3ece2;
    --muted: #a39a8e;
    --accent: #ffb636;
    --accent-ink: #1a1305;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(circle at 1px 1px, #ffffff0d 1px, transparent 0);
    background-size: 22px 22px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header { padding: 56px 0 28px; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: clamp(42px, 8vw, 84px); font-weight: 800; line-height: .95; margin: 10px 0 14px; letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); font-size: 18px; max-width: 46ch; margin: 0; }

  .grid {
    display: grid; gap: 18px; padding: 12px 0 64px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .thumb {
    aspect-ratio: 16 / 10; background: #000 center / cover no-repeat;
    display: grid; place-items: center; position: relative;
  }
  .thumb .initial { font-size: 72px; font-weight: 800; color: #ffffffd9; text-shadow: 0 4px 0 #0004; }
  .play {
    position: absolute; right: 12px; bottom: 12px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 3px 0 #0006;
  }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .title { font-size: 21px; font-weight: 700; margin: 0; }
  .ver { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .desc { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.4; }
  .meta { margin-top: auto; padding-top: 8px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: #776f64; }

  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 20px;
    text-align: center; color: var(--muted);
  }
  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: #776f64; font-size: 13px; }

  /* Layout: games links, bezoekersteller rechts */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
  .layout .grid { padding-top: 0; }
  .counter {
    position: sticky; top: 20px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 20px 20px; text-align: center; overflow: hidden;
  }
  .counter::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--accent);
  }
  .counter .label {
    font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  .digits { display: flex; justify-content: center; gap: 5px; }
  .digit {
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 38px; line-height: 1;
    width: 1.05em; padding: 12px 0 10px; border-radius: 8px; color: var(--ink);
    background: linear-gradient(#0b0a09 0 50%, #151310 50% 100%);
    box-shadow: inset 0 0 0 1px #ffffff12, 0 3px 0 #0008; position: relative;
  }
  .digit::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #0009; }
  .counter .sub { margin-top: 14px; color: var(--muted); font-size: 14px; }
  .counter.loading .digit { color: #5a534a; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .counter { position: relative; top: 0; order: -1; }
    .digit { font-size: 36px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Arcade · speel in je browser</div>
      <h1>Daan's <span>Games</span></h1>
      <p class="lede">Zelfgebouwde browsergames. Klik en speel — geen installatie nodig.</p>
    </header>
    <div class="layout">
      <main id="grid" class="grid" aria-live="polite"></main>
      <aside class="counter loading" id="counter" aria-label="Aantal bezoekers">
        <div class="label">Bezoekers</div>
        <div class="digits" id="digits"><span class="digit">0</span><span class="digit">0</span><span class="digit">0</span><span class="digit">0</span><span class="digit">0</span></div>
        <div class="sub" id="counter-sub">laden…</div>
      </aside>
    </div>
    <footer>Nieuwe versies verschijnen hier automatisch.</footer>
  </div>
<script>
  const hues = [12, 38, 150, 200, 265, 320];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = d => { try { return new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };

  // Bezoekersteller: telt elke browser één keer (unieke bezoekers) via de gratis Abacus-API.
  (function visitorCounter() {
    const API = "https://abacus.jasoncameron.dev";
    const NS = "daanbaard-games", KEY = "visitors", FLAG = "dg-counted";
    const box = document.getElementById("counter");
    const digits = document.getElementById("digits");
    const render = n => {
      const s = String(n).padStart(5, "0");
      digits.innerHTML = [...s].map(c => `<span class="digit">${c}</span>`).join("");
      box.setAttribute("aria-label", `${n} bezoekers`);
    };
    const animate = target => {
      const start = performance.now(), dur = 1200;
      const step = t => {
        const p = Math.min(1, (t - start) / dur);
        render(Math.round(target * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    let counted = false;
    try { counted = localStorage.getItem(FLAG) === "1"; } catch {}
    const url = `${API}/${counted ? "get" : "hit"}/${NS}/${KEY}`;
    fetch(url)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => {
        if (!counted) { try { localStorage.setItem(FLAG, "1"); } catch {} }
        box.classList.remove("loading");
        animate(Number(d.value) || 0);
        document.getElementById("counter-sub").textContent = counted ? "bezoekers tot nu toe" : "jij bent nummer " + d.value + "!";
      })
      .catch(() => {
        box.classList.remove("loading");
        digits.innerHTML = '<span class="digit">–</span>';
        document.getElementById("counter-sub").textContent = "teller even niet bereikbaar";
      });
  })();

  fetch("games.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(games => {
      const grid = document.getElementById("grid");
      if (!games.length) {
        grid.innerHTML = '<div class="empty">Nog geen games gepubliceerd. De eerste komt eraan.</div>';
        return;
      }
      grid.innerHTML = games.map((g, i) => {
        const h = hues[[...g.slug].reduce((a, c) => a + c.charCodeAt(0), 0) % hues.length];
        const bg = g.thumbnail
          ? `background-image:url('${esc(g.thumbnail)}')`
          : `background-image:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h + 40) % 360} 70% 25%))`;
        return `
          <a class="card" href="${esc(g.slug)}/">
            <div class="thumb" style="${bg}">
              ${g.thumbnail ? "" : `<span class="initial">${esc(g.title[0] || "?")}</span>`}
              <span class="play">▶ Speel</span>
            </div>
            <div class="body">
              <div class="row"><h2 class="title">${esc(g.title)}</h2>${g.version ? `<span class="ver">v${esc(g.version)}</span>` : ""}</div>
              ${g.description ? `<p class="desc">${esc(g.description)}</p>` : ""}
              ${g.updated ? `<div class="meta">bijgewerkt ${fmt(g.updated)}</div>` : ""}
            </div>
          </a>`;
      }).join("");
    });
</script>
</body>
</html>
