<!doctype html>
<!-- Horrorz v1.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Horrorz</title>
<script>
/* Poki SDK alleen laden buiten de eigen gamesite (github.io): daar meldt de SDK "unauthorized hosting". */
window.__pokiReady=new Promise(function(res){
  if(/(^|\.)github\.io$/i.test(location.hostname)||/[?&](thumb|test)=1/.test(location.search)){res(false);return}
  var s=document.createElement('script');s.src='https://game-cdn.poki.com/scripts/v2/poki-sdk.js';
  s.onload=function(){res(true)};s.onerror=function(){res(false)};setTimeout(function(){res(false)},8000);
  document.head.appendChild(s);
});
</script>
<style>
:root{--ink:#f4efff;--panel:#1b142d;--panel2:#291f44;--edge:#4a3a7c;--pump:#ff8a2a;--pumpD:#b9520c;--mint:#5ef2c2;--mintD:#1f9c79;--pink:#ff5d8f;--gold:#ffcf3a;--muted:#a99cc9;--rare:#4fc3ff;--epic:#c56bff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07050d;color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
.dim{background:rgba(6,3,16,.74)}
h2{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-weight:900;letter-spacing:1px}
.ctitle{font-size:clamp(26px,5vw,44px);color:#fff;text-shadow:0 0 18px rgba(150,110,255,.8),0 4px 0 #3b2470;text-align:center}

.btn{font-weight:900;border:none;border-radius:14px;padding:11px 22px;font-size:19px;cursor:pointer;color:#2a1405;background:linear-gradient(#ffb25e,var(--pump));box-shadow:0 5px 0 var(--pumpD),0 8px 18px rgba(0,0,0,.4);position:relative;white-space:nowrap;letter-spacing:.4px;transition:transform .07s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pumpD)}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn.mint{background:linear-gradient(#a3fbe2,var(--mint));box-shadow:0 5px 0 var(--mintD),0 8px 18px rgba(0,0,0,.4);color:#06332a}
.btn.mint:active{box-shadow:0 2px 0 var(--mintD)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 #0f0a1d,0 8px 18px rgba(0,0,0,.3)}
.btn.ghost:active{box-shadow:0 2px 0 #0f0a1d}
.btn.big{font-size:clamp(24px,4.4vw,32px);padding:13px 58px;border-radius:18px}
.btn.small{font-size:15px;padding:8px 14px;border-radius:11px}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:default;transform:none}
.btn .ad{display:inline-block;margin-left:7px;font-size:.72em;vertical-align:2px;background:rgba(0,0,0,.22);border-radius:6px;padding:2px 6px}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ic{width:1.3em;height:1.3em;vertical-align:-.28em;image-rendering:auto}

.hb{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,12,38,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.hb:active{transform:scale(.92)}
#hudBtns{position:fixed;top:10px;right:10px;display:none;gap:8px;z-index:4}
#hudBtns.on{display:flex}
.pz{display:block;width:14px;height:16px;border-left:5px solid #fff;border-right:5px solid #fff}
.snd{display:block;width:22px;height:22px;position:relative}
.gear{display:block;width:20px;height:20px;border-radius:50%;border:5px dotted #fff;position:relative}
.gear::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}

/* logo */
.logo{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-weight:900;font-size:clamp(46px,11vw,104px);line-height:1;display:flex;gap:.03em;letter-spacing:.01em;filter:drop-shadow(0 0 22px rgba(140,90,255,.55))}
.logo span{display:inline-block;color:#f3ecff;text-shadow:0 .06em 0 #3d2575,0 .1em 0 #22133f;position:relative;animation:bob 3.2s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:-.6s}
.logo span:nth-child(3n){animation-delay:-1.3s}
.logo span.o{color:var(--pump);text-shadow:0 .06em 0 #8a3a05,0 .1em 0 #4c1f02,0 0 .3em rgba(255,140,40,.6)}
.logo span.o::before,.logo span.o::after{content:"";position:absolute;top:37%;width:.12em;height:.16em;border-radius:50%;background:#fff1b8;box-shadow:0 0 .12em #ffd23f;animation:blink 4s infinite}
.logo span.o::before{left:30%}.logo span.o::after{right:30%}
.logo span.d::after{content:"";position:absolute;left:38%;top:86%;width:.12em;height:.2em;border-radius:0 0 .08em .08em;background:#f3ecff;animation:drip 2.6s ease-in infinite}
.logo span.z{color:var(--mint);text-shadow:0 .06em 0 #106450,0 .1em 0 #083a2e}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.06em) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drip{0%{height:.06em;opacity:1}70%{height:.24em;opacity:1}100%{height:.28em;opacity:0}}
#load .logo{font-size:clamp(40px,9vw,80px)}
.lbar{width:min(300px,70vw);height:12px;border-radius:8px;background:#1d1433;overflow:hidden;border:2px solid #3a2c63}
#lfill{height:100%;width:10%;background:linear-gradient(90deg,var(--pump),var(--gold));transition:width .3s}

/* home */
#home{flex-direction:column;align-items:center;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,12,38,.75);border:2px solid rgba(255,255,255,.14);border-radius:30px;padding:6px 14px;font-weight:900;font-size:20px;margin-right:2px}
.homeMain{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vh,14px)}
.chapSel{display:flex;align-items:center;gap:8px}
.arrow{width:46px;height:56px;border-radius:14px;border:none;background:rgba(30,20,56,.8);font-size:40px;font-weight:900;line-height:1;cursor:pointer;color:#fff}
.arrow:disabled{opacity:.25}
.chapCard{width:min(330px,62vw);background:rgba(25,17,46,.82);border:2px solid var(--edge);border-radius:18px;padding:9px 14px;text-align:center;backdrop-filter:blur(2px)}
.chapCard .cn{font-size:13px;color:var(--muted);font-weight:900;letter-spacing:2px;text-transform:uppercase}
.chapCard .cname{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(19px,3.4vw,25px);font-weight:900}
.chapCard .cinfo{font-size:14px;color:#d8cff3;margin-top:2px;min-height:18px}
.chapCard.locked{opacity:.7}
.chapCard .crown{color:var(--gold);font-weight:900}
.nav{display:flex;gap:clamp(6px,1.4vw,14px);flex-wrap:wrap;justify-content:center}
.nb{position:relative;width:min(76px,calc((100vw - 64px)/6));display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(25,17,46,.82);border:2px solid var(--edge);border-radius:16px;padding:7px 4px 6px;cursor:pointer;font-size:11px;font-weight:900;color:#e8e0ff}
.nb img{width:34px;height:34px}
.nb:active{transform:scale(.94)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #1b142d;animation:pulse 1.2s infinite}
.ver{position:fixed;left:8px;bottom:4px;font-size:11px;color:rgba(255,255,255,.35)}

/* panel */
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:22px;width:min(600px,95vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel2);border-bottom:2px solid var(--edge)}
.ph h2{font-size:22px}
.x{width:38px;height:38px;border-radius:12px;border:none;background:#3a2c5f;font-size:18px;cursor:pointer;font-weight:900}
.pb{padding:12px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border-radius:14px;margin-bottom:8px}
.row .ri{width:46px;height:46px;flex:none}
.row .rt{flex:1;min-width:0}
.row .rn{font-weight:900;font-size:16px}
.row .rd{font-size:13px;color:var(--muted)}
.row.done{opacity:.55}
.pips{display:flex;gap:4px;margin-top:4px}
.pip{width:14px;height:6px;border-radius:3px;background:#3d3062}
.pip.on{background:var(--mint)}
.pip.new{background:var(--gold);animation:pulse .8s infinite}
.bar{height:10px;border-radius:6px;background:#3d3062;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#b8ffe9)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;font-size:13px}
.tile.sel{border-color:var(--mint);box-shadow:0 0 14px rgba(94,242,194,.35)}
.tile canvas,.tile img{width:84px;height:84px}
.tile .tn{font-weight:900;font-size:14px}
.tile .ts{font-size:12px;color:var(--muted);min-height:15px}
.tile.lock canvas,.tile.lock>img{filter:brightness(.35) grayscale(.6)}
.tile .ts img{width:1.2em;height:1.2em;vertical-align:-.25em}
.sec{font-weight:900;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;margin:12px 4px 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{background:var(--panel2);border-radius:12px;padding:6px 2px;text-align:center;font-size:11px;font-weight:900;border:2px solid transparent}
.day img{width:30px;height:30px;display:block;margin:2px auto}
.day.got{opacity:.45}
.day.now{border-color:var(--gold);box-shadow:0 0 14px rgba(255,207,58,.4)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs .btn.sel{outline:3px solid var(--mint)}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

/* cards */
.cards{display:flex;gap:clamp(8px,2vw,16px);justify-content:center;align-items:stretch;flex-wrap:nowrap;max-width:100%}
.card{width:clamp(104px,27vw,210px);background:linear-gradient(#251b40,#1a1330);border:3px solid #8fa0c8;border-radius:18px;padding:clamp(8px,1.6vw,14px);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) backwards;position:relative}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover{transform:translateY(-6px)}
.card:active{transform:scale(.96)}
.card img{width:clamp(52px,10vw,86px);height:clamp(52px,10vw,86px)}
.card .cr{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#a9b6d6}
.card .cnm{font-weight:900;font-size:clamp(14px,2.2vw,19px);line-height:1.1}
.card .cd{font-size:clamp(11px,1.6vw,14px);color:#d4cbef;line-height:1.25}
.card .ck{position:absolute;top:6px;left:9px;font-size:12px;color:rgba(255,255,255,.35);font-weight:900}
.card.r1{border-color:var(--rare);box-shadow:0 0 20px rgba(79,195,255,.35)}
.card.r1 .cr{color:var(--rare)}
.card.r2{border-color:var(--epic);box-shadow:0 0 28px rgba(197,107,255,.55);background:linear-gradient(#34205a,#1d1236)}
.card.r2 .cr{color:var(--epic)}
.card.r2::after{content:"";position:absolute;inset:-3px;border-radius:18px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:250% 100%;animation:shine 2s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes cardIn{from{transform:translateY(40px) rotateY(80deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.crow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.build{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.bi{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:10px;padding:4px 8px 4px 4px;font-size:13px;font-weight:900}
.bi img{width:28px;height:28px}

/* results */
.result{text-align:center;padding:16px 16px 18px;gap:8px;align-items:center;overflow-y:auto;touch-action:pan-y}
.result .btn.big{padding:11px 44px;font-size:clamp(22px,3.6vw,28px)}
.result h2{font-size:clamp(28px,5vw,40px);text-shadow:0 0 18px rgba(150,110,255,.7)}
.result .sub{color:var(--muted);font-weight:900;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.result .big{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(30px,6vw,46px);font-weight:900}
.result .near{color:var(--gold);font-weight:900;font-size:16px}
.result .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result .st{background:var(--panel2);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--muted)}
.result .st b{display:block;color:#fff;font-size:18px}
.result .earn{font-size:28px;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px}
.result .goal{width:100%;max-width:380px;font-size:13px;color:#d8cff3}
.result .rec{color:var(--mint);font-weight:900;animation:pulse 1s infinite}
.result .btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:4px;width:100%}
.result .crow .btn{min-width:150px}

#toasts{position:fixed;top:64px;right:12px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:10px;background:rgba(27,20,45,.95);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 3.4s forwards}
.toast img{width:36px;height:36px}
.toast b{display:block;color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.toast span{font-weight:900}
@keyframes toast{0%{transform:translateX(120%);opacity:0}10%,85%{transform:none;opacity:1}100%{transform:translateX(120%);opacity:0}}
.spinner{width:48px;height:48px;border-radius:50%;border:6px solid rgba(255,255,255,.15);border-top-color:var(--pump);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-height:430px){
  .logo{font-size:clamp(34px,8vh,64px)}
  .btn.big{padding:9px 44px;font-size:24px}
  .nb{padding:4px 3px;font-size:10px}.nb img{width:26px;height:26px}
  .chapCard{padding:5px 10px}.arrow{height:44px}
  .card{padding:6px}.card .cd{font-size:11px}
  .result{padding:8px 12px;gap:4px;width:min(760px,96vw)}.result h2{font-size:24px}.result .big{font-size:22px}.result .earn{font-size:20px}.result .sub{font-size:11px}
  .result .st{padding:3px 10px}.result .st b{font-size:15px}.result .near,.result .rec{font-size:13px}.result .goal{font-size:11px}
  .result .btns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}.result .crow .btn{min-width:0}.result .btn.big{padding:8px 26px;font-size:20px}
  .nb span{font-size:9px}
}

.thumb .topbar,.thumb .chapSel,.thumb .playRow,.thumb #nightBtn,.thumb .nav,.thumb .ver,.thumb #hudBtns{display:none!important}
.thumb #home{justify-content:flex-start;padding-top:3%}
.thumb .logo{font-size:min(14vw,112px)}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudBtns"><button id="pauseBtn" class="hb" aria-label="pause"><span class="pz"></span></button><button id="muteBtn" class="hb" aria-label="sound"></button></div>

<div id="load" class="screen center on">
  <div class="logo" id="logoL"></div>
  <div class="lbar"><div id="lfill"></div></div>
</div>

<div id="home" class="screen">
  <div class="topbar">
    <button id="setBtn" class="hb" aria-label="settings"><span class="gear"></span></button>
    <div class="pill"><img class="ic" data-icon="candy" alt=""><span id="hCandy">0</span></div>
  </div>
  <div class="homeMain">
    <div class="logo" id="logo"></div>
    <div class="chapSel">
      <button class="arrow" id="chPrev" aria-label="previous">&#8249;</button>
      <div class="chapCard" id="chapCard"></div>
      <button class="arrow" id="chNext" aria-label="next">&#8250;</button>
    </div>
    <div class="playRow">
      <button class="btn big" id="playBtn"></button>
    </div>
    <button class="btn mint" id="nightBtn"></button>
  </div>
  <div class="nav" id="nav"></div>
  <div class="ver" id="ver"></div>
</div>

<div id="panel" class="screen center dim">
  <div class="panel">
    <div class="ph"><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="close">&#10005;</button></div>
    <div class="pb" id="pBody"></div>
  </div>
</div>

<div id="cards" class="screen center dim">
  <h2 class="ctitle" id="cTitle"></h2>
  <div class="cards" id="cardRow"></div>
  <div class="crow"><button class="btn ghost small" id="rerollBtn"></button><button class="btn ghost small" id="adRerollBtn"></button></div>
</div>

<div id="pause" class="screen center dim">
  <h2 class="ctitle" id="paTitle"></h2>
  <div class="build" id="pauseBuild"></div>
  <button class="btn big" id="resumeBtn"></button>
  <div class="crow"><button class="btn ghost small" id="sndToggle"></button><button class="btn ghost small" id="musToggle"></button></div>
  <button class="btn ghost small" id="quitBtn"></button>
</div>

<div id="over" class="screen center dim"><div class="panel result" id="overBox"></div></div>

<div id="adwait" class="screen center"><div class="spinner"></div></div>

<div id="toasts"></div>
<script>
'use strict';
const VERSION='1.0';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return d}
function wpick(list){let s=0;for(const e of list)s+=Math.max(0,e[1]);let r=Math.random()*s;for(const e of list){r-=Math.max(0,e[1]);if(r<=0)return e[0]}return list[list.length-1][0]}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function srng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const TEST=/[?&]test=1/.test(location.search), THUMB=/[?&]thumb=1/.test(location.search);

/* ---------- Poki SDK (with offline fallback) ---------- */
const SDK_STUB={init:()=>Promise.resolve(),gameLoadingFinished(){},gameplayStart(){},gameplayStop(){},commercialBreak:()=>Promise.resolve(),rewardedBreak:()=>new Promise(r=>setTimeout(()=>r(true),500))};
let SDK=window.PokiSDK||SDK_STUB;
let gpOn=false,inAd=false,adMuted=false;
function gpStart(){if(!gpOn){gpOn=true;try{SDK.gameplayStart()}catch(e){}}}
function gpStop(){if(gpOn){gpOn=false;try{SDK.gameplayStop()}catch(e){}}}
function measure(c,w,a){try{if(window.PokiSDK&&PokiSDK.measure)PokiSDK.measure(c,w,a)}catch(e){}}
function setAdMute(b){adMuted=b;applyVolume()}
function commercial(){gpStop();inAd=true;setAdMute(true);let p;try{p=SDK.commercialBreak(()=>setAdMute(true))}catch(e){p=null}
  return Promise.resolve(p).catch(()=>{}).then(()=>{inAd=false;setAdMute(false)})}

function mergeSave(dst,src){for(const k in src){const v=src[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k]))mergeSave(dst[k],v);else dst[k]=v}}

/* ---------- audio (all synthesised) ---------- */
let AC=null,master=null,sfxG=null,musG=null,noiseBuf=null,musDelay=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.connect(AC.destination);
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;comp.connect(master);
    sfxG=AC.createGain();sfxG.connect(comp);
    musG=AC.createGain();musG.connect(comp);
    musDelay=AC.createDelay(1);musDelay.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.32;const wet=AC.createGain();wet.gain.value=.35;
    musDelay.connect(fb);fb.connect(musDelay);musDelay.connect(wet);wet.connect(musG);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVolume();
  }catch(e){AC=null}
}
function applyVolume(){if(!AC)return;master.gain.value=adMuted?0:1;sfxG.gain.value=S.muted?0:.6;musG.gain.value=(S.muted||!S.music)?0:.3}
function osc(f,dur,type,vol,slide,t0,dest,delaySend){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(dest||sfxG);if(delaySend&&musDelay)g.connect(musDelay);o.start(t0);o.stop(t0+dur+.03)}
function tone(f,dur,type,vol,slide,delay){if(!AC||S.muted)return;osc(f,dur,type,vol,slide,AC.currentTime+(delay||0),sfxG)}
function noise(dur,vol,freq,ft,delay,dest){if(!AC||(S.muted&&dest!==musG))return;const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft||'lowpass';f.frequency.value=freq||1200;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t0);s.stop(t0+dur+.02)}
const lastSfx={};
function canPlay(k,ms){const n=performance.now();if(lastSfx[k]&&n-lastSfx[k]<ms)return false;lastSfx[k]=n;return true}
const ST=s=>Math.pow(2,s/12);
const SFX={
  pop(i){if(!canPlay('pop',25))return;const f=480*ST(Math.min(i||0,30)*.6);tone(f,.13,'triangle',.22,f*1.9);tone(f*2,.08,'sine',.1,f*3.2,.02);noise(.07,.1,3500,'highpass')},
  candy(i){if(!canPlay('candy',28))return;const f=990*ST([0,2,4,7,9,12,14,16,19,21,24][i%11]);tone(f,.1,'sine',.1,f*1.01)},
  soul(){if(!canPlay('soul',45))return;tone(1500,.05,'sine',.04,1900)},
  hurt(){tone(240,.28,'square',.14,80);noise(.22,.22,700)},
  dash(){noise(.16,.14,2000,'bandpass');tone(320,.12,'sine',.07,700)},
  level(){[0,4,7,12,16].forEach((s,i)=>tone(523*ST(s),.2,'triangle',.17,null,i*.06))},
  card(){tone(760,.06,'triangle',.1,980)},
  pick(){tone(660,.1,'triangle',.16,990);tone(990,.18,'sine',.12,1480,.06)},
  door(){tone(150,.45,'sawtooth',.05,110);noise(.4,.07,500)},
  clear(){[0,3,7,10,12,15].forEach((s,i)=>tone(392*ST(s),.25,'triangle',.13,null,i*.07))},
  boo(){if(!canPlay('boo',80))return;tone(420,.14,'square',.06,190)},
  shot(){if(!canPlay('shot',60))return;tone(300,.2,'sine',.07,150)},
  tele(){if(!canPlay('tele',90))return;tone(180,.45,'sine',.06,520)},
  fizz(){if(!canPlay('fizz',50))return;noise(.12,.08,5000,'highpass')},
  boss(){tone(90,1.3,'sawtooth',.13,45);tone(135,1.3,'triangle',.1,68);noise(1,.1,350)},
  bigpop(){tone(200,.6,'triangle',.26,900);noise(.6,.22,2200);[0,4,7,12,16,19].forEach((s,i)=>tone(523*ST(s),.3,'triangle',.13,null,.1+i*.07))},
  win(){[0,4,7,12,7,12,16,19,24].forEach((s,i)=>tone(392*ST(s),.32,'triangle',.15,null,i*.11))},
  jackpot(){[0,4,7,12,16,19,24,28].forEach((s,i)=>{tone(784*ST(s),.15,'square',.06,null,i*.045);tone(784*ST(s),.2,'sine',.08,null,i*.045)})},
  coin(){tone(1046,.08,'square',.08);tone(1568,.22,'square',.08,null,.07)},
  click(){tone(520,.05,'triangle',.08,720)},
  near(){if(!canPlay('near',150))return;tone(1400,.09,'sine',.07,2000)},
  combo(l){[0,4,7,11].slice(0,2+l).forEach((s,i)=>tone(659*ST(s+l*2),.14,'triangle',.12,null,i*.05))},
  chest(i){tone(330*ST(i*2),.08,'square',.06)},
  lose(){[7,3,0,-5].forEach((s,i)=>tone(330*ST(s),.35,'triangle',.13,null,i*.16))},
  strobe(){if(!canPlay('strobe',100))return;noise(.18,.1,6000,'highpass');tone(1800,.12,'sine',.05,900)},
};
/* music: small procedural spooky loop (A harmonic minor) */
const MUS={next:0,step:0,mode:'calm'};
const PROG=[[0,3,7],[-4,0,3],[5,8,12],[-5,-1,2]];
const n2f=s=>220*ST(s);
function musicTick(){
  if(!AC||S.muted||!S.music||adMuted||AC.state!=='running')return;
  const now=AC.currentTime;if(MUS.next<now-.3)MUS.next=now+.05;
  const fast=MUS.mode==='boss',sd=60/(fast?128:98)/4;
  while(MUS.next<now+.2){
    const st=MUS.step%64,bar=(st/16)|0,s=st%16,ch=PROG[bar],tt=MUS.next;
    if(s===0||s===10||(fast&&s%4===0))osc(n2f(ch[0]-24),sd*(fast?2.5:6),'triangle',.2,null,tt,musG);
    if(s%2===0){const idx=[0,1,2,1,0,2,1,2][s>>1];osc(n2f(ch[idx]+(s>=8?12:0)),sd*1.8,'sine',.075,null,tt,musG,true)}
    if((s===6||s===14)&&Math.random()<.45)osc(n2f(ch[2]+24),.5,'sine',.04,null,tt,musG,true);
    if(fast&&s%2===1)noise(.03,.035,7000,'highpass',tt-now,musG);
    if(fast&&s%8===4)noise(.09,.07,900,'lowpass',tt-now,musG);
    MUS.next+=sd;MUS.step++;
  }
}

/* ---------- meta helpers ---------- */
function skinOwned(sk){return S.skins.includes(sk.id)||(sk.tr&&S.trophies[sk.tr])}
function beamOwned(b){return S.beams.includes(b.id)||(b.tr&&S.trophies[b.tr])}
function beamCol(){const b=BEAMS.find(x=>x.id===S.beam)||BEAMS[0];return b.c}
function ensureDaily(){
  const k=todayKey();if(S.daily.day===k&&S.daily.list.length)return;
  const r=srng(hashStr('hz'+k));const pool=MPOOL.slice();const list=[];
  while(list.length<3&&pool.length){const m=pool.splice(Math.floor(r()*pool.length),1)[0];const ti=Math.floor(r()*m.n.length);list.push({id:m.id,n:m.n[ti],rw:m.rw[ti],p:0,c:false})}
  S.daily={day:k,list,bonus:false};save();
}
function mProg(id,v,mode){if(!S.daily.list)return;for(const m of S.daily.list){if(m.id!==id||m.c)continue;if(mode==='max')m.p=Math.max(m.p,v);else m.p+=v;if(m.p>=m.n&&!m.ready){m.ready=true;missionReadyFx(m)}}}
function missionsClaimable(){ensureDaily();let n=S.daily.list.filter(m=>m.p>=m.n&&!m.c).length;if(!S.daily.bonus&&S.daily.list.every(m=>m.c))n++;return n}
function giftReady(){return S.gift.last!==todayKey()}
function checkTrophies(){for(const tr of TROPHIES){if(!S.trophies[tr.id]&&tr.ok()){S.trophies[tr.id]=1;toast('trophy',t('trophyGet'),t('tr_'+tr.id));
  const sk=SKINS.find(s=>s.tr===tr.id);if(sk)setTimeout(()=>toast('sk_'+sk.id,t('newSkin'),t('sk_'+sk.id)),900);save()}}}

/* ---------- procedural art (everything is drawn in code) ---------- */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mix(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'rgb('+((A[0]+(B[0]-A[0])*t)|0)+','+((A[1]+(B[1]-A[1])*t)|0)+','+((A[2]+(B[2]-A[2])*t)|0)+')'}
function shade(h,a){return a<0?mix(h,'#000000',-a):mix(h,'#ffffff',a)}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);c.fill()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fill()}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x,y,x-s*.5,y-s*.05,x-s*.5,y+s*.32);c.bezierCurveTo(x-s*.5,y+s*.62,x-s*.1,y+s*.78,x,y+s*.95);c.bezierCurveTo(x+s*.1,y+s*.78,x+s*.5,y+s*.62,x+s*.5,y+s*.32);c.bezierCurveTo(x+s*.5,y-s*.05,x,y,x,y+s*.35);c.closePath()}

/* ---- Lumi, the hero ---- */
function drawLumi(c,x,y,aim,t,skinId,mv,s,flash){
  const sk=SKIN[skinId]||SKINS[0];s=s||1;
  c.save();c.translate(x,y);c.scale(s,s);
  const bob=mv?Math.abs(Math.sin(t*12))*2.2:Math.sin(t*3)*.7;
  ell(c,0,15,15,5.5,'rgba(0,0,0,.35)');
  const lp=mv?Math.sin(t*12)*3.5:0;
  ell(c,-6,12+lp*.4,4.5,4,'#241c33');ell(c,6,12-lp*.4,4.5,4,'#241c33');
  const ax=Math.cos(aim),ay=Math.sin(aim);
  const lamp=()=>{c.save();c.translate(ax*9,ay*5-1-bob);c.rotate(aim);
    c.fillStyle='#2f3346';rr(c,-2,-4.5,20,9,3.5);c.fill();c.fillStyle='#9aa0bb';rr(c,1,-3.2,14,2.6,1.3);c.fill();
    c.fillStyle='#454b64';rr(c,15,-6,5,12,2);c.fill();ell(c,20.5,0,2.4,5,'#fff8d0');c.restore();
    ell(c,ax*8,ay*5+1-bob,3.6,3.6,'#ffdcc2')};
  if(sk.id==='vamp'){c.fillStyle='#160f22';c.beginPath();c.moveTo(-12,-7-bob);c.lineTo(-17,14);c.quadraticCurveTo(0,18,17,14);c.lineTo(12,-7-bob);c.closePath();c.fill()}
  if(ay<-.2)lamp();
  c.translate(0,-bob);
  c.fillStyle=sk.coat;rr(c,-12,-7,24,21,9);c.fill();
  c.save();rr(c,-12,-7,24,21,9);c.clip();c.fillStyle=sk.trim;c.fillRect(-12,9,24,6);
  if(sk.id==='skelly'){c.strokeStyle=sk.trim;c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-7,-1+i*4);c.lineTo(7,-1+i*4);c.stroke()}c.beginPath();c.moveTo(0,-4);c.lineTo(0,9);c.stroke()}
  if(sk.id==='dino')ell(c,0,4,7,7,shade(sk.coat,.35));
  if(sk.id==='astro'){c.fillStyle='#9fb3d9';rr(c,-6,-2,12,8,2);c.fill();circ(c,-3,2,1.4,'#ff5d8f');circ(c,1,2,1.4,'#5ef2c2')}
  if(sk.id==='witch'){c.fillStyle='#ffcf3a';starPath(c,5,2,3.2);c.fill()}
  if(sk.id==='golden'){c.fillStyle='rgba(255,255,255,.5)';c.fillRect(-9,-5,3,12)}
  c.restore();
  if(sk.id!=='skelly'&&sk.id!=='astro'){circ(c,0,-1,1.6,sk.trim);circ(c,0,4,1.6,sk.trim)}
  if(sk.id==='vamp'){c.fillStyle=sk.trim;c.beginPath();c.moveTo(-10,-8);c.lineTo(-4,-3);c.lineTo(-11,-1);c.closePath();c.fill();c.beginPath();c.moveTo(10,-8);c.lineTo(4,-3);c.lineTo(11,-1);c.closePath();c.fill()}
  // head
  circ(c,0,-15,10.5,'#ffdcc2');
  const ex=ax*2.3,ey=ay*1.7;
  ell(c,-3.7+ex,-15+ey,1.8,2.4,'#231a33');ell(c,3.7+ex,-15+ey,1.8,2.4,'#231a33');
  circ(c,-3.2+ex,-15.8+ey,.6,'#fff');circ(c,4.2+ex,-15.8+ey,.6,'#fff');
  c.globalAlpha=.35;circ(c,-6.5,-11.5,2,'#ff7a9a');circ(c,6.5,-11.5,2,'#ff7a9a');c.globalAlpha=1;
  drawHat(c,sk,t);
  if(ay>=-.2)lamp();
  if(flash){c.globalAlpha=flash;c.fillStyle='#fff';rr(c,-13,-27,26,42,10);c.fill();c.globalAlpha=1}
  c.restore();
}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}c.closePath()}
function drawHat(c,sk,t){
  const hair='#5b3a2a';
  switch(sk.id){
    case 'lumi':
      c.fillStyle=sk.coat;c.beginPath();c.arc(0,-15,12.5,Math.PI*.82,Math.PI*2.18);c.arc(0,-16,9,Math.PI*2.1,Math.PI*.9,true);c.closePath();c.fill();
      c.fillStyle=hair;c.beginPath();c.arc(0,-17,8.6,Math.PI*1.05,Math.PI*1.95);c.quadraticCurveTo(2,-19,-1,-17.5);c.closePath();c.fill();break;
    case 'pumpkin':
      c.fillStyle=hair;c.beginPath();c.arc(0,-16,10.4,Math.PI,0);c.closePath();c.fill();
      ell(c,0,-26,10,7,'#ff8a2a');c.strokeStyle='#c4570f';c.lineWidth=1.5;c.beginPath();c.ellipse(0,-26,4,7,0,0,TAU);c.stroke();
      c.fillStyle='#4caf50';c.fillRect(-1.5,-35,3,5);break;
    case 'witch':
      c.fillStyle=hair;c.beginPath();c.arc(0,-16,10.4,Math.PI,0);c.closePath();c.fill();
      ell(c,0,-22,15,4,'#3b2272');c.fillStyle='#3b2272';c.beginPath();c.moveTo(-9,-22);c.quadraticCurveTo(-2,-34,6,-44);c.quadraticCurveTo(3,-32,9,-22);c.closePath();c.fill();
      c.fillStyle='#ffcf3a';c.fillRect(-8.5,-25,17,3);break;
    case 'dino':
      c.fillStyle=sk.coat;c.beginPath();c.arc(0,-15,12.5,Math.PI*.82,Math.PI*2.18);c.arc(0,-16,9,Math.PI*2.1,Math.PI*.9,true);c.closePath();c.fill();
      c.fillStyle='#ffe066';for(let i=-2;i<=2;i++){const a=-Math.PI/2+i*.42,x=Math.cos(a)*12.5,y=-15+Math.sin(a)*12.5;c.beginPath();c.moveTo(x-3*Math.sin(a),y+3*Math.cos(a));c.lineTo(x+Math.cos(a)*6,y+Math.sin(a)*6);c.lineTo(x+3*Math.sin(a),y-3*Math.cos(a));c.closePath();c.fill()}break;
    case 'astro':
      c.fillStyle=hair;c.beginPath();c.arc(0,-16,10.4,Math.PI,0);c.closePath();c.fill();
      c.strokeStyle='rgba(220,235,255,.9)';c.lineWidth=2.5;c.beginPath();c.arc(0,-15,14,0,TAU);c.stroke();
      c.fillStyle='rgba(180,220,255,.18)';c.beginPath();c.arc(0,-15,13,0,TAU);c.fill();
      c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=2;c.beginPath();c.arc(0,-15,10,-2.6,-1.9);c.stroke();break;
    case 'vamp':
      c.fillStyle='#171021';c.beginPath();c.arc(0,-16,10.6,Math.PI,0);c.lineTo(3,-20);c.lineTo(0,-16.5);c.lineTo(-3,-20);c.closePath();c.fill();break;
    case 'skelly':
      c.fillStyle=sk.coat;c.beginPath();c.arc(0,-15,12.5,Math.PI*.82,Math.PI*2.18);c.arc(0,-16,9,Math.PI*2.1,Math.PI*.9,true);c.closePath();c.fill();
      ell(c,0,-25.5,5,4,'#f1efe6');circ(c,-1.8,-26,1.1,'#2b2b3a');circ(c,1.8,-26,1.1,'#2b2b3a');break;
    case 'golden':
      c.fillStyle='#e6a800';c.beginPath();c.arc(0,-16,10.4,Math.PI,0);c.closePath();c.fill();
      c.fillStyle='#ffd84a';c.beginPath();c.moveTo(-8,-24);c.lineTo(-8,-31);c.lineTo(-4,-27);c.lineTo(0,-33);c.lineTo(4,-27);c.lineTo(8,-31);c.lineTo(8,-24);c.closePath();c.fill();
      circ(c,0,-27,1.4,'#ff5d8f');break;
    default:
      c.fillStyle=hair;c.beginPath();c.arc(0,-16,10.4,Math.PI,0);c.closePath();c.fill();
  }
}

/* ---- ghosts ---- */
function sheetPath(c,r,h,t,ph,n,sharp){
  c.beginPath();c.moveTo(-r,0);c.arc(0,0,r,Math.PI,0);c.lineTo(r,h);
  for(let i=0;i<n;i++){const x1=r-(i+.5)*(2*r/n),x2=r-(i+1)*(2*r/n),w=Math.sin(t*6+ph+i*1.7)*r*.12;
    if(sharp){c.lineTo(x1,h+r*.4+w);c.lineTo(x2,h)}else c.quadraticCurveTo(x1,h+r*.36+w,x2,h)}
  c.closePath()}
function wispPath(c,r,t,ph){const sw=Math.sin(t*4+ph)*r*.55;c.beginPath();c.moveTo(-r,0);c.arc(0,0,r,Math.PI,0);
  c.quadraticCurveTo(r*.95,r*1.05,sw,r*2.1);c.quadraticCurveTo(-r*.95,r*1.05,-r,0);c.closePath()}
function ghostShape(c,g,t){
  const r=g.r,lk=g.look||g.tp;
  if(lk==='wisp'||lk==='mini'||lk==='golden')wispPath(c,r,t,g.ph);
  else if(lk==='shade')sheetPath(c,r,r*.95,t,g.ph,6,true);
  else if(lk==='moaner')sheetPath(c,r,r*1.45,t,g.ph,4);
  else if(lk==='pumpkin')sheetPath(c,r*.82,r*.9,t,g.ph,4);
  else sheetPath(c,r,r*(g.boss?1.05:.95),t,g.ph,g.boss?6:4);
}
function ghostFeatures(c,g,t,F){
  const r=g.r,lk=g.look||g.tp,dark='#2a1d3d';
  // mouth
  if(lk!=='pumpkin'){
    if(F>.04||g.lit){ell(c,0,r*.36,r*.12*(1+F*.6),r*.17*(1+F*.9),dark)}
    else{c.strokeStyle=dark;c.lineWidth=Math.max(1.5,r*.08);c.lineCap='round';c.beginPath();c.arc(0,r*.22,r*.16,.2*Math.PI,.8*Math.PI);c.stroke()}
  }
  if(lk==='moaner'){ell(c,0,r*.5,r*.18,r*.34*(g.charging?1.3:1),g.charging?'#ffb347':dark)}
  if(lk==='peeker'){ell(c,-r*.5,r*.18,r*.2,r*.15,shade(g.col,-.08));ell(c,r*.5,r*.18,r*.2,r*.15,shade(g.col,-.08))}
  if(F>.4){c.fillStyle='rgba(150,210,255,.9)';c.beginPath();c.moveTo(r*.72,-r*.62);c.quadraticCurveTo(r*.92,-r*.3,r*.72,-r*.24);c.quadraticCurveTo(r*.52,-r*.3,r*.72,-r*.62);c.fill()}
  // boss accessories
  switch(lk){
    case 'butler':c.fillStyle='#3a2160';c.beginPath();c.moveTo(0,r*.72);c.lineTo(-r*.32,r*.56);c.lineTo(-r*.32,r*.9);c.closePath();c.fill();c.beginPath();c.moveTo(0,r*.72);c.lineTo(r*.32,r*.56);c.lineTo(r*.32,r*.9);c.closePath();c.fill();circ(c,0,r*.72,r*.07,'#5a3590');
      c.fillStyle='#4a3a5a';c.beginPath();c.moveTo(-r*.05,r*.16);c.quadraticCurveTo(-r*.35,r*.06,-r*.42,r*.24);c.quadraticCurveTo(-r*.2,r*.2,0,r*.22);c.quadraticCurveTo(r*.2,r*.2,r*.42,r*.24);c.quadraticCurveTo(r*.35,r*.06,r*.05,r*.16);c.fill();break;
    case 'mama':c.fillStyle='#ff6fa5';c.beginPath();c.ellipse(-r*.28,-r*.95,r*.3,r*.18,-.4,0,TAU);c.ellipse(r*.28,-r*.95,r*.3,r*.18,.4,0,TAU);c.fill();circ(c,0,-r*.92,r*.12,'#ff3d8a');break;
    case 'countess':case 'cog':case 'widow':{const col=lk==='cog'?'#c8a24a':lk==='widow'?'#cfe9ff':'#d9c2ff';c.fillStyle=col;
      if(lk==='widow'){c.beginPath();c.arc(0,-r*1.05,r*.32,Math.PI*.15,Math.PI*1.85);c.arc(r*.12,-r*1.05,r*.26,Math.PI*1.75,Math.PI*.25,true);c.fill();c.fillStyle='rgba(30,20,60,.35)';c.beginPath();c.arc(0,-r*.1,r*1.02,Math.PI*1.05,Math.PI*1.95);c.lineTo(r*.9,r*.2);c.quadraticCurveTo(0,-r*.2,-r*.9,r*.2);c.fill()}
      else if(lk==='cog'){c.save();c.translate(0,-r*.95);c.rotate(t);gearPath(c,r*.32,8);c.fill();circ(c,0,0,r*.1,'#6a5020');c.restore()}
      else{c.beginPath();c.moveTo(-r*.4,-r*.82);c.lineTo(-r*.4,-r*1.12);c.lineTo(-r*.2,-r*.95);c.lineTo(0,-r*1.2);c.lineTo(r*.2,-r*.95);c.lineTo(r*.4,-r*1.12);c.lineTo(r*.4,-r*.82);c.closePath();c.fill()}break}
    case 'mossy':c.fillStyle='rgba(80,170,90,.7)';ell(c,-r*.5,-r*.5,r*.25,r*.16,'rgba(80,170,90,.7)');ell(c,r*.4,r*.6,r*.3,r*.15,'rgba(80,170,90,.7)');ell(c,r*.1,-r*.85,r*.2,r*.12,'rgba(100,190,100,.8)');break;
    case 'grumble':c.fillStyle='#b9c0d6';c.beginPath();c.moveTo(-r*.45,r*.42);c.quadraticCurveTo(0,r*1.2,r*.45,r*.42);c.quadraticCurveTo(0,r*.62,-r*.45,r*.42);c.fill();
      c.strokeStyle='#59607a';c.lineWidth=r*.09;c.beginPath();c.moveTo(-r*.52,-r*.4);c.lineTo(-r*.14,-r*.3);c.moveTo(r*.52,-r*.4);c.lineTo(r*.14,-r*.3);c.stroke();break;
    case 'clock':circ(c,0,r*.62,r*.3,'#fff6dc');c.strokeStyle='#5a4a70';c.lineWidth=r*.05;c.beginPath();c.arc(0,r*.62,r*.3,0,TAU);c.stroke();
      c.beginPath();c.moveTo(0,r*.62);c.lineTo(Math.cos(t*2)*r*.22,r*.62+Math.sin(t*2)*r*.22);c.moveTo(0,r*.62);c.lineTo(Math.cos(t*.3)*r*.15,r*.62+Math.sin(t*.3)*r*.15);c.stroke();break;
    case 'lily':for(let i=0;i<5;i++){const a=i*TAU/5-Math.PI/2;ell(c,Math.cos(a)*r*.18,-r*.98+Math.sin(a)*r*.18,r*.14,r*.14,'#ff9ad5')}circ(c,0,-r*.98,r*.1,'#ffe066');break;
  }
}
function gearPath(c,r,n){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr2=i%2?r*.78:r;c.lineTo(Math.cos(a-.12)*rr2,Math.sin(a-.12)*rr2);c.lineTo(Math.cos(a+.12)*rr2,Math.sin(a+.12)*rr2)}c.closePath()}
function ghostScale(g){const F=clamp(g.fear/g.hp,0,1);return{F,sc:(1-F*(g.boss?.12:.32))*(g.spawnT>0?.4+.6*(1-g.spawnT/(g.spawnMax||.9)):1)}}
function drawGhostBody(c,g,t){
  const {F,sc}=ghostScale(g);const r=g.r,lk=g.look||g.tp;
  const bob=Math.sin(t*2.6+g.ph)*r*.12;
  const sh=g.lit?(Math.random()-.5)*r*.12:0;
  c.save();c.translate(g.x,g.y);
  ell(c,0,r*1.55,r*.8*sc,r*.25*sc,'rgba(0,0,0,'+(.22*g.alpha)+')');

function roomInfo(n){

function makeRoom(n,info,demo){
  const ch=CH[info.vis];
  const rm={n,...info,ch,furn:[],candles:[],doors:[],doorXs:info.pre?[ROOM_W/2]:[ROOM_W*.3,ROOM_W*.7],phase:'fight',waves:[],wave:0,waveDelay:1.1,waveClock:0,
    seed:(Math.random()*1e9)|0,golden:false,goldenT:rand(5,14),clearT:0,dark:ch.dark,windows:[],frames:[],bossSpawned:false,bossT:1.2,winT:-1};

  for(const x of[120,880,500]){if(rm.doorXs.some(d=>Math.abs(d-x)<90))continue;(r()<.5?rm.windows:rm.frames).push(x)}
  // furniture
  const want=info.type==='normal'?2+Math.floor(r()*3):1+Math.floor(r()*2);
  let tries=0;
  while(rm.furn.length<want&&tries++<80){
    const type=ch.furn[Math.floor(r()*ch.furn.length)],[w,h]=FURN[type];
    const x=60+r()*(ROOM_W-120-w),y=70+r()*(ROOM_H-140-h);
    const f={type,x,y,w,h,ph:r()*6};
    const cx=x+w/2,cy=y+h/2;
    if(Math.hypot(cx-ROOM_W/2,cy-(ROOM_H-50))<170)continue;
    if(info.type!=='normal'&&Math.hypot(cx-ROOM_W/2,cy-ROOM_H/2)<200)continue;
    if(rm.doorXs.some(d=>Math.abs(cx-d)<w/2+70)&&y<150)continue;
    if(rm.furn.some(o=>x<o.x+o.w+40&&x+w+40>o.x&&y<o.y+o.h+40&&y+h+40>o.y))continue;
    rm.furn.push(f);
  }
  for(const f of rm.furn){
    if(f.type==='candelabra'){rm.candles.push({x:f.x+f.w*.3,y:f.y+f.h*.45,ph:r()*6},{x:f.x+f.w*.7,y:f.y+f.h*.45,ph:r()*6})}
    else if(r()<.45&&['table','dresser','tomb','bench','trunk','crate','piano','bookcase'].includes(f.type))rm.candles.push({x:f.x+f.w*(.2+r()*.6),y:f.y+f.h*.4,ph:r()*6});
  }

/* ---------- player ---------- */
function moveInput(){let mx=0,my=0;
  if(KEY.KeyA||KEY.ArrowLeft||KEY.KeyQ)mx--;if(KEY.KeyD||KEY.ArrowRight)mx++;if(KEY.KeyW||KEY.ArrowUp||KEY.KeyZ)my--;if(KEY.KeyS||KEY.ArrowDown)my++;
  if(stick.on){mx=stick.dx;my=stick.dy}
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}return[mx,my,Math.min(1,m)]}
function doDash(){
  if(P.dashCd>0||P.dash>0)return;
  let [mx,my,m]=moveInput();if(m<.2){mx=Math.cos(P.aim);my=Math.sin(P.aim)}else{const k=Math.hypot(mx,my);mx/=k;my/=k}
  P.dash=.19;P.dashCd=P.dashCdMax;P.dvx=mx*P.speed*3.3;P.dvy=my*P.speed*3.3;P.inv=Math.max(P.inv,.28);
  R.dashes++;mProg('dash',1);SFX.dash();puff(P.x,P.y+8,10,'#bfb3ff',6);
}
function collideRect(o,f){
  const cx=clamp(o.x,f.x,f.x+f.w),cy=clamp(o.y,f.y+4,f.y+f.h);const dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
  if(d2>=o.r*o.r)return;
  if(d2>0){const d=Math.sqrt(d2);o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r}
  else{const l=o.x-f.x,r=f.x+f.w-o.x,u=o.y-f.y,b=f.y+f.h-o.y,m=Math.min(l,r,u,b);if(m===l)o.x=f.x-o.r;else if(m===r)o.x=f.x+f.w+o.r;else if(m===u)o.y=f.y-o.r;else o.y=f.y+f.h+o.r}
}
function updPlayer(dt){
  const [mx,my,m]=moveInput();
  P.mv=m>.1||P.dash>0;
  if(R&&R.tut===1&&m>.1){R.tutMoved+=dt;if(R.tutMoved>.7){R.tut=2}}
  const sug=(L('sugar')&&R.combo>=5)?1+.1*L('sugar'):1;
  if(P.dash>0){P.dash-=dt;P.x+=P.dvx*dt;P.y+=P.dvy*dt;
    if(L('salt')){P.saltT-=dt;if(P.saltT<=0){P.saltT=.025;HZ.push({k:'salt',x:P.x+rand(-6,6),y:P.y+8+rand(-4,4),t:0,dur:2.6,dps:(10+6*L('salt'))*P.pw})}}
    if(Math.random()<.6)FX.push({x:P.x,y:P.y,vx:0,vy:0,t:0,dur:.25,sz:14,col:'rgba(190,170,255,.35)',k:'ghostimg'});
  }else{const sp=P.speed*sug;const k=1-Math.exp(-16*dt);P.vx=lerp(P.vx,mx*sp,k);P.vy=lerp(P.vy,my*sp,k);P.x+=P.vx*dt;P.y+=P.vy*dt}
  for(const f of room.furn)collideRect(P,f);
  P.x=clamp(P.x,P.r,ROOM_W-P.r);
  let minY=P.r;
  if(room.phase==='clear')for(const d of room.doors)if(Math.abs(P.x-d.x)<40)minY=-40;
  P.y=clamp(P.y,minY,ROOM_H-P.r);
  P.dashCd-=dt;P.inv-=dt;P.t+=dt*(P.mv?1:.5);
  // aim
  let target=null;
  if(!touchMode&&performance.now()-mouse.last<2600){const w=screenToWorld(mouse.x,mouse.y);target=Math.atan2(w.y-P.y,w.x-P.x)}
  else{let best=null,bs=1e9;
    for(const g of G){if(g.dead||g.spawnT>0||(g.tp==='peeker'&&!g.lit&&dist2(g.x,g.y,P.x,P.y)>250*250))continue;
      const dx=g.x-P.x,dy=g.y-P.y,d=Math.hypot(dx,dy);if(d>P.beamLen*1.45)continue;
      const ad=Math.abs(angDiff(Math.atan2(dy,dx),P.aim));const sc=d*(1+ad*.55)-(g.boss?60:0)-(g.tp==='golden'?120:0)-(g.tele>0?80:0);if(sc<bs){bs=sc;best=g}}
    if(best)target=Math.atan2(best.y-P.y,best.x-P.x);else if(m>.1)target=Math.atan2(my,mx)}
  if(target!=null){const d=angDiff(target,P.aim),mt=(touchMode?8:11)*dt;P.aim+=clamp(d,-mt,mt)}
}
function hurtPlayer(){

  if(R.combo>=5)floatText(P.x,P.y-40,'x'+R.combo,'#a99cc9',18);R.combo=0;R.comboT=0;

/* ---------- light ---------- */
function getBeams(){
  const b=[{a:P.aim,len:P.beamLen,ang:P.beamAng,dps:P.dps,main:true}];
  if(L('twin'))b.push({a:P.aim+Math.PI,len:P.beamLen*(.5+.12*L('twin')),ang:P.beamAng*.8,dps:P.dps*(.45+.15*L('twin'))});
  if(L('prism')){const off=P.beamAng*2+.14;for(const s of[-1,1])b.push({a:P.aim+s*off,len:P.beamLen*.82,ang:P.beamAng*.6,dps:P.dps*(.35+.15*L('prism'))})}
  return b}
function inBeam(b,x,y,r){const dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy);if(d>b.len+r)return 0;if(d<r)return 1;
  const half=b.ang+Math.asin(Math.min(1,r/d));return Math.abs(angDiff(Math.atan2(dy,dx),b.a))<half?(1+.5*(1-Math.min(1,d/b.len))):0}
function auraR(){return L('aura')?52+14*L('aura'):0}
function applyLight(dt){
  const beams=getBeams();R.beams=beams;
  const sug=(L('sugar')&&R.combo>=5)?1+.12*L('sugar'):1;
  const ar=auraR(),ad=(4+3*L('aura'))*P.pw,fd=(8+4*L('fire'))*P.pw;
  for(const g of G){
    if(g.dead||g.spawnT>0)continue;
    let dmg=0,lit=false;
    for(const b of beams){const k=inBeam(b,g.x,g.y,g.r*.9);if(k){dmg+=b.dps*k;lit=true}}
    if(ar&&dist2(g.x,g.y,P.x,P.y)<(ar+g.r)*(ar+g.r)){dmg+=ad;lit=true}
    for(const f of FIREF)if(dist2(f.x,f.y,g.x,g.y)<(g.r+13)*(g.r+13)){dmg+=fd;lit=true}
    for(const h of HZ){if(h.k==='candle'){if(dist2(h.x,h.y,g.x,g.y)<(h.r+g.r)*(h.r+g.r)){dmg+=h.dps;lit=true}}
      else if(h.k==='salt'&&dist2(h.x,h.y,g.x,g.y)<(16+g.r)*(16+g.r)){dmg+=h.dps*.1;g.slowT=.35}}
    if(lit){g.litT=.12;if(!g.lit&&!g.seenLit&&L('jump')&&!g.boss){g.seenLit=true;hurtGhost(g,g.hp*.12*L('jump'));floatText(g.x,g.y-g.r-10,t('boo'),'#ffd23f',16);SFX.boo()}g.seenLit=true;g.lit=true}
    else{g.litT-=dt;if(g.litT<=0)g.lit=false;g.fear=Math.max(0,g.fear-g.hp*.035*dt)}
    if(dmg>0&&!g.dead)hurtGhost(g,dmg*dt*sug,true);
  }
  // light melts goo orbs
  for(const o of ORBS){if(o.dead)continue;for(const b of beams)if(inBeam(b,o.x,o.y,8)){o.hp-=dt*(b.main?1:.6);if(o.hp<=0){o.dead=true;sparks(o.x,o.y,'#b6ffcf',6,120);SFX.fizz()}break}}
}
function hurtGhost(g,a,cont){

  if(g.fear>=g.hp)popGhost(g);
}

/* ---------- ghosts AI ---------- */
function updGhost(g,dt){
  if(g.spawnT>0){g.spawnT-=dt;g.alpha=clamp(1-g.spawnT/g.spawnMax,0,1);if(g.spawnT<=0){g.alpha=1;if(!S.seen[g.tp]&&BOOK.includes(g.tp))S.seen[g.tp]=1}return}
  g.life+=dt;g.hitT-=dt;
  if(g.boss){updBoss(g,dt);return}
  const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
  let sp=g.spd;if(g.lit)sp*=Math.max(.25,1-.35-.15*L('chill'));if(g.slowT>0){g.slowT-=dt;sp*=.5}
  let tx=nx,ty=ny;
  const brave=room.phase==='fight'&&room.wave>=room.waves.length&&room.waveClock>22;
  if(brave)sp*=1.15;
  switch(g.tp){
    case 'flitter':{const s=Math.sin(g.life*5+g.ph)*1.3;tx=nx-ny*s;ty=ny+nx*s;break}
    case 'moaner':{if(brave){break}if(d<160){tx=-nx;ty=-ny}else if(d<245){const sd=(g.ph>3?1:-1);tx=-ny*sd;ty=nx*sd}

      if(Math.random()<.3)FX.push({x:g.x+rand(-8,8),y:g.y+rand(-8,8),vx:0,vy:-20,t:0,dur:.6,sz:3,col:'#ffe27a',k:'spark',glow:true});break}

}

function updBoss(g,dt){

    g.patT-=dt*enr;if(g.patT<=0){g.act={p:g.pats[g.pi++%g.pats.length],t:0,n:0};if(g.act.p==='charge'){g.ax=dx/d;g.ay=dy/d}SFX.tele()}

      case 'summon':if(a.t>.6&&a.n===0){a.n=1;const cnt=Math.min(3+Math.min(3,c),20-G.filter(o=>!o.dead).length);const pool=Object.keys(room.ch.pool).filter(k=>k!=='peeker');for(let i=0;i<cnt;i++){const an=i*TAU/cnt;spawnGhost(pick(pool),clamp(g.x+Math.cos(an)*90,40,ROOM_W-40),clamp(g.y+Math.sin(an)*90,40,ROOM_H-40),{spawnT:.7})}}if(a.t>1.1)g.act=null;break;
      case 'charge':if(a.t<.8){g.ax=lerp(g.ax,dx/d,.04);g.ay=lerp(g.ay,dy/d,.04);const l=Math.hypot(g.ax,g.ay)||1;g.ax/=l;g.ay/=l}else if(a.t<1.4){g.x+=g.ax*520*dt;g.y+=g.ay*520*dt;if(Math.random()<.5)puff(g.x,g.y,g.r,'#b9a6ff',1)}else g.act=null;break;
      case 'teleport':if(a.t<.45)g.alpha=1-a.t/.45*.9;else if(a.n===0){a.n=1;const an=rand(0,TAU),rd=rand(170,240);g.x=clamp(P.x+Math.cos(an)*rd,90,ROOM_W-90);g.y=clamp(P.y+Math.sin(an)*rd,90,ROOM_H-90);puff(g.x,g.y,g.r,'#8a5cff',12)}else{g.alpha=Math.min(1,.1+(a.t-.45)/.4);if(a.t>.9){g.alpha=1;g.act=null}}break;
    }

/* ---------- main update ---------- */
function update(dt){
  if(freezeT>0){freezeT-=dt;return}
  if(slowT>0){slowT-=dt;dt*=.35}
  gtime+=dt;R.time+=dt;
  updPlayer(dt);
  if(wantDash){wantDash=false;doDash()}
  // abilities
  if(L('strobe')){R.strobeT-=dt;if(R.strobeT<=0){R.strobeT=4.4-.55*L('strobe');const rad=150+22*L('strobe');BURSTS.push({x:P.x,y:P.y,r:rad,t:0,dur:.4,col:'255,250,220'});SFX.strobe();
    for(const g of G)if(!g.dead&&g.spawnT<=0&&dist2(g.x,g.y,P.x,P.y)<rad*rad)hurtGhost(g,(12+8*L('strobe'))*P.pw*Math.sqrt(hpMul())*(g.boss?.5:1))}}
  if(L('candle')){R.candleT-=dt;if(R.candleT<=0){R.candleT=6.5-1.2*L('candle');HZ.push({k:'candle',x:P.x,y:P.y+6,t:0,dur:7,r:70,dps:(7+4*L('candle'))*P.pw,ph:rand(0,6)})}}
  for(let i=0;i<FIREF.length;i++){const a=R.time*2.5+i*TAU/FIREF.length,rd=72+FIREF.length*4;FIREF[i].x=P.x+Math.cos(a)*rd;FIREF[i].y=P.y-4+Math.sin(a)*rd*.85}
  // spawning
  if(room.phase==='fight'){
    if(room.type==='normal'){
      const live=G.filter(g=>!g.dead&&g.tp!=='golden').length;
      if(room.wave<room.waves.length){
        if(room.wave===0){room.waveDelay-=dt;if(room.waveDelay<=0){spawnWave(room.waves[0]);room.wave=1;room.waveClock=0}}
        else{room.waveClock+=dt;const prev=room.waves[room.wave-1].length;if(live<=Math.max(1,Math.floor(prev*.3))||room.waveClock>13){spawnWave(room.waves[room.wave]);room.wave++;room.waveClock=0;
          if(R.room===1&&R.ch===0&&R.mode==='story'&&!R.dashHinted&&room.wave===3){R.dashHinted=true;hint={text:t('tutDash'),t:0,dur:4.5}}}}
      }
      if(!room.golden&&room.wave>0){room.goldenT-=dt;if(room.goldenT<=0){room.golden=true;if(Math.random()<.07+.03*L('lucky')+(R.room===3&&S.st.golden===0?.4:0))spawnGolden()}}
      if(room.wave>=room.waves.length&&live===0)roomCleared();
    }else{
      if(!room.bossSpawned){room.bossT-=dt;if(room.bossT<=0){room.bossSpawned=true;spawnBoss(room.type)}}
      else if(!G.some(g=>!g.dead&&g.tp!=='golden'))roomCleared();
    }
  }
  if(room.phase==='clear'){room.clearT+=dt;
    if(room.final&&room.clearT>2.2&&state==='run'){chapterWin();return}
    if(!room.final)for(const d of room.doors)if(Math.abs(P.x-d.x)<40&&P.y<-6&&!trans){enterDoor(d);break}
  }
  for(const g of G)updGhost(g,dt);
  applyLight(dt);
  // bombs (deferred so chains feel like ripples)
  for(const b of BOMBQ){b.t-=dt;if(b.t<=0&&!b.done){b.done=true;BURSTS.push({x:b.x,y:b.y,r:b.r,t:0,dur:.3,col:'255,170,210'});sparks(b.x,b.y,'#ff9ad5',6,200);
    for(const g of G)if(!g.dead&&g.spawnT<=0&&dist2(g.x,g.y,b.x,b.y)<(b.r+g.r)*(b.r+g.r))hurtGhost(g,g.boss?b.dmg*.4:b.dmg)}}
  BOMBQ=BOMBQ.filter(b=>!b.done);
  G=G.filter(g=>!g.dead);
  // orbs
  for(const o of ORBS){if(o.dead)continue;o.t+=dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.t>7||o.x<-30||o.x>ROOM_W+30||o.y<-30||o.y>ROOM_H+30){o.dead=true;continue}
    const d=Math.hypot(o.x-P.x,o.y-P.y);
    if(d<8+P.r*.7&&P.inv<=0&&P.dash<=0){o.dead=true;hurtPlayer();continue}
    if(d<8+P.r+18)o.near=true;else if(o.near&&d>8+P.r+34&&!o.nearDone){o.nearDone=true;if(state==='run'){floatText(P.x,P.y-36,t('close'),'#b6f3ff',15);R.comboT=Math.max(R.comboT,1.2);SFX.near()}}}
  ORBS=ORBS.filter(o=>!o.dead);
  // drops
  for(const d of DROPS){d.t+=dt;d.rot+=dt*3;
    if(!d.mag){d.x+=d.vx*dt;d.y+=d.vy*dt;const k=Math.exp(-3.2*dt);d.vx*=k;d.vy*=k;d.vz-=620*dt;d.z+=d.vz*dt;if(d.z<0){d.z=0;d.vz=-d.vz*.42}
      d.x=clamp(d.x,8,ROOM_W-8);d.y=clamp(d.y,8,ROOM_H-8);
      if(d.t>.35&&(room.phase==='clear'||dist2(d.x,d.y,P.x,P.y)<P.magnet*P.magnet||(d.kind==='soul'&&d.t>2.5)))d.mag=true}
    else{const dx=P.x-d.x,dy=P.y-d.y,dd=Math.hypot(dx,dy)||1;const sp=Math.min(900,240+d.t*500);d.x+=dx/dd*sp*dt;d.y+=dy/dd*sp*dt;d.z=Math.max(0,d.z-dt*60);
      if(dd<P.r+10){d.dead=true;collect(d)}}}
  DROPS=DROPS.filter(d=>!d.dead);
  // chest
  if(room.chest){const c=room.chest;c.t+=dt;if(!c.open&&dist2(c.x,c.y,P.x,P.y)<40*40){c.open=true;c.ot=0}
    if(c.open&&!c.done){c.ot+=dt;if(Math.floor(c.ot*10)!==Math.floor((c.ot-dt)*10))SFX.chest(Math.floor(c.ot*10));if(c.ot>.75){c.done=true;openChest(c)}}}

  for(const h of HZ)h.t+=dt;HZ=HZ.filter(h=>h.t<h.dur);

  for(const f of FX){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.grav)f.vy+=f.grav*dt;else{f.vx*=.94;f.vy*=.94}}FX=FX.filter(f=>f.t<f.dur);

  if(R.candyChainT>0){R.candyChainT-=dt;if(R.candyChainT<=0)R.candyChain=0}
  if(R.tut===3){R.tutT-=dt;if(R.tutT<=0)R.tut=4}
  updCam(dt);
  if(R.wantCards&&state==='run'&&!trans){R.wantCards=false;if(R.pendingCards>0)openCards()}
}

    case 'candy':case 'big':{const v=d.val;R.candy+=v;mProg('candy',v);R.candyChain=(R.candyChain||0)+1;R.candyChainT=.35;SFX.candy(R.candyChain);if(d.kind==='big')floatText(P.x,P.y-30,'+'+Math.round(v),'#ffcf3a',16);break}

function updCam(dt,snap){

  const avail=AB.filter(a=>(R.ab[a.id]||0)<a.max&&!(a.id==='angel'&&R.angelUsed));const out=[];
  for(let i=0;i<3;i++){
    const rar=wpick([[0,64-boost*40],[1,29+boost*25],[2,7+boost*15+L('lucky')*2]]);
    let c=avail.filter(a=>a.r===rar&&!out.includes(a));if(!c.length)c=avail.filter(a=>!out.includes(a));
    out.push(c.length?pick(c):SNACK)}
  return out}

function countUp(el,to){if(!el)return;const from=+el.textContent||0,t0=performance.now();const step=()=>{const p=Math.min(1,(performance.now()-t0)/700);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};step()}

/* ---- run start ---- */
function startFlow(mode,ch,skipAd){
  initAudio();state='ad';show('adwait');
  const pb=mode==='story'?S.best[ch]:S.nightBest;
  const go=()=>{demo=null;startRun(mode,ch);R.prevBest=pb;state='run';show(null);if(acted)gpStart();else pendingGp=true;lastT=performance.now()};
  if(skipAd)go();else commercial().then(go);
}

/* ---- texts & buttons ---- */
function updMuteBtn(){$('muteBtn').innerHTML='<span style="opacity:'+(S.muted?.35:1)+'">&#9835;</span>'}
function applyTexts(){buildHome();updMuteBtn();if(state==='pause')buildPause()}
function bindUI(){
  $('playBtn').onclick=()=>{if(S.selCh<S.unlocked){SFX.click();startFlow('story',S.selCh)}};
  $('nightBtn').onclick=()=>{if(S.clear[0]){SFX.click();startFlow('night',0)}};
  $('chPrev').onclick=()=>changeCh(-1);$('chNext').onclick=()=>changeCh(1);
  $('setBtn').onclick=()=>{SFX.click();openPanel('settings')};
  $('pClose').onclick=()=>{SFX.click();closePanel()};
  $('panel').addEventListener('pointerdown',e=>{if(e.target===$('panel'))closePanel()});
  $('pauseBtn').onclick=()=>pauseGame();
  $('muteBtn').onclick=()=>{initAudio();S.muted=!S.muted;save();applyVolume();updMuteBtn()};
  $('resumeBtn').onclick=()=>resumeGame();
  $('quitBtn').onclick=()=>{bankCandy();save();goHome()};
  $('sndToggle').onclick=()=>{S.muted=!S.muted;save();applyVolume();updMuteBtn();buildPause()};
  $('musToggle').onclick=()=>{S.music=!S.music;save();applyVolume();buildPause()};
  $('rerollBtn').onclick=()=>{if(R.rerolls<=0)return;R.rerolls--;cardList=rollCards(0);SFX.card();renderCards();cardsAt=performance.now()-200};
  $('adRerollBtn').onclick=()=>{if(!R.adReroll)return;$('adRerollBtn').disabled=true;rewarded().then(ok=>{$('adRerollBtn').disabled=false;if(!ok){toast('reroll',t('adReroll'),t('noAd'));return}R.adReroll=false;cardList=rollCards(.3);SFX.card();renderCards();cardsAt=performance.now()-200})};
  document.querySelectorAll('img[data-icon]').forEach(el=>el.src=iconURL(el.dataset.icon));
}

/* ---- input ---- */
let acted=false,pendingGp=false;
function userActed(){acted=true;if(pendingGp&&state==='run'){pendingGp=false;gpStart()}}
addEventListener('keydown',e=>{
  initAudio();userActed();KEY[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(state==='run'){if(!e.repeat&&['Space','ShiftLeft','ShiftRight','KeyK','KeyJ'].includes(e.code))wantDash=true;if(e.code==='Escape'||e.code==='KeyP')pauseGame()}
  else if(state==='cards'){const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];if(n!=null)pickCard(n);if(e.code==='KeyR')$('rerollBtn').click()}
  else if(state==='pause'){if(e.code==='Escape'||e.code==='KeyP')resumeGame()}
  else if(state==='home'){if(e.code==='Enter'&&!panelKind)$('playBtn').click();if(e.code==='Escape'&&panelKind)closePanel();if(!panelKind&&e.code==='ArrowLeft')changeCh(-1);if(!panelKind&&e.code==='ArrowRight')changeCh(1)}
  else if(state==='over'){if(e.code==='Enter'&&$('overMain'))$('overMain').click()}
});
addEventListener('keyup',e=>{KEY[e.code]=false});
function releaseAll(){for(const kk in KEY)KEY[kk]=false;stick.on=false;stick.dx=stick.dy=0}
addEventListener('blur',()=>{releaseAll();if(state==='run')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();if(state==='run')pauseGame()}});
cv.addEventListener('pointerdown',e=>{
  initAudio();userActed();
  if(e.pointerType==='touch'||e.pointerType==='pen'){touchMode=true;if(state!=='run')return;e.preventDefault();
    const db=dashBtn();if(Math.hypot(e.clientX-db.x,e.clientY-db.y)<db.r+16){wantDash=true;return}
    if(!stick.on){stick.on=true;stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;stick.dx=stick.dy=0}else wantDash=true}
  else{touchMode=false;mouse.x=e.clientX;mouse.y=e.clientY;mouse.last=performance.now();if(state==='run')wantDash=true}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||e.pointerType==='pen'){if(stick.on&&e.pointerId===stick.id){let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const d=Math.hypot(dx,dy),R0=56;
    if(d>R0+20){stick.ox=e.clientX-dx/d*(R0+20);stick.oy=e.clientY-dy/d*(R0+20);dx=e.clientX-stick.ox;dy=e.clientY-stick.oy}
    const m=Math.min(1,Math.hypot(dx,dy)/R0),a=Math.atan2(dy,dx);stick.dx=m<.12?0:Math.cos(a)*m;stick.dy=m<.12?0:Math.sin(a)*m}}
  else{mouse.x=e.clientX;mouse.y=e.clientY;mouse.last=performance.now();touchMode=false}
});
const endPtr=e=>{if(stick.on&&e.pointerId===stick.id){stick.on=false;stick.dx=stick.dy=0}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{resize();if(room)room.cv=null});
addEventListener('wheel',e=>{if(state==='run')e.preventDefault()},{passive:false});

/* ---- main loop ---- */
let lastT=0,hudOn=null;
function frame(ts){
  const dt=Math.min(.05,Math.max(0,(ts-lastT)/1000)||0);lastT=ts;
  if(!inAd){
    if(state==='run'){
      if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=trans.dur/2){trans.fired=true;trans.mid()}if(trans.t>=trans.dur)trans=null}
      else update(dt);
    }else if(state==='dying'){update(dt);R.deathT-=dt;if(R.deathT<=0)showOver(false)}
    else if(state==='home'&&demo)updDemo(dt);
  }
  const want=state==='run'||state==='dying';if(want!==hudOn){hudOn=want;$('hudBtns').classList.toggle('on',want)}
  render(dt);musicTick();
  requestAnimationFrame(frame);
}

/* ---- boot ---- */
function thumbSetup(){
  document.body.classList.add('thumb');setupDemo(0);state='home';show('home');
  P.x=430;P.y=430;demo.t=0;k=W/640;camX=560;camY=300;
  G=[];const tps=['sheet','wisp','flitter','pumpkin','wisp','sheet'];const pos=[[650,330],[730,390],[600,250],[800,260],[420,250],[330,330]];
  tps.forEach((tp,i)=>{const g=mkGhost(tp,pos[i][0],pos[i][1],{spawnT:0});g.alpha=1;g.hp=1e9;g.spd=0;g.wa=0;g.fear=i<2?g.hp*.5:0;G.push(g)});
  updDemo=function(dt){gtime+=dt;camX=560;camY=300;P.aim=Math.atan2(340-P.y,690-P.x);R={beams:[{a:P.aim,len:330,ang:.36,dps:0,main:true}],ab:{},combo:0};
    for(const g of G){g.lit=!!inBeam(R.beams[0],g.x,g.y,g.r)}};
  for(let i=0;i<14;i++)DROPS.push({kind:i%4?'candy':'big',x:690+rand(-60,60),y:360+rand(-40,50),vx:0,vy:0,z:rand(0,30),vz:0,val:1,t:0,mag:false,col:pick(CANDYCOLS),rot:rand(0,6)});
  BURSTS.push({x:700,y:340,r:180,t:.05,dur:9e9,col:'160,240,255'});sparks(700,340,'#9ff3ff',30,260);for(const f of FX)f.dur=9e9;
}
function boot(){
  loadSave();setLang(S.lang||detectLang());resize();
  buildLogo($('logo'));buildLogo($('logoL'));bindUI();updMuteBtn();
  $('lfill').style.width='55%';
  if(TEST)window.T={get R(){return R},get P(){return P},get G(){return G},get state(){return state},get room(){return room},get S(){return S},startFlow,pickCard,goHome,openPanel,showOver,update,hurtPlayer,popGhost,setSkip:v=>{window.__skip=v}};
  Promise.resolve(window.__pokiReady).catch(()=>{}).then(()=>{if(window.PokiSDK)SDK=window.PokiSDK;return SDK.init()}).catch(()=>{}).then(()=>{
    if(!S.lang){setLang(detectLang())}
    $('lfill').style.width='100%';try{SDK.gameLoadingFinished()}catch(e){}
    ensureDaily();checkTrophies();
    requestAnimationFrame(t0=>{lastT=t0;requestAnimationFrame(frame)});
    console.log('Horrorz v'+VERSION);
    if(THUMB){thumbSetup();return}
    if(S.first){S.first=false;save();startFlow('story',0,true)}else goHome();
  });
}
boot();

</script>
