<!doctype html>
<!-- Horrorz v2.5 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Horrorz</title>
<script>
/* Poki SDK alleen laden buiten de eigen gamesite (github.io): daar meldt de SDK "unauthorized hosting". */
window.__pokiReady=new Promise(function(res){
  if(/(^|\.)github\.io$/i.test(location.hostname)||/[?&](thumb|test)=1/.test(location.search)){res(false);return}
  var s=document.createElement('script');s.src='https://game-cdn.poki.com/scripts/v2/poki-sdk.js';
  s.onload=function(){res(true)};s.onerror=function(){res(false)};setTimeout(function(){res(false)},8000);
  document.head.appendChild(s);
});
</script>
<style>
:root{--ink:#efe6d2;--bone:#d8c8a0;--muted:#9a8f7c;--panel:rgba(14,11,14,.94);--panel2:#1d181c;--edge:rgba(216,200,160,.28);--ember:#b8622a;--emberD:#6a3010;--moss:#7aa894;--blood:#8e1a28;--gold:#d8b868;--rare:#7fa6c9;--epic:#b48ad6;
  --serif:Georgia,"Times New Roman","Liberation Serif",serif;--sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050407;color:var(--ink);font-family:var(--sans);touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
.dim{background:radial-gradient(ellipse at center,rgba(8,6,10,.62),rgba(3,2,5,.9))}
h2{font-family:var(--serif);font-weight:700;letter-spacing:.08em}
.ctitle{font-size:clamp(24px,4.4vw,40px);color:var(--ink);text-shadow:0 0 24px rgba(0,0,0,.9),0 2px 0 #000;text-align:center;text-transform:uppercase;letter-spacing:.14em}
.ctitle::after{content:"";display:block;width:60%;margin:8px auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--bone),transparent);opacity:.6}

.btn{font-family:var(--serif);font-weight:700;border:1px solid rgba(216,200,160,.4);border-radius:3px;padding:10px 22px;font-size:17px;cursor:pointer;color:var(--ink);
  background:linear-gradient(#2a2226,#141013);box-shadow:inset 0 1px 0 rgba(255,240,210,.08),0 6px 20px rgba(0,0,0,.55);position:relative;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase;transition:transform .08s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,240,210,.12),0 0 18px rgba(216,184,104,.18),0 6px 20px rgba(0,0,0,.55)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.big{font-size:clamp(20px,3.6vw,27px);padding:12px 56px;color:#f4e8d0;border-color:rgba(232,190,120,.6);
  background:linear-gradient(#8a4418,#4e2008);box-shadow:inset 0 1px 0 rgba(255,210,150,.25),0 0 30px rgba(184,98,42,.35),0 8px 24px rgba(0,0,0,.6);text-shadow:0 1px 0 #000}
.btn.mint{color:#dfeee6;border-color:rgba(122,168,148,.55);background:linear-gradient(#2c443a,#14221c)}
.btn.ghost{background:linear-gradient(#1e191c,#110e10)}
.btn.small{font-size:13px;padding:7px 13px;letter-spacing:.08em}
.btn:disabled{filter:grayscale(.9) brightness(.55);cursor:default;transform:none}
.btn .ad{display:inline-block;margin-left:8px;font-size:.7em;vertical-align:2px;border:1px solid rgba(255,255,255,.3);border-radius:2px;padding:1px 5px}
.btn.pulse{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,210,150,.25),0 0 20px rgba(184,98,42,.25),0 8px 24px rgba(0,0,0,.6)}50%{box-shadow:inset 0 1px 0 rgba(255,210,150,.25),0 0 42px rgba(214,130,60,.5),0 8px 24px rgba(0,0,0,.6)}}
.ic{width:1.25em;height:1.25em;vertical-align:-.26em}

.hb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(216,200,160,.3);background:rgba(10,8,12,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--bone)}
.hb:active{transform:scale(.94)}
#hudBtns{position:fixed;top:10px;right:10px;display:none;gap:8px;z-index:4}
#hudBtns.on{display:flex}
.pz{display:block;width:12px;height:14px;border-left:4px solid var(--bone);border-right:4px solid var(--bone)}
.gear{display:block;width:18px;height:18px;border-radius:50%;border:4px dotted var(--bone);position:relative}
.gear::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bone)}

/* logo */
.logo{font-family:var(--serif);font-weight:700;font-size:clamp(46px,10.5vw,100px);line-height:1;display:flex;letter-spacing:.14em;margin-right:-.14em;color:#e8dcc2;
  text-shadow:0 0 .25em rgba(0,0,0,.9),0 .04em 0 #000,0 0 .7em rgba(184,98,42,.28);animation:flick 7s infinite}
.logo span{display:inline-block;position:relative}
.logo span:nth-child(2){transform:translateY(.03em) rotate(-2deg)}
.logo span:nth-child(4){transform:translateY(-.02em) rotate(1.5deg)}
.logo span.o{color:#d8a060;text-shadow:0 0 .35em rgba(232,140,60,.7),0 .04em 0 #000}
.logo span.z{color:#c8d4cc;text-shadow:0 0 .3em rgba(120,200,170,.35),0 .04em 0 #000;transform:rotate(4deg)}
@keyframes flick{0%,18%,22%,63%,66%,100%{opacity:1}20%{opacity:.55}64%{opacity:.7}65%{opacity:.95}}
.logo::after{content:"";position:absolute;left:8%;right:8%;bottom:-.18em;height:1px;background:linear-gradient(90deg,transparent,rgba(216,200,160,.6),transparent)}
.logo{position:relative}
#load .logo{font-size:clamp(38px,8vw,72px)}
.lbar{width:min(280px,70vw);height:3px;background:rgba(255,255,255,.08);overflow:hidden}
#lfill{height:100%;width:10%;background:linear-gradient(90deg,var(--emberD),var(--gold));transition:width .3s}

/* home */
#home{flex-direction:column;align-items:center;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:rgba(10,8,12,.7);border:1px solid var(--edge);border-radius:2px;padding:6px 14px;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold)}
.homeMain{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,16px)}
.chapSel{display:flex;align-items:center;gap:8px}
.arrow{width:40px;height:56px;border:none;background:none;font-size:42px;line-height:1;cursor:pointer;color:var(--bone);font-family:var(--serif);opacity:.8}
.arrow:disabled{opacity:.15}
.chapCard{width:min(340px,64vw);background:linear-gradient(rgba(14,11,14,.86),rgba(8,6,9,.86));border:1px solid var(--edge);padding:9px 14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chapCard .cn{font-size:11px;color:var(--muted);letter-spacing:.32em;text-transform:uppercase}
.chapCard .cname{font-family:var(--serif);font-size:clamp(19px,3.2vw,25px);font-weight:700;letter-spacing:.04em}
.chapCard .cinfo{font-size:13px;color:#c8bca4;margin-top:2px;min-height:18px;font-family:var(--serif);font-style:italic}
.chapCard.locked{opacity:.65}
.chapCard .crown{color:var(--gold);font-style:normal}
.nav{display:flex;gap:clamp(6px,1.4vw,12px);flex-wrap:wrap;justify-content:center}
.nb{position:relative;width:min(80px,calc((100vw - 64px)/6));display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(10,8,12,.72);border:1px solid var(--edge);padding:7px 4px 6px;cursor:pointer;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#d8ccb4}
.nb img{width:32px;height:32px}
.nb span{max-width:100%;overflow:hidden;text-align:center;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;letter-spacing:.03em}
@media (max-width:560px){.nb{font-size:8px;letter-spacing:0;padding:6px 2px}}
.nb:hover{border-color:rgba(216,200,160,.55)}
.nb:active{transform:scale(.96)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:1px solid rgba(255,200,200,.5);box-shadow:0 0 10px rgba(200,40,50,.6)}
.ver{position:fixed;left:8px;bottom:4px;font-size:10px;color:rgba(255,255,255,.3)}

/* panel */
.panel{background:var(--panel);border:1px solid var(--edge);width:min(620px,95vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.8);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--edge)}
.ph h2{font-size:19px;text-transform:uppercase;letter-spacing:.16em}
.x{width:34px;height:34px;border:1px solid var(--edge);background:none;font-size:15px;cursor:pointer;color:var(--bone)}
.pb{padding:12px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(216,200,160,.12);margin-bottom:8px}
.row .ri{width:44px;height:44px;flex:none}
.row .rt{flex:1;min-width:0}
.row .rn{font-family:var(--serif);font-weight:700;font-size:15px}
.row .rd{font-size:12px;color:var(--muted)}
.row.done{opacity:.5}
.pips{display:flex;gap:4px;margin-top:5px}
.pip{width:14px;height:3px;background:rgba(255,255,255,.15)}
.pip.on{background:var(--moss)}
.pip.new{background:var(--gold);animation:flick 1s infinite}
.bar{height:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),#cfe6da)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.03);border:1px solid rgba(216,200,160,.14);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;font-size:12px}
.tile.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(216,184,104,.2) inset}
.tile canvas,.tile img{width:84px;height:84px}
.tile .tn{font-family:var(--serif);font-weight:700;font-size:13px}
.tile .ts{font-size:11px;color:var(--muted);min-height:15px}
.tile.lock canvas,.tile.lock>img{filter:brightness(.3) grayscale(.8)}
.tile .ts img{width:1.2em;height:1.2em;vertical-align:-.25em}
.sec{font-weight:700;color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:11px;margin:12px 4px 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{background:rgba(255,255,255,.03);padding:6px 2px;text-align:center;font-size:10px;letter-spacing:.06em;border:1px solid rgba(216,200,160,.12);font-family:var(--serif)}
.day img{width:30px;height:30px;display:block;margin:2px auto}
.day.got{opacity:.4}
.day.now{border-color:var(--gold);box-shadow:0 0 14px rgba(216,184,104,.25)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs .btn.sel{border-color:var(--gold)}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

/* cards: tarot style */
.cards{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:stretch;flex-wrap:nowrap;max-width:100%;perspective:900px}
.card{width:clamp(104px,26vw,200px);background:linear-gradient(170deg,#1e181c,#0e0b0d);border:1px solid #6a6458;outline:1px solid rgba(216,200,160,.18);outline-offset:-7px;padding:clamp(10px,1.6vw,16px) clamp(8px,1.4vw,14px);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;animation:cardIn .5s cubic-bezier(.2,1.2,.4,1) backwards;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 24px rgba(216,184,104,.12)}
.card:active{transform:scale(.97)}
.card img{width:clamp(52px,10vw,84px);height:clamp(52px,10vw,84px)}
.card .cr{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#a8a090}
.card .cnm{font-family:var(--serif);font-weight:700;font-size:clamp(14px,2.1vw,18px);line-height:1.15}
.card .cd{font-size:clamp(11px,1.5vw,13px);color:#c8bca4;line-height:1.3}
.card .ck{position:absolute;top:8px;left:11px;font-size:11px;color:rgba(216,200,160,.35);font-family:var(--serif)}
.card.r1{border-color:#5a7894}.card.r1 .cr{color:var(--rare)}
.card.r2{border-color:#7a5a94;background:linear-gradient(170deg,#241a2a,#0e0a10);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px rgba(180,138,214,.18)}.card.r2 .cr{color:var(--epic)}
.card.r2::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);background-size:250% 100%;animation:shine 3s linear infinite;pointer-events:none}
.card.offer{border-color:#8a6a3a}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes cardIn{from{transform:translateY(30px) rotateY(70deg);opacity:0}to{transform:none;opacity:1}}
.crow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.build{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.bi{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(216,200,160,.12);padding:3px 8px 3px 3px;font-size:12px;font-family:var(--serif)}
.bi img{width:26px;height:26px}

/* results */
.result{text-align:center;padding:18px 18px 20px;gap:8px;align-items:center;overflow-y:auto;touch-action:pan-y}
.result h2{font-size:clamp(26px,4.6vw,38px);text-transform:uppercase;letter-spacing:.14em}
.result .sub{color:var(--muted);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.result .big{font-family:var(--serif);font-size:clamp(24px,4.6vw,36px);font-weight:700}
.result .near{color:var(--gold);font-family:var(--serif);font-style:italic;font-size:16px}
.result .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result .st{border:1px solid rgba(216,200,160,.16);padding:6px 12px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.result .st b{display:block;color:var(--ink);font-size:18px;font-family:var(--serif);letter-spacing:0}
.result .earn{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px}
.result .goal{width:100%;max-width:380px;font-size:12px;color:#c8bca4;font-style:italic;font-family:var(--serif)}
.result .rec{color:#a8d8c0;font-family:var(--serif);font-style:italic}
.result .btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px;width:100%}
.result .crow .btn{min-width:150px}
.result .btn.big{padding:11px 44px;font-size:clamp(18px,3.2vw,24px)}

#toasts{position:fixed;top:64px;right:12px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:10px;background:rgba(12,9,12,.95);border:1px solid rgba(216,184,104,.5);padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:toast 3.4s forwards}
.toast img{width:34px;height:34px}
.toast b{display:block;color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.toast span{font-family:var(--serif);font-weight:700}
@keyframes toast{0%{transform:translateX(120%);opacity:0}10%,85%{transform:none;opacity:1}100%{transform:translateX(120%);opacity:0}}
.spinner{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-height:430px){
  .logo{font-size:clamp(32px,8vh,62px)}
  .btn.big{padding:8px 40px;font-size:20px}
  .nb{padding:4px 3px;font-size:9px}.nb img{width:24px;height:24px}
  .chapCard{padding:5px 10px}.arrow{height:44px}
  .card{padding:8px 6px}.card .cd{font-size:11px}
  .result{padding:8px 12px;gap:4px;width:min(760px,96vw)}.result h2{font-size:22px}.result .big{font-size:20px}.result .earn{font-size:20px}.result .sub{font-size:10px}
  .result .st{padding:3px 10px}.result .st b{font-size:15px}.result .near,.result .rec{font-size:13px}.result .goal{font-size:11px}
  .result .btn{font-size:12px;padding:7px 12px;letter-spacing:.08em}
  .result .btns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}.result .crow .btn{min-width:0}.result .btn.big{padding:8px 26px;font-size:18px}
}
.thumb .topbar,.thumb .chapSel,.thumb .playRow,.thumb #nightBtn,.thumb .nav,.thumb .ver,.thumb #hudBtns{display:none!important}
.thumb #home{justify-content:flex-start;padding-top:4%}
.thumb .logo{font-size:min(13vw,104px)}

.thumb .logo{animation:none}
.thumb.sq #home{padding-top:5.5%}
.thumb.sq .logo{font-size:14.5vw}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudBtns"><button id="pauseBtn" class="hb" aria-label="pause"><span class="pz"></span></button><button id="muteBtn" class="hb" aria-label="sound"></button></div>

<div id="load" class="screen center on">
  <div class="logo" id="logoL"></div>
  <div class="lbar"><div id="lfill"></div></div>
</div>

<div id="home" class="screen">
  <div class="topbar">
    <button id="setBtn" class="hb" aria-label="settings"><span class="gear"></span></button>
    <div class="pill"><img class="ic" data-icon="candy" alt=""><span id="hCandy">0</span></div>
  </div>
  <div class="homeMain">
    <div class="logo" id="logo"></div>
    <div class="chapSel">
      <button class="arrow" id="chPrev" aria-label="previous">&#8249;</button>
      <div class="chapCard" id="chapCard"></div>
      <button class="arrow" id="chNext" aria-label="next">&#8250;</button>
    </div>
    <div class="playRow">
      <button class="btn big" id="playBtn"></button>
    </div>
    <button class="btn mint" id="nightBtn"></button>
  </div>
  <div class="nav" id="nav"></div>
  <div class="ver" id="ver"></div>
</div>

<div id="panel" class="screen center dim">
  <div class="panel">
    <div class="ph"><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="close">&#10005;</button></div>
    <div class="pb" id="pBody"></div>
  </div>
</div>

<div id="cards" class="screen center dim">
  <h2 class="ctitle" id="cTitle"></h2>
  <div class="cards" id="cardRow"></div>
  <div class="crow"><button class="btn ghost small" id="rerollBtn"></button><button class="btn ghost small" id="adRerollBtn"></button></div>
</div>

<div id="pause" class="screen center dim">
  <h2 class="ctitle" id="paTitle"></h2>
  <div class="build" id="pauseBuild"></div>
  <button class="btn big" id="resumeBtn"></button>
  <div class="crow"><button class="btn ghost small" id="sndToggle"></button><button class="btn ghost small" id="musToggle"></button></div>
  <button class="btn ghost small" id="quitBtn"></button>
</div>

<div id="over" class="screen center dim"><div class="panel result" id="overBox"></div></div>

<div id="adwait" class="screen center"><div class="spinner"></div></div>

<div id="toasts"></div>
<script>
'use strict';
const VERSION='2.5';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return d}
function wpick(list){let s=0;for(const e of list)s+=Math.max(0,e[1]);let r=Math.random()*s;for(const e of list){r-=Math.max(0,e[1]);if(r<=0)return e[0]}return list[list.length-1][0]}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

let AC=null,master=null,sfxG=null,musG=null,noiseBuf=null,musDelay=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.connect(AC.destination);
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;comp.connect(master);
    sfxG=AC.createGain();sfxG.connect(comp);
    musG=AC.createGain();musG.connect(comp);
    musDelay=AC.createDelay(1);musDelay.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.32;const wet=AC.createGain();wet.gain.value=.35;
    musDelay.connect(fb);fb.connect(musDelay);musDelay.connect(wet);wet.connect(musG);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVolume();
  }catch(e){AC=null}
}
function applyVolume(){if(!AC)return;master.gain.value=adMuted?0:1;sfxG.gain.value=S.muted?0:.6;musG.gain.value=(S.muted||!S.music)?0:.3}
function osc(f,dur,type,vol,slide,t0,dest,delaySend){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(dest||sfxG);if(delaySend&&musDelay)g.connect(musDelay);o.start(t0);o.stop(t0+dur+.03)}
function tone(f,dur,type,vol,slide,delay){if(!AC||S.muted)return;osc(f,dur,type,vol,slide,AC.currentTime+(delay||0),sfxG)}
function noise(dur,vol,freq,ft,delay,dest){if(!AC||(S.muted&&dest!==musG))return;const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft||'lowpass';f.frequency.value=freq||1200;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t0);s.stop(t0+dur+.02)}

const MUS={next:0,step:0,mode:'calm',ch:0};
const MKEYS=[
  {root:220,prog:[[0,3,7],[-4,0,3],[5,8,12],[-5,-1,2]],bpm:92,lead:'sine'},
  {root:196,prog:[[0,3,7],[1,5,8],[-2,1,5],[0,3,7]],bpm:84,lead:'triangle'},
  {root:174.6,prog:[[0,3,7],[-4,-1,3],[-7,-4,0],[-2,1,5]],bpm:76,lead:'sine'},
  {root:233,prog:[[0,3,7],[0,4,7],[-2,2,5],[-5,-1,2]],bpm:104,lead:'triangle'},
  {root:207.6,prog:[[0,3,7,10],[-4,0,3,7],[2,5,9],[-1,2,5]],bpm:88,lead:'sine'}];
function musicTick(){
  if(!AC||S.muted||!S.music||adMuted||AC.state!=='running')return;
  const now=AC.currentTime;if(MUS.next<now-.3)MUS.next=now+.05;
  const K=MKEYS[MUS.ch]||MKEYS[0],fast=MUS.mode==='boss',sd=60/(fast?K.bpm*1.35:K.bpm)/4,n2f=s=>K.root*ST(s);
  while(MUS.next<now+.2){
    const st=MUS.step%64,bar=(st/16)|0,s=st%16,ch=K.prog[bar],tt=MUS.next;
    if(s===0||s===10||(fast&&s%4===0))osc(n2f(ch[0]-24),sd*(fast?2.5:7),'triangle',.18,null,tt,musG);
    if(s%2===0&&(MUS.ch!==2||s%4===0)){const idx=[0,1,2,1,0,2,1,2][s>>1]%ch.length;osc(n2f(ch[idx]+(s>=8?12:0)),sd*1.9,K.lead,.065,null,tt,musG,true)}
    if((s===6||s===14)&&Math.random()<.45)osc(n2f(ch[ch.length-1]+24),.6,'sine',.035,null,tt,musG,true);
    if(s===0&&bar===0&&Math.random()<.5)osc(n2f(ch[0]-12),sd*14,'sawtooth',.02,null,tt,musG,true);
    if(fast&&s%2===1)noise(.03,.03,7000,'highpass',tt-now,musG);
    if(fast&&s%8===4)noise(.09,.06,900,'lowpass',tt-now,musG);
    MUS.next+=sd;MUS.step++;
  }
}

function skinOwned(sk){return S.skins.includes(sk.id)||(sk.tr&&S.trophies[sk.tr])}
function beamOwned(b){return S.beams.includes(b.id)||(b.tr&&S.trophies[b.tr])}
function beamCol(){const b=BEAMS.find(x=>x.id===S.beam)||BEAMS[0];return b.c}
function ensureDaily(){
  const k=todayKey();if(S.daily.day===k&&S.daily.list.length)return;
  const r=srng(hashStr('hz'+k));const pool=MPOOL.slice();const list=[];
  while(list.length<3&&pool.length){const m=pool.splice(Math.floor(r()*pool.length),1)[0];const ti=Math.floor(r()*m.n.length);list.push({id:m.id,n:m.n[ti],rw:m.rw[ti],p:0,c:false})}
  S.daily={day:k,list,bonus:false};save();
}
function mProg(id,v,mode){if(!S.daily.list)return;for(const m of S.daily.list){if(m.id!==id||m.c)continue;if(mode==='max')m.p=Math.max(m.p,v);else m.p+=v;if(m.p>=m.n&&!m.ready){m.ready=true;missionReadyFx(m)}}}
function missionsClaimable(){ensureDaily();let n=S.daily.list.filter(m=>m.p>=m.n&&!m.c).length;if(!S.daily.bonus&&S.daily.list.every(m=>m.c))n++;return n}
function giftReady(){return S.gift.last!==todayKey()}
function checkTrophies(){for(const tr of TROPHIES){if(!S.trophies[tr.id]&&tr.ok()){S.trophies[tr.id]=1;measure('trophy',tr.id,'reached');toast('trophy',t('trophyGet'),t('tr_'+tr.id));
  const sk=SKINS.find(s=>s.tr===tr.id);if(sk)setTimeout(()=>toast('sk_'+sk.id,t('newSkin'),t('sk_'+sk.id)),900);save()}}}

/* ---------- procedural textures (generated once, cached) ---------- */
const NZP=(()=>{const r=srng(91731);const p=new Uint16Array(512);const a=[];for(let i=0;i<256;i++)a.push(i);for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const tmp=a[i];a[i]=a[j];a[j]=tmp}for(let i=0;i<512;i++)p[i]=a[i&255];const v=new Float32Array(256);for(let i=0;i<256;i++)v[i]=r();return{p,v}})();
function hh(x,y){return NZP.v[NZP.p[(NZP.p[x&255]+(y&255))&511]&255]}
/* periodic value noise: cell size cs px, period per cells */
function vn(x,y,cs,per){const fx=x/cs,fy=y/cs,xi=Math.floor(fx),yi=Math.floor(fy),xf=fx-xi,yf=fy-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const pw=per||256;
  const x0=((xi%pw)+pw)%pw,x1=(x0+1)%pw,y0=((yi%pw)+pw)%pw,y1=(y0+1)%pw;
  const a=hh(x0,y0),b=hh(x1,y0),c=hh(x0,y1),d=hh(x1,y1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,cs,S,oct){let s=0,a=.5,n=0;for(let o=0;o<(oct||4);o++){s+=vn(x,y,cs,S/cs)*a;n+=a;a*=.5;cs/=2;if(cs<1)break}return s/n}
function vn2(x,y,cx,cy,px,py){const fx=x/cx,fy=y/cy,xi=Math.floor(fx),yi=Math.floor(fy),xf=fx-xi,yf=fy-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
  const a=hh(x0,y0),b=hh(x1,y0),c=hh(x0,y1),d=hh(x1,y1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbmA(x,y,cx,cy,S,oct){let s=0,a=.5,n=0;for(let o=0;o<(oct||3);o++){s+=vn2(x,y,cx,cy,Math.max(1,Math.round(S/cx)),Math.max(1,Math.round(S/cy)))*a;n+=a;a*=.5;cx/=2;cy=Math.max(1,cy/2)}return s/n}
const TEX={};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function pixelTex(w,h,fn){const cv=mkCanvas(w,h),c=cv.getContext('2d'),id=c.createImageData(w,h),d=id.data;const o=[0,0,0,255];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){fn(x,y,o);const i=(y*w+x)*4;d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=o[3]}
  c.putImageData(id,0,0);return cv}
const cl8=v=>v<0?0:v>255?255:v;

/* rows of planks; returns per-row cut lists so the result tiles */
function plankRows(S,rowH,minL,maxL,seed){const r=srng(seed);const rows=[];for(let y=0;y<S;y+=rowH){const cuts=[];let x=Math.floor(r()*S);const st=x;let acc=0;
  while(acc<S){cuts.push(((x%S)+S)%S);const l=minL+r()*(maxL-minL);x+=l;acc+=l}rows.push({cuts:cuts.sort((a,b)=>a-b),tones:cuts.map(()=>r()),seeds:cuts.map(()=>r()*100)})}return rows}
function plankAt(row,x){let i=row.cuts.length-1;for(let j=0;j<row.cuts.length;j++){if(row.cuts[j]>x){i=j-1;break}}if(i<0)i=row.cuts.length-1;return i}

function woodTex(key,base,S,rowH,minL,maxL,opt){
  if(TEX[key])return TEX[key];opt=opt||{};
  const rows=plankRows(S,rowH,minL,maxL,hashStr(key));
  const knots=[];const kr=srng(hashStr(key+'k'));for(let i=0;i<(opt.knots||6);i++)knots.push([kr()*S,kr()*S,3+kr()*5]);
  TEX[key]=pixelTex(S,S,(x,y,o)=>{
    const ri=Math.floor(y/rowH)%rows.length,row=rows[ri],pi=plankAt(row,x);
    const tone=.78+row.tones[pi]*.36,sd=row.seeds[pi];
    const yy=y%rowH;
    const g=fbmA(x+sd*37,y,64,4,S,3);
    let grain=.5+.5*Math.sin((y*0.9+g*26+sd)*1.3);grain=.86+grain*.16;
    const fine=.95+vn2(x,y,2,8,S/2,S/8)*.1;
    const wear=fbm(x,y,128,S,3);
    let k=tone*grain*fine*(.9+wear*.2);
    for(const kn of knots){const dx=x-kn[0],dy=(y-kn[1])*2.4,dd=Math.sqrt(dx*dx+dy*dy);if(dd<kn[2]*2.2)k*=.72+.28*Math.abs(Math.sin(dd*1.4))}
    if(yy<1.2||yy>rowH-1.2)k*=opt.gap||.42;
    for(const c of row.cuts){const dx=Math.abs(x-c);if(dx<1.1)k*=opt.joint||.5}
    if(opt.nails){for(const c of row.cuts){if(Math.abs(x-c-5)<1.3&&(Math.abs(yy-rowH*.28)<1.3||Math.abs(yy-rowH*.72)<1.3))k*=.35}}
    const dust=opt.dust?Math.max(0,fbm(x+300,y,96,S,3)-.52)*opt.dust:0;
    o[0]=cl8(base[0]*k+dust*160);o[1]=cl8(base[1]*k+dust*150);o[2]=cl8(base[2]*k+dust*135);o[3]=255});
  return TEX[key];
}
function stoneTex(key,base,S,rowH,minW,maxW,opt){
  if(TEX[key])return TEX[key];opt=opt||{};
  const rows=plankRows(S,rowH,minW,maxW,hashStr(key));const mort=opt.mortar||3;
  TEX[key]=pixelTex(S,S,(x,y,o)=>{
    const ri=Math.floor(y/rowH)%rows.length,row=rows[ri],pi=plankAt(row,x);
    const tone=.8+row.tones[pi]*.32;const yy=y%rowH;
    let ex=1e9;for(const c of row.cuts){const d=Math.abs(x-c);if(d<ex)ex=d;const d2=Math.abs(x-c-S);if(d2<ex)ex=d2;const d3=Math.abs(x-c+S);if(d3<ex)ex=d3}
    const ey=Math.min(yy,rowH-yy),e=Math.min(ex,ey);
    const n=fbm(x,y,32,S,5),n2=fbm(x+90,y+40,8,S,3);
    let k=tone*(.78+n*.36)*(.92+n2*.14);
    if(e<mort){const m=opt.mortCol||[.42,.4,.38];const moss=opt.moss?Math.max(0,fbm(x+500,y,48,S,3)-.5)*opt.moss:0;
      o[0]=cl8(base[0]*m[0]*1.6*(.8+n*.4));o[1]=cl8(base[1]*m[1]*1.6*(.8+n*.4)+moss*90);o[2]=cl8(base[2]*m[2]*1.6*(.8+n*.4));o[3]=255;return}
    if(e<mort+3)k*=.78+.22*((e-mort)/3);
    if(ey>mort&&yy<mort+4)k*=1.08;
    const stain=Math.max(0,fbm(x+200,y+70,96,S,3)-.55)*1.4;k*=1-stain*.35;
    const moss=opt.moss?Math.max(0,fbm(x+700,y+30,64,S,4)-.6)*opt.moss:0;
    o[0]=cl8(base[0]*k-moss*30);o[1]=cl8(base[1]*k+moss*40);o[2]=cl8(base[2]*k-moss*20);o[3]=255});
  return TEX[key];
}
function addCracks(cv,n,seed,col){const c=cv.getContext('2d'),r=srng(seed);c.strokeStyle=col||'rgba(10,8,8,.55)';c.lineWidth=1;
  for(let i=0;i<n;i++){let x=r()*cv.width,y=r()*cv.height,a=r()*TAU;c.beginPath();c.moveTo(x,y);for(let j=0;j<6+r()*8;j++){a+=(r()-.5)*1.2;x+=Math.cos(a)*(4+r()*8);y+=Math.sin(a)*(4+r()*8);c.lineTo(x,y)}c.stroke()}return cv}
function ironTex(key){if(TEX[key])return TEX[key];const S=256,P=128;
  const cv=pixelTex(S,S,(x,y,o)=>{const px=x%P,py=y%P;const n=fbm(x,y,16,S,5);let k=.82+n*.3;
    const e=Math.min(px,py,P-px,P-py);if(e<2)k*=.35;else if(px<5||py<5)k*=1.25;else if(px>P-6||py>P-6)k*=.7;
    const dia=((x+y)%12<1.5||(x-y+600)%12<1.5)?.9:1;k*=dia;
    const rust=Math.max(0,fbm(x+40,y+90,48,S,4)-.55)*2;
    o[0]=cl8(64*k+rust*70);o[1]=cl8(62*k+rust*32);o[2]=cl8(60*k+rust*10);o[3]=255});
  const c=cv.getContext('2d');for(let gx=0;gx<S;gx+=P)for(let gy=0;gy<S;gy+=P)for(const [ox,oy] of[[8,8],[P-8,8],[8,P-8],[P-8,P-8]]){const g=c.createRadialGradient(gx+ox-1,gy+oy-1,0,gx+ox,gy+oy,4);g.addColorStop(0,'#a8a6a2');g.addColorStop(1,'#2a2826');c.fillStyle=g;c.beginPath();c.arc(gx+ox,gy+oy,3.4,0,TAU);c.fill()}
  return TEX[key]=cv}
function tileTex(key,base,S,ts,opt){if(TEX[key])return TEX[key];opt=opt||{};const r=srng(hashStr(key));const tones=[];for(let i=0;i<(S/ts)*(S/ts);i++)tones.push(r());
  const cv=pixelTex(S,S,(x,y,o)=>{const tx=Math.floor(x/ts),ty=Math.floor(y/ts),px=x%ts,py=y%ts,e=Math.min(px,py,ts-px,ts-py);const n=fbm(x,y,16,S,5);
    if(e<2.5){const moss=Math.max(0,fbm(x+50,y,32,S,3)-.45)*(opt.moss||0);o[0]=cl8(96+n*30-moss*30);o[1]=cl8(92+n*30+moss*60);o[2]=cl8(84+n*28-moss*20);o[3]=255;return}
    const tone=.82+tones[ty*(S/ts)+tx]*.3;let k=tone*(.82+n*.3);if(e<5)k*=.9;if(px<6&&py<6)k*=1.06;
    const wear=Math.max(0,fbm(x+300,y+300,64,S,3)-.5)*.8;
    o[0]=cl8(base[0]*k+wear*60);o[1]=cl8(base[1]*k+wear*50);o[2]=cl8(base[2]*k+wear*40);o[3]=255});
  return TEX[key]=addCracks(cv,opt.cracks||6,hashStr(key+'c'),'rgba(30,18,12,.5)')}

function floorTex(kind){
  switch(kind){
    case 'parquet':return woodTex('parquet',[112,70,40],512,32,260,520,{knots:5,dust:.6,gap:.62,joint:.62});
    case 'boards':return woodTex('boards',[104,86,66],512,46,320,700,{knots:9,gap:.3,nails:true,dust:1.1});
    case 'flagstone':return addCracks(stoneTex('flag',[92,94,98],512,64,64,150,{mortar:3,moss:.6}),6,77);
    case 'iron':return ironTex('iron');
    case 'terracotta':return tileTex('terra',[150,82,58],512,64,{moss:.5,cracks:10});
  }
}
/* small textures for furniture */
function woodGrain(key,base){return woodTex('wg_'+key,base,256,64,600,600,{knots:2,gap:1})}
function stoneGrain(key,base){if(TEX['sg_'+key])return TEX['sg_'+key];return TEX['sg_'+key]=pixelTex(256,256,(x,y,o)=>{const n=fbm(x,y,32,256,5),n2=fbm(x+70,y,8,256,3);const k=.8+n*.3+n2*.1;o[0]=cl8(base[0]*k);o[1]=cl8(base[1]*k);o[2]=cl8(base[2]*k);o[3]=255})}
function pat(c,cv,scale){const p=c.createPattern(cv,'repeat');if(scale&&p.setTransform){try{p.setTransform(new DOMMatrix([scale,0,0,scale,0,0]))}catch(e){}}return p}

/* wall faces (top wall), WALLT tall, tile 256 wide */
function wallTex(kind,ch){
  const key='wall_'+kind;if(TEX[key])return TEX[key];
  const S=256,H=WALLT;let cv;
  if(kind==='damask'){
    const pc=hexRgb(ch.paper),pc2=hexRgb(ch.paper2);
    cv=pixelTex(S,H,(x,y,o)=>{const n=fbm(x,y,32,S,4);const stain=Math.max(0,fbm(x*.5,y*.08+x*.02,64,S,3)-.45)*1.6;const k=(.86+n*.22)*(1-stain*.3);
      const v=Math.sin(x/S*TAU*8)*.5+.5;const m=pc.map((c,i)=>c+(pc2[i]-c)*v*.3);o[0]=cl8(m[0]*k);o[1]=cl8(m[1]*k);o[2]=cl8(m[2]*k);o[3]=255});
    const c=cv.getContext('2d');c.fillStyle='rgba(220,180,140,.07)';c.strokeStyle='rgba(230,190,150,.09)';c.lineWidth=1.2;
    for(let gx=0;gx<S+32;gx+=32)for(let gy=0,j=0;gy<H-40;gy+=36,j++){const x=gx+(j%2?16:0),y=gy+12;
      c.beginPath();c.moveTo(x,y-11);c.bezierCurveTo(x+9,y-6,x+9,y+4,x,y+11);c.bezierCurveTo(x-9,y+4,x-9,y-6,x,y-11);c.fill();c.beginPath();c.arc(x,y,4,0,TAU);c.stroke();
      c.beginPath();c.moveTo(x-8,y-8);c.quadraticCurveTo(x-14,y,x-8,y+8);c.moveTo(x+8,y-8);c.quadraticCurveTo(x+14,y,x+8,y+8);c.stroke()}
    // vertical water stains / peeling
    const r=srng(5);for(let i=0;i<5;i++){const x=r()*S,w=4+r()*10,l=20+r()*50;const g=c.createLinearGradient(0,0,0,l);g.addColorStop(0,'rgba(20,10,5,.25)');g.addColorStop(1,'rgba(20,10,5,0)');c.fillStyle=g;c.fillRect(x,0,w,l)}
    // wainscot
    const wy=H-46,wd=woodGrain('wain',[70,42,26]);c.fillStyle=pat(c,wd,.6);c.fillRect(0,wy,S,46);
    for(let x=6;x<S;x+=64){c.fillStyle='rgba(0,0,0,.28)';c.fillRect(x,wy+8,52,28);c.fillStyle='rgba(255,220,180,.08)';c.fillRect(x+2,wy+10,48,2);c.fillRect(x+2,wy+10,2,24);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(x+2,wy+33,50,2)}
    c.fillStyle='#2a170d';c.fillRect(0,wy-4,S,5);c.fillStyle='rgba(255,220,180,.12)';c.fillRect(0,wy-4,S,1);
    c.fillStyle='#1a0e08';c.fillRect(0,H-7,S,7);
  }else if(kind==='timber'){
    cv=mkCanvas(S,H);const c=cv.getContext('2d');const wd=woodTex('timberv',[86,66,46],256,32,500,500,{knots:4,gap:.35});
    c.save();c.translate(S,0);c.rotate(Math.PI/2);c.fillStyle=pat(c,wd,1);c.fillRect(0,0,H,S);c.restore();
    c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,0,S,H);
    const bw=woodTex('beam',[60,44,30],256,40,600,600,{knots:2});c.fillStyle=pat(c,bw,1);c.fillRect(0,0,S,22);c.fillStyle='rgba(0,0,0,.45)';c.fillRect(0,22,S,4);
    c.fillStyle='rgba(220,220,230,.08)';for(let i=0;i<4;i++){c.beginPath();c.moveTo(i*64,26);c.quadraticCurveTo(i*64+20,40,i*64+40,26);c.lineWidth=1;c.strokeStyle='rgba(220,220,230,.12)';c.stroke()}
    c.fillStyle='#120c08';c.fillRect(0,H-6,S,6);
  }else if(kind==='stone'){
    const raw=stoneTex('wallstone',[78,82,90],256,30,50,110,{mortar:2.5,moss:.7});cv=(()=>{const o=mkCanvas(S,H),c=o.getContext('2d');c.drawImage(raw,0,0);
      const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,30,20,.35)');c.fillStyle=g;c.fillRect(0,0,S,H);return o})();
  }else if(kind==='brick'){
    const raw=stoneTex('brick',[122,62,46],256,16,36,46,{mortar:2,mortCol:[.62,.62,.62]});cv=mkCanvas(S,H);const c=cv.getContext('2d');c.drawImage(raw,0,0);
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(5,3,2,.6)');g.addColorStop(.5,'rgba(5,3,2,.1)');g.addColorStop(1,'rgba(5,3,2,.3)');c.fillStyle=g;c.fillRect(0,0,S,H);
  }else{ // glass greenhouse wall
    cv=mkCanvas(S,H);const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1626');g.addColorStop(.7,'#16263a');g.addColorStop(1,'#0a120e');c.fillStyle=g;c.fillRect(0,0,S,H);
    const r=srng(9);for(let i=0;i<30;i++){c.fillStyle='rgba(220,230,255,'+(.2+r()*.5)+')';c.fillRect(r()*S,r()*H*.5,1,1)}
    for(let i=0;i<14;i++){const x=r()*S,y=H*.62+r()*H*.3,rr2=10+r()*22;c.fillStyle='rgba(8,18,12,.95)';c.beginPath();c.arc(x,y,rr2,0,TAU);c.fill()}
    c.fillStyle='rgba(160,200,255,.05)';c.beginPath();c.moveTo(0,H);c.lineTo(60,0);c.lineTo(90,0);c.lineTo(30,H);c.fill();
    c.strokeStyle='#1c2226';c.lineWidth=5;for(let x=0;x<=S;x+=64){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}c.lineWidth=3;for(let y=30;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(S,y);c.stroke()}
    c.strokeStyle='rgba(180,200,210,.18)';c.lineWidth=1;for(let x=0;x<=S;x+=64){c.beginPath();c.moveTo(x-2,0);c.lineTo(x-2,H);c.stroke()}
    c.fillStyle='#262a2a';c.fillRect(0,H-14,S,14);c.fillStyle='rgba(255,255,255,.06)';c.fillRect(0,H-14,S,1);
  }
  return TEX[key]=cv;
}
function capTex(ch){const key='cap_'+ch.wallf;if(TEX[key])return TEX[key];const b=hexRgb(ch.trim);
  return TEX[key]=pixelTex(128,128,(x,y,o)=>{const n=fbm(x,y,16,128,4);const k=.8+n*.5;o[0]=cl8(b[0]*k+6);o[1]=cl8(b[1]*k+5);o[2]=cl8(b[2]*k+5);o[3]=255})}
function fogTex(){if(TEX.fog)return TEX.fog;return TEX.fog=pixelTex(256,256,(x,y,o)=>{const n=fbm(x,y,64,256,4);const v=Math.max(0,n-.35)/.65;o[0]=200;o[1]=205;o[2]=215;o[3]=cl8(v*v*255)})}
function grainTex(){if(TEX.grain)return TEX.grain;const r=srng(4);return TEX.grain=pixelTex(128,128,(x,y,o)=>{const v=r()*255;o[0]=v;o[1]=v;o[2]=v;o[3]=26})}

/* ---------- procedural art (everything is drawn in code) ---------- */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mix(a,b,t){const A=hexRgb(a),B=hexRgb(b);const h=v=>('0'+Math.max(0,Math.min(255,v|0)).toString(16)).slice(-2);return'#'+h(A[0]+(B[0]-A[0])*t)+h(A[1]+(B[1]-A[1])*t)+h(A[2]+(B[2]-A[2])*t)}
function shade(h,a){return a<0?mix(h,'#000000',-a):mix(h,'#ffffff',a)}
function rgba(h,a){const c=hexRgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
const _hexA={};function hexA(h,a){const k=h+a;if(_hexA[k])return _hexA[k];return _hexA[k]=rgba(h,a)}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);c.fill()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fill()}
function softShadow(c,x,y,rx,ry,a){const g=c.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(.6,'rgba(0,0,0,'+a*.55+')');g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.translate(x,y);c.scale(1,ry/rx);c.translate(-x,-y);c.fillStyle=g;c.beginPath();c.arc(x,y,rx,0,TAU);c.fill();c.restore()}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x,y,x-s*.5,y-s*.05,x-s*.5,y+s*.32);c.bezierCurveTo(x-s*.5,y+s*.62,x-s*.1,y+s*.78,x,y+s*.95);c.bezierCurveTo(x+s*.1,y+s*.78,x+s*.5,y+s*.62,x+s*.5,y+s*.32);c.bezierCurveTo(x+s*.5,y-s*.05,x,y,x,y+s*.35);c.closePath()}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}c.closePath()}
function gearPath(c,r,n){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr2=i%2?r*.8:r;c.lineTo(Math.cos(a-.13)*rr2,Math.sin(a-.13)*rr2);c.lineTo(Math.cos(a+.13)*rr2,Math.sin(a+.13)*rr2)}c.closePath()}
function lin(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of stops)g.addColorStop(s[0],s[1]);return g}
function rad(c,x,y,r0,r1,stops,ox,oy){const g=c.createRadialGradient(x+(ox||0),y+(oy||0),r0,x,y,r1);for(const s of stops)g.addColorStop(s[0],s[1]);return g}

/* ================= Lumi ================= */
function drawLumi(c,x,y,aim,t,skinId,mv,s,flash){
  const sk=SKIN[skinId]||SKINS[0];s=s||1;
  c.save();c.translate(x,y);c.scale(s,s);c.lineCap='round';c.lineJoin='round';
  const step=mv?Math.sin(t*11):0,bob=mv?Math.abs(step)*1.1:Math.sin(t*2.4)*.35;
  softShadow(c,0,12,14,5,.6);
  const ax=Math.cos(aim),ay=Math.sin(aim),up=ay<-.4;
  // legs + boots
  for(const sd of[-1,1]){const lo=step*sd;c.fillStyle='#24222b';rr(c,sd*4.3-2.6,3.5+lo*.6-bob,5.2,8.5,2.2);c.fill();
    ell(c,sd*4.3,12.2+lo*1.2,3.5,2.4,'#2a1c14');ell(c,sd*4.3-.8,11.6+lo*1.2,1.3,.7,'rgba(255,230,200,.18)')}
  c.translate(0,-bob);
  if(sk.id==='vamp'){c.fillStyle=lin(c,0,-10,0,14,[[0,'#1a1220'],[1,'#0c0810']]);c.beginPath();c.moveTo(-10,-9);c.quadraticCurveTo(-17,6,-15,15);c.quadraticCurveTo(0,18,15,15);c.quadraticCurveTo(17,6,10,-9);c.closePath();c.fill()}
  if(up)lumiArm(c,sk,ax,ay);
  // coat
  c.beginPath();c.moveTo(-8.6,-9);c.quadraticCurveTo(-11,-7,-11,-3);c.lineTo(-12,8);c.quadraticCurveTo(0,11,12,8);c.lineTo(11,-3);c.quadraticCurveTo(11,-7,8.6,-9);c.quadraticCurveTo(0,-11,-8.6,-9);c.closePath();
  c.fillStyle=lin(c,-12,0,12,0,[[0,shade(sk.coat,.18)],[.45,sk.coat],[1,shade(sk.coat,-.42)]]);c.fill();
  c.fillStyle=lin(c,0,-10,0,10,[[0,'rgba(255,255,255,.10)'],[.6,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.35)']]);c.fill();
  c.save();c.clip();
  c.fillStyle=shade(sk.coat,-.25);c.fillRect(-13,6.5,26,4);
  if(sk.id==='skelly'){c.strokeStyle='rgba(225,220,205,.8)';c.lineWidth=1.3;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-7,-4+i*3.4);c.quadraticCurveTo(0,-2+i*3.4,7,-4+i*3.4);c.stroke()}c.beginPath();c.moveTo(0,-7);c.lineTo(0,7);c.stroke()}
  if(sk.id==='astro'){c.fillStyle='#7d8798';rr(c,-5,-3,10,6,1.5);c.fill();circ(c,-2.4,0,1,'#c33');circ(c,.6,0,1,'#3a6');circ(c,3,0,1,'#dc3')}
  if(!up&&sk.id!=='astro'&&sk.id!=='skelly'){c.strokeStyle=shade(sk.coat,-.5);c.lineWidth=.8;c.beginPath();c.moveTo(.4,-8);c.lineTo(.8,9);c.stroke();
    for(const yy of[-4,0,4])circ(c,2.2,yy,.9,shade(sk.trim,-.2));c.beginPath();c.moveTo(-8,3);c.lineTo(-4,3.4);c.stroke()}
  c.restore();
  // head
  const hx=ax*.8,hy=-15;
  if(sk.id==='vamp'){c.fillStyle='#5a1020';c.beginPath();c.moveTo(-9,-10);c.lineTo(-11,-19);c.lineTo(-4,-12);c.closePath();c.fill();c.beginPath();c.moveTo(9,-10);c.lineTo(11,-19);c.lineTo(4,-12);c.closePath();c.fill()}
  const hoodCol=sk.id==='skelly'?'#1c1c22':sk.coat;
  const noHood=['pumpkin','witch','astro','vamp'].includes(sk.id);
  if(!noHood){c.fillStyle=rad(c,hx,hy,1,9.5,[[0,shade(hoodCol,.15)],[.75,hoodCol],[1,shade(hoodCol,-.45)]],-3,-3);c.beginPath();c.arc(hx,hy,9,0,TAU);c.fill()}
  else{c.fillStyle=rad(c,hx,hy+1,1,8,[[0,'#e2bb9c'],[1,'#a77a5e']],-2,-2);c.beginPath();c.arc(hx,hy+1,7.4,0,TAU);c.fill();
    c.fillStyle=sk.id==='vamp'?'#141016':'#4a2e1e';c.beginPath();c.arc(hx,hy,7.8,Math.PI*1.02,Math.PI*1.98);c.quadraticCurveTo(hx+3,hy-1,hx-1,hy-.5);c.closePath();c.fill()}
  if(!up){const fx=hx+ax*1.8,fy=hy+1+ay*.9;
    if(!noHood){c.fillStyle='#0e0b0e';c.beginPath();c.ellipse(fx,fy,6,6.3,0,0,TAU);c.fill()}
    c.fillStyle=rad(c,fx,fy+1,.5,6,[[0,'#ecc8aa'],[.8,'#c4977a'],[1,'#7a5848']],-1,-2);c.beginPath();c.ellipse(fx,fy+.6,4.7,5,0,0,TAU);c.fill();
    if(!noHood){c.fillStyle='#3a2418';c.beginPath();c.ellipse(fx,fy-3.4,4.6,2,0,Math.PI,TAU);c.fill();c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(fx,fy-2.6,5,2.2,0,Math.PI,TAU);c.fill()}
    const ex=ax*1.1,ey=ay*.6;for(const sd of[-1,1]){ell(c,fx+sd*1.9+ex,fy+.2+ey,.95,1.15,'#1b1512');circ(c,fx+sd*1.9+ex+.35,fy-.2+ey,.32,'rgba(255,255,255,.8)')}
    c.strokeStyle='rgba(120,60,50,.5)';c.lineWidth=.6;c.beginPath();c.moveTo(fx-1+ax,fy+3+ey);c.lineTo(fx+1+ax,fy+3+ey);c.stroke()}
  else if(!noHood){c.strokeStyle=shade(hoodCol,-.4);c.lineWidth=.8;c.beginPath();c.moveTo(hx,hy-8);c.quadraticCurveTo(hx+.5,hy,hx,hy+7);c.stroke()}
  lumiHat(c,sk,hx,hy,t);
  if(!up)lumiArm(c,sk,ax,ay);
  if(flash){c.globalAlpha=flash;c.fillStyle='#fff';rr(c,-13,-26,26,40,10);c.fill();c.globalAlpha=1}
  c.restore();
}
function lumiArm(c,sk,ax,ay){
  const sd=ax>=0?1:-1,sx=sd*8.4,sy=-6,hx=sx+ax*7.5,hy=sy+ay*5+2.5;
  c.strokeStyle=shade(sk.coat,-.2);c.lineWidth=4.6;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();
  c.strokeStyle=shade(sk.coat,.08);c.lineWidth=1.4;c.beginPath();c.moveTo(sx-.6,sy-1.2);c.lineTo(hx-.6,hy-1.2);c.stroke();
  c.save();c.translate(hx,hy);c.rotate(Math.atan2(ay,ax));
  c.fillStyle=lin(c,0,-2.4,0,2.4,[[0,'#8d929e'],[.35,'#d8dbe2'],[.6,'#5a5f6c'],[1,'#2a2d36']]);rr(c,-1,-2.2,12,4.4,1.4);c.fill();
  c.fillStyle=lin(c,0,-3.2,0,3.2,[[0,'#6e7380'],[.4,'#c4c8d0'],[1,'#22252c']]);rr(c,10.5,-3.2,4.4,6.4,1.2);c.fill();
  c.fillStyle='#fff8dc';c.beginPath();c.ellipse(15,0,1.1,2.6,0,0,TAU);c.fill();
  c.fillStyle='#d8a888';c.beginPath();c.arc(1.5,0,2.4,0,TAU);c.fill();c.restore();
}
function lumiHat(c,sk,hx,hy,t){
  switch(sk.id){
    case 'pumpkin':c.fillStyle=lin(c,0,hy-14,0,hy-3,[[0,'#d07a38'],[1,'#7a3a12']]);c.beginPath();c.ellipse(hx,hy-5,8.6,7.4,0,Math.PI,TAU);c.lineTo(hx+8.6,hy-3);c.lineTo(hx-8.6,hy-3);c.closePath();c.fill();
      c.strokeStyle='rgba(60,25,8,.45)';c.lineWidth=.7;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(hx+i*2.2,hy-3);c.lineTo(hx+i*2,hy-10);c.stroke()}
      c.fillStyle='#5e2a0c';c.fillRect(hx-8.8,hy-4.2,17.6,2.4);circ(c,hx,hy-12.6,2.6,'#e8a86a');break;
    case 'witch':c.fillStyle=rad(c,hx,hy-4,1,14,[[0,'#3a3046'],[1,'#141018']]);c.beginPath();c.ellipse(hx,hy-4,13,4.6,0,0,TAU);c.fill();
      c.fillStyle=lin(c,hx-6,0,hx+6,0,[[0,'#3a3046'],[1,'#120e16']]);c.beginPath();c.moveTo(hx-6.5,hy-5);c.quadraticCurveTo(hx-2,hy-16,hx+5,hy-27);c.quadraticCurveTo(hx+3,hy-15,hx+6.5,hy-5);c.closePath();c.fill();
      c.fillStyle='#6a4a2a';c.fillRect(hx-6.5,hy-8,13,2.2);break;
    case 'astro':c.fillStyle=rad(c,hx,hy,2,11,[[0,'#f2f4f8'],[.8,'#c4c8d2'],[1,'#7c8494']],-3,-4);c.beginPath();c.arc(hx,hy,10.6,0,TAU);c.fill();
      c.fillStyle=lin(c,hx-6,hy-5,hx+6,hy+5,[[0,'#3a4a66'],[.5,'#10141e'],[1,'#26324a']]);c.beginPath();c.ellipse(hx,hy+1,7.2,6,0,0,TAU);c.fill();
      c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(hx-3,hy-2,2.4,1.2,-.6,0,TAU);c.fill();break;
    case 'dino':c.fillStyle='#8aa850';for(let i=-2;i<=2;i++){const a=-Math.PI/2+i*.42,x=hx+Math.cos(a)*8.6,y=hy+Math.sin(a)*8.6;c.beginPath();c.moveTo(x-2.6*Math.sin(a),y+2.6*Math.cos(a));c.lineTo(x+Math.cos(a)*4.4,y+Math.sin(a)*4.4);c.lineTo(x+2.6*Math.sin(a),y-2.6*Math.cos(a));c.closePath();c.fill()}break;
    case 'skelly':c.fillStyle='rgba(225,220,205,.85)';c.beginPath();c.ellipse(hx,hy-6,3.6,2.8,0,0,TAU);c.fill();circ(c,hx-1.3,hy-6.2,.8,'#1c1c22');circ(c,hx+1.3,hy-6.2,.8,'#1c1c22');break;
    case 'golden':c.fillStyle=lin(c,0,hy-16,0,hy-8,[[0,'#ffe9a0'],[1,'#a87818']]);c.beginPath();c.moveTo(hx-6,hy-8);c.lineTo(hx-6,hy-14);c.lineTo(hx-3,hy-11);c.lineTo(hx,hy-16);c.lineTo(hx+3,hy-11);c.lineTo(hx+6,hy-14);c.lineTo(hx+6,hy-8);c.closePath();c.fill();break;
  }
}

/* ================= ghosts ================= */
function sheetPath(c,r,h,t,ph,n,sharp){
  c.beginPath();c.moveTo(-r,0);c.arc(0,0,r,Math.PI,0);c.lineTo(r,h);
  for(let i=0;i<n;i++){const x1=r-(i+.5)*(2*r/n),x2=r-(i+1)*(2*r/n),w=Math.sin(t*6+ph+i*1.7)*r*.12;
    if(sharp){c.lineTo(x1,h+r*.4+w);c.lineTo(x2,h)}else c.quadraticCurveTo(x1,h+r*.36+w,x2,h)}
  c.closePath()}
function wispPath(c,r,t,ph){const sw=Math.sin(t*4+ph)*r*.55;c.beginPath();c.moveTo(-r,0);c.arc(0,0,r,Math.PI,0);
  c.quadraticCurveTo(r*.95,r*1.05,sw,r*2.1);c.quadraticCurveTo(-r*.95,r*1.05,-r,0);c.closePath()}
function specterPath(c,r,hl,t,ph,n,rag,wide){
  wide=wide||1.08;const H=hl*r;c.beginPath();c.moveTo(-r,0);c.arc(0,0,r,Math.PI,0);
  c.bezierCurveTo(r*1.02,r*.7,r*wide+Math.sin(t*2+ph)*r*.08,H*.7,r*wide*.98,H);
  for(let i=0;i<n;i++){const x=r*wide-(i+.5)*(2*wide*r/n),x2=r*wide-(i+1)*(2*wide*r/n),w=Math.sin(t*3.1+ph+i*1.9)*r*.16,len=r*rag*(.55+.45*Math.abs(Math.sin(i*2.3+ph)));
    c.quadraticCurveTo(x+w*.4+r*.08,H+len*.6,x+w,H+len);c.quadraticCurveTo(x+w*.2-r*.06,H+len*.5,x2,H+Math.sin(t*2+i)*r*.05)}
  c.bezierCurveTo(-r*wide-Math.sin(t*2+ph+1)*r*.08,H*.7,-r*1.02,r*.7,-r,0);c.closePath()}
function ghostShape(c,g,t){const r=g.r,lk=g.look||g.tp;
  if(lk==='wisp'||lk==='mini'||lk==='golden'||lk==='mote')wispPath(c,r,t,g.ph);
  else if(lk==='shade')specterPath(c,r*.8,1.5,t,g.ph,5,.5,.9);
  else if(lk==='wailer')specterPath(c,r*.85,2.1,t,g.ph,6,.6,1);
  else if(lk==='moaner')specterPath(c,r,1.3,t,g.ph,5,.45,1.25);
  else specterPath(c,r,g.boss?1.2:1.1,t,g.ph,g.boss?8:6,.5)}
function ghostScale(g){const F=clamp(g.fear/g.hp,0,1);return{F,sc:(1-F*(g.boss?.1:.22))*(g.spawnT>0?.5+.5*(1-g.spawnT/(g.spawnMax||.9)):1)}}
function socket(c,x,y,rx,ry,a){c.fillStyle=rad(c,x,y,0,Math.max(rx,ry),[[0,'rgba(4,4,10,'+a+')'],[.65,'rgba(4,4,10,'+a*.75+')'],[1,'rgba(4,4,10,0)']]);c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill()}
function ghostFace(c,g,r,F,t){
  const lk=g.look||g.tp,a=.85;
  if(lk==='shade'||lk==='drinker')return;
  const ey=-r*.12,ex=r*.33,sx=r*.17*(1+F*.25),sy=r*.23*(1+F*.35);
  if(lk==='peeker'){socket(c,ex,ey,sx,sy,a);}
  else{socket(c,-ex,ey,sx,sy,a);socket(c,ex,ey,sx,sy,a)}
  const scream=F+(g.charging||g.wailT>0?.6:0);
  socket(c,0,r*.36,r*(.1+scream*.06),r*(.1+Math.min(1,scream)*.3),.8);
}
function drawTrail(c,g){if(!g.tr||g.tr.length<2)return;const col=g.col;for(let i=0;i<g.tr.length;i++){const p=g.tr[i],a=(i+1)/g.tr.length*.12*g.alpha;c.fillStyle=hexA(col,a.toFixed(3));c.beginPath();c.ellipse(p[0],p[1]-g.r*.2,g.r*.8,g.r*1.1,0,0,TAU);c.fill()}}
function drawGhostBody(c,g,t){
  if(g.hidden){drawCandleObj(c,g.x,g.y+6,t,g.ph,1);return}
  const {F,sc}=ghostScale(g);const r=g.r,lk=g.look||g.tp;
  drawTrail(c,g);
  const bob=Math.sin(t*2.6+g.ph)*r*.12,sh=g.lit?(Math.random()-.5)*r*.1:0;
  c.save();c.translate(g.x,g.y);
  softShadow(c,0,r*1.5,r*.9*sc,r*.28*sc,.35*g.alpha);
  c.translate(sh,bob-r*.25);c.scale(sc*(1-F*.06),sc*(1+F*.12));
  const al=g.alpha*(g.lit?.9:.7),col=g.elite?mix(g.col,'#e8c060',.25):g.col;
  const body=g.hitT>0?'#ffffff':mix(col,'#f4f6ff',F*.6);
  c.globalAlpha=1;
  switch(lk){
    case 'drinker':{for(let i=0;i<7;i++){const a=t*.8+i*.9+g.ph,d=r*(.35+.25*Math.sin(t*1.7+i)),x=Math.cos(a)*d,y=Math.sin(a)*d*.8;c.fillStyle=rad(c,x,y,0,r*.9,[[0,'rgba(8,6,12,'+(.75*al)+')'],[1,'rgba(8,6,12,0)']]);c.beginPath();c.arc(x,y,r*.9,0,TAU);c.fill()}
      c.strokeStyle='rgba(10,8,14,'+(.6*al)+')';c.lineWidth=2;for(let i=0;i<5;i++){const a=i*1.3+t;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(Math.cos(a)*r*1.2,Math.sin(a)*r*1.2+r*.4,Math.cos(a+.6)*r*1.7,Math.sin(a+.6)*r*1.5+r*.8);c.stroke()}break}
    case 'shade':{c.fillStyle=lin(c,0,-r,0,r*1.9,[[0,'rgba(18,14,24,'+(.95*g.alpha)+')'],[.7,'rgba(18,14,24,'+(.8*g.alpha)+')'],[1,'rgba(18,14,24,0)']]);ghostShape(c,g,t);c.fill();
      c.fillStyle='rgba(18,14,24,'+(.95*g.alpha)+')';c.beginPath();c.arc(0,-r*.95,r*.42,0,TAU);c.fill();
      c.strokeStyle='rgba(140,110,190,'+(.25*g.alpha)+')';c.lineWidth=1.4;ghostShape(c,g,t);c.stroke();break}
    case 'pumpkin':{c.fillStyle=lin(c,0,0,0,r*1.8,[[0,'rgba(30,24,22,'+(.9*g.alpha)+')'],[1,'rgba(30,24,22,0)']]);specterPath(c,r*.85,1,t,g.ph,6,.6,1.1);c.fill();
      c.save();c.translate(0,-r*.35);for(let i=-2;i<=2;i++){c.fillStyle=lin(c,i*r*.3-r*.4,0,i*r*.3+r*.4,0,[[0,'#6a2c0c'],[.5,i===0?'#d8762a':'#b85e20'],[1,'#5a240a']]);c.beginPath();c.ellipse(i*r*.3,0,r*.42,r*.78,0,0,TAU);c.fill()}
      c.fillStyle='rgba(255,220,150,.12)';c.beginPath();c.ellipse(-r*.3,-r*.35,r*.25,r*.14,-.4,0,TAU);c.fill();c.fillStyle='#3a4a1a';rr(c,-r*.08,-r*1.02,r*.16,r*.3,2);c.fill();
      c.fillStyle='#1a0a02';for(const sd of[-1,1]){c.beginPath();c.moveTo(sd*r*.52,-r*.04);c.lineTo(sd*r*.18,-r*.04);c.lineTo(sd*r*.35,-r*(.36+F*.1));c.closePath();c.fill()}
      c.beginPath();c.moveTo(-r*.5,r*.2);c.lineTo(-r*.28,r*.34);c.lineTo(-r*.12,r*.22);c.lineTo(0,r*.36);c.lineTo(r*.12,r*.22);c.lineTo(r*.28,r*.34);c.lineTo(r*.5,r*.2);c.quadraticCurveTo(0,r*(.62+F*.15),-r*.5,r*.2);c.fill();c.restore();break}
    case 'mimic':{c.fillStyle=lin(c,0,-r,0,r*1.8,[[0,rgba('#efe4c8',al)],[.7,rgba('#d8c8a0',al*.8)],[1,'rgba(216,200,160,0)']]);specterPath(c,r,1,t,g.ph,6,.7,1.05);c.fill();
      c.fillStyle=rgba('#f6eed8',.7*al);for(let i=0;i<4;i++){const x=-r*.7+i*r*.45;rr(c,x,-r*.2,r*.14,r*(.6+.3*Math.sin(i*2.1)),r*.07);c.fill()}
      ghostFace(c,g,r,F,t);break}
    case 'flitter':case 'mote':{const fl=Math.sin(t*(lk==='mote'?30:22)+g.ph);c.fillStyle=rgba('#e8dcd0',.45*al);c.strokeStyle=rgba('#ffffff',.25*al);c.lineWidth=.7;
      for(const sd of[-1,1]){c.beginPath();c.moveTo(sd*r*.3,-r*.1);c.bezierCurveTo(sd*r*1.3,-r*(1.1+fl*.5),sd*r*2.1,-r*(.4+fl*.4),sd*r*1.4,r*.35);c.quadraticCurveTo(sd*r*.9,r*.5,sd*r*.3,r*.2);c.closePath();c.fill();c.stroke();
        c.beginPath();c.moveTo(sd*r*.4,0);c.lineTo(sd*r*1.4,-r*(.6+fl*.4));c.moveTo(sd*r*.4,r*.1);c.lineTo(sd*r*1.5,r*.1);c.stroke()}
      c.fillStyle=lin(c,0,-r,0,r*2,[[0,rgba(body,al)],[1,'rgba(230,220,230,0)']]);wispPath(c,r*.7,t,g.ph);c.fill();if(lk==='flitter')ghostFace(c,g,r*.7,F,t);break}
    default:{
      if(lk==='moth'){c.fillStyle=rgba('#a89276',.7*al);for(const sd of[-1,1]){c.beginPath();c.ellipse(sd*r*1.05,-r*.1,r*.8,r*.58+Math.sin(t*5)*r*.05,sd*.5,0,TAU);c.fill();c.fillStyle=rgba('#4a3a5a',.7*al);c.beginPath();c.arc(sd*r*1.15,-r*.15,r*.18,0,TAU);c.fill();c.fillStyle=rgba('#a89276',.7*al)}}
      const H=r*2.2;
      c.fillStyle=lin(c,0,-r,0,H,[[0,rgba(body,.92*al)],[.45,rgba(body,.75*al)],[1,rgba(body,0)]]);ghostShape(c,g,t);c.fill();
      c.fillStyle=rad(c,0,-r*.3,0,r*1.1,[[0,'rgba(255,255,255,'+(.22*al)+')'],[1,'rgba(255,255,255,0)']]);c.beginPath();c.arc(0,-r*.3,r*1.1,0,TAU);c.fill();
      if(lk==='sheet'||g.boss){c.save();ghostShape(c,g,t);c.clip();c.lineWidth=r*.12;for(let i=-2;i<=2;i++){const x=i*r*.42+Math.sin(t*1.5+i)*r*.05;c.strokeStyle=lin(c,0,0,0,H,[[0,'rgba(0,0,0,0)'],[.4,'rgba(40,40,60,'+(.12*al)+')'],[1,'rgba(40,40,60,0)']]);c.beginPath();c.moveTo(x*.4,r*.3);c.quadraticCurveTo(x*.9,H*.5,x*1.1,H);c.stroke()}c.restore()}

    c.fillStyle='rgba(255,'+(180+fl*50|0)+',80,'+(.85*fl)+')';for(const sd of[-1,1]){c.beginPath();c.moveTo(sd*r*.48,-r*.06);c.lineTo(sd*r*.22,-r*.06);c.lineTo(sd*r*.35,-r*(.32+F*.1));c.closePath();c.fill()}
    c.beginPath();c.moveTo(-r*.46,r*.22);c.lineTo(-r*.28,r*.34);c.lineTo(-r*.12,r*.24);c.lineTo(0,r*.36);c.lineTo(r*.12,r*.24);c.lineTo(r*.28,r*.34);c.lineTo(r*.46,r*.22);c.quadraticCurveTo(0,r*(.58+F*.15),-r*.46,r*.22);c.fill();c.globalCompositeOperation='source-over'}

  else if(lk==='mote'){c.globalCompositeOperation='lighter';c.fillStyle=rad(c,0,0,0,r*1.8,[[0,'rgba(255,240,180,.55)'],[1,'rgba(255,240,180,0)']]);c.beginPath();c.arc(0,0,r*1.8,0,TAU);c.fill();circ(c,0,0,r*.25,'#fff8d8');c.globalCompositeOperation='source-over'}
  else if(lk==='golden'){c.globalCompositeOperation='lighter';c.fillStyle=rad(c,0,0,0,r*2.4,[[0,'rgba(255,210,110,.6)'],[1,'rgba(255,210,110,0)']]);c.beginPath();c.arc(0,0,r*2.4,0,TAU);c.fill();c.globalCompositeOperation='source-over';
    c.fillStyle=lin(c,0,-r,0,r*2,[[0,'rgba(255,236,170,.95)'],[1,'rgba(255,200,90,0)']]);wispPath(c,r,t,g.ph);c.fill();pin(-r*.3,-r*.1,r*.08);pin(r*.3,-r*.1,r*.08)}
  else if(lk==='shade'){pin(-r*.2,-r*.98,r*.06);pin(r*.2,-r*.98,r*.06)}

  else{const s=r*(lk==='flitter'?.06:.075)*(g.boss?.8:1),k=lk==='flitter'?.7:1;pin(-r*.33*k,-r*.12*k,s);pin(r*.33*k,-r*.12*k,s)}

function makeRoom(n,info,opt){

    if(opt.rt==='shrine'&&Math.hypot(cx-ROOM_W/2,cy-ROOM_H*.42)<w/2+110)return false;

  let budget=R.mode==='story'?(6+n*1.7+c*2.8)*R.dd:(7+n*1.5+Math.pow(n,1.25)*.4)*R.dd*(1+n*.025);
  let pool=poolFor(rm);

  const nw=swarm?4:n<3?2:(n<7&&R.mode==='story')?2:3;
  const waves=[];for(let i=0;i<nw;i++)waves.push({e:[],pat:null});
  let eliteP=(R.mode==='story'?c*.035+n*.004:Math.min(.25,n*.008))+(rm.tw==='haunt'?.3:0);
  const theme=swarm||n<3?'mixed':wpick([['mixed',58],['mono',24],['elite',18]]);
  const monoTp=wpick(pool.filter(p=>p[0]!=='mote'));
  if(theme==='mono')budget*=1.1;
  let i=0;
  if(theme==='elite'){const strong=pool.filter(p=>GT[p[0]].cost>=2);const tp=strong.length?wpick(strong):'sheet';waves[nw-1].e.push({tp,elite:true});budget-=GT[tp].cost*2.4}

/* ---------- line of sight (furniture blocks light) ---------- */
function segRect(x1,y1,x2,y2,f){const m=4,minX=f.x+m,maxX=f.x+f.w-m,minY=f.y+m,maxY=f.y+f.h-m;let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
  const p=[-dx,dx,-dy,dy],q=[x1-minX,maxX-x1,y1-minY,maxY-y1];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return false}else{const r=q[i]/p[i];if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}return true}
function losClear(x1,y1,x2,y2){for(const f of room.furn)if(segRect(x1,y1,x2,y2,f))return false;return true}
function seesGhost(g){const dx=g.x-P.x,dy=g.y-P.y,d=Math.hypot(dx,dy)||1,k=Math.max(0,d-g.r*.8)/d;return losClear(P.x,P.y,P.x+dx*k,P.y+dy*k)}

/* ---------- player ---------- */
function moveInput(){let mx=0,my=0;
  if(KEY.KeyA||KEY.ArrowLeft||KEY.KeyQ)mx--;if(KEY.KeyD||KEY.ArrowRight)mx++;if(KEY.KeyW||KEY.ArrowUp||KEY.KeyZ)my--;if(KEY.KeyS||KEY.ArrowDown)my++;
  if(stick.on){mx=stick.dx;my=stick.dy}
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}return[mx,my,Math.min(1,m)]}
function doDash(){
  if(P.dashCd>0||P.dash>0)return;
  let [mx,my,m]=moveInput();if(m<.2){mx=Math.cos(P.aim);my=Math.sin(P.aim)}else{const k=Math.hypot(mx,my);mx/=k;my/=k}
  P.dash=.19;P.dashCd=P.dashCdMax;P.dvx=mx*P.speed*3.3;P.dvy=my*P.speed*3.3;P.inv=Math.max(P.inv,.28);
  R.dashes++;mProg('dash',1);SFX.dash();puff(P.x,P.y+8,10,'#6a6070',6);
}
function collideRect(o,f){
  const cx=clamp(o.x,f.x,f.x+f.w),cy=clamp(o.y,f.y+4,f.y+f.h);const dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
  if(d2>=o.r*o.r)return;
  if(d2>0){const d=Math.sqrt(d2);o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r}
  else{const l=o.x-f.x,r=f.x+f.w-o.x,u=o.y-f.y,b=f.y+f.h-o.y,m=Math.min(l,r,u,b);if(m===l)o.x=f.x-o.r;else if(m===r)o.x=f.x+f.w+o.r;else if(m===u)o.y=f.y-o.r;else o.y=f.y+f.h+o.r}
}
function updPlayer(dt){

  const sug=(L('sugar')&&R.combo>=5)?1+.1*L('sugar'):1;

    if(L('salt')){P.saltT-=dt;if(P.saltT<=0){P.saltT=.025;HZ.push({k:'salt',x:P.x+rand(-6,6),y:P.y+8+rand(-4,4),t:0,dur:2.6,dps:(10+6*L('salt'))*P.pw})}}
    if(Math.random()<.6)FX.push({x:P.x,y:P.y,vx:0,vy:0,t:0,dur:.25,sz:14,col:'rgba(160,150,190,.25)',k:'ghostimg'});
  }else{const sp=P.speed*sug;const k=1-Math.exp(-(room.tw==='cold'?3.2:16)*dt);P.vx=lerp(P.vx,mx*sp,k);P.vy=lerp(P.vy,my*sp,k);P.x+=P.vx*dt;P.y+=P.vy*dt}

  P.x=clamp(P.x,P.r,ROOM_W-P.r);

  P.y=clamp(P.y,minY,ROOM_H-P.r);
  P.dashCd-=dt;P.inv-=dt;P.t+=dt*(P.mv?1:.5);
  if(room.tw==='cold'&&Math.random()<dt*1.2)FX.push({x:P.x+Math.cos(P.aim)*6,y:P.y-16,vx:Math.cos(P.aim)*20,vy:-12,t:0,dur:1,sz:5,col:'#c8d8e8',k:'mist'});
  // aim
  let target=null;
  if(!touchMode&&performance.now()-mouse.last<2600){const w=screenToWorld(mouse.x,mouse.y);target=Math.atan2(w.y-P.y,w.x-P.x)}
  else{let best=null,bs=1e9;
    for(const g of G){if(g.dead||g.spawnT>0||g.hidden||(g.tp==='peeker'&&!g.lit&&dist2(g.x,g.y,P.x,P.y)>250*250))continue;
      const dx=g.x-P.x,dy=g.y-P.y,d=Math.hypot(dx,dy);if(d>P.beamLen*1.45)continue;
      const ad=Math.abs(angDiff(Math.atan2(dy,dx),P.aim));let sc=d*(1+ad*.55)-(g.boss?60:0)-(g.tp==='golden'?120:0)-(g.tele>0||g.wailT>0?80:0)-(g.tp==='drinker'?50:0);if(!seesGhost(g))sc+=400;if(sc<bs){bs=sc;best=g}}
    if(!best&&room.poss!==false)for(const f of room.furn)if(f.poss&&!f.poss.done){const fx=f.x+f.w/2,fy=f.y+f.h/2,d=Math.hypot(fx-P.x,fy-P.y);if(d<P.beamLen*1.3&&d<bs){bs=d;best={x:fx,y:fy}}}
    if(best)target=Math.atan2(best.y-P.y,best.x-P.x);else if(m>.1)target=Math.atan2(my,mx)}
  if(target!=null){const d=angDiff(target,P.aim),mt=(touchMode?8:11)*dt;P.aim+=clamp(d,-mt,mt)}
}

function scareAll(rad,f){BURSTS.push({x:P.x,y:P.y,r:rad,t:0,dur:.6,col:'255,250,235'});flash(255,250,235,.45);

/* ---------- light ---------- */
function getBeams(){
  let lm=R.lamp*(1-.38*R.drain)*(room.tw==='fog'?.84:1),dm=R.lamp*(1-.3*R.drain);
  const b=[{a:P.aim,len:P.beamLen*lm,ang:P.beamAng,dps:P.dps*dm,main:true}];
  if(L('twin'))b.push({a:P.aim+Math.PI,len:P.beamLen*(.5+.12*L('twin'))*lm,ang:P.beamAng*.8,dps:P.dps*(.45+.15*L('twin'))*dm});
  if(L('prism')){const off=P.beamAng*2+.14;for(const s of[-1,1])b.push({a:P.aim+s*off,len:P.beamLen*.82*lm,ang:P.beamAng*.6,dps:P.dps*(.35+.15*L('prism'))*dm})}
  return b}
function inBeam(b,x,y,r){if(b.len<=1)return 0;const dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy);if(d>b.len+r)return 0;if(d<r)return 1;
  const half=b.ang+Math.asin(Math.min(1,r/d));return Math.abs(angDiff(Math.atan2(dy,dx),b.a))<half?(1+.5*(1-Math.min(1,d/b.len))):0}
function auraR(){return L('aura')?52+14*L('aura'):0}
function applyLight(dt){
  const beams=getBeams();R.beams=beams;
  const sug=(L('sugar')&&R.combo>=5)?1+.12*L('sugar'):1;
  const ar=auraR(),ad=(4+3*L('aura'))*P.pw,fd=(8+4*L('fire'))*P.pw;
  const rit=room.ritual?room.ritual.filter(rc=>rc.lit):[];const rdps=10*Math.sqrt(hpMul());
  for(const g of G){
    if(g.dead||g.spawnT>0)continue;
    let dmg=0,lit=false,vis=null;
    for(const b of beams){const k=inBeam(b,g.x,g.y,g.r*.9);if(k){if(vis===null)vis=seesGhost(g);if(vis){dmg+=b.dps*k;lit=true}}}
    if(ar&&dist2(g.x,g.y,P.x,P.y)<(ar+g.r)*(ar+g.r)){dmg+=ad;lit=true}
    for(const f of FIREF)if(dist2(f.x,f.y,g.x,g.y)<(g.r+13)*(g.r+13)){dmg+=fd;lit=true}
    for(const h of HZ){if(h.k==='candle'){if(dist2(h.x,h.y,g.x,g.y)<(h.r+g.r)*(h.r+g.r)){dmg+=h.dps;lit=true}}
      else if(h.k==='salt'&&dist2(h.x,h.y,g.x,g.y)<(16+g.r)*(16+g.r)){dmg+=h.dps*.1;g.slowT=.35}}
    for(const rc of rit)if(dist2(rc.x,rc.y,g.x,g.y)<(85+g.r)*(85+g.r)){dmg+=rdps;lit=true}
    if(g.hidden){if(lit)g.litAcc+=dt;continue}
    if(lit){g.litT=.12;if(!g.lit&&!g.seenLit&&L('jump')&&!g.boss){g.seenLit=true;hurtGhost(g,g.hp*.12*L('jump'));floatText(g.x,g.y-g.r-10,t('boo'),'#e8c870',14);SFX.boo()}g.seenLit=true;g.lit=true}
    else{g.litT-=dt;if(g.litT<=0)g.lit=false;g.fear=Math.max(0,g.fear-g.hp*.035*dt)}
    if(dmg>0&&!g.dead)hurtGhost(g,dmg*dt*sug,true);
  }
  for(const o of ORBS){if(o.dead||o.kind!=='goo')continue;for(const b of beams)if(inBeam(b,o.x,o.y,8)){o.hp-=dt*(b.main?1:.6);if(o.hp<=0){o.dead=true;sparks(o.x,o.y,'#b6ffcf',6,120);SFX.fizz()}break}}
  // possessed furniture
  for(const f of room.furn){if(!f.poss||f.poss.done)continue;const fx=f.x+f.w/2,fy=f.y+f.h/2,rr2=Math.min(f.w,f.h)/2;f.poss.lit=false;
    for(const b of beams){const k=inBeam(b,fx,fy,rr2);if(k){f.poss.fear+=b.dps*k*dt*.8*sug;f.poss.lit=true}}
    if(f.poss.fear>=f.poss.hp)exorcise(f)}
}
function exorcise(f){f.poss.done=true;const fx=f.x+f.w/2,fy=f.y+f.h/2;room.possDone=(room.possDone||0)+1;
  const tp=room.c>=2?pick(['sheet','moaner','wailer']):'sheet';const g=spawnGhost(tp,clamp(fx,30,ROOM_W-30),clamp(fy-f.h/2-14,30,ROOM_H-30),{spawnT:.15});g.fear=g.hp*.45;
  BURSTS.push({x:fx,y:fy,r:200,t:0,dur:.5,col:'200,180,255'});shake(6);SFX.exorcise();wisps(fx,fy,'#c8b8ff',14);floatText(fx,fy-30,t('freed'),'#c8b8ff',18)}
function hurtGhost(g,a,cont){

function popGhost(g){

  if(R.tut&&!R.tutPop){R.tutPop=true;R.tutCandyT=2.6;measure('tutorial','first-pop','complete');measure('tutorial','first-pop-after',R.time<3?'s0-3':R.time<8?'s3-8':R.time<20?'s8-20':'s20+')}

}

/* ---------- ghosts AI ---------- */
function updGhost(g,dt){
  if(g.spawnT>0){g.spawnT-=dt;g.alpha=clamp(1-g.spawnT/g.spawnMax,0,1);if(g.spawnT<=0){g.alpha=1;if(!S.seen[g.tp]&&BOOK.includes(g.tp))S.seen[g.tp]=1}return}

  g.trT-=dt;if(g.trT<=0){g.trT=.06;g.tr.push([g.x,g.y]);if(g.tr.length>5)g.tr.shift()}
  if(g.boss){updBoss(g,dt);return}
  const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
  if(g.hidden){g.hideT+=dt;if(d<110||g.litAcc>.35||g.hideT>14){g.hidden=false;g.lit=true;g.vx=nx*320;g.vy=ny*320;S.seen.mimic=1;SFX.shriek();shake(4);floatText(g.x,g.y-30,t('boo'),'#e0a070',16);puff(g.x,g.y,g.r,'#d8c8a0',8)}return}
  let sp=g.spd;if(g.lit)sp*=Math.max(.25,1-.35-.15*L('chill'));if(g.slowT>0){g.slowT-=dt;sp*=.5}
  let tx=nx,ty=ny;
  const brave=room.phase==='fight'&&room.wave>=room.waves.length&&room.waveClock>22;
  if(brave)sp*=1.15;
  switch(g.tp){
    case 'flitter':{const s=Math.sin(g.life*5+g.ph)*1.3;tx=nx-ny*s;ty=ny+nx*s;break}
    case 'mote':{const s=Math.sin(g.life*9+g.ph)*1.6+Math.sin(g.life*3.3)*0.6;tx=nx-ny*s;ty=ny+nx*s;break}
    case 'moaner':{if(brave){break}if(d<160){tx=-nx;ty=-ny}else if(d<245){const sd=(g.ph>3?1:-1);tx=-ny*sd;ty=nx*sd}
      g.shotT-=dt;g.charging=g.shotT<.55;if(g.shotT<=0&&d<520){fireOrb(g.x,g.y,Math.atan2(dy,dx),165);g.shotT=rand(2.4,3.3)}break}
    case 'wailer':{if(g.wailT>0){sp=0;g.wailT-=dt;if(g.fear-g.wailF>g.hp*.25){g.wailT=0;g.wailCd=2.4;floatText(g.x,g.y-g.r-14,t('hushed'),'#a8c0e0',14);break}
        if(g.wailT<=0){HZ.push({k:'wail',x:g.x,y:g.y,r:g.r,max:330,spd:250,t:0,dur:1.4,hit:false});SFX.wail();shake(3);g.wailCd=rand(3.6,5)}break}

        else{room.waveClock+=dt;const prev=room.waves[room.wave-1].e.length*(GT[room.waves[room.wave-1].e[0].tp].group||1);if(room.tut&&!R.tutPop&&room.waveClock<8){}else if(live<=Math.max(room.tut?0:1,Math.floor(prev*.3))||room.waveClock>13){spawnWave(room.waves[room.wave]);room.wave++;room.waveClock=0;measure('wave',lvKey(),'w'+room.wave);
          if(room.tut)measure('tutorial','wave'+room.wave,'reached');
          if(R.room===2&&R.ch===0&&R.mode==='story'&&!R.dashHinted&&room.wave===2){R.dashHinted=true;hint={text:t('tutDash'),t:0,dur:4.5}}}}

      if(room.wave>=room.waves.length&&room.waveClock>40)for(const g of G)if(!g.dead&&g.spawnT<=0&&g.tp!=='golden'){g.hidden=false;hurtGhost(g,g.hp*.05*dt,true)}
      let done=room.wave>=room.waves.length&&!G.some(g=>!g.dead&&g.tp!=='golden');
      if(room.rt==='hunt'){const runner=G.some(g=>g.hunt&&!g.dead);if(!runner&&room.huntLeft>0){room.huntT-=dt;if(room.huntT<=0){room.huntLeft--;spawnGolden(true);room.huntT=1.1;SFX.chime()}}done=done&&room.huntLeft===0&&!runner}

/* ---------- main update ---------- */
function update(dt){
  if(freezeT>0){freezeT-=dt;return}

  gtime+=dt;const pt=R.time;R.time+=dt;R.drain=0;for(const q of [60,120,180,300,420,600,900])if(pt<q&&R.time>=q)measure('runtime',runKey(),'s'+q);
  updTwist(dt);
  updPlayer(dt);
  if(wantDash){wantDash=false;doDash()}
  if(L('strobe')){R.strobeT-=dt;if(R.strobeT<=0){R.strobeT=4.4-.55*L('strobe');const rad=150+22*L('strobe');BURSTS.push({x:P.x,y:P.y,r:rad,t:0,dur:.4,col:'255,250,230'});SFX.strobe();
    for(const g of G)if(!g.dead&&g.spawnT<=0&&dist2(g.x,g.y,P.x,P.y)<rad*rad){if(g.hidden)g.litAcc+=1;else hurtGhost(g,(12+8*L('strobe'))*P.pw*Math.sqrt(hpMul())*(g.boss?.5:1))}}}
  if(L('candle')){R.candleT-=dt;if(R.candleT<=0){R.candleT=6.5-1.2*L('candle');HZ.push({k:'candle',x:P.x,y:P.y+6,t:0,dur:7,r:70,dps:(7+4*L('candle'))*P.pw,ph:rand(0,6)})}}
  for(let i=0;i<FIREF.length;i++){const a=R.time*2.5+i*TAU/FIREF.length,rd=72+FIREF.length*4;FIREF[i].x=P.x+Math.cos(a)*rd;FIREF[i].y=P.y-4+Math.sin(a)*rd*.85}
  if(room.phase==='fight'){
    if(room.type==='normal')updRoomType(dt);
    else{
      if(!room.bossSpawned){room.bossT-=dt;if(room.bossT<=0){room.bossSpawned=true;spawnBoss(room.type)}}
      else if(!G.some(g=>!g.dead&&g.tp!=='golden'&&!g.clone))roomCleared();
    }
  }
  if(room.phase==='shrine'&&room.altar&&!room.altar.used&&Math.hypot(P.x-room.altar.x,P.y-room.altar.y)<54&&!trans){room.altar.used=true;openShrine();return}
  if(room.phase==='clear'){room.clearT+=dt;
    if(room.final&&room.clearT>2.2&&state==='run'){chapterWin();return}
    if(!room.final)for(const d of room.doors)if(Math.abs(P.x-d.x)<40&&P.y<-6&&!trans){enterDoor(d);break}
    if(room.tut&&!room.final&&room.clearT>6&&!trans&&!R.wantCards&&room.doors.length){const d=nearestDoor();measure('tutorial','door','auto');enterDoor(d)}
  }
  for(const g of G)updGhost(g,dt);
  applyLight(dt);
  for(const b of BOMBQ){b.t-=dt;if(b.t<=0&&!b.done){b.done=true;BURSTS.push({x:b.x,y:b.y,r:b.r,t:0,dur:.3,col:'255,190,210'});sparks(b.x,b.y,'#ff9ad5',6,200);
    for(const g of G)if(!g.dead&&g.spawnT<=0&&!g.hidden&&dist2(g.x,g.y,b.x,b.y)<(b.r+g.r)*(b.r+g.r))hurtGhost(g,g.boss?b.dmg*.4:b.dmg)}}
  BOMBQ=BOMBQ.filter(b=>!b.done);
  G=G.filter(g=>!g.dead);
  for(const o of ORBS){if(o.dead)continue;o.t+=dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=dt*(o.kind==='goo'?0:9);
    if(o.t>7||o.x<-30||o.x>ROOM_W+30||o.y<-30||o.y>ROOM_H+30){o.dead=true;continue}
    if(o.kind!=='goo'&&o.t>.15&&inFurn(o.x,o.y,0)){o.dead=true;puff(o.x,o.y,6,'#8a8070',4);SFX.thud();continue}
    const d=Math.hypot(o.x-P.x,o.y-P.y);

    if(d<8+P.r+18)o.near=true;else if(o.near&&d>8+P.r+34&&!o.nearDone){o.nearDone=true;if(state==='run'){floatText(P.x,P.y-36,t('close'),'#b8d8e8',14);R.comboT=Math.max(R.comboT,1.2);SFX.near()}}}
  ORBS=ORBS.filter(o=>!o.dead);
  for(const d of DROPS){d.t+=dt;d.rot+=dt*3;
    if(!d.mag){d.x+=d.vx*dt;d.y+=d.vy*dt;const k=Math.exp(-3.2*dt);d.vx*=k;d.vy*=k;d.vz-=620*dt;d.z+=d.vz*dt;if(d.z<0){d.z=0;d.vz=-d.vz*.42}
      d.x=clamp(d.x,8,ROOM_W-8);d.y=clamp(d.y,8,ROOM_H-8);
      if(d.t>.35&&(room.phase==='clear'||dist2(d.x,d.y,P.x,P.y)<P.magnet*P.magnet||(d.kind==='soul'&&d.t>2.5)))d.mag=true}
    else{const dx=P.x-d.x,dy=P.y-d.y,dd=Math.hypot(dx,dy)||1;const sp=Math.min(900,240+d.t*500);d.x+=dx/dd*sp*dt;d.y+=dy/dd*sp*dt;d.z=Math.max(0,d.z-dt*60);
      if(dd<P.r+10){d.dead=true;collect(d)}}}
  DROPS=DROPS.filter(d=>!d.dead);
  if(room.chest){const c=room.chest;c.t+=dt;if(!c.open&&dist2(c.x,c.y,P.x,P.y)<40*40){c.open=true;c.ot=0}
    if(c.open&&!c.done){c.ot+=dt;if(Math.floor(c.ot*10)!==Math.floor((c.ot-dt)*10))SFX.chest(Math.floor(c.ot*10));if(c.ot>.75){c.done=true;openChest(c)}}}
  for(const h of HZ){h.t+=dt;if(h.k==='wail'){h.r+=h.spd*dt;const d=Math.hypot(P.x-h.x,P.y-h.y);if(!h.hit&&h.r<h.max&&Math.abs(d-h.r)<12+P.r*.5){h.hit=true;hurtPlayer()}}}
  HZ=HZ.filter(h=>h.t<h.dur&&!(h.k==='wail'&&h.r>h.max));
  for(const f of FX){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.grav)f.vy+=f.grav*dt;else{f.vx*=.94;f.vy*=.94}}FX=FX.filter(f=>f.t<f.dur);
  if(FX.length>600)FX.splice(0,FX.length-600);
  for(const b of BURSTS)b.t+=dt;BURSTS=BURSTS.filter(b=>b.t<b.dur);
  for(const x of TXT){x.t+=dt;x.y-=dt*30}TXT=TXT.filter(x=>x.t<x.dur);
  if(R.comboT>0){R.comboT-=dt;if(R.comboT<=0){if(R.combo>=8){floatText(P.x,P.y-50,t('bestCombo')+' ×'+R.combo,'#8a8094',14)}R.combo=0;R.comboTier=-1}}
  if(R.candyChainT>0){R.candyChainT-=dt;if(R.candyChainT<=0)R.candyChain=0}
  if(R.tutCandyT>0)R.tutCandyT-=dt;
  R.ambT-=dt;if(R.ambT<=0){R.ambT=rand(6,14);SFX.amb(room.ch.amb)}
  updCam(dt);
  if(R.wantCards&&state==='run'&&!trans){R.wantCards=false;if(R.pendingCards>0)openCards()}
}
function collect(d){

let lastT=0,hudOn=null,perfT=0,perfN=0;
function frame(ts){
  if(window.__hold){requestAnimationFrame(frame);return}
  const raw=Math.max(0,(ts-lastT)/1000)||0;const dt=Math.min(.05,raw);lastT=ts;
  if(!window.LOWQ&&(state==='run'||state==='home')&&raw<.5){perfT+=raw;perfN++;if(perfT>4){if(perfT/perfN>.034){window.LOWQ=true;resize();if(room)room.cv=null}perfT=0;perfN=0}}
  if(!inAd){
    if(state==='run'){
      if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=trans.dur/2){trans.fired=true;trans.mid()}if(trans.t>=trans.dur)trans=null}
      else update(dt);
    }else if(state==='dying'){update(dt);R.deathT-=dt;if(R.deathT<=0)showOver(false)}

  render(dt);musicTick();
  requestAnimationFrame(frame);
}
